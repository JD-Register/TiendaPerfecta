<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel Admin | Gestión de Tienda</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
            onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>

    <style>
        
        
        
        :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --sidebar: #0f172a;
    --sidebar-hover: #1e293b;
    --primary: #e63946;
    --primary-dark: #c1121f;
    --primary-light: #fef2f2;
    --success: #10b981;
    --success-light: #d1fae5;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --info: #3b82f6;
    --info-light: #dbeafe;
    --purple: #8b5cf6;
    --purple-light: #ede9fe;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --radius-sm: 8px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
}

.dark-mode {
    --bg: #1a1a2e;
    --surface: #16213e;
    --text: #e2e8f0;
    --text-secondary: #94a3b8;
    --border: #334155;
    --primary-light: #2d1a1a;
    --success-light: #1a2e1a;
    --warning-light: #2e241a;
    --danger-light: #2e1a1a;
    --info-light: #1a1a2e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

/* ===== SIDEBAR ===== */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
.sidebar-overlay.active { display: block; }

.sidebar {
    position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
    background: var(--sidebar); padding: 20px 14px; z-index: 100;
    display: flex; flex-direction: column; transition: transform 0.3s; overflow-y: auto;
}

.sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 0 6px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px; }
.sidebar-logo .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; flex-shrink: 0; }
.sidebar-logo h2 { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.3; }
.sidebar-logo span { color: #fca5a5; font-size: 10px; display: block; font-weight: 400; }

.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 13px; transition: var(--transition); cursor: pointer; position: relative; }
.sidebar-nav a:hover, .sidebar-nav a.active { background: var(--sidebar-hover); color: #fff; }
.sidebar-nav a.active { border-left: 3px solid var(--primary); }
.sidebar-nav a svg { width: 20px; height: 20px; flex-shrink: 0; }

.sidebar-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--primary); color: #fff; min-width: 20px; height: 20px; border-radius: 50%; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

.sidebar-footer { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.btn-sidebar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition); width: 100%; text-align: left; font-family: inherit; }
.btn-sidebar:hover { background: var(--sidebar-hover); color: #fff; }
.btn-sidebar svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-sidebar.danger:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

.btn-hamburger { display: none; position: fixed; top: 14px; left: 14px; z-index: 110; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 42px; height: 42px; cursor: pointer; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.btn-hamburger svg { width: 22px; height: 22px; }

/* ===== MAIN ===== */
.main { margin-left: 260px; flex: 1; padding: 24px; transition: margin 0.3s; width: calc(100% - 260px); min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.topbar h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.topbar h1 svg { width: 22px; height: 22px; }
.topbar .fecha { font-size: 13px; color: var(--text-secondary); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.btn { padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 700; font-size: 12px; cursor: pointer; border: none; transition: var(--transition); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; height: fit-content; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-warning { background: var(--warning); color: #000; }
.btn-warning:hover { background: #d97706; }
.btn-info { background: var(--info); color: #fff; }
.btn-info:hover { background: #2563eb; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-purple:hover { background: #7c3aed; }
.btn-sm { padding: 6px 12px; font-size: 10px; border-radius: 6px; }
.btn-xs { padding: 4px 8px; font-size: 9px; border-radius: 4px; }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-outline-danger { background: transparent; border: 2px solid var(--danger); color: var(--danger); }
.btn-outline-danger:hover { background: var(--danger-light); }
.btn-copiar { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
.btn-copiar:hover { background: #e2e8f0; }
.btn-logout { background: none; border: 2px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

/* ===== CARDS ===== */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; width: 100%; max-width: 100%; }
.card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); transition: var(--transition); min-width: 0; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.card .icon svg { width: 20px; height: 20px; }
.card .number { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
.card .label { font-size: 10px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

/* ===== CHARTS GRID ===== */
.charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
}

.chart-container {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    min-width: 0;
}

.chart-wrapper {
    position: relative;
    width: 100%;
    max-width: 100%;
    height: 250px;
    overflow: hidden;
}

.chart-wrapper canvas {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    max-height: 100% !important;
}

/* ===== NOTIFICACIÓN ===== */
@keyframes slideInNotif {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOutNotif {
    to { transform: translateX(100%); opacity: 0; }
}

/* ===== PORTADA PREVIEW ===== */
.portada-config-preview {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    margin-top: 8px;
}

/* ===== ALERTA PEDIDO ATRASADO ===== */
.alerta-atrasado {
    background: var(--danger-light);
    color: #991b1b;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
    animation: pulseAtrasado 2s infinite;
}

@keyframes pulseAtrasado {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* ===== SECTIONS ===== */
.section { background: var(--surface); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); width: 100%; max-width: 100%; min-width: 0; }
.section h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.section h2 svg { width: 20px; height: 20px; }
.section .desc { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }

/* ===== FORMS ===== */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; margin-bottom: 12px; width: 100%; }
.form-group { display: flex; flex-direction: column; min-width: 0; }
.form-group label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: #f8fafc; transition: var(--transition); font-family: inherit; color: var(--text); width: 100%; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230,57,70,0.08); background: #fff; }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group-check { display: flex; align-items: center; gap: 8px; padding-top: 20px; }
.form-group-check label { font-size: 12px; font-weight: 600; cursor: pointer; text-transform: none; color: var(--text); }
.form-group-check input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

/* ===== TABLES ===== */
.table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); border: 1px solid var(--border); max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
th { text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); background: #f8fafc; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover { background: #f8fafc; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 700; }
.badge-success { background: var(--success-light); color: #065f46; }
.badge-danger { background: var(--danger-light); color: #991b1b; }
.badge-warning { background: var(--warning-light); color: #92400e; }
.badge-info { background: var(--info-light); color: #1e40af; }
.badge-purple { background: var(--purple-light); color: #5b21b6; }

.search-box { position: relative; margin-bottom: 12px; }
.search-box input { width: 100%; padding: 10px 14px 10px 40px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg); }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 13px; z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: var(--shadow-lg); max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.info { background: var(--info); color: #fff; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 16px; }
.modal-overlay.active { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 24px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .charts-grid { grid-template-columns: 1fr; gap: 12px; }
}

@media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .btn-hamburger { display: flex; }
    .main { margin-left: 0; width: 100%; padding: 16px 10px; padding-top: 60px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    table { min-width: 500px; font-size: 10px; }
    th, td { padding: 6px 8px; font-size: 9px; }
    .topbar h1 { font-size: 18px; }
}

@media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .section { padding: 16px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .topbar-actions { width: 100%; justify-content: space-between; }
    .btn { font-size: 10px; padding: 8px 14px; }
    .btn-sm { font-size: 9px; padding: 4px 8px; }
    .btn-xs { font-size: 8px; padding: 3px 6px; }
    .chart-wrapper { height: 180px; }
    .charts-grid { gap: 10px; }
    
    .tabla-movil table { display: block; min-width: auto; }
    .tabla-movil thead { display: none; }
    .tabla-movil tbody { display: block; }
    .tabla-movil tr { display: block; margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; background: var(--surface); }
    .tabla-movil td { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border: none; font-size: 12px; border-bottom: 1px solid var(--border); }
    .tabla-movil td:last-child { border-bottom: none; }
    .tabla-movil td::before { content: attr(data-label); font-weight: 700; color: var(--primary); font-size: 9px; text-transform: uppercase; margin-right: 8px; }
}

@media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .card .number { font-size: 22px; }
    .card .label { font-size: 9px; }
    .topbar h1 { font-size: 16px; }
    .topbar .fecha { font-size: 11px; }
    .section { padding: 12px; }
    .section h2 { font-size: 15px; }
    .chart-wrapper { height: 150px; }
}

@media (max-width: 380px) {
    .main { padding: 12px 8px; padding-top: 50px; }
    .topbar h1 { font-size: 14px; }
    .card .number { font-size: 18px; }
    .btn { font-size: 9px; padding: 6px 10px; }
    table { min-width: 350px; font-size: 8px; }
    th, td { padding: 4px 6px; font-size: 8px; }
}
    </style>
</head>

    <aside class="sidebar" id="sidebar">

    </aside>

    <div class="main">
        <div class="topbar">

    function reproducirSonido() {
        try {

            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
        } catch (e) {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc2 = audioCtx.createOscillator();
                var gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 880;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                osc2.stop(audioCtx.currentTime + 0.2);
            } catch (e2) {}
        }
    }

// Función para parsear fechas correctamente
function parsearFecha(fechaStr) {
    if (!fechaStr) return null;
    
    // Intentar formato: "15/8/2026, 13:05:59"
    try {
        var partes = fechaStr.split(',');
        var fechaParte = partes[0].trim();
        var horaParte = partes[1] ? partes[1].trim() : '00:00:00';
        
        var f = fechaParte.split('/');
        var h = horaParte.split(':');
        
        if (f.length === 3 && h.length >= 2) {
            var dia = parseInt(f[0]);
            var mes = parseInt(f[1]) - 1; // Meses van de 0-11
            var anio = parseInt(f[2]);
            var hora = parseInt(h[0]);
            var min = parseInt(h[1]);
            var seg = h[2] ? parseInt(h[2]) : 0;
            
            return new Date(anio, mes, dia, hora, min, seg);
        }
    } catch (e) {}
    
    // Intentar formato ISO
    var fecha = new Date(fechaStr);
    if (!isNaN(fecha.getTime())) {
        return fecha;
    }
    
    return null;
}

                <div class="card"><div class="icon" style="background:var(--info-light);color:var(--info);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="number">${pedidosHoy.length}</div><div class="label">Pedidos Hoy</div></div>
                <div class="card"><div class="icon" style="background:var(--success-light);color:var(--success);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="number">${formatearPrecio(ventasHoy)}</div><div class="label">Ventas Hoy</div></div>
                <div class="card"><div class="icon" style="background:var(--purple-light);color:var(--purple);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div><div class="number">${activos}</div><div class="label">Productos Activos</div></div>
            </div>`;

        html += '<div class="charts-grid">';
        html += '<div class="section chart-container" style="margin:0;"><h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> Ventas 7 días</h2><div class="chart-wrapper"><canvas id="chart-dash-ventas"></canvas></div></div>';
        html += '<div class="section chart-container" style="margin:0;"><h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9"/><polyline points="21 3 21 9 15 9"/></svg> Estados de Pedidos</h2><div class="chart-wrapper"><canvas id="chart-dash-estados"></canvas></div></div>';
        html += '</div>';

        var ventasProductos = {};
        pedidos.forEach(function(p) {
            if (p.estado === 'cancelado') return;
            var items = p.items || [];
            if (items.length === 0) {
                var key = p.producto || 'Producto';
                if (!ventasProductos[key]) ventasProductos[key] = { nombre: key, cantidad: 0, total: 0 };
                ventasProductos[key].cantidad++;
                ventasProductos[key].total += (p.precio || 0);
            } else {
                items.forEach(function(item) {
                    var key = item.nombre || 'Producto';
                    if (!ventasProductos[key]) ventasProductos[key] = { nombre: key, cantidad: 0, total: 0 };
                    ventasProductos[key].cantidad += (item.cantidad || 1);
                    ventasProductos[key].total += ((item.precio || 0) * (item.cantidad || 1));
                });
            }
        });

        var top = Object.values(ventasProductos).sort(function(a, b) { return b.cantidad - a.cantidad; }).slice(0, 5);

        html += '<div class="section"><h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Productos Más Vendidos</h2>';
        if (top.length === 0) {
            html += '<p style="color:var(--text-secondary);text-align:center;padding:20px;">Aún no hay ventas registradas.</p>';
        } else {
            html += '<div style="display:grid;gap:10px;">';
            top.forEach(function(item, i) {
                html += '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);"><span style="font-weight:900;font-size:16px;color:var(--text-secondary);min-width:24px;">#' + (i + 1) + '</span><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;">' + item.nombre + '</div><div style="font-size:11px;color:var(--text-secondary);">' + item.cantidad + ' pedidos</div></div><div style="font-weight:800;font-size:14px;color:var(--primary);white-space:nowrap;">' + formatearPrecio(item.total) + '</div></div>';
            });
            html += '</div>';
        }
        html += '</div>';

        var ultimos = pedidos.slice(-5).reverse();
        html += '<div class="section"><h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Últimos Pedidos</h2>';
        if (ultimos.length === 0) {
            html += '<p style="color:var(--text-secondary);text-align:center;padding:20px;">No hay pedidos aún.</p>';
        } else {
            html += '<div class="table-wrapper tabla-movil"><table><thead><tr><th>ID</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th></tr></thead><tbody>';
            ultimos.forEach(function(p) {
                var estadoBadge = '<span class="badge badge-' + (p.estado === 'pendiente' ? 'warning' : p.estado === 'preparando' ? 'info' : p.estado === 'enviado' ? 'purple' : p.estado === 'entregado' ? 'success' : 'danger') + '">' + p.estado + '</span>';
                html += '<tr><td data-label="ID"><strong>#' + (p.idRastreo || p.id) + '</strong></td><td data-label="Cliente">' + p.nombre + '</td><td data-label="Productos">' + p.producto + '</td><td data-label="Total"><strong>' + formatearPrecio(p.precio || 0) + '</strong></td><td data-label="Estado">' + estadoBadge + '</td></tr>';
            });
            html += '</tbody></table></div>';
        }
        html += '</div>';

        c.innerHTML = html;
        setTimeout(drawDashboardCharts, 100);
    }

    function drawDashboardCharts() {
        if (typeof Chart === 'undefined') { setTimeout(drawDashboardCharts, 500); return; }
        var pedidos = getPedidos();
        var cfg = getConfig();
        var simbolo = cfg.simboloMoneda || '$';

        var dias = [];
        var ventas = [];
        for (var i = 6; i >= 0; i--) {
            var d = new Date();
            d.setDate(d.getDate() - i);
            var key = d.toLocaleDateString();
            dias.push(d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }));
            var total = 0;
            pedidos.forEach(function(p) {
                if (p.fecha && p.fecha.includes(key) && p.estado !== 'cancelado') total += (p.precio || 0);
            });
            ventas.push(total);
        }

        var canvasVentas = document.getElementById('chart-dash-ventas');
        if (canvasVentas) {
            if (chartVentas) chartVentas.destroy();
            chartVentas = new Chart(canvasVentas.getContext('2d'), { type: 'bar', data: { labels: dias, datasets: [{ label: simbolo, data: ventas, backgroundColor: '#e63946', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
        }

        var estados = ['pendiente', 'preparando', 'enviado', 'entregado', 'cancelado'];
        var counts = estados.map(function(e) { return pedidos.filter(function(p) { return p.estado === e; }).length; });
        var colores = ['#f59e0b', '#3b82f6', '#8b5cf6', '#10b981', '#ef4444'];
        var nombres = ['Pendiente', 'Preparando', 'Enviado', 'Entregado', 'Cancelado'];

        var canvasEstados = document.getElementById('chart-dash-estados');
        if (canvasEstados) {
            if (chartEstados) chartEstados.destroy();
            chartEstados = new Chart(canvasEstados.getContext('2d'), { type: 'doughnut', data: { labels: nombres, datasets: [{ data: counts, backgroundColor: colores, borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } } });
        }
    }

    function cargarTablaPedidos() {
        var pedidos = getPedidos();
        var filtroEstado = obtenerFiltro('pedidos_estado', 'todos');
        var filtroFecha = obtenerFiltro('pedidos_fecha', 'todos');
        var filtroBuscar = obtenerFiltro('pedidos_buscar', '').toLowerCase();

        if (filtroEstado !== 'todos') pedidos = pedidos.filter(function(p) { return p.estado === filtroEstado; });
        if (filtroFecha === 'hoy') { var hoy = new Date().toLocaleDateString(); pedidos = pedidos.filter(function(p) { return p.fecha && p.fecha.includes(hoy); }); }
        if (filtroBuscar) pedidos = pedidos.filter(function(p) { return (p.nombre || '').toLowerCase().includes(filtroBuscar) || String(p.idRastreo || '').includes(filtroBuscar); });

        var tbody = document.getElementById('tabla-pedidos');
        var sin = document.getElementById('sin-pedidos');

        if (pedidos.length === 0) { tbody.innerHTML = ''; sin.style.display = 'block'; return; }
        sin.style.display = 'none';

        var cfg = getConfig();
        var tiempoLimite = cfg.tiempoLimitePedido || 15;

        tbody.innerHTML = pedidos.slice().reverse().map(function(p) {
            var estadoBadge = '<span class="badge badge-' + (p.estado === 'pendiente' ? 'warning' : p.estado === 'preparando' ? 'info' : p.estado === 'enviado' ? 'purple' : p.estado === 'entregado' ? 'success' : 'danger') + '">' + p.estado + '</span>';
            
            var alertaAtrasado = '';
            if (p.estado === 'pendiente' && p.fecha) {
                var fechaPedido = new Date(p.fecha);
                var ahora = new Date();
                var diffMinutos = (ahora - fechaPedido) / (1000 * 60);
                if (diffMinutos >= tiempoLimite) {
                    alertaAtrasado = ' <span class="alerta-atrasado">⏰ ' + Math.floor(diffMinutos) + ' min</span>';
                }
            }

            return `<tr>
                <td data-label="ID"><strong>#${p.idRastreo || p.id}</strong></td>
                <td data-label="Cliente">${p.nombre}</td>
                <td data-label="Teléfono">${p.telefono || '—'}</td>
                <td data-label="Dirección">${p.direccion || '—'}</td>
                <td data-label="Productos">${p.producto}</td>
                <td data-label="Total"><strong>${formatearPrecio(p.precio || 0)}</strong></td>
                <td data-label="Estado">${estadoBadge}${alertaAtrasado}</td>
                <td data-label="Fecha">${p.fecha || '—'}</td>
                <td data-label="Acciones">
                    <button class="btn btn-info btn-xs" onclick="verTicket(${p.id})" title="Ver ticket"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <button class="btn btn-danger btn-xs" onclick="eliminarPedido(${p.id})" title="Eliminar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 011-2h4a2 2 0 012 2v2"/></svg></button>
                </td>
            </tr>`;
        }).join('');
    }

    function cambiarEstadoPedido(id, nuevoEstado) {
        var pedidos = getPedidos();
        var p = pedidos.find(function(pe) { return pe.id === id; });
        if (p) {
            p.estado = nuevoEstado;
            localStorage.setItem(K.PEDIDOS, JSON.stringify(pedidos));
            toast('Estado actualizado a: ' + nuevoEstado, 'success');
            cargarTablaPedidos();
            actualizarBadges();
        }
    }

    function eliminarPedido(id) {
        if (confirm('¿Eliminar este pedido?')) {
            var pedidos = getPedidos().filter(function(p) { return p.id !== id; });
            localStorage.setItem(K.PEDIDOS, JSON.stringify(pedidos));
            toast('Pedido eliminado', 'success');
            cargarTablaPedidos();
            actualizarBadges();
        }
    }

    function limpiarPedidos() {
        if (confirm('¿Eliminar pedidos antiguos (más de 30 días)?')) {
            var pedidos = getPedidos();
            var limite = new Date();
            limite.setDate(limite.getDate() - 30);
            pedidos = pedidos.filter(function(p) { return p.estado === 'pendiente' || p.estado === 'preparando' || (p.fecha && new Date(p.fecha) > limite); });
            localStorage.setItem(K.PEDIDOS, JSON.stringify(pedidos));
            toast('Pedidos limpiados', 'success');
            cargarTablaPedidos();
        }
    }

    function verTicket(id) {
        var pedidos = getPedidos();
        var p = pedidos.find(function(pe) { return pe.id === id; });
        if (!p) return;
        var cfg = getConfig();

        var modal = document.createElement('div');
        modal.className = 'modal-overlay active';
        modal.innerHTML = `
            <div class="modal" style="max-width:500px;">

                    <div style="font-size:32px;">${cfg.emoji || '🍕'}</div>

                    <div style="font-size:28px;font-weight:900;color:var(--primary);letter-spacing:4px;">#${p.idRastreo || p.id}</div>
                    <div style="font-size:11px;color:var(--text-secondary);">${p.fecha || '—'}</div>

                <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:12px;">
                    <p style="font-size:13px;margin-bottom:4px;"><strong>Cliente:</strong> ${p.nombre}</p>
                    <p style="font-size:13px;margin-bottom:4px;"><strong>Teléfono:</strong> ${p.telefono}</p>
                    <p style="font-size:13px;margin-bottom:4px;"><strong>Dirección:</strong> ${p.direccion}</p>
                    ${p.notas ? '<p style="font-size:13px;margin-bottom:4px;"><strong>Notas:</strong> ' + p.notas + '</p>' : ''}
                </div>
                <div style="margin-bottom:12px;">
                    <h4 style="font-size:13px;margin-bottom:8px;">Productos</h4>
                    <p style="font-size:14px;">${p.producto}</p>
                </div>
                <div style="text-align:center;margin-bottom:12px;">
                    <span class="badge badge-${p.estado === 'pendiente' ? 'warning' : p.estado === 'preparando' ? 'info' : p.estado === 'enviado' ? 'purple' : p.estado === 'entregado' ? 'success' : 'danger'}" style="font-size:12px;padding:6px 16px;">${p.estado.toUpperCase()}</span>
                </div>
                <div style="text-align:right;font-size:24px;font-weight:900;color:var(--primary);border-top:2px solid var(--border);padding-top:12px;">${formatearPrecio(p.precio || 0)}</div>
                <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
                    <button class="btn btn-success btn-sm" onclick="notificarWhatsApp(${p.id})" style="background:#25d366;">💬 Notificar WhatsApp</button>
                    <button class="btn btn-primary btn-sm" onclick="descargarTicket(${p.id})">Descargar</button>
                    <button class="btn btn-info btn-sm" onclick="copiarIdRastreo('${p.idRastreo || ''}')">Copiar ID</button>
                    <button class="btn btn-danger btn-sm" onclick="this.closest('.modal-overlay').remove()">Cerrar</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', function(e) { if (e.target === this) this.remove(); });

    function notificarWhatsApp(id) {
        var pedidos = getPedidos();
        var p = pedidos.find(function(pe) { return pe.id === id; });
        if (!p) return;
        
        var cfg = getConfig();
        var telefono = p.telefono || '';
        
        if (!telefono || telefono.length < 8) {
            toast('⚠️ El cliente no tiene teléfono válido', 'error');
            return;
        }
        
        var telefonoNormalizado = telefono.replace(/\D/g, '');
        if (telefonoNormalizado.length === 8) {
            telefonoNormalizado = '53' + telefonoNormalizado;
        }
        
        var estadosMensaje = {
            'pendiente': '📋 Tu pedido ha sido recibido y está en cola de preparación.',
            'preparando': '👨‍🍳 Tu pedido está siendo preparado con los mejores ingredientes.',
            'enviado': '🛵 Tu pedido va en camino. ¡Llega pronto!',
            'entregado': '✅ ¡Tu pedido ha sido entregado! Esperamos que disfrutes.',
            'cancelado': '❌ Tu pedido ha sido cancelado.'
        };
        
        var mensaje = encodeURIComponent(
            '🍕 *' + cfg.nombre + '*\n\n' +
            '📋 Pedido #' + (p.idRastreo || p.id) + '\n' +
            '📊 Estado: ' + p.estado.toUpperCase() + '\n' +
            '📝 ' + (estadosMensaje[p.estado] || 'Estado actualizado.') + '\n\n' +
            '📦 Productos: ' + p.producto + '\n' +
            '💰 Total: ' + formatearPrecio(p.precio || 0) + '\n\n' +
            '🔍 Código de rastreo: ' + (p.idRastreo || p.id)
        );
        
        var whatsappUrl = 'https://wa.me/' + telefonoNormalizado + '?text=' + mensaje;
        window.open(whatsappUrl, '_blank');
        toast('💬 Notificación enviada por WhatsApp', 'success');
    }

    function copiarIdRastreo(id) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(id).then(function() { toast('ID copiado: ' + id, 'success'); });
        }
    }

    function descargarTicket(id) {
        var pedidos = getPedidos();
        var p = pedidos.find(function(pe) { return pe.id === id; });
        if (!p) return;
        var doc = new jspdf.jsPDF('p', 'mm', 'a4');
        doc.setFontSize(16);
        doc.setTextColor(230, 57, 70);
        doc.text('Ticket #' + (p.idRastreo || p.id), 20, 20);
        var y = 30;
        doc.setFontSize(11);
        doc.setTextColor(15, 23, 42);
        doc.text('Cliente: ' + p.nombre, 20, y); y += 6;
        doc.text('Teléfono: ' + p.telefono, 20, y); y += 6;
        doc.text('Dirección: ' + p.direccion, 20, y); y += 6;
        doc.text('Productos: ' + p.producto, 20, y); y += 6;
        doc.text('Total: ' + formatearPrecio(p.precio || 0), 20, y); y += 6;
        doc.text('Estado: ' + p.estado, 20, y); y += 6;
        doc.save('ticket-' + (p.idRastreo || p.id) + '.pdf');
    }

    function exportarPedidosPDF() {
        var pedidos = getPedidos();
        if (pedidos.length === 0) { toast('No hay pedidos', 'error'); return; }
        var doc = new jspdf.jsPDF('p', 'mm', 'a4');
        doc.setFontSize(16);
        doc.setTextColor(230, 57, 70);
        doc.text('Reporte de Pedidos', 20, 20);
        var y = 30;
        doc.setFontSize(10);
        doc.setTextColor(15, 23, 42);
        pedidos.slice(0, 20).forEach(function(p) {
            doc.text('#' + (p.idRastreo || p.id) + ' - ' + p.nombre + ' - ' + formatearPrecio(p.precio || 0) + ' - ' + p.estado, 20, y);
            y += 6;
            if (y > 270) { doc.addPage(); y = 20; }
        });
        doc.save('pedidos.pdf');
    }

    function exportarPedidosCSV() {
        var pedidos = getPedidos();
        if (pedidos.length === 0) { toast('No hay pedidos', 'error'); return; }
        var csv = [['ID', 'Cliente', 'Teléfono', 'Dirección', 'Productos', 'Total', 'Estado', 'Fecha']];
        pedidos.forEach(function(p) { csv.push([p.idRastreo || p.id, p.nombre, p.telefono, p.direccion, p.producto, p.precio || 0, p.estado, p.fecha || '']); });
        var blob = new Blob(['\uFEFF' + csv.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pedidos.csv';
        a.click();
    }

    function toggleFormularioProducto() {
        var form = document.getElementById('form-producto');
        if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    function cargarTablaProductos() {
        var productos = getProductos();
        var filtroBuscar = obtenerFiltro('productos_buscar', '').toLowerCase();
        var filtroCategoria = obtenerFiltro('productos_categoria', 'todas');

        if (filtroCategoria !== 'todas') productos = productos.filter(function(p) { return p.categoria === filtroCategoria; });
        if (filtroBuscar) productos = productos.filter(function(p) { return p.nombre.toLowerCase().includes(filtroBuscar) || (p.descripcion || '').toLowerCase().includes(filtroBuscar); });

        var tbody = document.getElementById('tabla-productos');
        var sin = document.getElementById('sin-productos');

        if (productos.length === 0) { tbody.innerHTML = ''; sin.style.display = 'block'; return; }
        sin.style.display = 'none';

        tbody.innerHTML = productos.map(function(p, i) {
            var stockBajo = p.stock !== undefined && p.stock <= 3 && p.disponible === 'si';
            return `<tr>
                <td data-label="#">${i + 1}</td>
                <td data-label="Producto">${p.emoji || '🍕'} ${p.nombre}</td>
                <td data-label="Categoría">${p.categoria}</td>
                <td data-label="Precio"><strong>${formatearPrecio(p.precio)}</strong></td>
                <td data-label="Stock">${stockBajo ? '<span class="badge badge-warning">⚠️ ' + p.stock + '</span>' : (p.stock || 0)}</td>
                <td data-label="Estado"><span class="badge badge-${p.disponible === 'si' ? 'success' : 'danger'}">${p.disponible === 'si' ? 'Disponible' : 'Agotado'}</span></td>
                <td data-label="Destacado">${p.destacado === 'si' ? '⭐ Sí' : 'No'}</td>
                <td data-label="Acciones">
                    <button class="btn btn-info btn-xs" onclick="editarProducto(${p.id})" title="Editar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                    <button class="btn btn-success btn-xs" onclick="toggleProducto(${p.id})" title="Cambiar estado"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg></button>
                    <button class="btn btn-purple btn-xs" onclick="duplicarProducto(${p.id})" title="Duplicar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
                    <button class="btn btn-danger btn-xs" onclick="eliminarProducto(${p.id})" title="Eliminar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
                </td>
            </tr>`;
        }).join('');
    }

    function crearProducto() {
        var nombre = document.getElementById('prod-nombre').value.trim();
        var categoria = document.getElementById('prod-categoria').value;
        var precio = parseFloat(document.getElementById('prod-precio').value);
        var stock = parseInt(document.getElementById('prod-stock').value) || 0;
        var emoji = document.getElementById('prod-emoji').value.trim() || '🍕';
        var disponible = document.getElementById('prod-disponible').value;
        var destacado = document.getElementById('prod-destacado').value;
        var descripcion = document.getElementById('prod-descripcion').value.trim();
        var ingredientes = document.getElementById('prod-ingredientes').value.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });

        if (!nombre || isNaN(precio) || precio < 0) { toast('Completa nombre y precio', 'error'); return; }

        var productos = getProductos();
        var nuevoId = productos.length > 0 ? Math.max.apply(null, productos.map(function(p) { return p.id; })) + 1 : 1;

        var nuevo = { id: nuevoId, nombre: nombre, categoria: categoria, precio: precio, stock: stock, emoji: emoji, disponible: disponible, destacado: destacado, descripcion: descripcion, ingredientes: ingredientes, imagen: '' };

        var imgInput = document.getElementById('prod-imagen');
        if (imgInput.files && imgInput.files[0]) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                nuevo.imagen = ev.target.result;
                productos.push(nuevo);
                localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
                toast('Producto creado con imagen', 'success');
                cargarTablaProductos();
                toggleFormularioProducto();
            };
            reader.readAsDataURL(imgInput.files[0]);
        } else {
            productos.push(nuevo);
            localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
            toast('Producto creado', 'success');
            cargarTablaProductos();
            toggleFormularioProducto();
        }
    }

    function editarProducto(id) {
        var productos = getProductos();
        var p = productos.find(function(pr) { return pr.id === id; });
        if (!p) return;

        var modal = document.createElement('div');
        modal.className = 'modal-overlay active';
        modal.innerHTML = `
            <div class="modal">
                <h3 style="font-size:18px;font-weight:800;margin-bottom:16px;">Editar Producto</h3>
                <div class="form-row">
                    <div class="form-group"><label>Nombre</label><input type="text" id="edit-nombre" value="${p.nombre}"></div>
                    <div class="form-group"><label>Precio</label><input type="number" id="edit-precio" value="${p.precio}" step="0.01"></div>
                    <div class="form-group"><label>Stock</label><input type="number" id="edit-stock" value="${p.stock || 0}"></div>
                    <div class="form-group"><label>Disponible</label><select id="edit-disponible"><option value="si" ${p.disponible === 'si' ? 'selected' : ''}>Disponible</option><option value="no" ${p.disponible === 'no' ? 'selected' : ''}>Agotado</option></select></div>
                    <div class="form-group"><label>Destacado</label><select id="edit-destacado"><option value="no" ${p.destacado === 'no' ? 'selected' : ''}>Normal</option><option value="si" ${p.destacado === 'si' ? 'selected' : ''}>Destacado</option></select></div>
                    <div class="form-group" style="grid-column:1/-1;"><label>Descripción</label><input type="text" id="edit-descripcion" value="${p.descripcion || ''}"></div>
                </div>
                <div style="display:flex;gap:8px;margin-top:16px;">
                    <button class="btn btn-success" onclick="guardarEdicionProducto(${p.id})">Guardar</button>
                    <button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', function(e) { if (e.target === this) this.remove(); });
    }

    function guardarEdicionProducto(id) {
        var productos = getProductos();
        var p = productos.find(function(pr) { return pr.id === id; });
        if (!p) return;
        p.nombre = document.getElementById('edit-nombre').value.trim();
        p.precio = parseFloat(document.getElementById('edit-precio').value);
        p.stock = parseInt(document.getElementById('edit-stock').value) || 0;
        p.disponible = document.getElementById('edit-disponible').value;
        p.destacado = document.getElementById('edit-destacado').value;
        p.descripcion = document.getElementById('edit-descripcion').value.trim();
        localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
        toast('Producto actualizado', 'success');
        document.querySelectorAll('.modal-overlay').forEach(function(m) { m.remove(); });
        cargarTablaProductos();
    }

    function toggleProducto(id) {
        var productos = getProductos();
        var p = productos.find(function(pr) { return pr.id === id; });
        if (p) {
            p.disponible = p.disponible === 'si' ? 'no' : 'si';
            localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
            toast('Estado: ' + (p.disponible === 'si' ? 'Disponible' : 'Agotado'), 'success');
            cargarTablaProductos();
        }
    }

    function duplicarProducto(id) {
        var productos = getProductos();
        var p = productos.find(function(pr) { return pr.id === id; });
        if (!p) return;
        var copia = JSON.parse(JSON.stringify(p));
        copia.id = Math.max.apply(null, productos.map(function(pr) { return pr.id; })) + 1;
        copia.nombre = p.nombre + ' (Copia)';
        productos.push(copia);
        localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
        toast('Producto duplicado', 'success');
        cargarTablaProductos();
    }

    function eliminarProducto(id) {
        if (confirm('¿Eliminar este producto?')) {
            var productos = getProductos().filter(function(p) { return p.id !== id; });
            localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
            toast('Producto eliminado', 'success');
            cargarTablaProductos();
        }
    }

    function exportarProductosCSV() {
        var productos = getProductos();
        if (productos.length === 0) { toast('No hay productos', 'error'); return; }
        var csv = [['Nombre', 'Categoría', 'Precio', 'Stock', 'Disponible', 'Destacado', 'Descripción', 'Ingredientes']];
        productos.forEach(function(p) { csv.push([p.nombre, p.categoria, p.precio, p.stock || 0, p.disponible, p.destacado || 'no', p.descripcion || '', (p.ingredientes || []).join(', ')]); });
        var blob = new Blob(['\uFEFF' + csv.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'productos.csv';
        a.click();
    }

    function importarProductosCSV(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var lines = ev.target.result.split('\n');
            var productos = getProductos();
            var maxId = productos.length > 0 ? Math.max.apply(null, productos.map(function(p) { return p.id; })) : 0;
            for (var i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                var v = lines[i].split(',').map(function(s) { return s.trim(); });
                productos.push({ id: maxId + i, nombre: v[0] || 'Producto', categoria: v[1] || 'General', precio: parseFloat(v[2]) || 0, stock: parseInt(v[3]) || 0, disponible: v[4] === 'si' ? 'si' : 'no', destacado: v[5] === 'si' ? 'si' : 'no', descripcion: v[6] || '', ingredientes: v[7] ? v[7].split(',').map(function(s) { return s.trim(); }) : [], emoji: '🍕', imagen: '' });
            }
            localStorage.setItem(K.PRODUCTOS, JSON.stringify(productos));
            toast('Productos importados', 'success');
            cargarTablaProductos();
        };
        reader.readAsText(file);
    }

    function cargarTablaCategorias() {

                    <button class="btn btn-danger btn-xs" onclick="eliminarCategoria(${cat.id})" title="Eliminar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>

            </tr>`;

    function crearCategoria() {
        var nombre = document.getElementById('cat-nombre').value.trim();
        var emoji = document.getElementById('cat-emoji').value.trim() || '📂';
        var descripcion = document.getElementById('cat-descripcion').value.trim();
        if (!nombre) { toast('Pon un nombre', 'error'); return; }
        var categorias = getCategorias();
        if (categorias.find(function(c) { return c.nombre.toLowerCase() === nombre.toLowerCase(); })) { toast('Ya existe', 'error'); return; }
        var nuevoId = categorias.length > 0 ? Math.max.apply(null, categorias.map(function(c) { return c.id; })) + 1 : 1;
        categorias.push({ id: nuevoId, nombre: nombre, emoji: emoji, descripcion: descripcion });
        localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
        toast('Categoría creada', 'success');
        cargarTablaCategorias();
        document.getElementById('cat-nombre').value = '';
        document.getElementById('cat-descripcion').value = '';
    }

    function editarCategoria(id) {
        var categorias = getCategorias();
        var cat = categorias.find(function(c) { return c.id === id; });
        if (!cat) return;
        var nombre = prompt('Nuevo nombre:', cat.nombre);
        if (nombre && nombre.trim()) {
            cat.nombre = nombre.trim();
            var emoji = prompt('Nuevo emoji:', cat.emoji);
            if (emoji) cat.emoji = emoji;
            localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
            toast('Categoría actualizada', 'success');
            cargarTablaCategorias();
        }
    }

    function eliminarCategoria(id) {
        if (confirm('¿Eliminar esta categoría?')) {
            var categorias = getCategorias().filter(function(c) { return c.id !== id; });
            localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
            toast('Categoría eliminada', 'success');
            cargarTablaCategorias();
        }
    }

    function renderClientes(c) {

                <input type="text" id="buscar-cliente" placeholder="Buscar por nombre o teléfono..." value="${filtroBuscar}" oninput="guardarFiltro('clientes_buscar', this.value); cargarTablaClientes()" style="width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:16px;">

    function cargarTablaClientes() {
        var pedidos = getPedidos();
        var filtroBuscar = obtenerFiltro('clientes_buscar', '').toLowerCase();
        var clientesMap = {};

        pedidos.forEach(function(p) {
            var key = p.telefono || p.nombre;
            if (!clientesMap[key]) clientesMap[key] = { nombre: p.nombre, telefono: p.telefono, totalPedidos: 0, totalGastado: 0, ultimoPedido: '' };
            clientesMap[key].totalPedidos++;
            clientesMap[key].totalGastado += (p.precio || 0);
            if (p.fecha && p.fecha > clientesMap[key].ultimoPedido) clientesMap[key].ultimoPedido = p.fecha;
        });

        var clientes = Object.values(clientesMap).sort(function(a, b) { return b.totalGastado - a.totalGastado; });
        if (filtroBuscar) clientes = clientes.filter(function(c) { return c.nombre.toLowerCase().includes(filtroBuscar) || (c.telefono || '').includes(filtroBuscar); });

        var tbody = document.getElementById('tabla-clientes');
        var sin = document.getElementById('sin-clientes');
        if (clientes.length === 0) { tbody.innerHTML = ''; sin.style.display = 'block'; return; }
        sin.style.display = 'none';

        tbody.innerHTML = clientes.map(function(c, i) {
            return `<tr>
                <td data-label="#">${i + 1}</td>
                <td data-label="Cliente"><strong>${c.nombre}</strong></td>
                <td data-label="Teléfono">${c.telefono || '—'}</td>
                <td data-label="Total Pedidos">${c.totalPedidos}</td>
                <td data-label="Total Gastado"><strong>${formatearPrecio(c.totalGastado)}</strong></td>
                <td data-label="Último Pedido">${c.ultimoPedido || '—'}</td>
            </tr>`;
        }).join('');
    }

    // ==========================================
    // VALORACIONES
    // ==========================================
    function renderValoraciones(c) {
        var valoraciones = getValoraciones();
        var html = `
            <div class="section">
                <h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Valoraciones de Clientes</h2>
                <div class="table-wrapper tabla-movil"><table><thead><tr><th>#</th><th>Cliente</th><th>Producto</th><th>Estrellas</th><th>Comentario</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="tabla-valoraciones"></tbody></table></div>
                <p id="sin-valoraciones" style="display:none;color:var(--text-secondary);text-align:center;padding:20px;">No hay valoraciones.</p>
            </div>`;
        c.innerHTML = html;

        var tbody = document.getElementById('tabla-valoraciones');
        var sin = document.getElementById('sin-valoraciones');
        if (valoraciones.length === 0) { tbody.innerHTML = ''; sin.style.display = 'block'; return; }
        sin.style.display = 'none';

        tbody.innerHTML = valoraciones.map(function(v, i) {
            var estrellas = '';
            for (var s = 1; s <= 5; s++) estrellas += s <= v.estrellas ? '⭐' : '☆';
            return `<tr>
                <td data-label="#">${i + 1}</td>
                <td data-label="Cliente">${v.cliente || 'Anónimo'}</td>
                <td data-label="Producto">${v.producto || 'General'}</td>
                <td data-label="Estrellas">${estrellas}</td>
                <td data-label="Comentario">${v.comentario || '—'}</td>
                <td data-label="Fecha">${v.fecha || '—'}</td>
                <td data-label="Acciones"><button class="btn btn-danger btn-xs" onclick="eliminarValoracion(${v.id})" title="Eliminar"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button></td>
            </tr>`;
        }).join('');
    }

    function eliminarValoracion(id) {
        if (confirm('¿Eliminar esta valoración?')) {
            var valoraciones = getValoraciones().filter(function(v) { return v.id !== id; });
            localStorage.setItem(K.VALORACIONES, JSON.stringify(valoraciones));
            toast('Valoración eliminada', 'success');
            navegar('valoraciones', document.getElementById('nav-valoraciones'));
        }
    }

    // ==========================================
    // CONFIGURACIÓN
    // ==========================================
    function renderConfig(c) {
        var cfg = getConfig();
        var html = `
            <div class="section">
                <h2><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> Configuración General</h2>
                <div class="form-row">
                    <div class="form-group"><label>Nombre del Negocio</label><input type="text" id="cfg-nombre" value="${cfg.nombre || ''}"></div>
                    <div class="form-group"><label>Tipo de Negocio</label><select id="cfg-tipo-negocio">
                        <option value="Pizzería" ${cfg.tipoNegocio === 'Pizzería' ? 'selected' : ''}>Pizzería</option>
                        <option value="Restaurante" ${cfg.tipoNegocio === 'Restaurante' ? 'selected' : ''}>Restaurante</option>
                        <option value="Cafetería" ${cfg.tipoNegocio === 'Cafetería' ? 'selected' : ''}>Cafetería</option>
                        <option value="Tienda" ${cfg.tipoNegocio === 'Tienda' ? 'selected' : ''}>Tienda</option>
                        <option value="Otro" ${cfg.tipoNegocio === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select></div>
                    <div class="form-group"><label>Eslogan</label><input type="text" id="cfg-eslogan" value="${cfg.eslogan || ''}"></div>
                    <div class="form-group"><label>Descripción del Negocio</label><input type="text" id="cfg-descripcion" value="${cfg.descripcionNegocio || ''}"></div>
                    <div class="form-group"><label>Teléfono</label><input type="text" id="cfg-telefono" value="${cfg.telefono || ''}"></div>
                    <div class="form-group"><label>WhatsApp</label><input type="text" id="cfg-whatsapp" value="${cfg.whatsapp || ''}"></div>
                    <div class="form-group"><label>Email</label><input type="text" id="cfg-email" value="${cfg.email || ''}"></div>
                    <div class="form-group"><label>Dirección</label><input type="text" id="cfg-direccion" value="${cfg.direccion || ''}"></div>
                    <div class="form-group"><label>Horario</label><input type="text" id="cfg-horario" value="${cfg.horario || ''}"></div>
                    <div class="form-group"><label>Emoji</label><input type="text" id="cfg-emoji" value="${cfg.emoji || '🍕'}" maxlength="2"></div>
                    <div class="form-group"><label>Color Principal</label><input type="color" id="cfg-color" value="${cfg.color || '#e63946'}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Moneda</label><select id="cfg-moneda">
                        <option value="USD" ${cfg.moneda === 'USD' ? 'selected' : ''}>USD</option>
                        <option value="CUP" ${cfg.moneda === 'CUP' ? 'selected' : ''}>CUP</option>
                        <option value="EUR" ${cfg.moneda === 'EUR' ? 'selected' : ''}>EUR</option>
                    </select></div>
                    <div class="form-group"><label>Símbolo</label><input type="text" id="cfg-simbolo" value="${cfg.simboloMoneda || '$'}" maxlength="3"></div>
                    <div class="form-group"><label>Tipo de Envío</label><select id="cfg-envio">
                        <option value="gratis" ${cfg.tipoEnvio === 'gratis' ? 'selected' : ''}>Gratis</option>
                        <option value="fijo" ${cfg.tipoEnvio === 'fijo' ? 'selected' : ''}>Precio Fijo</option>
                        <option value="zona" ${cfg.tipoEnvio === 'zona' ? 'selected' : ''}>Por Zona</option>
                    </select></div>
                    <div class="form-group"><label>Días para Limpieza</label><input type="number" id="cfg-dias-limpieza" value="${cfg.diasLimpieza || 7}" min="1" max="30"></div>
                    <div class="form-group"><label>⏰ Tiempo Límite Pedido (min)</label><input type="number" id="cfg-tiempo-limite" value="${cfg.tiempoLimitePedido || 15}" min="1" max="120"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="grid-column:1/-1;">
                        <label>🖼️ Imagen de Portada</label>
                        <input type="file" id="cfg-portada-input" accept="image/*" onchange="previewPortada(event)">
                        <div id="portada-preview-container" style="margin-top:8px;">
                            ${cfg.portada ? '<img src="' + cfg.portada + '" class="portada-config-preview" alt="Portada">' : '<p style="color:var(--text-secondary);font-size:12px;">Sin portada</p>'}
                        </div>
                        ${cfg.portada ? '<button class="btn btn-danger btn-xs" onclick="eliminarPortada()" style="margin-top:4px;">Eliminar Portada</button>' : ''}
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="grid-column:1/-1;">
                        <label>🎠 Carrusel de Imágenes (máx. 6)</label>
                        <div id="carrusel-config-container">
                            ${cfg.carrusel && cfg.carrusel.length > 0 ? cfg.carrusel.map(function(item, i) {
                                return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">' +
                                    (item.imagen ? '<img src="' + item.imagen + '" style="width:50px;height:35px;object-fit:cover;border-radius:4px;">' : '<span style="font-size:24px;">🖼️</span>') +
                                    '<input type="text" value="' + (item.titulo || '') + '" placeholder="Título" id="carrusel-titulo-' + i + '" style="flex:1;min-width:100px;padding:8px;border:2px solid var(--border);border-radius:8px;font-size:12px;">' +
                                    '<input type="file" accept="image/*" id="carrusel-img-' + i + '" onchange="previewCarruselItem(' + i + ')" style="flex:1;min-width:100px;">' +
                                    '<button class="btn btn-danger btn-xs" onclick="eliminarCarruselItem(' + i + ')">🗑️</button>' +
                                    '</div>';
                            }).join('') : '<p style="color:var(--text-secondary);font-size:12px;">No hay imágenes en el carrusel.</p>'}
                        </div>
                        <button class="btn btn-purple btn-sm" onclick="agregarCarruselItem()" style="margin-top:8px;">Agregar Imagen</button>
                    </div>
                </div>
                <button class="btn btn-success" onclick="guardarConfig()">Guardar Configuración</button>
                <button class="btn btn-danger" onclick="ejecutarLimpieza()" style="margin-left:8px;">Limpiar Datos Obsoletos</button>
            </div>`;
        c.innerHTML = html;
    }

    function guardarConfig() {
        var cfg = getConfig();
        cfg.nombre = document.getElementById('cfg-nombre').value.trim();
        cfg.tipoNegocio = document.getElementById('cfg-tipo-negocio').value;
        cfg.eslogan = document.getElementById('cfg-eslogan').value.trim();
        cfg.descripcionNegocio = document.getElementById('cfg-descripcion').value.trim();
        cfg.telefono = document.getElementById('cfg-telefono').value.trim();
        cfg.whatsapp = document.getElementById('cfg-whatsapp').value.trim();
        cfg.email = document.getElementById('cfg-email').value.trim();
        cfg.direccion = document.getElementById('cfg-direccion').value.trim();
        cfg.horario = document.getElementById('cfg-horario').value.trim();
        cfg.emoji = document.getElementById('cfg-emoji').value.trim() || '🍕';
        cfg.color = document.getElementById('cfg-color').value;
        cfg.moneda = document.getElementById('cfg-moneda').value;
        cfg.simboloMoneda = document.getElementById('cfg-simbolo').value.trim() || '$';
        cfg.tipoEnvio = document.getElementById('cfg-envio').value;
        cfg.diasLimpieza = parseInt(document.getElementById('cfg-dias-limpieza').value) || 7;
        cfg.tiempoLimitePedido = parseInt(document.getElementById('cfg-tiempo-limite').value) || 15;

        var carrusel = [];
        if (cfg.carrusel) {
            cfg.carrusel.forEach(function(item, i) {
                var tituloInput = document.getElementById('carrusel-titulo-' + i);
                if (tituloInput) item.titulo = tituloInput.value;
                carrusel.push(item);
            });
        }
        cfg.carrusel = carrusel;

        localStorage.setItem(K.CONFIG, JSON.stringify(cfg));
        toast('Configuración guardada', 'success');
        actualizarSidebar();
    }

    function actualizarSidebar() {
        var cfg = getConfig();
        document.getElementById('sidebar-emoji').textContent = cfg.emoji || '🍕';
        document.getElementById('sidebar-nombre').innerHTML = cfg.nombre + '<span>Panel de Gestión</span>';
    }

    // ==========================================
    // REPORTES
    // ==========================================
    function renderReportes(c) {
        var pedidos = getPedidos();
        var cfg = getConfig();
        var simbolo = cfg.simboloMoneda || '$';

        var totalVentas = pedidos.filter(function(p) { return p.estado !== 'cancelado'; }).reduce(function(s, p) { return s + (p.precio || 0); }, 0);
        var totalPedidos = pedidos.length;
        var promedio = totalPedidos > 0 ? totalVentas / totalPedidos : 0;
        var cancelados = pedidos.filter(function(p) { return p.estado === 'cancelado'; }).length;

        var html = `
            <div class="cards">
                <div class="card"><div class="icon" style="background:var(--success-light);color:var(--success);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="number">${formatearPrecio(totalVentas)}</div><div class="label">Ventas Totales</div></div>
                <div class="card"><div class="icon" style="background:var(--info-light);color:var(--info);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div><div class="number">${totalPedidos}</div><div class="label">Total Pedidos</div></div>
                <div class="card"><div class="icon" style="background:var(--purple-light);color:var(--purple);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></div><div class="number">${formatearPrecio(promedio)}</div><div class="label">Promedio por Pedido</div></div>
                <div class="card"><div class="icon" style="background:var(--danger-light);color:var(--danger);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div><div class="number">${cancelados}</div><div class="label">Cancelados</div></div>
            </div>`;

        html += '<div class="charts-grid">';
        html += '<div class="section chart-container" style="margin:0;"><h2>Ventas por Hora</h2><div class="chart-wrapper"><canvas id="chart-reporte-hora"></canvas></div></div>';
        html += '<div class="section chart-container" style="margin:0;"><h2>Ventas por Día</h2><div class="chart-wrapper"><canvas id="chart-reporte-dia"></canvas></div></div>';
        html += '</div>';

        c.innerHTML = html;

        setTimeout(function() {
            if (typeof Chart === 'undefined') return;
            var horas = [];
            var ventasHora = [];
            for (var h = 0; h < 24; h += 2) {
                horas.push(h + ':00');
                var total = 0;
                pedidos.forEach(function(p) {
                    if (p.estado === 'cancelado') return;
                    if (p.fecha) {
                        var hora = new Date(p.fecha).getHours();
                        if (hora >= h && hora < h + 2) total += (p.precio || 0);
                    }
                });
                ventasHora.push(total);
            }

            var canvasHora = document.getElementById('chart-reporte-hora');
            if (canvasHora) {
                if (chartVentasHora) chartVentasHora.destroy();
                chartVentasHora = new Chart(canvasHora.getContext('2d'), { type: 'bar', data: { labels: horas, datasets: [{ label: simbolo, data: ventasHora, backgroundColor: '#8b5cf6', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }

            var diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            var ventasDia = diasSemana.map(function(_, d) {
                var total = 0;
                pedidos.forEach(function(p) {
                    if (p.estado === 'cancelado') return;
                    if (p.fecha) { var dia = new Date(p.fecha).getDay(); if (dia === d) total += (p.precio || 0); }
                });
                return total;
            });

            var canvasDia = document.getElementById('chart-reporte-dia');
            if (canvasDia) {
                if (chartVentasDia) chartVentasDia.destroy();
                chartVentasDia = new Chart(canvasDia.getContext('2d'), { type: 'bar', data: { labels: diasSemana, datasets: [{ label: simbolo, data: ventasDia, backgroundColor: '#f59e0b', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }
        }, 100);
    }

    // ==========================================
    // BACKUP
    // ==========================================
    function exportarBackup() {
        var data = {
            productos: getProductos(),
            categorias: getCategorias(),
            pedidos: getPedidos(),
            config: getConfig(),
            valoraciones: getValoraciones(),
            fecha: new Date().toISOString()
        };
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        toast('Backup descargado', 'success');
    }

    // ==========================================
    // INICIAR
    // ==========================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay').forEach(function(m) { m.remove(); });
            closeSidebar();
        }
    });

    verificarLimpieza();
    actualizarSidebar();
    navegar('dashboard', document.querySelector('.sidebar-nav a.active'));
    actualizarBadges();

    // Cargar notificaciones pendientes guardadas
notificacionesPendientes = JSON.parse(localStorage.getItem('notificacionesPendientes')) || [];

// Limpiar notificaciones de pedidos que ya no están pendientes
var pendientesActuales = getPedidos().filter(function(p) { return p.estado === 'pendiente'; }).map(function(p) { return p.id; });
notificacionesPendientes = notificacionesPendientes.filter(function(n) { return pendientesActuales.includes(n.idPedido); });
guardarNotificacionesPendientes();

// Mostrar notificaciones pendientes al abrir (después de 1 segundo)
setTimeout(function() {
    mostrarNotificacionesPendientes();
}, 1000);

// Verificación cada 2 segundos
setInterval(function() {
    verificarNuevosPedidos();
    verificarPedidosAtrasados();
    actualizarBadges();
}, 2000);
</script>
