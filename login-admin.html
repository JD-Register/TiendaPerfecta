<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Acceso Administrativo | Isla Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        :root{
            --primary:#4f46e5; --primary-hover:#4338ca;
            --bg:#0f172a; --surface:#ffffff; --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0;
            --radius:16px; --radius-sm:10px;
            --shadow-lg:0 20px 60px rgba(0,0,0,0.3);
            --transition:0.25s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;}
        body{
            font-family:'Inter',system-ui,sans-serif;
            min-height:100vh;min-height:100dvh;
            display:flex;align-items:center;justify-content:center;
            background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);
            padding:20px;
            -webkit-font-smoothing:antialiased;
        }
        .login-container{
            width:100%;max-width:400px;
            background:var(--surface);
            border-radius:var(--radius);
            padding:40px 32px;
            box-shadow:var(--shadow-lg);
            animation:slideUp 0.4s ease;
        }
        @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
        .login-logo{
            display:flex;align-items:center;justify-content:center;gap:10px;
            margin-bottom:8px;
        }
        .login-logo .logo-icon{
            width:44px;height:44px;
            background:linear-gradient(135deg,#0f172a,#4f46e5);
            border-radius:10px;
            display:flex;align-items:center;justify-content:center;
            font-weight:800;font-size:18px;color:#fff;letter-spacing:-0.5px;
        }
        .login-logo h1{
            font-size:22px;font-weight:800;color:var(--text);
            letter-spacing:-0.5px;
        }
        .login-logo h1 span{
            display:block;font-size:11px;font-weight:500;color:var(--text-muted);
        }
        .login-subtitle{
            text-align:center;color:var(--text-muted);
            font-size:13px;margin-bottom:24px;
        }
        .form-group{margin-bottom:16px;}
        .form-group label{
            display:block;font-size:11px;font-weight:600;
            text-transform:uppercase;letter-spacing:0.5px;
            color:var(--text-muted);margin-bottom:4px;
        }
        .input-wrapper{position:relative;}
        .input-wrapper svg{
            position:absolute;left:12px;top:50%;transform:translateY(-50%);
            width:16px;height:16px;
            stroke:var(--text-muted);fill:none;stroke-width:1.8;
            transition:var(--transition);
        }
        .input-wrapper input{
            width:100%;padding:10px 12px 10px 38px;
            border:1px solid var(--border);border-radius:var(--radius-sm);
            font-size:14px;font-family:inherit;
            transition:var(--transition);
            background:var(--surface);color:var(--text);
        }
        .input-wrapper input:focus{
            outline:none;border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(79,70,229,0.1);
        }
        .input-wrapper input:focus ~ svg{stroke:var(--primary);}
        .btn-login{
            width:100%;padding:12px;
            background:var(--primary);color:#fff;
            border:none;border-radius:var(--radius-sm);
            font-weight:600;font-size:14px;font-family:inherit;
            cursor:pointer;transition:var(--transition);margin-top:8px;
        }
        .btn-login:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,0.3);}
        .error-msg{
            background:#fef2f2;border:1px solid #fecaca;
            color:#991b1b;border-radius:var(--radius-sm);
            padding:10px 14px;font-size:12px;
            margin-bottom:14px;display:none;
        }
        .error-msg.visible{display:block;}
        .btn-volver{
            display:block;text-align:center;margin-top:12px;
            color:var(--text-muted);font-size:12px;
            text-decoration:none;transition:var(--transition);
        }
        .btn-volver:hover{color:var(--primary);}
        @media(max-width:400px){.login-container{padding:28px 20px;}}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <div class="logo-icon">IM</div>
            <h1>Isla Market<span>Panel Administrativo</span></h1>
        </div>
        <p class="login-subtitle">Acceso restringido solo para administradores</p>
        
        <div class="error-msg" id="error-msg">Credenciales incorrectas.</div>
        
        <form onsubmit="return loginAdmin(event)">
            <div class="form-group">
                <label>Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="login-usuario" placeholder="Usuario administrador" required autocomplete="username">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
            </div>
            <button type="submit" class="btn-login">Acceder al Panel</button>
        </form>
        
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </div>

    <script>
        function obtenerCredencialesAdmin(){
            var config=JSON.parse(localStorage.getItem('central_config')||'{}');
            return {
                usuario: config.adminUsuario || 'admin',
                contrasena: config.adminContrasena || 'admin123'
            };
        }
        
        function loginAdmin(e){
            e.preventDefault();
            var usuario=document.getElementById('login-usuario').value.trim().toLowerCase();
            var password=document.getElementById('login-password').value;
            var credenciales=obtenerCredencialesAdmin();
            var errorMsg=document.getElementById('error-msg');
            
            if(usuario===credenciales.usuario && password===credenciales.contrasena){
                var token=Date.now().toString(36)+Math.random().toString(36).substr(2);
                var sesion={
                    usuario:usuario,
                    token:token,
                    expiracion:Date.now()+(480*60*1000)
                };
                sessionStorage.setItem('adminSesion',JSON.stringify(sesion));
                window.location.href='admin-general.html';
                return false;
            }
            errorMsg.classList.add('visible');
            document.getElementById('login-password').value='';
            setTimeout(function(){errorMsg.classList.remove('visible');},3000);
            return false;
        }
    </script>
</body>
</html>
