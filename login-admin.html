<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Acceso Administrador | TiendaPerfecta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: linear-gradient(160deg, #1e1b4b 0%, #312e81 30%, #4c1d95 70%, #1e1b4b 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin: 0 auto 12px;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 800;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: 0.2s;
            background: var(--bg);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            background: var(--surface);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: #fff;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(99,102,241,0.3);
            margin-top: 4px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .error-msg {
            background: #fef2f2;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
            border: 1px solid #fecaca;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 500;
        }

        .toast.mostrar {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { border-color: #ef4444; color: #ef4444; }
        .toast.info { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="icon">🔐</div>
            <h1>Panel Administrador</h1>
            <p>Ingresa tus credenciales para gestionar el sistema</p>
        </div>

        <form id="form-login-admin">
            <div id="error-msg" class="error-msg"></div>
            <div class="form-group">
                <label>👤 Usuario</label>
                <input type="text" id="admin-user" placeholder="admin" value="admin" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>🔑 Contraseña</label>
                <input type="password" id="admin-pass" placeholder="••••••••" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">🚀 Entrar al Panel</button>
        </form>

        <div class="login-footer">
            <a href="index.html">← Volver a la vitrina</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE CREDENCIALES
        // ==========================================
        var ADMIN_CONFIG = {
            usuario: 'admin',
            password: 'TiendaPerfecta2025', // ¡CAMBIA ESTO EN PRODUCCIÓN!
            tiempoExpiracion: 480 // 8 horas en minutos
        };

        // ==========================================
        // TOAST
        // ==========================================
        function mostrarToast(mensaje, tipo) {
            var toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast mostrar ' + (tipo || 'info');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.className = 'toast';
            }, 4000);
        }

        // ==========================================
        // OBTENER RUTA BASE
        // ==========================================
        function obtenerRutaBase() {
            var href = window.location.href;
            return href.substring(0, href.lastIndexOf('/') + 1);
        }

        // ==========================================
        // VERIFICAR SESIÓN EXISTENTE
        // ==========================================
        (function() {
            var sesionRaw = sessionStorage.getItem('adminSesion');
            
            if (sesionRaw) {
                try {
                    var sesion = JSON.parse(sesionRaw);
                    var ahora = new Date().getTime();
                    
                    // Si la sesión es válida y no ha expirado, redirigir al panel
                    if (sesion.usuario === ADMIN_CONFIG.usuario && sesion.token && sesion.expiracion && ahora < sesion.expiracion) {
                        var rutaBase = obtenerRutaBase();
                        window.location.href = rutaBase + 'admin-general.html';
                        return;
                    } else {
                        // Sesión inválida o expirada, limpiar
                        sessionStorage.removeItem('adminSesion');
                    }
                } catch (e) {
                    sessionStorage.removeItem('adminSesion');
                }
            }
        })();

        // ==========================================
        // LOGIN
        // ==========================================
        document.getElementById('form-login-admin').addEventListener('submit', function(e) {
            e.preventDefault();

            var usuario = document.getElementById('admin-user').value.trim();
            var contrasena = document.getElementById('admin-pass').value.trim();
            var errorMsg = document.getElementById('error-msg');

            // Ocultar mensaje de error anterior
            errorMsg.style.display = 'none';

            // Validar campos vacíos
            if (!usuario || !contrasena) {
                errorMsg.textContent = '⚠️ Completa todos los campos.';
                errorMsg.style.display = 'block';
                return;
            }

            // Verificar credenciales
            if (usuario === ADMIN_CONFIG.usuario && contrasena === ADMIN_CONFIG.password) {
                
                // Crear sesión segura con expiración
                var ahora = new Date().getTime();
                var expiracion = ahora + (ADMIN_CONFIG.tiempoExpiracion * 60 * 1000);
                
                var sesion = {
                    usuario: usuario,
                    token: btoa(usuario + ':' + ahora + ':' + Math.random().toString(36).substring(2, 10)),
                    inicio: ahora,
                    expiracion: expiracion
                };
                
                // Guardar en sessionStorage
                sessionStorage.setItem('adminSesion', JSON.stringify(sesion));
                
                console.log('✅ Sesión guardada correctamente');
                console.log('📦 Token:', sesion.token);
                console.log('⏰ Expira:', new Date(expiracion).toLocaleTimeString());
                
                // Mostrar feedback visual
                var btnLogin = document.querySelector('.btn-login');
                btnLogin.textContent = '✅ Acceso correcto...';
                btnLogin.style.background = '#10b981';
                btnLogin.disabled = true;
                
                // Redirigir después de una pequeña pausa
                var rutaBase = obtenerRutaBase();
                setTimeout(function() {
                    window.location.href = rutaBase + 'admin-general.html';
                }, 300);
                
            } else {
                // Credenciales incorrectas
                errorMsg.textContent = '❌ Usuario o contraseña incorrectos.';
                errorMsg.style.display = 'block';
                
                // Limpiar contraseña
                document.getElementById('admin-pass').value = '';
                document.getElementById('admin-pass').focus();
                
                // Agitar el formulario
                var container = document.querySelector('.login-container');
                container.style.animation = 'none';
                container.offsetHeight;
                container.style.animation = 'shake 0.4s ease';
            }
        });

        // ==========================================
        // ENTER PARA ENVIAR
        // ==========================================
        document.getElementById('admin-pass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('form-login-admin').dispatchEvent(new Event('submit'));
            }
        });

        // ==========================================
        // PREVENIR ACCESO DIRECTO
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hash === '#bypass') {
                window.location.hash = '';
            }
        });
    </script>
</body>
</html>
