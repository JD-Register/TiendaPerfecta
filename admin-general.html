function verDetalleCliente(id){
    var cl=(JSON.parse(localStorage.getItem(K.CLIENTES))||[]).find(function(c){return c.id===id;});
    if(!cl)return;
    
    var cuotas=cl.cuotas||[];
    var totalCuotas=cuotas.length;
    var pagadas=cuotas.filter(function(q){return q.pagado;}).length;
    var porcentaje=totalCuotas>0?Math.round((pagadas/totalCuotas)*100):0;
    var totalPagado=cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0);
    var totalPendiente=cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0);
    
    var html='<div style="font-size:13px;">';
    html+='<div class="detalle-seccion"><h4>'+getIcono('clientes')+' Datos Generales</h4>';
    html+='<p><strong>Nombre:</strong> '+cl.nombre+' | <strong>Dueño:</strong> '+(cl.dueno||'—')+'</p>';
    html+='<p><strong>Tel:</strong> '+(cl.telefono||'—')+' | <strong>Email:</strong> '+(cl.email||'—')+'</p>';
    html+='<p><strong>Usuario:</strong> '+cl.usuario+' | <strong>Contraseña:</strong> <span id="pass-'+cl.id+'">••••</span> <button class="btn btn-outline btn-xs" onclick="togglePassword('+cl.id+',\''+(cl.contrasena||'123456').replace(/'/g,"\\'")+'\')">Ver</button></p>';
    html+='<p><strong>Provincia:</strong> '+(cl.provincia||'—')+' | <strong>Municipio:</strong> '+(cl.municipio||'—')+'</p>';
    html+='<p><strong>Etiquetas:</strong> '+getEtiquetasBadges(cl.etiquetas)+'</p>';
    html+='<div class="contacto-botones" style="margin-top:8px;">'+btnLlamar(cl.telefono)+btnWhatsApp(cl.whatsapp||cl.telefono)+'</div>';
    html+='</div>';
    
    if(cl.tipoCliente==='alquiler'&&cuotas.length>0){
        html+='<div class="detalle-seccion"><h4>'+getIcono('pagos')+' Cuotas ('+cuotas.length+')</h4>';
        html+='<div class="tabla-wrap"><table style="font-size:11px;"><thead><tr><th>#</th><th>Vence</th><th>Estimado</th><th>Real</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
        
        for(var i=0;i<cuotas.length;i++){
            var q=cuotas[i];
            var fv=new Date(q.fechaVencimiento+'T00:00:00');
            var vencido=!q.pagado&&fv<new Date();
            var claseFila=q.pagado?'fila-pagada':(vencido?'fila-vencida':'fila-pendiente');
            var estadoTexto=q.pagado?'Pagado':(vencido?'Vencido':'Pendiente');
            var accion=q.pagado?'':'<button class="btn btn-success btn-xs" onclick="pagarCuotaDesdeModal('+cl.id+','+i+')">Pagar</button>';
            
            html+='<tr class="'+claseFila+'"><td data-label="#">'+q.numero+'</td><td data-label="Vence">'+fv.toLocaleDateString('es-ES')+'</td><td data-label="Estimado">$'+q.montoEstimado.toLocaleString()+'</td><td data-label="Real">'+(q.montoReal?'$'+q.montoReal.toLocaleString():'—')+'</td><td data-label="Estado">'+estadoTexto+'</td><td data-label="Acción">'+accion+'</td></tr>';
        }
        
        html+='</tbody></table></div>';
        html+='<div class="progress"><div class="progress-fill" style="width:'+porcentaje+'%;background:var(--success);"></div></div>';
        html+='<div class="detalle-grid"><div class="item"><div class="num">$'+totalPagado.toLocaleString()+'</div><div class="lbl">Pagado</div></div><div class="item"><div class="num">$'+totalPendiente.toLocaleString()+'</div><div class="lbl">Pendiente</div></div><div class="item"><div class="num">'+pagadas+'/'+totalCuotas+'</div><div class="lbl">Cuotas</div></div><div class="item"><div class="num">'+porcentaje+'%</div><div class="lbl">Progreso</div></div></div>';
        html+='</div>';
    }
    
    html+='<div class="acciones-grid">';
    html+='<button class="btn-accion" onclick="accionCliente('+cl.id+',\'publicar\')">'+(cl.publicadoEnVitrina?'Ocultar':'Publicar')+'</button>';
    html+='<button class="btn-accion" onclick="accionCliente('+cl.id+',\'gracia\')">'+(cl.enPeriodoGracia?'Quitar Gracia':'Activar Gracia')+'</button>';
    html+='<button class="btn-accion" onclick="accionCliente('+cl.id+',\'suspender\')">'+(cl.estado==='suspendido'?'Reactivar':'Suspender')+'</button>';
    html+='<button class="btn-accion" onclick="cerrarModalConfirmar();editarCliente('+cl.id+')">Editar</button>';
    html+='<button class="btn-accion danger" onclick="cerrarModalConfirmar();eliminarCliente('+cl.id+')">Eliminar</button>';
    if(cl.urlTienda)html+='<a class="btn-accion" href="'+cl.urlTienda+'" target="_blank" style="text-decoration:none;">Ver Tienda</a>';
    html+='</div></div>';
    
    mostrarDetalleModal('Detalle: '+cl.nombre,html);
    document.getElementById('modal-confirmar').querySelector('.modal').classList.add('modal-detalle');
}

function togglePassword(id,pass){
    var el=document.getElementById('pass-'+id);
    if(el){
        el.textContent=el.textContent==='••••'?pass:'••••';
    }
}

function pagarCuotaDesdeModal(cid,cuotaIndex){
    var cl=(JSON.parse(localStorage.getItem(K.CLIENTES))||[]).find(function(c){return c.id===cid;});
    if(!cl||!cl.cuotas||!cl.cuotas[cuotaIndex])return;
    var q=cl.cuotas[cuotaIndex];
    var cfg=obtenerConfig();
    var mr=calcularMontoReal(q.montoEstimado,cl.metodoPago||'tarjeta_cup',cfg.planDescuentoEfectivo||15,obtenerTasaActual());
    
    confirmarAccion('Confirmar Pago','<p><strong>Cuota #'+q.numero+'</strong></p><p>Monto: $'+mr.monto.toLocaleString()+' '+mr.moneda+'</p>',function(){
        var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
        pagos.push({id:Date.now(),clienteId:cid,cuotaIndex:cuotaIndex,monto:mr.monto,fecha:new Date().toISOString().split('T')[0],metodoPago:cl.metodoPago||'Efectivo',estado:'Confirmado',moneda:mr.moneda,tasaUsada:mr.tasaUsada,origen:'admin'});
        localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
        marcarCuotaPagada(cid,cuotaIndex,mr.monto,mr.moneda,mr.tasaUsada);
        verDetalleCliente(cid);
    });
}

function accionCliente(id,accion){
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var idx=clientes.findIndex(function(c){return c.id===id;});
    if(idx===-1)return;
    var cl=clientes[idx];
    
    if(accion==='publicar'){
        cl.publicadoEnVitrina=!cl.publicadoEnVitrina;
        if(cl.publicadoEnVitrina){
            notificarCliente(id,'Tu tienda ya es visible en la vitrina pública.','exito','normal');
        }
        localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
        toast(cl.publicadoEnVitrina?'Publicado':'Ocultado','exito');
    }
    else if(accion==='gracia'){
        cl.enPeriodoGracia=!cl.enPeriodoGracia;
        if(cl.enPeriodoGracia){
            cl.fechaInicioGracia=new Date().toISOString();
            cl.estado='activo';
        }else{
            cl.fechaInicioGracia=null;
        }
        localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
        toast(cl.enPeriodoGracia?'Gracia activada':'Gracia desactivada','exito');
    }
    else if(accion==='suspender'){
        cl.estado=cl.estado==='suspendido'?'activo':'suspendido';
        cl.enPeriodoGracia=false;
        localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
        toast(cl.estado==='activo'?'Reactivado':'Suspendido','exito');
    }
    
    cerrarModalConfirmar();
    renderClientes(document.getElementById('contenido-principal'));
    actualizarBadges();
}

// APROBAR CONFIGURACIÓN DE TIENDA DESDE CLIENTE
// Recibe los datos que el cliente envió desde su panel
// ==========================================
function aprobarConfiguracionTienda(solicitudId){
    // Obtener la solicitud
    var solicitudes=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[];
    var sol=solicitudes.find(function(s){return s.id===solicitudId;});
    if(!sol||!sol.contexto){toast('Solicitud no encontrada','error');return;}
    
    // Obtener clientes
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var idx=clientes.findIndex(function(c){return c.id===sol.contexto.clienteId;});
    if(idx===-1){toast('Cliente no encontrado','error');return;}
    
    // Actualizar datos del cliente con lo que envió
    clientes[idx].nombre=sol.contexto.nombre||clientes[idx].nombre;
    clientes[idx].eslogan=sol.contexto.eslogan||'';
    clientes[idx].telefono=sol.contexto.telefono||'';
    clientes[idx].whatsapp=sol.contexto.whatsapp||'';
    clientes[idx].descripcion=sol.contexto.descripcion||'';
    clientes[idx].logo=sol.contexto.logo||'tienda';
    clientes[idx].provincia=sol.contexto.provincia||'';
    clientes[idx].municipio=sol.contexto.municipio||'';
    clientes[idx].direccion=sol.contexto.direccion||'';
    clientes[idx].instagram=sol.contexto.instagram||'';
    clientes[idx].facebook=sol.contexto.facebook||'';
    clientes[idx].tiktok=sol.contexto.tiktok||'';
    clientes[idx].youtube=sol.contexto.youtube||'';
    clientes[idx].oferta=sol.contexto.oferta||'';
    clientes[idx].tiendaCompleta=true;
    
    // Guardar cambios
    localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
    
    // Marcar solicitud como aprobada
    sol.estado='cliente';
    if(!sol.historial)sol.historial=[];
    sol.historial.push({fecha:new Date().toISOString(),accion:'Configuración aprobada'});
    localStorage.setItem(K.SOLICITUDES,JSON.stringify(solicitudes));
    
    // Notificar al cliente
    notificarCliente(clientes[idx].id,'Tu configuración fue aprobada. Tu tienda ya está actualizada.','exito','normal');
    
    toast('Configuración aprobada','exito');
    renderSolicitudes(document.getElementById('contenido-principal'));
    actualizarBadges();
}
