<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel de Administración | Isla Market</title>
    <script>
        var cdns=['https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js'];
        var intento=0;
        function cargarChart(){if(intento>=cdns.length)return;var s=document.createElement('script');s.src=cdns[intento];s.onload=function(){window._chartCargado=true;};s.onerror=function(){intento++;setTimeout(cargarChart,500);};document.head.appendChild(s);}
        cargarChart();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{
            --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
            --bg:#f8fafc; --surface:#ffffff; --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0;
            --success:#059669; --success-bg:#ecfdf5; --success-text:#065f46;
            --warning:#d97706; --warning-bg:#fffbeb; --warning-text:#92400e;
            --danger:#dc2626; --danger-bg:#fef2f2; --danger-text:#991b1b;
            --info:#2563eb; --info-bg:#eff6ff; --info-text:#1e40af;
            --wa-green:#25d366; --phone-blue:#2563eb;
            --sidebar-bg:#0f172a; --sidebar-hover:#1e293b; --sidebar-text:#94a3b8;
            --radius:12px; --radius-sm:8px; --radius-xs:6px;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(79,70,229,0.1);
            --transition:0.2s ease;
        }
        .dark-mode{
            --bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;
            --primary-light:#1e1b4b;
            --success-bg:#064e3b;--success-text:#a7f3d0;
            --warning-bg:#78350f;--warning-text:#fde68a;
            --danger-bg:#7f1d1d;--danger-text:#fecaca;
            --info-bg:#1e3a5f;--info-text:#bfdbfe;
            --shadow-md:0 4px 12px rgba(0,0,0,0.3);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px;line-height:1.5;transition:background 0.3s,color 0.3s;}
        img{max-width:100%;height:auto;object-fit:contain;}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:99;}
        .sidebar-overlay.activo{display:block;}
        .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;height:100dvh;background:var(--sidebar-bg);z-index:100;display:flex;flex-direction:column;transition:transform 0.25s;flex-shrink:0;}
        .sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:8px;}
        .sidebar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;overflow:hidden;}
        .sidebar-logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
        .sidebar-title{font-size:15px;font-weight:700;color:#fff;line-height:1.2;}
        .sidebar-title span{display:block;font-size:10px;font-weight:500;color:#818cf8;}
        .sidebar-nav{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 8px;overflow-y:auto;}
        .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--sidebar-text);text-decoration:none;font-weight:500;font-size:13px;transition:var(--transition);cursor:pointer;position:relative;white-space:nowrap;border-left:3px solid transparent;}
        .sidebar-nav a:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .sidebar-nav a.activo{background:var(--primary);color:#fff;border-left-color:#7c3aed;}
        .sidebar-nav a svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        .badge-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--danger);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
        .sidebar-footer{border-top:1px solid rgba(255,255,255,0.1);padding:10px 8px;display:flex;flex-direction:column;gap:2px;}
        .btn-sidebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:none;border:none;color:var(--sidebar-text);cursor:pointer;font-weight:500;font-size:12px;transition:var(--transition);width:100%;text-align:left;font-family:inherit;border-left:3px solid transparent;}
        .btn-sidebar:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .btn-sidebar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
        .btn-sidebar-logout{color:#fca5a5!important;border-top:1px solid rgba(255,255,255,0.1);margin-top:4px;padding-top:10px;}
        .btn-menu-movil{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
        .btn-menu-movil svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;}
        .contenido{margin-left:240px;flex:1;padding:24px;width:calc(100% - 240px);min-width:0;min-height:100vh;}
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
        .topbar h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
        .topbar .fecha{color:var(--text-muted);font-size:13px;font-weight:500;}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
        .stat-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--border);border-left:3px solid var(--primary);box-shadow:var(--shadow-sm);transition:var(--transition);}
        .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
        .stat-card:nth-child(2){border-left-color:var(--danger);}
        .stat-card:nth-child(3){border-left-color:var(--success);}
        .stat-card:nth-child(4){border-left-color:var(--warning);}
        .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:6px;}
        .stat-value{font-size:24px;font-weight:700;color:var(--text);}
        .seccion{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border);border-top:2px solid var(--primary);box-shadow:var(--shadow-sm);}
        .seccion-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
        .seccion-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
        .seccion-title svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;}
        .badge-success{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success);}
        .badge-warning{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning);}
        .badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger);}
        .badge-info{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info);}
        .badge-neutral{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
        .badge-primary{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);}
        .badge-vip{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;}
        .badge-urgente{background:var(--danger);color:#fff;animation:pulse 1s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.7;}}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent;transition:var(--transition);font-family:inherit;white-space:nowrap;text-decoration:none;}
        .btn svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;}
        .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
        .btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);}
        .btn-outline{background:transparent;border-color:var(--primary);color:var(--primary);}
        .btn-outline:hover{background:var(--primary-light);}
        .btn-success{background:var(--success);color:#fff;border-color:var(--success);}
        .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
        .btn-danger:hover{background:var(--danger);color:#fff;}
        .btn-wa{background:var(--wa-green);color:#fff;}
        .btn-wa svg{fill:currentColor;stroke:none;}
        .btn-tel{background:var(--phone-blue);color:#fff;}
        .btn-tel svg{fill:currentColor;stroke:none;}
        .btn-sm{padding:5px 10px;font-size:11px;}
        .btn-xs{padding:3px 8px;font-size:10px;border-radius:4px;}
        .btn-block{width:100%;justify-content:center;}
        .tabla-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);width:100%;}
        table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px;}
        thead{background:var(--primary-light);}
        th{text-align:left;padding:9px 12px;color:var(--primary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid var(--primary);white-space:nowrap;}
        td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tbody tr{transition:var(--transition);}
        tbody tr:hover{background:var(--primary-light);}
        .tabla-acciones{display:flex;gap:4px;flex-wrap:wrap;}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end;}
        .form-grupo{display:flex;flex-direction:column;min-width:0;}
        .form-grupo-full{grid-column:1/-1;}
        .form-grupo label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:4px;}
        .form-grupo input,.form-grupo select,.form-grupo textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--surface);transition:var(--transition);font-family:inherit;width:100%;color:var(--text);}
        .form-grupo input:focus,.form-grupo select:focus,.form-grupo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,0.1);}
        .form-grupo textarea{resize:vertical;min-height:50px;}
        .form-grupo-check{display:flex;align-items:center;gap:8px;padding-top:8px;}
        .form-grupo-check label{font-size:11px;font-weight:500;text-transform:none;cursor:pointer;}
        .form-grupo-check input[type="checkbox"]{width:15px;height:15px;cursor:pointer;accent-color:var(--primary);}
        .form-grupo-file input[type="file"]{padding:7px;border:1px dashed var(--primary);border-radius:var(--radius-xs);background:var(--primary-light);cursor:pointer;font-size:11px;}
        .logo-preview{width:60px;height:60px;border-radius:var(--radius-sm);border:2px solid var(--primary);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--primary-light);flex-shrink:0;}
        .logo-preview img{width:100%;height:100%;object-fit:contain;padding:4px;}
        .logo-preview-horizontal{width:200px;height:60px;border-radius:var(--radius-sm);border:2px solid var(--primary);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--primary-light);flex-shrink:0;}
        .logo-preview-horizontal img{width:100%;height:100%;object-fit:contain;padding:4px;}
        .formulario-colapsable{display:none;margin-top:12px;padding-top:12px;border-top:2px solid var(--primary);}
        .formulario-colapsable.visible{display:block;}
        .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
        .chip{padding:6px 12px;border-radius:20px;font-weight:600;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:var(--transition);font-family:inherit;white-space:nowrap;}
        .chip:hover{border-color:var(--primary);color:var(--primary);}
        .chip.activo{background:var(--primary);color:#fff;border-color:var(--primary);}
        .search-box{position:relative;margin-bottom:12px;}
        .search-box input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);}
        .search-box input:focus{outline:none;border-color:var(--primary);}
        .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;}
        .alerta{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:12px;font-weight:500;flex-wrap:wrap;gap:8px;border:1px solid;border-left:4px solid;}
        .alerta-warning{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-text);border-left-color:var(--warning);}
        .alerta-danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text);border-left-color:var(--danger);}
        .alerta-info{background:var(--info-bg);border-color:var(--info);color:var(--info-text);border-left-color:var(--info);}
        .alerta-success{background:var(--success-bg);border-color:var(--success);color:var(--success-text);border-left-color:var(--success);}
        .dias-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
        .dia-chip{text-align:center;padding:5px 0;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:var(--transition);font-family:inherit;}
        .dia-chip:hover{border-color:var(--primary);color:var(--primary);}
        .dia-chip.seleccionado{background:var(--primary);color:#fff;border-color:var(--primary);}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:16px;}
        .modal-overlay.activo{display:flex;}
        .modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modalIn 0.25s ease;border:1px solid var(--primary);border-top:3px solid var(--primary);}
        @keyframes modalIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .modal h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--primary);}
        .modal-detalle{max-width:800px;}
        .detalle-seccion{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);border-left:3px solid var(--primary);}
        .detalle-seccion h4{font-size:11px;font-weight:700;margin-bottom:6px;color:var(--primary);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
        .detalle-seccion h4 svg{width:14px;height:14px;stroke:var(--primary);fill:none;stroke-width:2;}
        .detalle-seccion p{font-size:12px;margin-bottom:3px;}
        .detalle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
        .detalle-grid .item{background:var(--surface);border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border);}
        .detalle-grid .item .num{font-size:16px;font-weight:700;color:var(--primary);}
        .detalle-grid .item .lbl{font-size:9px;color:var(--text-muted);}
        .acciones-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
        .btn-accion{padding:7px 8px;border-radius:var(--radius-xs);font-weight:600;font-size:10px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:var(--transition);text-align:center;font-family:inherit;}
        .btn-accion:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
        .btn-accion.danger:hover{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
        .progress{width:100%;height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0;}
        .progress-fill{height:100%;border-radius:4px;transition:width 0.4s;}
        .contacto-botones{display:flex;gap:4px;flex-wrap:wrap;}
        .chart-container{max-width:100%;height:240px;margin-top:10px;position:relative;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;font-weight:600;font-size:13px;z-index:3000;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.2);max-width:90%;text-align:center;}
        .toast.mostrar{opacity:1;}
        .toast.exito{background:var(--success);color:#fff;}
        .toast.error{background:var(--danger);color:#fff;}
        .toast.info{background:var(--primary);color:#fff;}
        .etiqueta-select{display:flex;gap:4px;flex-wrap:wrap;}
        .fila-pagada{background:var(--success-bg);border-left:3px solid var(--success);}
        .fila-vencida{background:var(--danger-bg);border-left:3px solid var(--danger);}
        .fila-pendiente{background:var(--warning-bg);border-left:3px solid var(--warning);}
        
        /* NUEVO: Tabs de configuración */
        .config-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:8px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);}
        .config-tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;border:2px solid transparent;background:transparent;color:var(--text-muted);transition:var(--transition);font-family:inherit;white-space:nowrap;}
        .config-tab:hover{background:var(--primary-light);color:var(--primary);}
        .config-tab.activo{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-md);}
        .config-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
        
        /* NUEVO: Horario semanal */
        .horario-grid{display:grid;gap:8px;}
        .horario-fila{display:grid;grid-template-columns:100px 60px 1fr 1fr;gap:8px;align-items:center;padding:8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);}
        .horario-dia{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;}
        .horario-dia svg{width:14px;height:14px;stroke:var(--primary);fill:none;stroke-width:2;}
        
        /* NUEVO: Kanban */
        .kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px;}
        .kanban-col{background:var(--bg);border-radius:var(--radius-sm);padding:12px;min-height:200px;border:1px solid var(--border);}
        .kanban-col-header{font-weight:700;font-size:11px;text-transform:uppercase;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
        .kanban-card{background:var(--surface);border-radius:6px;padding:10px;margin-bottom:6px;border:1px solid var(--border);cursor:pointer;transition:var(--transition);}
        .kanban-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary);}
        
        @media(max-width:1024px){.stats-grid{grid-template-columns:repeat(2,1fr);}.detalle-grid{grid-template-columns:repeat(2,1fr);}.acciones-grid{grid-template-columns:repeat(2,1fr);}.kanban-grid{grid-template-columns:repeat(2,1fr);}}
        @media(max-width:900px){.sidebar{transform:translateX(-100%);}.sidebar.abierto{transform:translateX(0);}.btn-menu-movil{display:flex;}.contenido{margin-left:0;width:100%;padding:14px 10px;padding-top:56px;}}
        @media(max-width:600px){
            .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
            .stat-card{padding:12px;}
            .stat-value{font-size:17px;}
            .seccion{padding:14px 12px;}
            .form-grid{grid-template-columns:1fr;}
            .dias-grid{grid-template-columns:repeat(5,1fr);}
            .detalle-grid{grid-template-columns:1fr 1fr;}
            .acciones-grid{grid-template-columns:1fr 1fr;}
            .modal{padding:14px 10px;max-width:100%;}
            .tabla-wrap{border:none;overflow:visible;}
            table{min-width:auto;display:block;}
            thead{display:none;}
            tbody{display:block;}
            tr{display:block;margin-bottom:8px;border:1px solid var(--primary);border-radius:var(--radius-sm);padding:8px;border-left:3px solid var(--primary);}
            td{display:flex;justify-content:space-between;padding:5px 0;border:none;font-size:11px;}
            td::before{content:attr(data-label);font-weight:600;color:var(--primary);font-size:9px;text-transform:uppercase;margin-right:8px;flex-shrink:0;}
            .kanban-grid{grid-template-columns:1fr;}
            .config-tabs{flex-direction:column;}
            .horario-fila{grid-template-columns:80px 50px 1fr 1fr;gap:4px;}
        }
        @media(max-width:400px){.stats-grid{grid-template-columns:1fr;}.acciones-grid{grid-template-columns:1fr;}}
    </style>
</head>

function comprimirImagen(file,maxWidth,calidad,callback){
    var reader=new FileReader();
    reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
            var canvas=document.createElement('canvas');
            var ctx=canvas.getContext('2d');
            var width=img.width;
            var height=img.height;
            if(width>maxWidth){
                height=Math.round(height*(maxWidth/width));
                width=maxWidth;
            }
            canvas.width=width;
            canvas.height=height;
            ctx.drawImage(img,0,0,width,height);
            var dataURL=canvas.toDataURL('image/jpeg',calidad);
            callback(dataURL);
        };
        img.src=e.target.result;
    };
    reader.readAsDataURL(file);
}


function previewLogo(e){
    var f=e.target.files[0];
    if(!f)return;
    comprimirImagen(f,300,0.6,function(dataURL){
        var preview=document.getElementById('cl-logo-preview');
        if(preview)preview.innerHTML='<img src="'+dataURL+'" style="width:100%;height:100%;object-fit:contain;">';
    });
}

function previewPortada(e){
    var f=e.target.files[0];

}

function previewGaleria(event){
    var files=event.target.files;
    var container=document.getElementById('galeria-preview');
    if(!container)return;
    container.innerHTML='';
    
    var maxImages=Math.min(files.length,5);
    for(var i=0;i<maxImages;i++){
        (function(file){
            comprimirImagen(file,300,0.5,function(dataURL){
                var img=document.createElement('img');
                img.src=dataURL;
                img.style.cssText='width:50px;height:50px;object-fit:cover;border-radius:6px;border:2px solid var(--primary);';
                container.appendChild(img);
            });
        })(files[i]);
    }
}

    function actualizarBadges(){
        var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],solicitudes=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[],hoy=new Date();
        var v=0;
        clientes.forEach(function(c){
            if(c.estado==='activo'&&c.cuotas){
                c.cuotas.forEach(function(q){if(!q.pagado&&new Date(q.fechaVencimiento)<hoy)v++;});
            }
        });
        var bv=document.getElementById('badge-vencidos');
        bv.textContent=v;bv.style.display=v>0?'flex':'none';
        
        // Separar solicitudes comerciales vs soporte
        var sol=solicitudes.filter(function(s){return s.estado==='nueva'&&s.tipo!=='soporte';}).length;
        var bs=document.getElementById('badge-solicitudes');
        bs.textContent=sol;bs.style.display=sol>0?'flex':'none';
        
        var sop=solicitudes.filter(function(s){return (s.estado==='nueva'||s.estado==='en_proceso')&&s.tipo==='soporte';}).length;
        var bsp=document.getElementById('badge-soporte');

        bnp.textContent=np;bnp.style.display=np>0?'flex':'none';

    function verificarVencimientos(){
        var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],hoy=new Date(),cambios=false,cfg=obtenerConfig();
        var diasGracia=cfg.diasGracia||5,recordatorioDias=cfg.recordatorioDias||3;
        clientes.forEach(function(cl){
            if(cl.tipoCliente!=='alquiler')return;
            var tieneCuotaVencida=false;
            if(cl.cuotas){
                cl.cuotas.forEach(function(q){
                    if(!q.pagado&&new Date(q.fechaVencimiento+'T00:00:00')<hoy)tieneCuotaVencida=true;
                });
            }
            if(tieneCuotaVencida&&cl.estado==='activo'){
                if(cl.graciaAutomatica&&!cl.enPeriodoGracia&&!cl.fechaInicioGracia){
                    cl.enPeriodoGracia=true;cl.fechaInicioGracia=hoy.toISOString();cambios=true;
                    notificarCliente(cl.id,'Tienes pagos vencidos. Período de gracia de '+diasGracia+' días activado.','alerta','alta');
                    registrarLog('Gracia automática activada',cl.nombre);
                }else if(!cl.graciaAutomatica&&!cl.enPeriodoGracia){
                    cl.estado='suspendido';cambios=true;
                    notificarCliente(cl.id,'Cuota vencida. Tienda suspendida.','alerta','urgente');
                    registrarLog('Cliente suspendido',cl.nombre);
                }
            }
            if(cl.enPeriodoGracia&&cl.fechaInicioGracia){
                var fg=new Date(cl.fechaInicioGracia);fg.setDate(fg.getDate()+diasGracia);
                if(hoy>fg&&cl.estado==='activo'){
                    cl.estado='suspendido';cl.enPeriodoGracia=false;cambios=true;
                    notificarCliente(cl.id,'Período de gracia terminado. Tienda suspendida.','alerta','urgente');
                }
            }
            if(cl.cuotas&&cl.enPeriodoGracia){
                var todasPagas=cl.cuotas.every(function(q){return q.pagado;});
                if(todasPagas){cl.enPeriodoGracia=false;cl.fechaInicioGracia=null;cambios=true;}
            }
            if(cl.cuotas&&cl.estado==='activo'){
                cl.cuotas.forEach(function(q){
                    if(!q.pagado&&!q.recordatorioEnviado){
                        var dias=Math.ceil((new Date(q.fechaVencimiento+'T00:00:00')-hoy)/(1000*60*60*24));
                        if(dias>=0&&dias<=recordatorioDias){
                            notificarCliente(cl.id,'Cuota #'+q.numero+' vence en '+dias+' día(s).','pago','media');
                            q.recordatorioEnviado=true;cambios=true;
                        }
                    }
                });
            }
        });
        if(cambios){localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));actualizarBadges();}
    }
    
    function notificarCliente(cid,txt,tipo,prioridad){
        var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],idx=clientes.findIndex(function(c){return c.id===cid;});
        if(idx===-1)return;
        if(!clientes[idx].notificaciones)clientes[idx].notificaciones=[];
        clientes[idx].notificaciones.unshift({
            id:Date.now(),texto:txt,leida:false,fecha:new Date().toISOString(),
            tipo:tipo||'sistema',prioridad:prioridad||'normal'
        });
        if(clientes[idx].notificaciones.length>30)clientes[idx].notificaciones=clientes[idx].notificaciones.slice(0,30);
        localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
    }

    // ==========================================
    // FUNCIONES DE PAGO Y CUOTAS
    // ==========================================
    function generarCuotas(precioBase,metodoPago,descuentoEfectivo,mesesContratados,pagosPorMes,diasPago,fechaInicio){
        var cuotas=[],montoPorPago=precioBase/pagosPorMes,fi=new Date(fechaInicio+'T00:00:00'),total=mesesContratados*pagosPorMes;
        for(var i=0;i<total;i++){
            var np=i%pagosPorMes,nm=Math.floor(i/pagosPorMes),dp=diasPago[np]||1;
            var fv=new Date(fi);fv.setMonth(fv.getMonth()+nm);
            fv.setDate(Math.min(dp,new Date(fv.getFullYear(),fv.getMonth()+1,0).getDate()));
            var ma=montoPorPago;
            if(np===pagosPorMes-1){
                var sa=0;
                for(var j=i-np;j<i;j++){if(cuotas[j])sa+=cuotas[j].montoEstimado;}
                ma=precioBase-sa;
            }
            cuotas.push({numero:i+1,fechaVencimiento:fv.toISOString().split('T')[0],montoEstimado:Math.round(ma*100)/100,montoReal:null,monedaReal:null,tasaUsada:null,pagado:false,fechaPago:null,comprobanteId:null,saldoPendiente:0,notas:'',recordatorioEnviado:false});
        }
        return cuotas;
    }
    
    function calcularMontoReal(montoEstimado,metodoPago,descuentoEfectivo,tasaDelDia){
        switch(metodoPago){
            case 'tarjeta_cup':return {monto:montoEstimado,moneda:'CUP',tasaUsada:null};
            case 'efectivo_cup':return {monto:Math.round(montoEstimado*(1-descuentoEfectivo/100)),moneda:'CUP',tasaUsada:null};
            case 'efectivo_usd':var usd=montoEstimado/tasaDelDia;return {monto:Math.round(usd*(1-descuentoEfectivo/100)*100)/100,moneda:'USD',tasaUsada:tasaDelDia};
            default:return {monto:montoEstimado,moneda:'CUP',tasaUsada:null};
        }
    }
    
    function marcarCuotaPagada(clienteId,cuotaIndex,monto,moneda,tasaUsada){
        var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],idx=clientes.findIndex(function(c){return c.id===clienteId;});
        if(idx===-1||!clientes[idx].cuotas||!clientes[idx].cuotas[cuotaIndex])return;
        var q=clientes[idx].cuotas[cuotaIndex];
        if(q.pagado)return;
        q.pagado=true;q.montoReal=monto;q.monedaReal=moneda;q.tasaUsada=tasaUsada;
        q.fechaPago=new Date().toISOString().split('T')[0];q.recordatorioEnviado=true;
        var todasPagas=clientes[idx].cuotas.every(function(cu){return cu.pagado;});
        if(todasPagas){clientes[idx].enPeriodoGracia=false;clientes[idx].fechaInicioGracia=null;clientes[idx].estado='activo';}
        localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
        notificarCliente(clienteId,'Cuota #'+q.numero+' confirmada. Monto: $'+monto.toLocaleString()+' '+moneda,'pago','normal');
        registrarLog('Pago confirmado','Cuota #'+q.numero+' de '+clientes[idx].nombre+' - $'+monto);
    }

    function renderDashboard(c){
        var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[],solicitudes=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[],hoy=new Date();
        var activos=clientes.filter(function(cl){return cl.estado==='activo';});
        var suspendidos=clientes.filter(function(cl){return cl.estado==='suspendido';});
        var enGracia=clientes.filter(function(cl){return cl.enPeriodoGracia;});
        var vencidos=[],proximos=[],noPublicados=[];
        activos.forEach(function(cl){
            if(cl.cuotas){
                cl.cuotas.forEach(function(q){
                    if(!q.pagado){
                        var dias=Math.ceil((new Date(q.fechaVencimiento+'T00:00:00')-hoy)/(1000*60*60*24));
                        if(dias<0)vencidos.push({cliente:cl,cuota:q});
                        else if(dias<=7)proximos.push({cliente:cl,cuota:q,dias:dias});
                    }
                });
            }
            if(cl.tiendaCompleta&&!cl.publicadoEnVitrina)noPublicados.push(cl);
        });
        
        // Nuevas métricas
        var solicitudesComerciales=solicitudes.filter(function(s){return s.tipo!=='soporte'&&s.estado==='nueva';});
        var ticketsSoporte=solicitudes.filter(function(s){return s.tipo==='soporte'&&(s.estado==='nueva'||s.estado==='en_proceso');});
        var ticketsUrgentes=ticketsSoporte.filter(function(s){return s.prioridad==='urgente'||s.prioridad==='alta';});
        var pendientesRevisar=pagos.filter(function(p){return p.estado==='Pendiente';});
        var ingresosMes=pagos.filter(function(p){var fp=new Date(p.fecha);return fp.getMonth()===hoy.getMonth()&&fp.getFullYear()===hoy.getFullYear()&&p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
        var proyeccion=clientes.filter(function(c){return c.tipoCliente==='alquiler'&&c.cuotas;}).reduce(function(s,c){return s+c.cuotas.filter(function(q){return!q.pagado;}).reduce(function(ss,q){return ss+q.montoEstimado;},0);},0);
        var tasaMorosidad=activos.length>0?Math.round((vencidos.length/activos.length)*100):0;
        
        var html='<div class="topbar"><h1>'+getIcono('dashboard',22)+' Dashboard</h1><span class="fecha">'+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div>';
        
        // Stats principales
        html+='<div class="stats-grid">';
        html+='<div class="stat-card"><div class="stat-label">Clientes Activos</div><div class="stat-value">'+activos.length+'</div></div>';
        html+='<div class="stat-card"><div class="stat-label">Cuotas Vencidas</div><div class="stat-value" style="color:var(--danger);">'+vencidos.length+'</div></div>';
        html+='<div class="stat-card"><div class="stat-label">Ingresos del Mes</div><div class="stat-value">$'+ingresosMes.toLocaleString()+'</div></div>';
        html+='<div class="stat-card"><div class="stat-label">Proyección Pendiente</div><div class="stat-value">$'+proyeccion.toLocaleString()+'</div></div>';
        html+='</div>';
        
        // Stats secundarias

function cargarCuotasPendientes(){
    var cid=parseInt(document.getElementById('pg-cliente').value),sel=document.getElementById('pg-cuota-index');
    if(!sel)return;
    var cl=(JSON.parse(localStorage.getItem(K.CLIENTES))||[]).find(function(c){return c.id===cid;});
    sel.innerHTML='<option value="">—</option>';
    if(!cl||!cl.cuotas)return;
    cl.cuotas.forEach(function(q,i){
        if(!q.pagado)sel.innerHTML+='<option value="'+i+'">Cuota #'+q.numero+' - $'+q.montoEstimado.toLocaleString()+'</option>';
    });
}

function renderFilasPagos(datos,clientes){
    if(datos.length===0)return'<tr><td colspan="6" style="text-align:center;padding:30px;">No hay pagos.</td></tr>';
    return datos.sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);}).map(function(p){
        var cl=clientes.find(function(c){return c.id===p.clienteId;})||{};
        var cuotaInfo=p.cuotaIndex!==undefined?'#'+(p.cuotaIndex+1):'—';
        var estadoBadge=p.estado==='Confirmado'?'<span class="badge badge-success">Confirmado</span>':'<span class="badge badge-warning">Pendiente</span>';
        var acciones='<div class="tabla-acciones">';
        if(p.estado==='Pendiente')acciones+='<button class="btn btn-success btn-xs" onclick="confirmarPagoYSincronizar('+p.id+')">Confirmar</button>';
        if(p.comprobante)acciones+='<button class="btn btn-outline btn-xs" onclick="verComprobante('+p.id+')">Ver</button>';
        acciones+='<button class="btn btn-danger btn-xs" onclick="eliminarPago('+p.id+')">Eliminar</button></div>';
        return'<tr><td data-label="Fecha">'+p.fecha+'</td><td data-label="Cliente"><strong>'+(cl.nombre||'—')+'</strong></td><td data-label="Cuota">'+cuotaInfo+'</td><td data-label="Monto">$'+p.monto.toFixed(2)+'</td><td data-label="Estado">'+estadoBadge+'</td><td data-label="Acciones">'+acciones+'</td></tr>';
    }).join('');
}

function confirmarPagoYSincronizar(pagoId){
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[],idxP=pagos.findIndex(function(p){return p.id===pagoId;});
    if(idxP===-1)return;
    var pago=pagos[idxP];
    confirmarAccion('Confirmar Pago','Monto: $'+pago.monto.toFixed(2),function(){
        pagos[idxP].estado='Confirmado';
        localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
        if(pago.cuotaIndex!==undefined&&pago.cuotaIndex!==null){
            marcarCuotaPagada(pago.clienteId,pago.cuotaIndex,pago.monto,pago.moneda||'CUP',pago.tasaUsada||null);
        }
        toast('Pago confirmado','exito');
        renderPagos(document.getElementById('contenido-principal'));
    });
}

function registrarPago(){
    var m=parseFloat(document.getElementById('pg-monto').value);
    if(!m||m<=0){toast('Monto inválido','error');return;}
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[],cid=parseInt(document.getElementById('pg-cliente').value);
    var ci=document.getElementById('pg-cuota-index').value;
    ci=ci!==''?parseInt(ci):null;
    var pago={id:Date.now(),clienteId:cid,cuotaIndex:ci,monto:m,fecha:document.getElementById('pg-fecha').value||new Date().toISOString().split('T')[0],metodoPago:document.getElementById('pg-metodo').value,estado:document.getElementById('pg-estado').value,moneda:'CUP',tasaUsada:null,origen:'admin'};
    pagos.push(pago);
    localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
    if(pago.estado==='Confirmado'&&ci!==null){
        marcarCuotaPagada(cid,ci,m,'CUP',null);
    }
    toast('Pago registrado','exito');
    renderPagos(document.getElementById('contenido-principal'));
}

        var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];

function exportarPagosCSV(){
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    if(!pagos.length){toast('Sin datos','error');return;}
    var csv='Fecha,Cliente,Cuota,Monto,Metodo,Estado\n';
    pagos.forEach(function(p){
        var cl=clientes.find(function(c){return c.id===p.clienteId;})||{};
        csv+='"'+p.fecha+'","'+(cl.nombre||'')+'","'+(p.cuotaIndex!==undefined?p.cuotaIndex+1:'')+'","'+p.monto+'","'+(p.metodoPago||'')+'","'+p.estado+'"\n';
    });
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='pagos_'+new Date().toISOString().split('T')[0]+'.csv';
    a.click();
    toast('CSV exportado','exito');
}

            // ==========================================
        // SISTEMA DE GEOLOCALIZACIÓN MEJORADO
        // Usa OpenStreetMap Nominatim + Leaflet

        var mapaActual=null;
        var marcadorActual=null;
        
        function obtenerCoordenadasDesdeDireccion(){
            var direccion=document.getElementById('cl-direccion').value.trim();
            var provincia=document.getElementById('cl-provincia')?document.getElementById('cl-provincia').value:'';
            var municipio=document.getElementById('cl-municipio')?document.getElementById('cl-municipio').value:'';
            
            if(!direccion&&!municipio){
                toast('Escribe una dirección o selecciona municipio primero','error');
                return;
            }
            
            // Construir query completo
            var query=[];
            if(direccion)query.push(direccion);
            if(municipio&&municipio!=='')query.push(municipio);
            if(provincia&&provincia!=='')query.push(provincia);
            query.push('Cuba');
            
            var queryString=query.join(', ');
            
            toast('Buscando coordenadas...','info');
            
            // Usar Nominatim con headers apropiados
            fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(queryString),{
                headers:{
                    'Accept':'application/json',
                    'User-Agent':'IslaMarket/1.0'
                }
            })
            .then(function(res){
                if(!res.ok)throw new Error('Error HTTP: '+res.status);
                return res.json();
            })
            .then(function(data){
                if(data&&data.length>0){
                    var lat=parseFloat(data[0].lat);
                    var lon=parseFloat(data[0].lon);
                    
                    // Verificar que sean coordenadas de Cuba
                    if(lat>=19.5&&lat<=23.5&&lon>=-85&&lon<=-74){
                        // Corregir orden: latitud primero, longitud después
                        document.getElementById('cl-lat').value=lat;
                        document.getElementById('cl-lng').value=lon;
                        
                        // Mostrar en mini mapa
                        mostrarMiniMapa(lat,lon);
                        
                        toast('Coordenadas encontradas: '+lat.toFixed(6)+', '+lon.toFixed(6),'exito');
                    }else{
                        toast('Las coordenadas no corresponden a Cuba','error');
                    }
                }else{
                    // Intentar solo con municipio
                    if(municipio){
                        fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(municipio+', '+provincia+', Cuba'),{
                            headers:{'Accept':'application/json','User-Agent':'IslaMarket/1.0'}
                        })
                        .then(function(r){return r.json();})
                        .then(function(d2){
                            if(d2&&d2.length>0){
                                var lat2=parseFloat(d2[0].lat);
                                var lon2=parseFloat(d2[0].lon);
                                document.getElementById('cl-lat').value=lat2;
                                document.getElementById('cl-lng').value=lon2;
                                mostrarMiniMapa(lat2,lon2);
                                toast('Coordenadas del municipio: '+lat2.toFixed(6)+', '+lon2.toFixed(6),'exito');
                            }else{
                                toast('No se encontraron coordenadas','error');
                            }
                        })
                        .catch(function(){
                            toast('Error al conectar con el servicio','error');
                        });
                    }else{
                        toast('No se encontraron coordenadas para esa dirección','error');
                    }
                }
            })
            .catch(function(err){
                console.error('Error geocodificación:',err);
                toast('Error al conectar. Intenta de nuevo.','error');
            });
        }

        function cambiarEstadoSoporte(id,ne){
            var s=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[],idx=s.findIndex(function(x){return x.id===id;});
            if(idx===-1)return;
            s[idx].estado=ne;
            if(!s[idx].historial)s[idx].historial=[];
            s[idx].historial.push({fecha:new Date().toISOString(),accion:'Estado cambiado a: '+ne});
            localStorage.setItem(K.SOLICITUDES,JSON.stringify(s));
            if(s[idx].contexto&&s[idx].contexto.clienteId){
                notificarCliente(s[idx].contexto.clienteId,'Tu ticket de soporte fue actualizado a: '+ne,'soporte','normal');
            }
            toast('Ticket actualizado','exito');
            actualizarBadges();
            renderSoporte(document.getElementById('contenido-principal'));
        }

            var hasta=document.getElementById('horario-'+dia+'-hasta').value;

        }
        
        var verificadoBadge=cl.verificado?' <span class="badge badge-primary" title="Verificado">✓</span>':'';
        
        return'<tr>'+
            '<td data-label="Logo">'+logo+'</td>'+
            '<td data-label="Negocio"><strong>'+cl.nombre+'</strong>'+verificadoBadge+'</td>'+
            '<td data-label="Ubicación">'+ubicacion+'</td>'+

        function restaurarBackup(){
            var input=document.createElement('input');
            input.type='file';
            input.accept='.json';
            input.onchange=function(e){
                var file=e.target.files[0];
                if(!file)return;
                var reader=new FileReader();
                reader.onload=function(ev){
                    try{
                        var data=JSON.parse(ev.target.result);
                        var d=data.datos||data;
                        if(d.clientes)localStorage.setItem(K.CLIENTES,JSON.stringify(d.clientes));
                        if(d.pagos)localStorage.setItem(K.PAGOS,JSON.stringify(d.pagos));
                        if(d.config)localStorage.setItem(K.CONFIG,JSON.stringify(d.config));
                        if(d.plantillas)localStorage.setItem(K.PLANTILLAS,JSON.stringify(d.plantillas));
                        if(d.categorias)localStorage.setItem(K.CATEGORIAS,JSON.stringify(d.categorias));
                        if(d.solicitudes)localStorage.setItem(K.SOLICITUDES,JSON.stringify(d.solicitudes));
                        if(d.valoraciones)localStorage.setItem('valoracionesNegocios',JSON.stringify(d.valoraciones));
                        if(d.usuarios)localStorage.setItem('usuariosTiendaPerfecta',JSON.stringify(d.usuarios));
                        if(d.logs)localStorage.setItem(K.LOGS,JSON.stringify(d.logs));
                        registrarLog('Backup restaurado','');
                        toast('Backup restaurado correctamente','exito');
                        navegar('dashboard',document.querySelector('.sidebar-nav a'));
                    }catch(err){
                        toast('Archivo inválido','error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

function toggleDiaPago(el,max){

    if(!el.classList.contains('seleccionado')&&sel.length>=max){
        toast('Máximo '+max+' día(s)','error');

    el.classList.toggle('seleccionado');
    actualizarInputDiasPago();
}

function actualizarInputDiasPago(){
    var sel=document.querySelectorAll('#dias-pago-grid .dia-chip.seleccionado');
    var dias=[];
    sel.forEach(function(b){
        dias.push(parseInt(b.dataset.dia));
    });
    dias.sort(function(a,b){return a-b;});
    
    var input=document.getElementById('cl-dias-pago');
    if(input)input.value=dias.join(',');

function actualizarFechasPreview(){
    var container=document.getElementById('fechas-preview-container');
    if(!container)return;
    
    var ppm=parseInt(document.getElementById('cl-pagos-por-mes')?.value)||1;
    var meses=parseInt(document.getElementById('cl-meses-contratados')?.value)||1;
    var diasStr=document.getElementById('cl-dias-pago')?.value||'1';
    var diasPago=diasStr.split(',').map(function(d){return parseInt(d);});
    var fechaInicio=document.getElementById('cl-fecha-inicio-alquiler')?.value||new Date().toISOString().split('T')[0];
    var precioBase=parseFloat(document.getElementById('cl-precio-base')?.value)||obtenerConfig().planPrecio||16000;
    
    var totalCuotas=meses*ppm;
    var montoPorPago=precioBase/ppm;
    
    var html='<div style="background:var(--success-bg);border:1px solid var(--success);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--success-text);"><strong>Calendario de pagos ('+totalCuotas+' pagos):</strong>';
    
    var fi=new Date(fechaInicio+'T00:00:00');
    for(var i=0;i<totalCuotas;i++){
        var np=i%ppm;
        var nm=Math.floor(i/ppm);
        var dp=diasPago[np]||1;
        
        var fv=new Date(fi);
        fv.setMonth(fv.getMonth()+nm);
        fv.setDate(Math.min(dp,new Date(fv.getFullYear(),fv.getMonth()+1,0).getDate()));
        
        var me=montoPorPago;
        if(np===ppm-1){
            var sa=0;
            for(var j=i-np;j<i;j++){
                sa+=montoPorPago;
            }
            me=precioBase-sa;
        }
        
        html+='<br>Pago '+(i+1)+': '+fv.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' - $'+Math.round(me).toLocaleString();
    }
    
    html+='</div>';
    container.innerHTML=html;
}

    html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">'+getIcono('pagos')+' Registrar Pago</span><button class="btn btn-primary btn-sm" onclick="toggleFormulario(\'form-pago\')">Nuevo</button></div>';

    html+='<div class="form-grupo"><label>Cliente</label><select id="pg-cliente" onchange="cargarCuotasPendientes()">'+clientes.map(function(c){return'<option value="'+c.id+'">'+c.nombre+'</option>';}).join('')+'</select></div>';
    html+='<div class="form-grupo"><label>Cuota</label><select id="pg-cuota-index"><option value="">—</option></select></div>';
    html+='<div class="form-grupo"><label>Monto</label><input type="number" id="pg-monto" value="10" step="0.01"></div>';
    html+='<div class="form-grupo"><label>Fecha</label><input type="date" id="pg-fecha"></div>';
    html+='<div class="form-grupo"><label>Método</label><select id="pg-metodo"><option>Efectivo</option><option>Transferencia</option><option>USD</option></select></div>';
    html+='<div class="form-grupo"><label>Estado</label><select id="pg-estado"><option value="Confirmado">Confirmado</option><option value="Pendiente">Pendiente</option></select></div>';

function cargarCuotasPendientes(){
    var cid=parseInt(document.getElementById('pg-cliente')?.value);
    var sel=document.getElementById('pg-cuota-index');
    if(!sel||!cid)return;
    var cl=(JSON.parse(localStorage.getItem(K.CLIENTES))||[]).find(function(c){return c.id===cid;});
    sel.innerHTML='<option value="">—</option>';
    if(!cl||!cl.cuotas)return;
    cl.cuotas.forEach(function(q,i){
        if(!q.pagado)sel.innerHTML+='<option value="'+i+'">Cuota #'+q.numero+' - $'+q.montoEstimado.toLocaleString()+'</option>';
    });
}

function renderFilasPagos(datos,clientes){
    if(datos.length===0)return'<tr><td colspan="6" style="text-align:center;padding:30px;">No hay pagos.</td></tr>';
    return datos.sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);}).map(function(p){
        var cl=clientes.find(function(c){return c.id===p.clienteId;})||{};
        var cuotaInfo=p.cuotaIndex!==undefined?'#'+(p.cuotaIndex+1):'—';
        var estadoBadge=p.estado==='Confirmado'?'<span class="badge badge-success">Confirmado</span>':'<span class="badge badge-warning">Pendiente</span>';
        var acciones='<div class="tabla-acciones">';
        if(p.estado==='Pendiente')acciones+='<button class="btn btn-success btn-xs" onclick="confirmarPagoYSincronizar('+p.id+')">Confirmar</button>';
        if(p.comprobante)acciones+='<button class="btn btn-outline btn-xs" onclick="verComprobante('+p.id+')">Ver</button>';
        acciones+='<button class="btn btn-danger btn-xs" onclick="eliminarPago('+p.id+')">Eliminar</button></div>';
        return'<tr><td data-label="Fecha">'+p.fecha+'</td><td data-label="Cliente"><strong>'+(cl.nombre||'—')+'</strong></td><td data-label="Cuota">'+cuotaInfo+'</td><td data-label="Monto">$'+p.monto.toFixed(2)+'</td><td data-label="Estado">'+estadoBadge+'</td><td data-label="Acciones">'+acciones+'</td></tr>';

function confirmarPagoYSincronizar(pagoId){
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var idxP=pagos.findIndex(function(p){return p.id===pagoId;});
    if(idxP===-1)return;
    var pago=pagos[idxP];
    confirmarAccion('Confirmar Pago','Monto: $'+pago.monto.toFixed(2),function(){
        pagos[idxP].estado='Confirmado';
        localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
        if(pago.cuotaIndex!==undefined&&pago.cuotaIndex!==null){
            marcarCuotaPagada(pago.clienteId,pago.cuotaIndex,pago.monto,pago.moneda||'CUP',pago.tasaUsada||null);
        }
        toast('Pago confirmado','exito');
        renderPagos(document.getElementById('contenido-principal'));
    });
}

function verComprobante(pid){
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var p=pagos.find(function(x){return x.id===pid;});
    if(!p||!p.comprobante){toast('Sin comprobante','error');return;}
    mostrarDetalleModal('Comprobante','<div style="text-align:center;"><img src="'+p.comprobante+'" style="max-width:100%;max-height:250px;border-radius:8px;object-fit:contain;"><p style="font-size:11px;margin-top:6px;">Monto: $'+p.monto.toFixed(2)+' | '+p.fecha+'</p></div>');
}

function registrarPago(){
    var m=parseFloat(document.getElementById('pg-monto')?.value);
    if(!m||m<=0){toast('Monto inválido','error');return;}
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var cid=parseInt(document.getElementById('pg-cliente')?.value);
    var ci=document.getElementById('pg-cuota-index')?.value;
    ci=ci!==''?parseInt(ci):null;
    var pago={id:Date.now(),clienteId:cid,cuotaIndex:ci,monto:m,fecha:document.getElementById('pg-fecha')?.value||new Date().toISOString().split('T')[0],metodoPago:document.getElementById('pg-metodo')?.value||'Efectivo',estado:document.getElementById('pg-estado')?.value||'Confirmado',moneda:'CUP',tasaUsada:null,origen:'admin'};
    pagos.push(pago);
    localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
    if(pago.estado==='Confirmado'&&ci!==null){
        marcarCuotaPagada(cid,ci,m,'CUP',null);
    }
    toast('Pago registrado','exito');
    renderPagos(document.getElementById('contenido-principal'));
}

function eliminarPago(id){
    confirmarAccion('Eliminar Pago','Solo se eliminará este registro.',function(){
        var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
        pagos=pagos.filter(function(p){return p.id!==id;});
        localStorage.setItem(K.PAGOS,JSON.stringify(pagos));
        toast('Eliminado','exito');
        renderPagos(document.getElementById('contenido-principal'));
    });
}

function renderFilasVitrina(datos){
    var tb=document.getElementById('tabla-vitrina');

    tb.innerHTML=datos.map(function(cl){
        var tienda=cl.tiendaCompleta?'<span class="badge badge-success">Completa</span>':'<span class="badge badge-warning">Pendiente</span>';
        var vitrina=cl.publicadoEnVitrina?'<span class="badge badge-success">Publicado</span>':'<span class="badge badge-neutral">Oculto</span>';
        return'<tr><td data-label="Negocio"><strong>'+cl.nombre+'</strong></td><td data-label="Tienda">'+tienda+'</td><td data-label="Vitrina">'+vitrina+'</td><td data-label="Acciones"><button class="btn btn-'+(cl.publicadoEnVitrina?'outline':'success')+' btn-xs" onclick="togglePublicarVitrina('+cl.id+')">'+(cl.publicadoEnVitrina?'Ocultar':'Publicar')+'</button></td></tr>';
    }).join('');

function togglePublicarVitrina(id){
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var idx=clientes.findIndex(function(c){return c.id===id;});
    if(idx===-1)return;
    clientes[idx].publicadoEnVitrina=!clientes[idx].publicadoEnVitrina;
    localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
    if(clientes[idx].publicadoEnVitrina){
        notificarCliente(id,'Tu tienda ya es visible en la vitrina pública.','exito','normal');
    }
    toast(clientes[idx].publicadoEnVitrina?'Publicado':'Ocultado','exito');
    renderVitrina(document.getElementById('contenido-principal'));
    actualizarBadges();
}

function filtrarVitrina(e,el){
    filtroVitrinaEstado=e;

    if(el)el.classList.add('activo');
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var r=clientes;
    if(filtroVitrinaEstado==='publicado')r=r.filter(function(c){return c.publicadoEnVitrina;});
    else if(filtroVitrinaEstado==='no_publicado')r=r.filter(function(c){return !c.publicadoEnVitrina;});
    renderFilasVitrina(r);
}

function renderReportes(c){
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var hoy=new Date();
    var total=pagos.filter(function(p){return p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
    var publicados=clientes.filter(function(c){return c.publicadoEnVitrina;}).length;
    
    var html='<div class="topbar"><h1>'+getIcono('reportes',22)+' Reportes</h1><button class="btn btn-outline btn-sm" onclick="exportarPDFReporte()">Exportar PDF</button> <button class="btn btn-outline btn-sm" onclick="exportarValoracionesCSV()">Exportar Valoraciones</button></div>';
    html+='<div class="stats-grid">';
    html+='<div class="stat-card"><div class="stat-label">Total Clientes</div><div class="stat-value">'+clientes.length+'</div></div>';
    html+='<div class="stat-card"><div class="stat-label">Ingresos Totales</div><div class="stat-value">$'+total.toLocaleString()+'</div></div>';
    html+='<div class="stat-card"><div class="stat-label">Publicados</div><div class="stat-value">'+publicados+'</div></div>';
    html+='</div>';
    html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">'+getIcono('reportes')+' Ingresos Mensuales</span></div><div class="chart-container"><canvas id="chart-reportes"></canvas></div></div>';
    c.innerHTML=html;
    
    setTimeout(function(){
        if(typeof Chart==='undefined')return;
        var canvas=document.getElementById('chart-reportes');
        if(!canvas)return;
        var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],labels=[],data=[];
        for(var i=5;i>=0;i--){
            var m=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
            labels.push(meses[m.getMonth()]);
            data.push(pagos.filter(function(p){var fp=new Date(p.fecha);return fp.getMonth()===m.getMonth()&&fp.getFullYear()===m.getFullYear()&&p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0));
        }
        new Chart(canvas.getContext('2d'),{type:'bar',data:{labels:labels,datasets:[{label:'$',data:data,backgroundColor:'#4f46e5',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    },500);
}

function exportarPDFReporte(){
    if(typeof jspdf==='undefined'){toast('Error: jsPDF no cargado','error');return;}
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    var pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
    var total=pagos.filter(function(p){return p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
    
    var doc=new jspdf.jsPDF('p','mm','a4');
    var y=15;
    doc.setFontSize(16);doc.setTextColor(79,70,229);doc.text('Isla Market - Reporte Ejecutivo',15,y);y+=8;
    doc.setFontSize(9);doc.setTextColor(100,116,139);doc.text('Generado: '+new Date().toLocaleString('es-ES'),15,y);y+=8;
    doc.setFontSize(11);doc.setTextColor(15,23,42);doc.text('RESUMEN',15,y);y+=6;
    doc.setFontSize(9);
    doc.text('Total Clientes: '+clientes.length,15,y);y+=5;
    doc.text('Ingresos Totales: $'+total.toLocaleString(),15,y);y+=5;
    doc.text('Publicados: '+clientes.filter(function(c){return c.publicadoEnVitrina;}).length,15,y);y+=8;
    doc.setFontSize(11);doc.text('CLIENTES',15,y);y+=6;
    doc.setFontSize(8);
    clientes.forEach(function(cl){
        doc.text(cl.nombre+' - '+(cl.tipoCliente==='alquiler'?'Alquiler':'Prueba')+' - '+cl.estado,15,y);y+=4;
        if(y>270){doc.addPage();y=20;}
    });
    doc.save('reporte_'+new Date().toISOString().split('T')[0]+'.pdf');
    toast('PDF descargado','exito');
}

function filtrarLogs(){
    var f=(document.getElementById('buscar-log')?.value||'').toLowerCase();
    var logs=JSON.parse(localStorage.getItem(K.LOGS))||[];
    var cont=document.getElementById('contenedor-logs');
    if(!cont)return;
    if(f)logs=logs.filter(function(l){return (l.accion||'').toLowerCase().includes(f)||(l.detalles||'').toLowerCase().includes(f);});
    if(!logs.length){
        cont.innerHTML='<p style="text-align:center;color:var(--text-muted);padding:20px;">Sin resultados.</p>';
        return;
    }
    cont.innerHTML='<div style="max-height:400px;overflow-y:auto;">'+logs.slice(0,100).map(function(log){
        return'<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;"><span><strong>'+log.accion+'</strong> - '+(log.detalles||'')+'</span><span style="color:var(--text-muted);">'+new Date(log.fecha).toLocaleString('es-ES')+'</span></div>';
    }).join('')+'</div>';
}

function guardarCategoria(){
    console.log('guardarCategoria ejecutándose');
    var n=document.getElementById('cat-nombre')?.value?.trim();
    if(!n){toast('Nombre obligatorio','error');return;}
    
    var cats=JSON.parse(localStorage.getItem(K.CATEGORIAS))||[];
    
    var nuevaCategoria={
        id:Date.now(),
        nombre:n,
        icono:document.getElementById('cat-icono')?.value||'tienda',
        orden:parseInt(document.getElementById('cat-orden')?.value)||1
    };
    
    cats.push(nuevaCategoria);
    localStorage.setItem(K.CATEGORIAS,JSON.stringify(cats));
    toast('Categoría guardada correctamente','exito');
    registrarLog('Categoría creada',n);
    
    // Recargar la vista
    renderCategorias(document.getElementById('contenido-principal'));
}

function eliminarCategoria(id){
    confirmarAccion('Eliminar Categoría','¿Estás seguro de eliminar esta categoría?',function(){
        var cats=JSON.parse(localStorage.getItem(K.CATEGORIAS))||[];
        var catEliminada=cats.find(function(c){return c.id===id;});
        cats=cats.filter(function(c){return c.id!==id;});
        localStorage.setItem(K.CATEGORIAS,JSON.stringify(cats));
        
        if(catEliminada){
            registrarLog('Categoría eliminada',catEliminada.nombre);
        }
        
        toast('Categoría eliminada','exito');
        renderCategorias(document.getElementById('contenido-principal'));
    });
}

function renderHorarioEditor(){
    var container=document.getElementById('horario-container');
    if(!container)return;
    
    var dias=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
    var nombres=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
    
    container.innerHTML=dias.map(function(dia,i){
        return'<div class="horario-fila">'+
            '<div class="horario-dia"><input type="checkbox" id="horario-'+dia+'" checked onchange="toggleHorarioDia(\''+dia+'\')"> '+nombres[i]+'</div>'+
            '<div><input type="time" id="horario-'+dia+'-desde" value="09:00"></div>'+
            '<div><input type="time" id="horario-'+dia+'-hasta" value="18:00"></div>'+
            '<div><button type="button" class="btn btn-xs btn-outline" onclick="copiarHorario(\''+dia+'\')">Copiar</button></div>'+
            '</div>';
    }).join('');
}

function toggleHorarioDia(dia){
    var abierto=document.getElementById('horario-'+dia)?.checked||false;
    var desde=document.getElementById('horario-'+dia+'-desde');
    var hasta=document.getElementById('horario-'+dia+'-hasta');
    if(desde)desde.disabled=!abierto;
    if(hasta)hasta.disabled=!abierto;
}

function copiarHorario(dia){
    var desde=document.getElementById('horario-'+dia+'-desde')?.value||'09:00';
    var hasta=document.getElementById('horario-'+dia+'-hasta')?.value||'18:00';
    var dias=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
    
    dias.forEach(function(d){
        if(d!==dia){
            var dDesde=document.getElementById('horario-'+d+'-desde');
            var dHasta=document.getElementById('horario-'+d+'-hasta');
            if(dDesde)dDesde.value=desde;
            if(dHasta)dHasta.value=hasta;
        }
    });
    toast('Horario copiado a todos los días','exito');
}

function previewGaleria(event){
    var files=event.target.files;
    var container=document.getElementById('galeria-preview');
    if(!container)return;
    container.innerHTML='';
    
    for(var i=0;i<Math.min(files.length,5);i++){
        (function(file){
            var reader=new FileReader();
            reader.onload=function(ev){
                var img=document.createElement('img');
                img.src=ev.target.result;
                img.style.cssText='width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid var(--primary);';
                container.appendChild(img);
            };
            reader.readAsDataURL(file);
        })(files[i]);
    }
}

function previewLogo(e){
    var f=e.target.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(ev){
        var preview=document.getElementById('cl-logo-preview');
        if(preview)preview.innerHTML='<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:contain;">';
    };
    r.readAsDataURL(f);
}

function actualizarDiasPago(){
    var ppm=parseInt(document.getElementById('cl-pagos-por-mes')?.value)||1;
    var grid=document.getElementById('dias-pago-grid');
    if(!grid)return;
    
    var html='';
    for(var i=1;i<=28;i++){
        html+='<button type="button" class="dia-chip" data-dia="'+i+'" onclick="toggleDiaPago(this,'+ppm+')">'+i+'</button>';
    }
    grid.innerHTML=html;
    
    var diasDefault={1:[1],2:[1,16],3:[1,10,20],4:[7,14,21,28]};
    var def=diasDefault[ppm]||[1];
    
    grid.querySelectorAll('.dia-chip').forEach(function(b){
        var d=parseInt(b.dataset.dia);
        if(def.indexOf(d)!==-1)b.classList.add('seleccionado');
    });
    
    actualizarInputDiasPago();
}

function toggleDiaPago(el,max){
    var sel=el.parentElement.querySelectorAll('.dia-chip.seleccionado');
    if(!el.classList.contains('seleccionado')&&sel.length>=max){
        toast('Máximo '+max+' día(s)','error');
        return;
    }
    el.classList.toggle('seleccionado');
    actualizarInputDiasPago();
}

function actualizarInputDiasPago(){
    var sel=document.querySelectorAll('#dias-pago-grid .dia-chip.seleccionado');
    var dias=[];
    sel.forEach(function(b){
        dias.push(parseInt(b.dataset.dia));
    });
    dias.sort(function(a,b){return a-b;});
    
    var input=document.getElementById('cl-dias-pago');
    if(input)input.value=dias.join(',');
}

function actualizarFechasPreview(){
    var container=document.getElementById('fechas-preview-container');
    if(!container)return;
    
    var ppm=parseInt(document.getElementById('cl-pagos-por-mes')?.value)||1;
    var meses=parseInt(document.getElementById('cl-meses-contratados')?.value)||1;
    var diasStr=document.getElementById('cl-dias-pago')?.value||'1';
    var diasPago=diasStr.split(',').map(function(d){return parseInt(d);});
    var fechaInicio=document.getElementById('cl-fecha-inicio-alquiler')?.value||new Date().toISOString().split('T')[0];
    var precioBase=parseFloat(document.getElementById('cl-precio-base')?.value)||obtenerConfig().planPrecio||16000;
    
    var totalCuotas=meses*ppm;
    var montoPorPago=precioBase/ppm;
    
    var html='<div style="background:var(--success-bg);border:1px solid var(--success);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--success-text);"><strong>Calendario ('+totalCuotas+' pagos):</strong>';
    
    var fi=new Date(fechaInicio+'T00:00:00');
    for(var i=0;i<totalCuotas;i++){
        var np=i%ppm;
        var nm=Math.floor(i/ppm);
        var dp=diasPago[np]||1;
        
        var fv=new Date(fi);
        fv.setMonth(fv.getMonth()+nm);
        fv.setDate(Math.min(dp,new Date(fv.getFullYear(),fv.getMonth()+1,0).getDate()));
        
        var me=montoPorPago;
        if(np===ppm-1){
            var sa=0;
            for(var j=i-np;j<i;j++){
                sa+=montoPorPago;
            }
            me=precioBase-sa;
        }
        
        html+='<br>Pago '+(i+1)+': '+fv.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' - $'+Math.round(me).toLocaleString();
    }
    
    html+='</div>';
    container.innerHTML=html;
}




function guardarCliente(){

        var fpi=document.getElementById('cl-fecha-prueba-inicio')?.value||new Date().toISOString().split('T')[0];

        datos.fechaPruebaFin=fpf.toISOString().split('T')[0];

        datos.precio=0;
    }
    else if(tc==='alquiler'){
        var metodo=document.getElementById('cl-metodo-pago')?.value||'tarjeta_cup';
        var meses=parseInt(document.getElementById('cl-meses-contratados')?.value)||1;
        var ppm=parseInt(document.getElementById('cl-pagos-por-mes')?.value)||1;
        var diasStr=document.getElementById('cl-dias-pago')?.value||'1';
        var diasPago=diasStr.split(',').map(function(d){return parseInt(d);});

        datos.mesesContratados=meses;
        datos.pagosPorMes=ppm;
        datos.diasPago=diasPago;
        datos.fechaInicio=fechaInicio;
        datos.precioContratado=precioBase;
        datos.plan='Alquiler';
        datos.precio=precioBase;

            datos.id=old.id;
            datos.estado=old.estado||'activo';
            datos.notificaciones=old.notificaciones||[];
            datos.enPeriodoGracia=old.enPeriodoGracia||false;
            datos.fechaInicioGracia=old.fechaInicioGracia||null;
            if(old.cuotas&&old.cuotas.length>0&&tc==='alquiler'){

            }

    actualizarUsuariosLogin();
    
    var btnGuardar=document.getElementById('btn-guardar-cliente');

        btnGuardar.textContent='Guardar Cliente';
    }

    actualizarBadges();

function renderFilasClientes(datos){
    if(datos.length===0)return'<tr><td colspan="10" style="text-align:center;padding:30px;">No se encontraron clientes.</td></tr>';
    
    return datos.map(function(cl){
        var tipo=cl.tipoCliente==='alquiler'?'Alquiler':'Prueba';
        var estadoBadge=cl.estado==='suspendido'?'<span class="badge badge-danger">Suspendido</span>':cl.enPeriodoGracia?'<span class="badge badge-warning">Gracia</span>':cl.estado==='activo'?'<span class="badge badge-success">Activo</span>':'<span class="badge badge-neutral">Inactivo</span>';
        var pagosInfo=cl.cuotas?cl.cuotas.filter(function(q){return q.pagado;}).length+'/'+cl.cuotas.length:'—';
        var vitrina=cl.publicadoEnVitrina?'<span class="badge badge-success">Sí</span>':'<span class="badge badge-neutral">No</span>';
        var ubicacion=(cl.provincia||cl.municipio)?(cl.municipio||'')+(cl.provincia?', '+cl.provincia:''):'—';
        
        var logo='';
        if(cl.logo&&cl.logo.startsWith('data:')){
            logo='<img src="'+cl.logo+'" style="width:30px;height:30px;border-radius:6px;object-fit:contain;">';
        }else{
            logo='<div style="width:30px;height:30px;border-radius:6px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;">'+getIcono('tienda',16)+'</div>';
        }
        
        var verificadoBadge=cl.verificado?' <span class="badge badge-primary" title="Verificado">✓</span>':'';
        
        return'<tr>'+
            '<td data-label="Logo">'+logo+'</td>'+
            '<td data-label="Negocio"><strong>'+cl.nombre+'</strong>'+verificadoBadge+'</td>'+
            '<td data-label="Ubicación">'+ubicacion+'</td>'+
            '<td data-label="Tipo">'+tipo+'</td>'+
            '<td data-label="Usuario"><code>'+cl.usuario+'</code></td>'+
            '<td data-label="Pagos">'+pagosInfo+'</td>'+
            '<td data-label="Etiquetas">'+getEtiquetasBadges(cl.etiquetas)+'</td>'+
            '<td data-label="Vitrina">'+vitrina+'</td>'+
            '<td data-label="Estado">'+estadoBadge+'</td>'+
            '<td data-label="Acciones"><div class="tabla-acciones">'+
            '<button class="btn btn-outline btn-xs" onclick="verDetalleCliente('+cl.id+')">Detalle</button>'+
            '<button class="btn btn-outline btn-xs" onclick="editarCliente('+cl.id+')">Editar</button>'+
            '<button class="btn btn-danger btn-xs" onclick="eliminarCliente('+cl.id+')">Eliminar</button>'+

    }).join('');

function getEtiquetasBadges(etiquetas){
    if(!etiquetas||etiquetas.length===0)return'—';
    var html='';
    if(etiquetas.indexOf('vip')!==-1)html+='<span class="badge badge-vip">VIP</span> ';
    if(etiquetas.indexOf('moroso')!==-1)html+='<span class="badge badge-danger">Moroso</span> ';
    if(etiquetas.indexOf('seguimiento')!==-1)html+='<span class="badge badge-warning">Seguimiento</span> ';
    return html||'—';
}



// ==========================================
// APLICAR FILTROS DE CLIENTES
// Filtra por: estado, tipo, provincia, búsqueda y etiqueta
// ==========================================
function aplicarFiltrosClientes(){
    // Obtener todos los clientes
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    
    // Obtener valores de los filtros
    var f=(document.getElementById('buscar-cliente')?.value||'').toLowerCase();
    var provFiltro=document.getElementById('filtro-provincia')?.value||'todas';
    var tipoFiltro=document.getElementById('filtro-tipo-cliente')?.value||'todos';
    var hoy=new Date();
    var r=clientes;
    
    // FILTRO POR ESTADO
    if(filtroEstadoActual==='activo'){
        r=r.filter(function(c){return c.estado==='activo';});
    }else if(filtroEstadoActual==='vencido'){
        r=r.filter(function(c){
            if(c.cuotas)return c.cuotas.some(function(q){return!q.pagado&&new Date(q.fechaVencimiento)<hoy;});
            return false;
        });
    }else if(filtroEstadoActual==='suspendido'){
        r=r.filter(function(c){return c.estado==='suspendido';});
    }else if(filtroEstadoActual==='publicado'){
        r=r.filter(function(c){return c.publicadoEnVitrina;});
    }
    
    // FILTRO POR TIPO DE CLIENTE (prueba o alquiler)
    if(tipoFiltro!=='todos'){
        r=r.filter(function(c){return c.tipoCliente===tipoFiltro;});
    }
    
    // FILTRO POR PROVINCIA
    if(provFiltro!=='todas'){
        r=r.filter(function(c){return c.provincia===provFiltro;});
    }
    
    // FILTRO POR BÚSQUEDA DE TEXTO
    if(f){
        r=r.filter(function(c){return (c.nombre||'').toLowerCase().includes(f);});
    }
    
    // FILTRO POR ETIQUETA
    if(filtroEtiqueta!=='todas'){
        r=r.filter(function(c){return c.etiquetas&&c.etiquetas.indexOf(filtroEtiqueta)!==-1;});
    }
    
    // Actualizar la tabla con los resultados filtrados
    document.getElementById('tabla-clientes').innerHTML=renderFilasClientes(r);
}


function filtrarClientesEstado(e,el){
    filtroEstadoActual=e;
    filtroEtiqueta='todas';
    document.querySelectorAll('.filtros .chip').forEach(function(c){c.classList.remove('activo');});
    if(el)el.classList.add('activo');
    aplicarFiltrosClientes();
}



function filtrarClientesEtiqueta(e,el){
    filtroEtiqueta=e;
    filtroEstadoActual='todos';
    document.querySelectorAll('.filtros .chip').forEach(function(c){c.classList.remove('activo');});
    if(el)el.classList.add('activo');
    aplicarFiltrosClientes();
}


// ==========================================
// EXPORTAR CLIENTES A PDF
// Genera un PDF con toda la base de datos de clientes
// ==========================================
function exportarClientesPDF(){
    // Verificar que jsPDF esté cargado
    if(typeof jspdf==='undefined'){toast('Error: jsPDF no cargado','error');return;}
    
    // Obtener todos los clientes
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    
    // Crear documento PDF
    var doc=new jspdf.jsPDF('p','mm','a4');
    var y=15;
    
    // Encabezado del PDF
    doc.setFontSize(14);
    doc.setTextColor(79,70,229);
    doc.text('Base de Datos de Clientes',15,y);
    y+=8;
    
    // Fecha de generación
    doc.setFontSize(8);
    doc.setTextColor(100,116,139);
    doc.text('Generado: '+new Date().toLocaleString('es-ES'),15,y);
    y+=6;
    
    // Total de clientes
    doc.text('Total clientes: '+clientes.length,15,y);
    y+=6;
    
    // Recorrer cada cliente
    clientes.forEach(function(cl){
        // Si la página está llena, crear nueva página
        if(y>270){doc.addPage();y=20;}
        
        // Nombre y tipo de cliente
        doc.setFontSize(10);
        doc.setTextColor(15,23,42);
        doc.text(cl.nombre+' ('+(cl.tipoCliente||'prueba')+')',15,y);
        y+=5;
        
        // Detalles del cliente
        doc.setFontSize(8);
        doc.setTextColor(100,116,139);
        doc.text('Estado: '+cl.estado+' | Usuario: '+cl.usuario+' | Tel: '+(cl.telefono||'—'),15,y);
        y+=4;
        
        // Información específica según tipo
        if(cl.tipoCliente==='alquiler'&&cl.cuotas){
            // Calcular pagos para clientes de alquiler
            var pagadas=cl.cuotas.filter(function(q){return q.pagado;}).length;
            var totalPagado=cl.cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0);
            var totalPendiente=cl.cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0);
            doc.text('Cuotas: '+pagadas+'/'+cl.cuotas.length+' | Pagado: $'+totalPagado.toLocaleString()+' | Pendiente: $'+totalPendiente.toLocaleString(),15,y);
            y+=4;
        }else{
            // Información para clientes de prueba
            doc.text('Plan: Prueba Gratuita | Inicio: '+(cl.fechaPruebaInicio||'—')+' | Fin: '+(cl.fechaPruebaFin||'—'),15,y);
            y+=4;
        }
        
        // Espacio entre clientes
        y+=4;
    });
    
    // Descargar PDF
    doc.save('clientes_'+new Date().toISOString().split('T')[0]+'.pdf');
    toast('PDF descargado','exito');
}


// ==========================================
// EXPORTAR CLIENTES A CSV (EXCEL)
// Genera un archivo CSV que se abre en Excel
// ==========================================
function exportarClientesCSV(){
    // Obtener todos los clientes
    var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[];
    
    // Verificar que haya datos
    if(!clientes.length){toast('Sin datos','error');return;}
    
    // Encabezados del CSV
    var csv='Nombre,Dueño,Tipo,Estado,Usuario,Teléfono,Email,Provincia,Municipio,Cuotas Pagadas,Total Cuotas,Pagado,Pendiente,Fecha Inicio,Fecha Fin\n';
    
    // Recorrer cada cliente y agregar fila al CSV
    clientes.forEach(function(cl){
        // Calcular métricas de pago
        var pagadas=cl.cuotas?cl.cuotas.filter(function(q){return q.pagado;}).length:0;
        var totalCuotas=cl.cuotas?cl.cuotas.length:0;
        var totalPagado=cl.cuotas?cl.cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0):0;
        var totalPendiente=cl.cuotas?cl.cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0):0;
        
        // Agregar fila con todos los datos del cliente
        csv+='"'+cl.nombre+'","'+(cl.dueno||'')+'","'+(cl.tipoCliente||'prueba')+'","'+cl.estado+'","'+cl.usuario+'","'+(cl.telefono||'')+'","'+(cl.email||'')+'","'+(cl.provincia||'')+'","'+(cl.municipio||'')+'",'+pagadas+','+totalCuotas+','+totalPagado+','+totalPendiente+',"'+(cl.fechaPruebaInicio||cl.fechaInicio||'')+'","'+(cl.fechaPruebaFin||'')+'"\n';
    });
    
    // Crear blob con BOM para que Excel reconozca UTF-8
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});
    
    // Crear enlace de descarga
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='clientes_'+new Date().toISOString().split('T')[0]+'.csv';
    a.click();
    
    toast('CSV descargado','exito');
}
