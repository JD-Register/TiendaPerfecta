<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel Maestro | Isla Market</title>

    <script>
        var cdns = [
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
            'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
        ];
        var intento = 0;
        function cargarChart()
        {
            if (intento >= cdns.length) return;
            var s = document.createElement('script');
            s.src = cdns[intento];
            s.onload = function() { window._chartCargado = true; };
            s.onerror = function() { intento++;
                setTimeout(cargarChart, 500); };
            document.head.appendChild(s);
        }
        cargarChart();
    </script>

    <!-- Librería para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';">
    </script>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
            onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';">
    </script>

    <style>
        :root
        {
            --bg: #f8fafc;
            --surface: #ffffff;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-sidebar: #cbd5e1;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
        }

        .dark-mode
        {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body
        {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        .sidebar-overlay
        {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        .sidebar-overlay.activo { display: block; }

        .sidebar
        {
            position: fixed;
            top: 0;
            left: 0;
            width: 270px;
            height: 100vh;
            background: var(--sidebar-bg);
            padding: 22px 14px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
            overflow-y: auto;
        }

        .sidebar-logo
        {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 18px;
        }

        .sidebar-logo .logo-cuadro
        {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .sidebar-logo h2 { font-size: 17px; font-weight: 700; color: white; line-height: 1.3; }
        .sidebar-logo h2 span { color: #a5b4fc; font-size: 11px; display: block; font-weight: 500; }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 3px; }

        .sidebar-nav a
        {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: var(--text-sidebar);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.activo { background: var(--sidebar-hover); color: #fff; }

        .sidebar-nav a .icono-nav { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }

        .sidebar-badge
        {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #ef4444;
            color: #fff;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }

        .btn-sidebar
        {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: none;
            border: none;
            color: var(--text-sidebar);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .btn-sidebar:hover { background: var(--sidebar-hover); color: #fff; }

        .contenido
        {
            margin-left: 270px;
            flex: 1;
            padding: 28px 24px;
            width: calc(100% - 270px);
            min-width: 0;
        }

        .topbar
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .topbar h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .topbar .fecha { color: var(--text-secondary); font-size: 13px; font-weight: 600; }

        .resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }

        .resumen-tarjeta
        {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.5s ease both;
        }

        .resumen-tarjeta:nth-child(1) { animation-delay: 0.05s; }
        .resumen-tarjeta:nth-child(2) { animation-delay: 0.1s; }
        .resumen-tarjeta:nth-child(3) { animation-delay: 0.15s; }
        .resumen-tarjeta:nth-child(4) { animation-delay: 0.2s; }

        .resumen-tarjeta:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

        .resumen-tarjeta .resumen-icono
        {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .resumen-tarjeta:nth-child(1) .resumen-icono { background: #dbeafe; color: #3b82f6; }
        .resumen-tarjeta:nth-child(2) .resumen-icono { background: #d1fae5; color: #10b981; }
        .resumen-tarjeta:nth-child(3) .resumen-icono { background: #fef3c7; color: #f59e0b; }
        .resumen-tarjeta:nth-child(4) .resumen-icono { background: #ede9fe; color: #7c3aed; }

        .resumen-tarjeta .numero { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; }
        .resumen-tarjeta .etiqueta { color: var(--text-secondary); font-size: 12px; font-weight: 600; }

        @keyframes fadeInUp
        {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .seccion
        {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 26px 28px;
            margin-bottom: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.5s ease 0.1s both;
        }

        .seccion h2 { font-size: 18px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .seccion .desc { color: var(--text-secondary); font-size: 13px; margin-bottom: 18px; }

        .filtros-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

        .chip
        {
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: inherit;
        }

        .chip:hover { border-color: var(--primary); color: var(--primary); }
        .chip.activo { background: var(--primary); color: #fff; border-color: var(--primary); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end; }
        .form-grid-2 { grid-template-columns: repeat(2, 1fr); }
        .form-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .form-grupo { display: flex; flex-direction: column; }
        .form-grupo-full { grid-column: 1 / -1; }

        .form-grupo label
        {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .form-grupo input,
        .form-grupo select,
        .form-grupo textarea
        {
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 13px;
            background: #f8fafc;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-grupo input:focus,
        .form-grupo select:focus,
        .form-grupo textarea:focus
        {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.06);
            background: #fff;
        }

        .form-grupo textarea { resize: vertical; min-height: 60px; }

        .form-grupo-check { display: flex; align-items: center; gap: 8px; padding-top: 24px; }
        .form-grupo-check label { font-size: 12px; font-weight: 600; cursor: pointer; text-transform: none; color: var(--text); }
        .form-grupo-check input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        .form-grupo-file
        {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-grupo-file input[type="file"]
        {
            padding: 8px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-xs);
            background: var(--bg);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .form-grupo-file .logo-preview
        {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: var(--bg);
            margin-top: 4px;
        }

        .form-grupo-file .logo-preview img
        {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-grupo-file .portada-preview
        {
            width: 100%;
            height: 150px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: var(--bg);
            margin-top: 4px;
        }

        .form-grupo-file .portada-preview img
        {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-grupo-file .galeria-preview
        {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .form-grupo-file .galeria-preview .galeria-item
        {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-xs);
            border: 2px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--bg);
        }

        .form-grupo-file .galeria-preview .galeria-item img
        {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn
        {
            padding: 11px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-primario { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .btn-primario:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-xs { padding: 4px 10px; font-size: 9px; border-radius: 20px; }
        .btn-sm { padding: 6px 14px; font-size: 10px; }
        .btn:disabled { opacity: 0.6; pointer-events: none; }

        .spinner-btn
        {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .ripple
        {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

        .tabla-wrap
        {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 800px; }
        thead { background: #f8fafc; }

        th
        {
            text-align: left;
            padding: 12px 14px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover { color: var(--primary); }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        tbody tr { transition: var(--transition); }
        tbody tr:hover { background: #f8fafc; }
        tr.fila-activo { border-left: 3px solid #10b981; }
        tr.fila-vencido { border-left: 3px solid #ef4444; background: #fef2f2; }
        tr.fila-suspendido { border-left: 3px solid #f59e0b; background: #fffbeb; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; }
        .badge-activo { background: #d1fae5; color: #065f46; }
        .badge-vencido { background: #fee2e2; color: #991b1b; }
        .badge-suspendido { background: #fef3c7; color: #92400e; }
        .badge-destacado { background: #ede9fe; color: #5b21b6; }
        .badge-prueba { background: #dbeafe; color: #1e40af; }
        .badge-nueva { background: #dbeafe; color: #1e40af; }
        .badge-contactada { background: #fef3c7; color: #92400e; }
        .badge-negociacion { background: #ede9fe; color: #5b21b6; }
        .badge-cliente { background: #d1fae5; color: #065f46; }
        .badge-cerrada { background: #e2e8f0; color: #475569; }

        .alerta
        {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 10px;
        }

        .alerta-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .alerta-danger { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .alerta-info { background: #e0f2fe; border: 1px solid #bae6fd; color: #075985; }

        .chart-container { max-width: 100%; height: 280px; margin-top: 14px; }

        .modal-overlay
        {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.activo { display: flex; }

        .modal
        {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px 24px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp
        {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .modal p { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
        .modal-acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .dark-mode .modal { border: 1px solid var(--border); }

        .toast
        {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 13px 26px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .toast.mostrar { opacity: 1; }
        .toast.exito { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }

        .search-box { position: relative; margin-bottom: 16px; }

        .search-box input
        {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 13px;
            background: #f8fafc;
            transition: var(--transition);
        }

        .search-box input:focus
        {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.06);
            background: #fff;
        }

        .search-box .search-icon
        {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-secondary);
        }

        .btn-menu-movil
        {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            font-size: 22px;
            color: #0f172a;
        }

        .dark-mode .btn-menu-movil { background: #ffffff; color: #0f172a; border-color: #e2e8f0; }

        /* Estilos para solicitudes */
        .solicitud-item
        {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: var(--transition);
            background: var(--surface);
        }

        .solicitud-item:hover
        {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .solicitud-item .solicitud-info
        {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .solicitud-item .solicitud-info .nombre
        {
            font-weight: 700;
            font-size: 14px;
        }

        .solicitud-item .solicitud-info .detalles
        {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .solicitud-item .solicitud-info .detalles span
        {
            margin-right: 12px;
        }

        .solicitud-item .solicitud-acciones
        {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .solicitud-item .solicitud-estado
        {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .solicitud-item .solicitud-plantilla
        {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        /* ==========================================
           CORRECCIÓN: Tarjetas de solicitudes en móvil
           ========================================== */
        @media (max-width: 900px)
        {
            .sidebar { transform: translateX(-100%); }
            .sidebar.abierto { transform: translateX(0); }
            .btn-menu-movil { display: flex; }
            .contenido { margin-left: 0; width: 100%; padding: 16px 12px; padding-top: 60px; }
            .resumen { grid-template-columns: repeat(2, 1fr); }
            .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
            .resumen.solicitudes-stats {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        @media (max-width: 500px)
        {
            .resumen { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }

document.addEventListener('click', function(e)
{
    var btn = e.target.closest('.btn');
    if (!btn) return;
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
});

function navegar(seccion, el)
{
    document.querySelectorAll('.sidebar-nav a').forEach(function(a) { a.classList.remove('activo'); });
    if (el) el.classList.add('activo');
    document.getElementById('sidebar').classList.remove('abierto');

    var c = document.getElementById('contenido-principal');
    c.innerHTML = '';
    if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
    switch (seccion)
    {
        case 'dashboard': renderDashboard(c); break;
        case 'solicitudes': renderSolicitudes(c); break;
        case 'plantillas': renderPlantillas(c); break;
        case 'clientes': renderClientes(c); break;
        case 'pagos': renderPagos(c); break;
        case 'vitrina': renderVitrina(c); break;
        case 'categorias': renderCategorias(c); break;
        case 'reportes': renderReportes(c); break;
        case 'config': renderConfig(c); break;
    }
    actualizarBadges();
}

    var badgeSolicitudes = document.getElementById('badge-solicitudes');

function renderDashboard(c)
{
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
    var logs = JSON.parse(localStorage.getItem(K.LOGS)) || [];
    var hoy = new Date();

    var activos = clientes.filter(function(cl) { return cl.estado === 'activo'; });
    var vencidos = activos.filter(function(cl) { return cl.fechaVencimiento && new Date(cl.fechaVencimiento) < hoy; });
    var porVencer = activos.filter(function(cl) { if (!cl.fechaVencimiento) return false; var diff = (new Date(cl.fechaVencimiento) - hoy) / (1000 * 60 * 60 * 24); return diff <= 7 && diff >= 0; });
    var ingresosMes = pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear(); }).reduce(function(s, p) { return s + p.monto; }, 0);
    var nuevasSolicitudes = solicitudes.filter(function(s) { return s.estado === 'nueva'; }).length;

    var totalSolicitudes = solicitudes.length;
    var solicitudesConvertidas = solicitudes.filter(function(s) { return s.estado === 'cliente'; }).length;
    var tasaConversion = totalSolicitudes > 0 ? Math.round((solicitudesConvertidas / totalSolicitudes) * 100) : 0;

    var tiemposConversion = solicitudes.filter(function(s) { return s.estado === 'cliente' && s.fechaConversion; }).map(function(s) {
        var fechaSolicitud = new Date(s.fecha);
        var fechaConversion = new Date(s.fechaConversion);
        return Math.round((fechaConversion - fechaSolicitud) / (1000 * 60 * 60 * 24));
    });
    var promedioConversion = tiemposConversion.length > 0 ? Math.round(tiemposConversion.reduce(function(a, b) { return a + b; }, 0) / tiemposConversion.length) : 0;

    var ultimasActividades = logs.slice(0, 5);

    var html = '<div class="topbar"><h1>📊 Dashboard Central</h1><span class="fecha">' + new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + '</span></div>' +
        '<div class="resumen">' +
        '<div class="resumen-tarjeta"><div class="resumen-icono">👥</div><div class="numero">' + activos.length + '</div><div class="etiqueta">Clientes Activos</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono">⚠️</div><div class="numero">' + vencidos.length + '</div><div class="etiqueta">Vencidos</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono">💰</div><div class="numero">$' + ingresosMes.toLocaleString() + '</div><div class="etiqueta">Ingresos del Mes</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono">📩</div><div class="numero">' + nuevasSolicitudes + '</div><div class="etiqueta">Solicitudes Nuevas</div></div>' +
        '</div>' +
        '<div class="resumen" style="margin-top:-10px;">' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📊</div><div class="numero">' + tasaConversion + '%</div><div class="etiqueta">Tasa de Conversión</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">⏱️</div><div class="numero">' + promedioConversion + ' días</div><div class="etiqueta">Tiempo Promedio</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">✅</div><div class="numero">' + solicitudesConvertidas + '</div><div class="etiqueta">Convertidas a Clientes</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">📋</div><div class="numero">' + totalSolicitudes + '</div><div class="etiqueta">Total Solicitudes</div></div>' +
        '</div>';

    if (porVencer.length > 0)
    {
        html += '<div class="seccion"><h2>🔔 Próximos Vencimientos (7 días)</h2>';
        porVencer.forEach(function(cl) { var dias = Math.ceil((new Date(cl.fechaVencimiento) - hoy) / (1000 * 60 * 60 * 24)); html += '<div class="alerta alerta-warning"><span><strong>' + cl.nombre + '</strong> - Vence en ' + dias + ' días</span><button class="btn btn-warning btn-sm" onclick="renovarCliente(' + cl.id + ')">📅 Renovar</button></div>'; });
        html += '</div>';
    }

    if (vencidos.length > 0)
    {
        html += '<div class="seccion"><h2>🚫 Clientes Vencidos</h2>';
        vencidos.forEach(function(cl) { html += '<div class="alerta alerta-danger"><span><strong>' + cl.nombre + '</strong> - Venció: ' + new Date(cl.fechaVencimiento).toLocaleDateString() + '</span><div style="display:flex;gap:6px;"><button class="btn btn-success btn-sm" onclick="renovarCliente(' + cl.id + ')">📅 Renovar</button><button class="btn btn-outline btn-sm" onclick="suspenderCliente(' + cl.id + ')">⏸️ Suspender</button></div></div>'; });
        html += '</div>';
    }

    html += '<div class="seccion"><h2>🔄 Actividad Reciente</h2>';
    if (ultimasActividades.length === 0) {
        html += '<p style="color:var(--text-secondary);font-size:13px;">No hay actividad reciente.</p>';
    } else {
        ultimasActividades.forEach(function(log) {
            html += '<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
                '<span><strong>' + log.accion + '</strong>: ' + log.detalles + '</span>' +
                '<span style="color:var(--text-secondary);font-size:11px;">' + new Date(log.fecha).toLocaleString() + '</span>' +
                '</div>';
        });
    }
    html += '</div>';

    html += '<div class="seccion"><h2>📈 Ingresos Mensuales</h2><div class="chart-container"><canvas id="chart-ingresos"></canvas></div></div>';
    c.innerHTML = html;
    drawChart();
}

function drawChart()
{
    if (typeof Chart === 'undefined') { setTimeout(drawChart, 1000); return; }

    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    var hoy = new Date();
    var labels = [];
    var data = [];

    for (var i = 5; i >= 0; i--)
    {
        var m = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
        labels.push(meses[m.getMonth()]);
        var total = pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === m.getMonth() && fp.getFullYear() === m.getFullYear(); }).reduce(function(s, p) { return s + p.monto; }, 0);
        data.push(total);
    }

    var canvas = document.getElementById('chart-ingresos');
    if (!canvas) return;
    if (chartIngresos) chartIngresos.destroy();

    chartIngresos = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: 'Ingresos ($)', data: data, backgroundColor: '#6366f1', borderRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
}

function renovarCliente(id)
{
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var idx = clientes.findIndex(function(c) { return c.id === id; });
    if (idx === -1) return;
    var nuevaFecha = new Date();
    nuevaFecha.setMonth(nuevaFecha.getMonth() + 1);
    clientes[idx].fechaVencimiento = nuevaFecha.toISOString().split('T')[0];
    clientes[idx].estado = 'activo';
    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
    registrarLog('Cliente renovado', clientes[idx].nombre);
    toast('✅ Cliente renovado por 1 mes', 'exito');
    navegar('dashboard', document.querySelector('.sidebar-nav a.activo'));
}

function suspenderCliente(id)
{
    confirmarAccion('¿Suspender cliente?', 'No podrá usar su tienda hasta ser reactivado.', function()
    {
        var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
        var idx = clientes.findIndex(function(c) { return c.id === id; });

    });
}

function renderListaSolicitudes(solicitudes, plantillas, categorias, clientes)
{
    if (solicitudes.length === 0)
    {
        return '<div class="empty-state" style="text-align:center;padding:40px;color:var(--text-secondary);">📭 No hay solicitudes registradas</div>';
    }

    return solicitudes.map(function(s)
    {
        var pl = plantillas.find(function(p) { return p.id === s.plantillaId; }) || {};
        var estados = {
            'nueva': '<span class="solicitud-estado badge-nueva">🆕 Nueva</span>',
            'contactada': '<span class="solicitud-estado badge-contactada">📞 Contactada</span>',
            'en_negociacion': '<span class="solicitud-estado badge-negociacion">🤝 Negociación</span>',
            'cliente': '<span class="solicitud-estado badge-cliente">✅ Cliente</span>',
            'cerrada': '<span class="solicitud-estado badge-cerrada">🔒 Cerrada</span>'
        };

        var fecha = new Date(s.fecha);
        var fechaStr = fecha.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
        var diasDesde = Math.round((new Date() - fecha) / (1000 * 60 * 60 * 24));
        var telefonoLimpio = s.telefono ? s.telefono.replace(/\+/g, '').replace(/\s/g, '') : '';
        var mensajeWhatsApp = "Hola " + s.nombre + ", soy de IslaMarket. Recibí tu solicitud de información sobre nuestras tiendas online. ¿Podemos conversar?";

        return '<div class="solicitud-item" data-id="' + s.id + '">' +
            '<div class="solicitud-info">' +
            '<span class="nombre">' + s.nombre + '</span>' +
            '<div class="detalles">' +
            '<span>📞 ' + s.telefono + '</span>' +
            (s.email ? '<span>✉️ ' + s.email + '</span>' : '') +
            '<span>📅 ' + fechaStr + ' (' + diasDesde + ' días)</span>' +
            (s.plantillaId ? '<span class="solicitud-plantilla">📦 ' + (pl.emoji || '') + ' ' + (pl.nombre || 'Plantilla') + '</span>' : '') +
            (s.fuente ? '<span>📌 ' + s.fuente + '</span>' : '') +
            '</div>' +
            (s.mensaje ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">📝 ' + s.mensaje + '</div>' : '') +
            (s.notas && s.notas.length > 0 ? '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">📋 ' + s.notas.length + ' notas de seguimiento</div>' : '') +
            '</div>' +
            '<div class="solicitud-acciones">' +
            (estados[s.estado] || '<span class="solicitud-estado badge-cerrada">❓ ' + s.estado + '</span>') +
            (telefonoLimpio ? '<a href="https://wa.me/' + telefonoLimpio + '?text=' + encodeURIComponent(mensajeWhatsApp) + '" target="_blank" class="btn btn-success btn-xs" title="Contactar por WhatsApp">💬</a>' : '') +
            '<button class="btn btn-success btn-xs" onclick="cambiarEstadoSolicitud(' + s.id + ',\'contactada\')" title="Marcar como contactada">📞</button>' +
            '<button class="btn btn-warning btn-xs" onclick="cambiarEstadoSolicitud(' + s.id + ',\'en_negociacion\')" title="Marcar en negociación">🤝</button>' +
            '<button class="btn btn-primario btn-xs" onclick="convertirSolicitudEnCliente(' + s.id + ')" title="Convertir en cliente">✅ Cliente</button>' +
            '<button class="btn btn-outline btn-xs" onclick="agregarNotaSolicitud(' + s.id + ')" title="Agregar nota">📝</button>' +
            (s.estado !== 'cerrada' ? '<button class="btn btn-outline btn-xs" onclick="cambiarEstadoSolicitud(' + s.id + ',\'cerrada\')" title="Cerrar">🔒</button>' : '') +
            '<button class="btn btn-danger btn-xs" onclick="eliminarSolicitud(' + s.id + ')">🗑️</button>' +
            '</div>' +
            '</div>';
    }).join('');
}

var filtroSolicitudEstado = 'todas';

function filtrarSolicitudes(estado, el)
{
    filtroSolicitudEstado = estado;
    document.querySelectorAll('.filtros-chips .chip').forEach(function(chip) { chip.classList.remove('activo'); });
    if (el) el.classList.add('activo');
    aplicarFiltrosSolicitudes();
}

function filtrarSolicitudesTexto() { aplicarFiltrosSolicitudes(); }

function aplicarFiltrosSolicitudes()
{
    var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
    var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
    var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var filtroTexto = (document.getElementById('buscar-solicitud')?.value || '').toLowerCase();
    var f = solicitudes;

    if (filtroSolicitudEstado !== 'todas') { f = f.filter(function(s) { return s.estado === filtroSolicitudEstado; }); }
    if (filtroTexto) { f = f.filter(function(s) { return s.nombre.toLowerCase().includes(filtroTexto) || s.telefono.includes(filtroTexto) || (s.email || '').toLowerCase().includes(filtroTexto); }); }

    f.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

    var container = document.getElementById('lista-solicitudes');
    if (container) { container.innerHTML = renderListaSolicitudes(f, plantillas, categorias, clientes); }
}

function cambiarEstadoSolicitud(id, nuevoEstado)
{
    var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
    var idx = solicitudes.findIndex(function(s) { return s.id === id; });
    if (idx === -1) return;

    var estados = { 'contactada': '📞 Contactada', 'en_negociacion': '🤝 En negociación', 'cliente': '✅ Cliente', 'cerrada': '🔒 Cerrada' };
    solicitudes[idx].estado = nuevoEstado;
    if (nuevoEstado === 'cliente') { solicitudes[idx].fechaConversion = new Date().toISOString(); }
    localStorage.setItem(K.SOLICITUDES, JSON.stringify(solicitudes));
    registrarLog('Estado de solicitud actualizado', 'ID: ' + id + ' → ' + nuevoEstado);
    toast('✅ Solicitud marcada como ' + (estados[nuevoEstado] || nuevoEstado), 'exito');
    aplicarFiltrosSolicitudes();
    actualizarBadges();
}

function agregarNotaSolicitud(id)
{
    var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
    var idx = solicitudes.findIndex(function(s) { return s.id === id; });
    if (idx === -1) return;

    var nota = prompt('📝 Agregar nota de seguimiento para ' + solicitudes[idx].nombre + ':');
    if (nota && nota.trim() !== '') {
        if (!solicitudes[idx].notas) solicitudes[idx].notas = [];
        solicitudes[idx].notas.push({ fecha: new Date().toISOString(), nota: nota.trim(), autor: 'admin' });
        localStorage.setItem(K.SOLICITUDES, JSON.stringify(solicitudes));
        toast('✅ Nota agregada correctamente', 'exito');
        aplicarFiltrosSolicitudes();
    }
}

function convertirSolicitudEnCliente(id)
{
    var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
    var idx = solicitudes.findIndex(function(s) { return s.id === id; });
    if (idx === -1) return;

    var s = solicitudes[idx];
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
    var cat = categorias.find(function(c) { return c.id === s.categoriaId; }) || categorias[0] || {};

    var usuarioBase = s.nombre.toLowerCase().replace(/\s+/g, '');
    var usuario = usuarioBase;
    var contador = 1;
    while (clientes.find(function(c) { return c.usuario === usuario; })) { usuario = usuarioBase + contador; contador++; }

    var nuevoCliente = {
        id: Date.now(),
        nombre: s.nombre,
        dueno: s.nombre,
        categoriaId: cat.id || null,
        usuario: usuario,
        contrasena: '123456',
        plan: 'Básico',
        precio: 10,
        fechaInicio: new Date().toISOString().split('T')[0],
        fechaVencimiento: null,
        urlTienda: '',
        urlAdmin: '',
        estado: 'activo',
        destacado: false,
        nuevo: true,
        logo: '🏪',
        eslogan: '',
        telefono: s.telefono || '',
        email: s.email || '',
        whatsapp: s.telefono || '',
        direccion: '',
        horario: '',
        instagram: '',
        facebook: '',
        twitter: '',
        youtube: '',
        valoracion: 0,
        totalValoraciones: 0,
        oferta: '',
        portada: '',
        galeria: [],
        tags: [],
        notas: 'Convertido desde solicitud ID: ' + s.id + ' - ' + (s.mensaje || ''),
        // NUEVOS CAMPOS
        tipoCliente: 'prueba',
        accesoPanel: false,
        diasPrueba: 7,
        fechaPruebaInicio: new Date().toISOString().split('T')[0],
        fechaPruebaFin: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        usuarioTienda: '',
        contrasenaTienda: ''
    };

    clientes.push(nuevoCliente);
    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));

    solicitudes[idx].estado = 'cliente';
    solicitudes[idx].clienteId = nuevoCliente.id;
    solicitudes[idx].fechaConversion = new Date().toISOString();
    localStorage.setItem(K.SOLICITUDES, JSON.stringify(solicitudes));

    actualizarUsuariosLogin();
    registrarLog('Solicitud convertida en cliente', s.nombre + ' → ' + usuario);
    toast('✅ ¡' + s.nombre + ' ahora es cliente! Usuario: ' + usuario + ' | Contraseña: 123456', 'exito');
    aplicarFiltrosSolicitudes();
    actualizarBadges();
}

function eliminarSolicitud(id)
{
    confirmarAccion('¿Eliminar solicitud?', 'Esta acción no se puede deshacer.', function()
    {
        var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];

function guardarPlantilla()
{
    var nombre = document.getElementById('pl-nombre').value.trim();
    if (!nombre) { toast('⚠️ El nombre es obligatorio', 'error'); return; }
    var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
    plantillas.push({
        id: Date.now(),
        nombre: nombre,
        emoji: document.getElementById('pl-emoji').value.trim() || '🏪',
        categoriaId: parseInt(document.getElementById('pl-categoria').value),
        urlTienda: document.getElementById('pl-url-tienda').value.trim(),
        urlAdmin: document.getElementById('pl-url-admin').value.trim(),
        urlDemo: document.getElementById('pl-url-demo').value.trim(),
        color: document.getElementById('pl-color').value,
        descripcion: document.getElementById('pl-desc').value.trim(),
        tags: document.getElementById('pl-tags').value.trim(),
        disponible: document.getElementById('pl-disponible').checked,
        destacada: document.getElementById('pl-destacada').checked,
        orden: parseInt(document.getElementById('pl-orden').value) || 1
    });
    localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));
    toast('✅ Plantilla guardada correctamente', 'exito');
    registrarLog('Plantilla creada', nombre);
    renderPlantillas(document.getElementById('contenido-principal'));
}

function editarPlantilla(id)
{
    var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
    var p = plantillas.find(function(pl) { return pl.id === id; });
    if (!p) return;
    document.getElementById('pl-nombre').value = p.nombre;
    document.getElementById('pl-emoji').value = p.emoji;
    document.getElementById('pl-categoria').value = p.categoriaId;
    document.getElementById('pl-url-tienda').value = p.urlTienda;
    document.getElementById('pl-url-admin').value = p.urlAdmin;
    document.getElementById('pl-url-demo').value = p.urlDemo || '';
    document.getElementById('pl-color').value = p.color;
    document.getElementById('pl-desc').value = p.descripcion || '';
    document.getElementById('pl-tags').value = p.tags || '';
    document.getElementById('pl-disponible').checked = p.disponible;
    document.getElementById('pl-destacada').checked = p.destacada || false;
    document.getElementById('pl-orden').value = p.orden || 1;
    eliminarPlantillaSilenciosa(id);
    toast('✏️ Editando plantilla. Modifica y guarda.', 'exito');
}

function eliminarPlantillaSilenciosa(id) { var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || []; plantillas = plantillas.filter(function(p) { return p.id !== id; }); localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas)); }

function duplicarPlantilla(id)
{
    var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
    var original = plantillas.find(function(p) { return p.id === id; });
    if (!original) return;
    var copia = JSON.parse(JSON.stringify(original));
    copia.id = Date.now();
    copia.nombre = original.nombre + ' (Copia)';
    copia.disponible = true;
    plantillas.push(copia);
    localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));
    toast('📋 Plantilla duplicada correctamente', 'exito');
    renderPlantillas(document.getElementById('contenido-principal'));
}

function eliminarPlantilla(id)
{
    confirmarAccion('¿Eliminar plantilla?', 'Esta acción no se puede deshacer.', function()
    {
        var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
        plantillas = plantillas.filter(function(p) { return p.id !== id; });
        localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));
        toast('🗑️ Plantilla eliminada', 'exito');
        registrarLog('Plantilla eliminada', 'ID: ' + id);
        renderPlantillas(document.getElementById('contenido-principal'));
    });
}

function toggleTipoCliente() {
    var tipo = document.getElementById('cl-tipo-cliente').value;
    if (tipo === 'prueba') {
        document.getElementById('campos-prueba').style.display = 'grid';
        document.getElementById('campos-alquiler').style.display = 'none';
    } else {
        document.getElementById('campos-prueba').style.display = 'none';
        document.getElementById('campos-alquiler').style.display = 'grid';
    }
}

function actualizarFechaFinPrueba() {
    var fechaInicio = document.getElementById('cl-fecha-prueba-inicio');
    var diasPrueba = document.getElementById('cl-dias-prueba');
    var fechaFin = document.getElementById('cl-fecha-prueba-fin');
    
    if (fechaInicio && diasPrueba && fechaFin) {
        var inicio = fechaInicio.value || new Date().toISOString().split('T')[0];
        var dias = parseInt(diasPrueba.value) || 7;
        var fin = new Date(inicio);
        fin.setDate(fin.getDate() + dias);
        fechaFin.value = fin.toISOString().split('T')[0];
    }
}

// Event listeners para actualizar fecha fin
document.addEventListener('DOMContentLoaded', function() {
    var fechaInicio = document.getElementById('cl-fecha-prueba-inicio');
    var diasPrueba = document.getElementById('cl-dias-prueba');
    if (fechaInicio) fechaInicio.addEventListener('change', actualizarFechaFinPrueba);
    if (diasPrueba) diasPrueba.addEventListener('input', actualizarFechaFinPrueba);
});

function previewLogo(e)
{
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        var preview = document.getElementById('cl-logo-preview');
        preview.innerHTML = '<img src="' + ev.target.result + '" alt="Logo">';
    };
    reader.readAsDataURL(file);
}

function previewPortada(e)
{
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        var preview = document.getElementById('cl-portada-preview');
        preview.innerHTML = '<img src="' + ev.target.result + '" alt="Portada">';
    };
    reader.readAsDataURL(file);
}

function previewGaleria(e)
{
    var files = e.target.files;
    var preview = document.getElementById('cl-galeria-preview');
    preview.innerHTML = '';
    for (var i = 0; i < files.length; i++) {
        (function(file) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                var div = document.createElement('div');
                div.className = 'galeria-item';
                div.innerHTML = '<img src="' + ev.target.result + '" alt="Galería">';
                preview.appendChild(div);
            };
            reader.readAsDataURL(file);
        })(files[i]);
    }
}

function renderFilasClientes(datos)
{
    var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
    var hoy = new Date();

    if (datos.length === 0) return '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-secondary);">No se encontraron clientes.</td></tr>';

    return datos.map(function(cl)
    {
        var cat = categorias.find(function(c) { return c.id === cl.categoriaId; }) || {};
        
        // Determinar estado
        var estadoBadge = '';
        var claseFila = '';
        var tipoMostrar = '';
        
        if (cl.tipoCliente === 'prueba' || !cl.tipoCliente) {
            tipoMostrar = '🧪 Prueba';
            if (cl.fechaPruebaFin) {
                var diasRestantes = Math.ceil((new Date(cl.fechaPruebaFin) - hoy) / (1000 * 60 * 60 * 24));
                if (diasRestantes <= 0) {
                    estadoBadge = '<span class="badge badge-vencido">⏰ Vencida</span>';
                    claseFila = 'fila-vencido';
                } else if (diasRestantes <= 3) {
                    estadoBadge = '<span class="badge badge-suspendido">🧪 ' + diasRestantes + 'd</span>';
                    claseFila = 'fila-suspendido';
                } else {
                    estadoBadge = '<span class="badge badge-prueba">🧪 ' + diasRestantes + 'd</span>';
                }
            }
        } else if (cl.tipoCliente === 'alquiler') {
            tipoMostrar = '💰 ' + (cl.plan || 'Básico');
            if (cl.estado === 'suspendido') {
                estadoBadge = '<span class="badge badge-suspendido">⏸️ Suspendido</span>';
                claseFila = 'fila-suspendido';
            } else if (cl.fechaVencimiento && new Date(cl.fechaVencimiento) < hoy) {
                estadoBadge = '<span class="badge badge-vencido">❌ Vencido</span>';
                claseFila = 'fila-vencido';
            } else {
                estadoBadge = '<span class="badge badge-activo">✅ Activo</span>';
                claseFila = 'fila-activo';
            }
        }

        var logoHTML = cl.logo && cl.logo.startsWith('data:') ?
            '<img src="' + cl.logo + '" alt="' + cl.nombre + '" style="width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--border);">' :
            (cl.logo || '🏪');

        return '<tr class="' + claseFila + '">' +
            '<td><div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;">' + logoHTML + '</div></td>' +
            '<td><strong>' + cl.nombre + '</strong>' + (cl.eslogan ? '<br><small>' + cl.eslogan + '</small>' : '') + '</td>' +
            '<td>' + tipoMostrar + '</td>' +
            '<td><code>' + cl.usuario + '</code></td>' +
            '<td>' + (cl.fechaVencimiento || cl.fechaPruebaFin || '—') + '</td>' +
            '<td>' + estadoBadge + '</td>' +
            '<td>' + (cl.accesoPanel ? '✅' : '❌') + '</td>' +
            '<td style="white-space:nowrap;">' +
            '<button class="btn btn-outline btn-xs" onclick="verDetalleCliente(' + cl.id + ')">👁️</button> ' +
            '<button class="btn btn-outline btn-xs" onclick="editarCliente(' + cl.id + ')">✏️</button> ' +
            '<button class="btn btn-warning btn-xs" onclick="toggleAccesoPanelCliente(' + cl.id + ')">🔧 ' + (cl.accesoPanel ? 'Quitar' : 'Dar') + '</button> ' +
            (cl.tipoCliente === 'prueba' || !cl.tipoCliente ? '<button class="btn btn-success btn-xs" onclick="convertirAAlquiler(' + cl.id + ')">💰 Convertir</button> ' : '<button class="btn btn-success btn-xs" onclick="renovarCliente(' + cl.id + ')">📅</button> ') +
            '<button class="btn btn-danger btn-xs" onclick="eliminarCliente(' + cl.id + ')">🗑️</button>' +
            '</td></tr>';
    }).join('');
}

function toggleAccesoPanelCliente(id) {
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var idx = clientes.findIndex(function(c) { return c.id === id; });
    if (idx === -1) return;
    
    clientes[idx].accesoPanel = !clientes[idx].accesoPanel;
    
    if (clientes[idx].accesoPanel) {
        if (!clientes[idx].usuarioTienda) {
            clientes[idx].usuarioTienda = clientes[idx].usuario;
            clientes[idx].contrasenaTienda = clientes[idx].contrasena;
        }
        toast('✅ Acceso al panel CONCEDIDO', 'exito');
        registrarLog('Acceso panel concedido', clientes[idx].nombre);
    } else {
        toast('🔒 Acceso al panel REVOCADO', 'info');
        registrarLog('Acceso panel revocado', clientes[idx].nombre);
    }
    
    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
    actualizarUsuariosLogin();
    aplicarFiltrosClientes();
}

function convertirAAlquiler(id) {
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var idx = clientes.findIndex(function(c) { return c.id === id; });
    if (idx === -1) return;
    
    var meses = parseInt(prompt('¿Cuántos meses?', '1')) || 1;
    var precio = parseFloat(prompt('Precio mensual ($):', clientes[idx].precio || '10')) || 10;
    var plan = prompt('Plan (Básico/Pro/Premium):', clientes[idx].plan || 'Básico') || 'Básico';
    
    var fechaVenc = new Date();
    fechaVenc.setMonth(fechaVenc.getMonth() + meses);
    
    clientes[idx].tipoCliente = 'alquiler';
    clientes[idx].plan = plan;
    clientes[idx].precio = precio;
    clientes[idx].fechaVencimiento = fechaVenc.toISOString().split('T')[0];
    clientes[idx].estado = 'activo';
    clientes[idx].accesoPanel = true;
    clientes[idx].fechaPruebaFin = null;
    
    if (!clientes[idx].usuarioTienda) {
        clientes[idx].usuarioTienda = clientes[idx].usuario;
        clientes[idx].contrasenaTienda = clientes[idx].contrasena;
    }
    
    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
    actualizarUsuariosLogin();
    toast('✅ Cliente convertido a alquiler por ' + meses + ' meses', 'exito');
    registrarLog('Cliente convertido a alquiler', clientes[idx].nombre + ' - ' + meses + ' meses');
    aplicarFiltrosClientes();
}

function filtrarClientesEstado(estado, el)
{
    filtroEstadoActual = estado;
    document.querySelectorAll('.filtros-chips .chip').forEach(function(chip) { chip.classList.remove('activo'); });
    if (el) el.classList.add('activo');
    aplicarFiltrosClientes();
}

function filtrarClientesTexto() { aplicarFiltrosClientes(); }

function aplicarFiltrosClientes()
{
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var filtroTexto = (document.getElementById('buscar-cliente')?.value || '').toLowerCase();
    var hoy = new Date();
    var f = clientes;

    if (filtroEstadoActual === 'activo') { f = f.filter(function(c) { return c.estado === 'activo' && (!c.fechaVencimiento || new Date(c.fechaVencimiento) >= hoy); }); }
    else if (filtroEstadoActual === 'vencido') { f = f.filter(function(c) { return c.estado === 'activo' && c.fechaVencimiento && new Date(c.fechaVencimiento) < hoy; }); }
    else if (filtroEstadoActual === 'suspendido') { f = f.filter(function(c) { return c.estado === 'suspendido'; }); }

    if (filtroTexto) { f = f.filter(function(c) { return c.nombre.toLowerCase().includes(filtroTexto) || c.usuario.toLowerCase().includes(filtroTexto) || (c.dueno || '').toLowerCase().includes(filtroTexto); }); }

    document.getElementById('tabla-clientes').innerHTML = renderFilasClientes(f);
}

function eliminarCliente(id)
{
    confirmarAccion('¿Eliminar cliente?', 'Se eliminará permanentemente.', function()
    {
        var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
        var nombre = '';
        var idx = clientes.findIndex(function(c) { return c.id === id; });
        if (idx !== -1) { nombre = clientes[idx].nombre; clientes.splice(idx, 1); }
        localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
        actualizarUsuariosLogin();
        toast('🗑️ Cliente eliminado', 'exito');
        registrarLog('Cliente eliminado', nombre);
        renderClientes(document.getElementById('contenido-principal'));
        actualizarBadges();
    });
}

function actualizarUsuariosLogin()
{
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var usuariosLogin = {};
    clientes.forEach(function(c) { if (c.usuario && c.contrasena) { usuariosLogin[c.usuario] = { contrasena: c.contrasena, pagina: c.urlAdmin }; } });
    localStorage.setItem('usuariosIslaMarket', JSON.stringify(usuariosLogin));
}

function renderPagos(c)
{
    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var hoy = new Date();

    var totalCobrado = pagos.reduce(function(s, p) { return s + p.monto; }, 0);
    var pagosMes = pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear(); });
    var totalCobradoMes = pagosMes.reduce(function(s, p) { return s + p.monto; }, 0);
    var totalPagosMes = pagosMes.length;
    var pendientes = pagos.filter(function(p) { return p.estado === 'Pendiente' || p.estado === 'En_revision'; });
    var totalPendientes = pendientes.length;
    var morosos = clientes.filter(function(c) { return c.estado === 'activo' && c.fechaVencimiento && new Date(c.fechaVencimiento) < hoy; });
    var totalMorosos = morosos.length;
    var deudaTotal = morosos.reduce(function(s, c) { return s + (c.precio || 0); }, 0);

    var html = '<div class="topbar"><h1>💰 Suscripciones y Pagos</h1></div>' +
        '<div class="resumen" style="margin-bottom:22px;">' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">💰</div><div class="numero">$' + totalCobradoMes.toFixed(2) + '</div><div class="etiqueta">Cobrado este mes</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">⏳</div><div class="numero">' + totalPendientes + '</div><div class="etiqueta">Pagos Pendientes</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">✅</div><div class="numero">' + totalPagosMes + '</div><div class="etiqueta">Pagos realizados</div></div>' +
        '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📊</div><div class="numero">$' + deudaTotal.toFixed(2) + '</div><div class="etiqueta">Deuda Total</div></div>' +
        '</div>';

    if (morosos.length > 0)
    {
        html += '<div class="seccion"><h2>🚨 Pagos Pendientes (Morosos)</h2>';
        morosos.forEach(function(cl) {
            var diasAtraso = Math.floor((new Date() - new Date(cl.fechaVencimiento)) / (1000 * 60 * 60 * 24));
            html += '<div class="alerta alerta-danger"><span><strong>' + cl.nombre + '</strong> - Debe $' + (cl.precio || 0) + ' - ' + diasAtraso + ' días</span><div style="display:flex;gap:6px;"><button class="btn btn-success btn-sm" onclick="abrirFormularioPago(' + cl.id + ')">💰 Cobrar</button><button class="btn btn-outline btn-sm" onclick="enviarRecordatorioPago(' + cl.id + ')">📨 Recordatorio</button></div></div>';
        });
        html += '</div>';
    }

    html += '<div class="seccion" id="formulario-pago"><h2>➕ Registrar Nuevo Pago</h2>' +
        '<div class="form-grid form-grid-3">' +
        '<div class="form-grupo"><label>Cliente</label><select id="pg-cliente">' + clientes.map(function(c) { return '<option value="' + c.id + '">' + c.nombre + '</option>'; }).join('') + '</select></div>' +
        '<div class="form-grupo"><label>Monto ($)</label><input type="number" id="pg-monto" value="10" step="0.01"></div>' +
        '<div class="form-grupo"><label>Fecha de Pago</label><input type="date" id="pg-fecha"></div>' +
        '<div class="form-grupo"><label>Fecha de Vencimiento</label><input type="date" id="pg-fecha-vencimiento"></div>' +
        '<div class="form-grupo"><label>Método de Pago</label><select id="pg-metodo"><option>Efectivo</option><option>Transferencia</option><option>Enzona</option><option>MLC</option><option>Tarjeta</option><option>PayPal</option><option>Otro</option></select></div>' +
        '<div class="form-grupo"><label>Tipo de Pago</label><select id="pg-tipo-pago" onchange="togglePlazos()"><option value="mensual">Mensual (1 pago)</option><option value="2_plazos">2 plazos</option><option value="3_plazos">3 plazos</option><option value="personalizado">Personalizado</option></select></div>' +
        '<div class="form-grupo" id="pg-plazo-container" style="display:none;"><label>Número de Plazo</label><input type="number" id="pg-plazo" value="1" min="1" max="10"></div>' +
        '<div class="form-grupo"><label>Estado</label><select id="pg-estado"><option value="Confirmado">✅ Confirmado</option><option value="Pendiente">⏳ Pendiente</option><option value="En_revision">🔍 En revisión</option><option value="Rechazado">❌ Rechazado</option></select></div>' +
        '<div class="form-grupo"><label>N° Comprobante</label><input id="pg-numero-comprobante" placeholder="TRX-2025-001"></div>' +
        '<div class="form-grupo"><label>Banco Origen</label><input id="pg-banco-origen" placeholder="Banco de Cuba"></div>' +
        '<div class="form-grupo form-grupo-file"><label>Comprobante (imagen)</label><input type="file" id="pg-comprobante" accept="image/*" onchange="previewComprobante(event)"><div class="logo-preview" id="pg-comprobante-preview">📄</div></div>' +

        '<button class="btn btn-primario" onclick="registrarPago()">💾 Registrar Pago</button></div></div>';

        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"><button class="btn btn-outline btn-sm" onclick="exportarPagosCSV()">📥 CSV</button><button class="btn btn-outline btn-sm" onclick="exportarPagosPDF()" style="border-color:var(--danger);color:var(--danger);">📄 PDF</button><button class="btn btn-outline btn-sm" onclick="limpiarHistorialPagos()" style="border-color:var(--danger);color:var(--danger);">🗑️ Limpiar</button></div>' +
        '<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Método</th><th>Estado</th><th>Vence</th><th>Acciones</th></tr></thead><tbody id="tabla-pagos">';

    html += renderFilasPagos(pagos, clientes);
    html += '</tbody></table></div></div>';
    c.innerHTML = html;
}

function togglePlazos()
{
    var tipo = document.getElementById('pg-tipo-pago').value;
    var container = document.getElementById('pg-plazo-container');
    container.style.display = tipo === 'personalizado' ? 'block' : 'none';
}

function previewComprobante(e)
{
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('pg-comprobante-preview').innerHTML = '<img src="' + ev.target.result + '" alt="Comprobante" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
}

function abrirFormularioPago(clienteId)
{
    document.getElementById('pg-cliente').value = clienteId;
    document.getElementById('pg-monto').value = 10;
    document.getElementById('pg-fecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('pg-fecha-vencimiento').value = new Date(new Date().setDate(new Date().getDate() + 30)).toISOString().split('T')[0];
    document.getElementById('pg-notas').value = '';
    toast('💰 Preparando cobro. Completa el formulario.', 'info');
    document.getElementById('formulario-pago').scrollIntoView({ behavior: 'smooth' });
}

function enviarRecordatorioPago(clienteId)
{
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var cl = clientes.find(function(c) { return c.id === clienteId; });
    if (!cl) return;
    var mensaje = "📢 *Recordatorio de Pago*\n\nHola " + cl.dueno + ",\n\nTu suscripción de *" + cl.nombre + "* ha vencido.\n\n💰 Monto: $" + (cl.precio || 10) + "\n📅 Vencimiento: " + cl.fechaVencimiento + "\n\nPor favor, realiza tu pago.\n\n¡Gracias! 🙌";
    var tel = cl.whatsapp || cl.telefono;
    if (tel) { window.open("https://wa.me/" + tel.replace(/\+/g, '').replace(/\s/g, '') + "?text=" + encodeURIComponent(mensaje), '_blank'); toast('✅ Recordatorio enviado', 'exito'); }
    else { toast('⚠️ No tiene teléfono', 'error'); }
}

function renderFilasPagos(datos, clientes)
{
    if (datos.length === 0) return '<tr><td colspan="7" style="text-align:center;padding:30px;">No hay pagos.</td></tr>';
    var estados = { 'Confirmado': '<span class="badge badge-activo">✅ Confirmado</span>', 'Pendiente': '<span class="badge badge-suspendido">⏳ Pendiente</span>', 'En_revision': '<span class="badge badge-prueba">🔍 En revisión</span>', 'Rechazado': '<span class="badge badge-vencido">❌ Rechazado</span>' };
    var metodos = { 'Efectivo': '💵', 'Transferencia': '🏦', 'Enzona': '📱', 'MLC': '💳', 'Tarjeta': '💳', 'PayPal': '🌐', 'Otro': '📋' };
    return datos.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function(p) {
        var cl = clientes.find(function(c) { return c.id === p.clienteId; }) || {};
        return '<tr><td>' + p.fecha + '</td><td><strong>' + (cl.nombre || '—') + '</strong></td><td>$' + p.monto.toFixed(2) + '</td><td>' + (metodos[p.metodoPago] || '💰') + ' ' + (p.metodoPago || '—') + '</td><td>' + (estados[p.estado] || p.estado) + '</td><td>' + (p.fechaVencimiento || '—') + '</td><td><button class="btn btn-outline btn-xs" onclick="verDetallePago(' + p.id + ')">👁️</button> <button class="btn btn-outline btn-xs" onclick="editarPago(' + p.id + ')">✏️</button> <button class="btn btn-danger btn-xs" onclick="eliminarPago(' + p.id + ')">🗑️</button></td></tr>';
    }).join('');
}

var filtroPagosEstado = 'todos';

function filtrarPagos(estado, el)
{
    filtroPagosEstado = estado;
    document.querySelectorAll('.filtros-chips .chip').forEach(function(chip) { chip.classList.remove('activo'); });
    if (el) el.classList.add('activo');
    aplicarFiltrosPagos();
}

function aplicarFiltrosPagos()
{
    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    var f = pagos;
    if (filtroPagosEstado !== 'todos') { f = f.filter(function(p) { return p.estado === filtroPagosEstado; }); }
    document.getElementById('tabla-pagos').innerHTML = renderFilasPagos(f, clientes);
}

function registrarPago()
{
    var monto = parseFloat(document.getElementById('pg-monto').value);
    if (!monto || monto <= 0) { toast('⚠️ Ingresa un monto válido', 'error'); return; }
    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var clienteId = parseInt(document.getElementById('pg-cliente').value);
    var tipoPago = document.getElementById('pg-tipo-pago').value;
    var plazo = parseInt(document.getElementById('pg-plazo').value) || 1;
    var totalPlazos = 1;
    if (tipoPago === '2_plazos') totalPlazos = 2;
    else if (tipoPago === '3_plazos') totalPlazos = 3;
    else if (tipoPago === 'personalizado') totalPlazos = parseInt(prompt('¿Cuántos plazos?', '2')) || 1;

    var preview = document.getElementById('pg-comprobante-preview');
    var comprobanteData = preview.querySelector('img') ? preview.querySelector('img').src : '';

    var pago = {
        id: Date.now(), clienteId: clienteId, monto: monto,
        fecha: document.getElementById('pg-fecha').value || new Date().toISOString().split('T')[0],
        fechaVencimiento: document.getElementById('pg-fecha-vencimiento').value || '',
        metodoPago: document.getElementById('pg-metodo').value,
        estado: document.getElementById('pg-estado').value,
        tipoPago: tipoPago, plazo: plazo, totalPlazos: totalPlazos,
        numeroComprobante: document.getElementById('pg-numero-comprobante').value.trim(),
        bancoOrigen: document.getElementById('pg-banco-origen').value.trim(),
        comprobante: comprobanteData,
        notas: document.getElementById('pg-notas').value.trim(),
        fechaCreacion: new Date().toISOString(), usuarioCreador: 'admin'
    };

    pagos.push(pago);
    localStorage.setItem(K.PAGOS, JSON.stringify(pagos));

    if (pago.estado === 'Confirmado') {
        var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
        var idx = clientes.findIndex(function(c) { return c.id === clienteId; });
        if (idx !== -1) {
            var ultimaFecha = clientes[idx].fechaVencimiento ? new Date(clientes[idx].fechaVencimiento) : new Date();
            if (ultimaFecha < new Date()) ultimaFecha = new Date();
            ultimaFecha.setMonth(ultimaFecha.getMonth() + 1);
            clientes[idx].fechaVencimiento = ultimaFecha.toISOString().split('T')[0];
            clientes[idx].estado = 'activo';
            localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
        }
    }

    toast('✅ Pago registrado', 'exito');
    registrarLog('Pago registrado', 'Cliente ID: ' + clienteId + ' - $' + monto);
    renderPagos(document.getElementById('contenido-principal'));
    actualizarBadges();
}

function exportarPagosCSV()

    var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
    var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
    if (pagos.length === 0) { toast('⚠️ No hay pagos', 'error'); return; }
    var data = pagos.map(function(p) { var cl = clientes.find(function(c) { return c.id === p.clienteId; }) || {}; return { 'Fecha': p.fecha, 'Cliente': cl.nombre || '—', 'Monto': p.monto, 'Método': p.metodoPago || '—', 'Estado': p.estado || '—' }; });
    var csv = [Object.keys(data[0]).join(','), ...data.map(function(d) { return Object.values(d).join(','); })].join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'pagos_' + new Date().toISOString().split('T')[0] + '.csv'; a.click();
    URL.revokeObjectURL(url);
    toast('📥 CSV exportado', 'exito');
}

function backupDatos()
{
    var data = { plantillas: JSON.parse(localStorage.getItem(K.PLANTILLAS)), clientes: JSON.parse(localStorage.getItem(K.CLIENTES)), categorias: JSON.parse(localStorage.getItem(K.CATEGORIAS)), pagos: JSON.parse(localStorage.getItem(K.PAGOS)), config: JSON.parse(localStorage.getItem(K.CONFIG)), logs: JSON.parse(localStorage.getItem(K.LOGS)), solicitudes: JSON.parse(localStorage.getItem(K.SOLICITUDES)) };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup_' + new Date().toISOString().split('T')[0] + '.json'; a.click();
    toast('📥 Backup descargado', 'exito');
}

function restaurarBackup()
{
    var input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = function(e) {
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var data = JSON.parse(ev.target.result);
                if (data.plantillas) localStorage.setItem(K.PLANTILLAS, JSON.stringify(data.plantillas));
                if (data.clientes) localStorage.setItem(K.CLIENTES, JSON.stringify(data.clientes));
                if (data.categorias) localStorage.setItem(K.CATEGORIAS, JSON.stringify(data.categorias));
                if (data.pagos) localStorage.setItem(K.PAGOS, JSON.stringify(data.pagos));
                if (data.config) localStorage.setItem(K.CONFIG, JSON.stringify(data.config));
                if (data.logs) localStorage.setItem(K.LOGS, JSON.stringify(data.logs));
                if (data.solicitudes) localStorage.setItem(K.SOLICITUDES, JSON.stringify(data.solicitudes));
                toast('✅ Backup restaurado', 'exito');
                navegar('dashboard', document.querySelector('.sidebar-nav a'));
            } catch(err) { toast('⚠️ Archivo inválido', 'error'); }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
}
