<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel Maestro | Isla Market</title>
    
    <!-- ==========================================
    DEPENDENCIAS EXTERNAS
    ========================================== -->
    <script>
        var cdns = [
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
            'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
        ];
        var intento = 0;
        function cargarChart() {
            if (intento >= cdns.length) return;
            var s = document.createElement('script');
            s.src = cdns[intento];
            s.onload = function() { window._chartCargado = true; };
            s.onerror = function() { intento++; setTimeout(cargarChart, 500); };
            document.head.appendChild(s);
        }
        cargarChart();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
            onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';">
    </script>

    <!-- ==========================================
    ESTILOS
    ========================================== -->
    <style>
        /* ========== VARIABLES ========== */
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-sidebar: #cbd5e1;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.25s ease;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
        }

        .dark-mode {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        /* ========== RESET ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ========== BODY ========== */
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        /* ========== SIDEBAR OVERLAY ========== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.activo { display: block; }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: var(--sidebar-bg);
            padding: 20px 12px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
            overflow-y: auto;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 14px;
        }

        .sidebar-logo .logo-cuadro {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .sidebar-logo h2 {
            font-size: 16px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .sidebar-logo h2 span {
            color: #a5b4fc;
            font-size: 10px;
            display: block;
            font-weight: 500;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-sidebar);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.activo {
            background: var(--sidebar-hover);
            color: #fff;
        }

        .sidebar-nav a .icono-nav {
            font-size: 16px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-badge {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #ef4444;
            color: #fff;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn-sidebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 8px;
            background: none;
            border: none;
            color: var(--text-sidebar);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: var(--transition);
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .btn-sidebar:hover { background: var(--sidebar-hover); color: #fff; }

        .btn-sidebar-logout {
            color: #fca5a5 !important;
            margin-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 10px;
        }

        .btn-sidebar-logout:hover {
            background: rgba(239,68,68,0.15) !important;
            color: #ef4444 !important;
        }

        /* ========== CONTENIDO PRINCIPAL ========== */
        .contenido {
            margin-left: 260px;
            flex: 1;
            padding: 24px 20px;
            width: calc(100% - 260px);
            min-width: 0;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .topbar .fecha {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
        }

        /* ========== TARJETAS DE RESUMEN ========== */
        .resumen {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .resumen-tarjeta {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px 18px;
            border: 1px solid var(--border);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .resumen-tarjeta:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .resumen-tarjeta .resumen-icono {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .resumen-tarjeta .numero {
            font-size: 28px;
            font-weight: 900;
        }

        .resumen-tarjeta .etiqueta {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
        }

        /* ========== SECCIONES ========== */
        .seccion {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .seccion h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seccion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* ========== FILTROS ========== */
        .filtros-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .chip {
            padding: 7px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: inherit;
        }

        .chip:hover { border-color: var(--primary); color: var(--primary); }

        .chip.activo {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ========== FORMULARIOS ========== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .form-grid-2 { grid-template-columns: repeat(2, 1fr); }
        .form-grid-3 { grid-template-columns: repeat(3, 1fr); }

        .form-grupo { display: flex; flex-direction: column; }
        .form-grupo-full { grid-column: 1 / -1; }

        .form-grupo label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-grupo input,
        .form-grupo select,
        .form-grupo textarea {
            padding: 9px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-xs);
            font-size: 12px;
            background: #f8fafc;
            transition: var(--transition);
            font-family: inherit;
            width: 100%;
        }

        .form-grupo input:focus,
        .form-grupo select:focus,
        .form-grupo textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.06);
            background: #fff;
        }

        .form-grupo textarea { resize: vertical; min-height: 50px; }

        .form-grupo-check {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 18px;
        }

        .form-grupo-check label {
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: none;
            color: var(--text);
        }

        .form-grupo-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .form-grupo-file {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-grupo-file input[type="file"] {
            padding: 7px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-xs);
            background: var(--bg);
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }

        .logo-preview {
            width: 70px;
            height: 70px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: var(--bg);
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ========== FORMULARIO COLAPSABLE ========== */
        .formulario-colapsable {
            display: none;
            margin-top: 12px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .formulario-colapsable.visible { display: block; }

        /* ========== BOTONES ========== */
        .btn {
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
        }

        .btn-primario { background: var(--primary); color: #fff; }
        .btn-primario:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-xs { padding: 3px 8px; font-size: 8px; border-radius: 20px; }
        .btn-sm { padding: 5px 12px; font-size: 9px; }

        /* ========== TABLAS ========== */
        .tabla-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 600px;
        }

        thead { background: #f8fafc; }

        th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-secondary);
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }

        tbody tr:hover { background: #f8fafc; }

        /* ========== BADGES ========== */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
        }

        .badge-activo { background: #d1fae5; color: #065f46; }
        .badge-vencido { background: #fee2e2; color: #991b1b; }
        .badge-suspendido { background: #fef3c7; color: #92400e; }
        .badge-prueba { background: #dbeafe; color: #1e40af; }
        .badge-gracia { background: #fef3c7; color: #92400e; animation: pulse 1.5s infinite; }
        .badge-nueva { background: #dbeafe; color: #1e40af; }
        .badge-cliente { background: #d1fae5; color: #065f46; }
        .badge-solicitud-plan { background: #ede9fe; color: #6d28d9; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ========== ALERTAS ========== */
        .alerta {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 8px;
        }

        .alerta-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .alerta-danger { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .alerta-info { background: #e0f2fe; border: 1px solid #bae6fd; color: #075985; }

        /* ========== BUSCADOR ========== */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 12px;
            background: #f8fafc;
        }

        .search-box input:focus { outline: none; border-color: var(--primary); }

        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: var(--text-secondary);
        }

        /* ========== GRÁFICO ========== */
        .chart-container {
            max-width: 100%;
            height: 280px;
            margin-top: 14px;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.activo { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px 20px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .toast.mostrar { opacity: 1; }
        .toast.exito { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }

        /* ========== BOTÓN MÓVIL ========== */
        .btn-menu-movil {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 200;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            font-size: 20px;
            color: #0f172a;
        }

        /* ========== SOLICITUD ITEM ========== */
        .solicitud-item {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            transition: var(--transition);
            background: var(--surface);
        }

        .solicitud-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.abierto { transform: translateX(0); }
            .btn-menu-movil { display: flex; }
            .contenido { margin-left: 0; width: 100%; padding: 14px 10px; padding-top: 55px; }
            .resumen { grid-template-columns: repeat(2, 1fr); }
            .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            table { min-width: 450px; font-size: 10px; }
            th, td { padding: 6px 8px; }
        }

        @media (max-width: 500px) {
            .resumen { grid-template-columns: 1fr; }
            .seccion { padding: 14px 12px; }
            .btn { padding: 8px 14px; font-size: 10px; }
            .btn-xs { padding: 2px 6px; font-size: 7px; }
            .topbar h1 { font-size: 18px; }
            table { min-width: 380px; font-size: 9px; }
            .solicitud-item { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    SIDEBAR OVERLAY
    ========================================== -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- ==========================================
    BOTÓN MENÚ MÓVIL
    ========================================== -->
    <button class="btn-menu-movil" onclick="toggleSidebar()">☰</button>

    <!-- ==========================================
    SIDEBAR
    ========================================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-cuadro" id="sidebar-icono">🏝️</div>
            <h2>Isla<span>Market</span></h2>
        </div>
        <nav class="sidebar-nav">
            <a class="activo" onclick="navegar('dashboard', this)">
                <span class="icono-nav">📊</span> Dashboard
            </a>
            <a onclick="navegar('solicitudes', this)">
                <span class="icono-nav">📩</span> Solicitudes
                <span class="sidebar-badge" id="badge-solicitudes" style="display:none;">0</span>
            </a>
            <a onclick="navegar('plantillas', this)">
                <span class="icono-nav">🏗️</span> Plantillas
            </a>
            <a onclick="navegar('clientes', this)">
                <span class="icono-nav">👥</span> Clientes
                <span class="sidebar-badge" id="badge-vencidos" style="display:none;">0</span>
            </a>
            <a onclick="navegar('pagos', this)">
                <span class="icono-nav">💰</span> Suscripciones
            </a>
            <a onclick="navegar('vitrina', this)">
                <span class="icono-nav">⭐</span> Vitrina
            </a>
            <a onclick="navegar('categorias', this)">
                <span class="icono-nav">📂</span> Categorías
            </a>
            <a onclick="navegar('reportes', this)">
                <span class="icono-nav">📈</span> Reportes
            </a>
            <a onclick="navegar('config', this)">
                <span class="icono-nav">⚙️</span> Configuración
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-sidebar" onclick="toggleDarkMode()">🌓 Modo Oscuro</button>
            <button class="btn-sidebar" onclick="window.open('index.html','_blank')">🌐 Ver Vitrina</button>
            <button class="btn-sidebar" onclick="backupDatos()">📥 Backup</button>
            <button class="btn-sidebar btn-sidebar-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
        </div>
    </aside>

    <!-- ==========================================
    CONTENIDO PRINCIPAL
    ========================================== -->
    <main class="contenido" id="contenido-principal"></main>

    <!-- ==========================================
    MODAL DE CONFIRMACIÓN
    ========================================== -->
    <div class="modal-overlay" id="modal-confirmar">
        <div class="modal" id="modal-contenido-confirmar">
            <div style="text-align:center;">
                <div style="font-size:36px;margin-bottom:8px;">⚠️</div>
                <h3 id="modal-titulo">¿Estás seguro?</h3>
                <div id="modal-texto"></div>
                <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;">
                    <button class="btn btn-danger btn-sm" id="modal-btn-si">Confirmar</button>
                    <button class="btn btn-outline btn-sm" onclick="cerrarModalConfirmar()">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    TOAST
    ========================================== -->
    <div class="toast" id="toast"></div>

    <!-- ==========================================
    SCRIPT PRINCIPAL
    ========================================== -->
    <script>
        // ==========================================
        // STORAGE KEYS
        // ==========================================
        var K = {
            PLANTILLAS: 'central_plantillas',
            CLIENTES: 'central_clientes',
            CATEGORIAS: 'central_categorias',
            PAGOS: 'central_pagos',
            CONFIG: 'central_config',
            LOGS: 'central_logs',
            SOLICITUDES: 'central_solicitudes'
        };

        // ==========================================
        // DATOS INICIALES
        // ==========================================
        if (!localStorage.getItem(K.PLANTILLAS)) {
            localStorage.setItem(K.PLANTILLAS, JSON.stringify([
                { id: 1, nombre: 'Pizzería', emoji: '🍕', descripcion: 'Tienda de pizzas con pedidos online', tags: 'Menú digital, Pedidos, Domicilio', urlTienda: 'pizzeria.html', urlAdmin: 'admin-pizzeria.html', urlDemo: 'demo-pizzeria.html', color: '#ef4444', categoriaId: 1, disponible: true, destacada: false, orden: 1, imagen: '' },
                { id: 2, nombre: 'Agencia de Viajes', emoji: '🚌', descripcion: 'Reserva de pasajes y gestión de rutas', tags: 'Reservas, Rutas, Calendario', urlTienda: 'agencia.html', urlAdmin: 'admin-agencia.html', urlDemo: 'demo-agencia.html', color: '#e63946', categoriaId: 2, disponible: true, destacada: false, orden: 2, imagen: '' }
            ]));
        }

        if (!localStorage.getItem(K.CATEGORIAS)) {
            localStorage.setItem(K.CATEGORIAS, JSON.stringify([
                { id: 1, nombre: 'Restaurantes y Comida', emoji: '🍕', orden: 1, destacada: true },
                { id: 2, nombre: 'Viajes y Transporte', emoji: '🚌', orden: 2, destacada: false },
                { id: 3, nombre: 'Tiendas y Comercio', emoji: '🛍️', orden: 3, destacada: false },
                { id: 4, nombre: 'Servicios', emoji: '🔧', orden: 4, destacada: false }
            ]));
        }

        if (!localStorage.getItem(K.CLIENTES)) localStorage.setItem(K.CLIENTES, '[]');
        if (!localStorage.getItem(K.PAGOS)) localStorage.setItem(K.PAGOS, '[]');
        if (!localStorage.getItem(K.LOGS)) localStorage.setItem(K.LOGS, '[]');
        if (!localStorage.getItem(K.SOLICITUDES)) localStorage.setItem(K.SOLICITUDES, '[]');

        if (!localStorage.getItem(K.CONFIG)) {
            localStorage.setItem(K.CONFIG, JSON.stringify({
                nombrePlataforma: 'IslaMarket',
                emoji: '🏝️',
                logo: '',
                email: '',
                telefono: '',
                whatsapp: '',
                planPrecio: 15000,
                planDescuentoEfectivo: 15,
                planTasa: 365,
                planCaracteristicas: ['✓ 1 tienda activa', '✓ Hasta 50 productos', '✓ Panel de administración fácil', '✓ Sin necesidad de programación', '✓ Soporte por email', '✓ Estadísticas básicas'],
                planNota: '💡 Paga en efectivo y ahorra un 15%',
                diasPrueba: 7,
                maxPruebasGratuitas: 5,
                mensajeSinPruebas: 'Todos nuestros espacios de prueba están ocupados. Pronto habrá nuevas plazas.',
                modoMantenimiento: false
            }));
        }

        // ==========================================
        // VARIABLES GLOBALES
        // ==========================================
        var chartIngresos = null;
        var callbackConfirmar = null;
        var filtroEstadoActual = 'todos';
        var filtroPagosEstado = 'todos';

        // ==========================================
        // FUNCIONES GENERALES
        // ==========================================

        /** Alternar modo oscuro */
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('adminDarkMode', document.body.classList.contains('dark-mode'));
        }

        // Cargar preferencia de modo oscuro
        if (localStorage.getItem('adminDarkMode') === 'true') document.body.classList.add('dark-mode');

        /** Mostrar notificación toast */
        function toast(mensaje, tipo) {
            var el = document.getElementById('toast');
            el.textContent = mensaje;
            el.className = 'toast mostrar ' + (tipo || 'exito');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        /** Registrar actividad en logs */
        function registrarLog(accion, detalles) {
            var logs = JSON.parse(localStorage.getItem(K.LOGS)) || [];
            logs.unshift({ fecha: new Date().toISOString(), accion: accion, detalles: detalles });
            if (logs.length > 200) logs = logs.slice(0, 200);
            localStorage.setItem(K.LOGS, JSON.stringify(logs));
        }

        /** Alternar sidebar en móvil */
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('abierto');
            overlay.classList.toggle('activo', sidebar.classList.contains('abierto'));
        }

        /** Mostrar modal de confirmación */
        function confirmarAccion(titulo, texto, callback) {
            document.getElementById('modal-titulo').textContent = titulo;
            document.getElementById('modal-texto').innerHTML = '<p style="color:var(--text-secondary);font-size:12px;">' + texto + '</p>';
            document.getElementById('modal-btn-si').style.display = 'inline-flex';
            callbackConfirmar = callback;
            document.getElementById('modal-confirmar').classList.add('activo');
        }

        /** Mostrar modal con detalle */
        function mostrarDetalleModal(titulo, contenidoHTML) {
            document.getElementById('modal-titulo').textContent = titulo;
            document.getElementById('modal-texto').innerHTML = contenidoHTML;
            document.getElementById('modal-btn-si').style.display = 'none';
            document.getElementById('modal-confirmar').classList.add('activo');
        }

        /** Cerrar modal de confirmación */
        function cerrarModalConfirmar() {
            document.getElementById('modal-confirmar').classList.remove('activo');
            callbackConfirmar = null;
        }

        // Event listeners del modal
        document.getElementById('modal-btn-si').addEventListener('click', function() {
            if (callbackConfirmar) callbackConfirmar();
            cerrarModalConfirmar();
        });

        document.getElementById('modal-confirmar').addEventListener('click', function(e) {
            if (e.target === this) cerrarModalConfirmar();
        });

        /** Notificar a un cliente (guardar en sus notificaciones) */
        function notificarCliente(clienteId, texto) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var idx = clientes.findIndex(function(c) { return c.id === clienteId; });
            if (idx === -1) return;
            if (!clientes[idx].notificaciones) clientes[idx].notificaciones = [];
            clientes[idx].notificaciones.unshift({
                id: Date.now(),
                texto: texto,
                leida: false,
                fecha: new Date().toISOString()
            });
            if (clientes[idx].notificaciones.length > 20) clientes[idx].notificaciones = clientes[idx].notificaciones.slice(0, 20);
            localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
        }

        /** Mostrar/ocultar formulario colapsable */
        function toggleFormulario(id) {
            var el = document.getElementById(id);
            if (el) el.classList.toggle('visible');
        }

        // ==========================================
        // NAVEGACIÓN
        // ==========================================

        /** Navegar entre secciones */
        function navegar(seccion, el) {
            // Marcar activo en sidebar
            document.querySelectorAll('.sidebar-nav a').forEach(function(a) { a.classList.remove('activo'); });
            if (el) el.classList.add('activo');

            // Cerrar sidebar en móvil
            document.getElementById('sidebar').classList.remove('abierto');
            document.getElementById('sidebar-overlay').classList.remove('activo');

            // Limpiar y renderizar
            var contenido = document.getElementById('contenido-principal');
            contenido.innerHTML = '';

            switch (seccion) {
                case 'dashboard': renderDashboard(contenido); break;
                case 'solicitudes': renderSolicitudes(contenido); break;
                case 'plantillas': renderPlantillas(contenido); break;
                case 'clientes': renderClientes(contenido); break;
                case 'pagos': renderPagos(contenido); break;
                case 'vitrina': renderVitrina(contenido); break;
                case 'categorias': renderCategorias(contenido); break;
                case 'reportes': renderReportes(contenido); break;
                case 'config': renderConfig(contenido); break;
            }

            actualizarBadges();
        }

        /** Actualizar badges del sidebar */
        function actualizarBadges() {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var hoy = new Date();

            // Badge de vencidos
            var vencidos = clientes.filter(function(c) {
                return c.estado === 'activo' && c.fechaVencimiento && new Date(c.fechaVencimiento) < hoy;
            }).length;
            var badgeVencidos = document.getElementById('badge-vencidos');
            if (vencidos > 0) {
                badgeVencidos.textContent = vencidos;
                badgeVencidos.style.display = 'flex';
            } else {
                badgeVencidos.style.display = 'none';
            }

            // Badge de solicitudes nuevas
            var nuevas = solicitudes.filter(function(s) { return s.estado === 'nueva'; }).length;
            var badgeSolicitudes = document.getElementById('badge-solicitudes');
            if (nuevas > 0) {
                badgeSolicitudes.textContent = nuevas;
                badgeSolicitudes.style.display = 'flex';
            } else {
                badgeSolicitudes.style.display = 'none';
            }
        }

        // ==========================================
        // DASHBOARD
        // ==========================================

        /** Renderizar dashboard */
        function renderDashboard(contenido) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var logs = JSON.parse(localStorage.getItem(K.LOGS)) || [];
            var hoy = new Date();

            // KPIs
            var activos = clientes.filter(function(cl) { return cl.estado === 'activo'; });
            var vencidos = activos.filter(function(cl) {
                return cl.fechaVencimiento && new Date(cl.fechaVencimiento) < hoy;
            });
            var porVencer = activos.filter(function(cl) {
                if (!cl.fechaVencimiento) return false;
                var diff = (new Date(cl.fechaVencimiento) - hoy) / (1000 * 60 * 60 * 24);
                return diff <= 7 && diff >= 0;
            });
            var ingresosMes = pagos.filter(function(p) {
                var fp = new Date(p.fecha);
                return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear();
            }).reduce(function(s, p) { return s + p.monto; }, 0);

            var nuevasSolicitudes = solicitudes.filter(function(s) { return s.estado === 'nueva'; }).length;
            var totalSolicitudes = solicitudes.length;
            var solicitudesConvertidas = solicitudes.filter(function(s) { return s.estado === 'cliente'; }).length;
            var tasaConversion = totalSolicitudes > 0 ? Math.round((solicitudesConvertidas / totalSolicitudes) * 100) : 0;

            // Construir HTML
            var html = '';

            // Topbar
            html += '<div class="topbar">';
            html += '<h1>📊 Dashboard Central</h1>';
            html += '<span class="fecha">' + new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + '</span>';
            html += '</div>';

            // Tarjetas de resumen
            html += '<div class="resumen">';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">👥</div><div class="numero">' + activos.length + '</div><div class="etiqueta">Clientes Activos</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fee2e2;color:#ef4444;">⚠️</div><div class="numero">' + vencidos.length + '</div><div class="etiqueta">Vencidos</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">💰</div><div class="numero">$' + ingresosMes.toLocaleString() + '</div><div class="etiqueta">Ingresos del Mes</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📩</div><div class="numero">' + nuevasSolicitudes + '</div><div class="etiqueta">Solicitudes Nuevas</div></div>';
            html += '</div>';

            // Segunda fila de resumen
            html += '<div class="resumen" style="margin-top:-10px;">';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📊</div><div class="numero">' + tasaConversion + '%</div><div class="etiqueta">Tasa de Conversión</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">⏱️</div><div class="numero">' + (solicitudesConvertidas > 0 ? Math.round(solicitudes.filter(function(s) { return s.estado === 'cliente' && s.fechaConversion; }).reduce(function(a, b) { return a + Math.round((new Date(b.fechaConversion) - new Date(b.fecha)) / (1000 * 60 * 60 * 24)); }, 0) / solicitudesConvertidas) : 0) + ' días</div><div class="etiqueta">Tiempo Promedio</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">✅</div><div class="numero">' + solicitudesConvertidas + '</div><div class="etiqueta">Convertidas</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">📋</div><div class="numero">' + totalSolicitudes + '</div><div class="etiqueta">Total Solicitudes</div></div>';
            html += '</div>';

            // Alertas de próximos vencimientos
            if (porVencer.length > 0) {
                html += '<div class="seccion"><h2>🔔 Próximos Vencimientos (7 días)</h2>';
                porVencer.forEach(function(cl) {
                    var dias = Math.ceil((new Date(cl.fechaVencimiento) - hoy) / (1000 * 60 * 60 * 24));
                    html += '<div class="alerta alerta-warning"><span><strong>' + cl.nombre + '</strong> - Vence en ' + dias + ' días</span><button class="btn btn-warning btn-sm" onclick="renovarCliente(' + cl.id + ')">📅 Renovar</button></div>';
                });
                html += '</div>';
            }

            // Alertas de vencidos
            if (vencidos.length > 0) {
                html += '<div class="seccion"><h2>🚫 Clientes Vencidos</h2>';
                vencidos.forEach(function(cl) {
                    html += '<div class="alerta alerta-danger"><span><strong>' + cl.nombre + '</strong> - Venció: ' + new Date(cl.fechaVencimiento).toLocaleDateString() + '</span><div style="display:flex;gap:6px;"><button class="btn btn-success btn-sm" onclick="renovarCliente(' + cl.id + ')">📅 Renovar</button><button class="btn btn-outline btn-sm" onclick="suspenderCliente(' + cl.id + ')">⏸️ Suspender</button></div></div>';
                });
                html += '</div>';
            }

            // Actividad reciente
            html += '<div class="seccion"><h2>🔄 Actividad Reciente</h2>';
            var ultimosLogs = logs.slice(0, 5);
            if (ultimosLogs.length === 0) {
                html += '<p style="color:var(--text-secondary);font-size:12px;">No hay actividad reciente.</p>';
            } else {
                ultimosLogs.forEach(function(log) {
                    html += '<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">';
                    html += '<span><strong>' + log.accion + '</strong>: ' + log.detalles + '</span>';
                    html += '<span style="color:var(--text-secondary);">' + new Date(log.fecha).toLocaleString() + '</span>';
                    html += '</div>';
                });
            }
            html += '</div>';

            // Gráfico de ingresos
            html += '<div class="seccion"><h2>📈 Ingresos Mensuales</h2><div class="chart-container"><canvas id="chart-ingresos"></canvas></div></div>';

            contenido.innerHTML = html;
            drawChart();
        }

        /** Dibujar gráfico de ingresos */
        function drawChart() {
            if (typeof Chart === 'undefined') { setTimeout(drawChart, 1000); return; }

            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            var hoy = new Date();
            var labels = [];
            var data = [];

            for (var i = 5; i >= 0; i--) {
                var m = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
                labels.push(meses[m.getMonth()]);
                var total = pagos.filter(function(p) {
                    var fp = new Date(p.fecha);
                    return fp.getMonth() === m.getMonth() && fp.getFullYear() === m.getFullYear();
                }).reduce(function(s, p) { return s + p.monto; }, 0);
                data.push(total);
            }

            var canvas = document.getElementById('chart-ingresos');
            if (!canvas) return;
            if (chartIngresos) chartIngresos.destroy();

            chartIngresos = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ingresos ($)',
                        data: data,
                        backgroundColor: '#6366f1',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        /** Renovar cliente por 1 mes */
        function renovarCliente(id) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var idx = clientes.findIndex(function(c) { return c.id === id; });
            if (idx === -1) return;

            var nuevaFecha = new Date();
            nuevaFecha.setMonth(nuevaFecha.getMonth() + 1);
            clientes[idx].fechaVencimiento = nuevaFecha.toISOString().split('T')[0];
            clientes[idx].estado = 'activo';
            clientes[idx].enPeriodoGracia = false;
            localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));

            notificarCliente(id, '✅ Tu plan ha sido renovado por 1 mes más. ¡Gracias por confiar en nosotros!');
            registrarLog('Cliente renovado', clientes[idx].nombre);
            toast('✅ Cliente renovado por 1 mes', 'exito');
            navegar('dashboard', document.querySelector('.sidebar-nav a.activo'));
        }

        /** Suspender cliente */
        function suspenderCliente(id) {
            confirmarAccion('¿Suspender cliente?', 'No podrá usar su tienda hasta ser reactivado.', function() {
                var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
                var idx = clientes.findIndex(function(c) { return c.id === id; });
                if (idx !== -1) {
                    clientes[idx].estado = 'suspendido';
                    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
                    notificarCliente(id, '⚠️ Tu tienda ha sido suspendida. Contacta al administrador para más información.');
                }
                toast('⏸️ Cliente suspendido', 'exito');
                navegar('dashboard', document.querySelector('.sidebar-nav a.activo'));
            });
        }

        // ==========================================
        // SOLICITUDES
        // ==========================================

        /** Renderizar sección de solicitudes */
        function renderSolicitudes(contenido) {
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];

            var html = '';
            html += '<div class="topbar"><h1>📩 Solicitudes y Leads</h1></div>';

            // Estadísticas
            var nuevas = solicitudes.filter(function(s) { return s.estado === 'nueva'; }).length;
            var contactadas = solicitudes.filter(function(s) { return s.estado === 'contactada'; }).length;
            var enNegociacion = solicitudes.filter(function(s) { return s.estado === 'en_negociacion'; }).length;
            var convertidas = solicitudes.filter(function(s) { return s.estado === 'cliente'; }).length;

            html += '<div class="resumen" style="margin-bottom:20px;">';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">🆕</div><div class="numero">' + nuevas + '</div><div class="etiqueta">Nuevas</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">📞</div><div class="numero">' + contactadas + '</div><div class="etiqueta">Contactadas</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">🤝</div><div class="numero">' + enNegociacion + '</div><div class="etiqueta">Negociación</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">✅</div><div class="numero">' + convertidas + '</div><div class="etiqueta">Convertidas</div></div>';
            html += '</div>';

            // Filtros y buscador
            html += '<div class="seccion">';
            html += '<div class="filtros-chips">';
            html += '<button class="chip activo" onclick="filtrarSolicitudes(\'todas\', this)">📊 Todas</button>';
            html += '<button class="chip" onclick="filtrarSolicitudes(\'nueva\', this)">🆕 Nuevas</button>';
            html += '<button class="chip" onclick="filtrarSolicitudes(\'contactada\', this)">📞 Contactadas</button>';
            html += '<button class="chip" onclick="filtrarSolicitudes(\'en_negociacion\', this)">🤝 Negociación</button>';
            html += '<button class="chip" onclick="filtrarSolicitudes(\'cliente\', this)">✅ Clientes</button>';
            html += '<button class="chip" onclick="filtrarSolicitudes(\'cerrada\', this)">🔒 Cerradas</button>';
            html += '</div>';
            html += '<div class="search-box"><span class="search-icon">🔍</span><input id="buscar-solicitud" placeholder="Buscar por nombre, teléfono o email..." oninput="filtrarSolicitudesTexto()"></div>';
            html += '<div id="lista-solicitudes">' + renderListaSolicitudes(solicitudes, plantillas) + '</div>';
            html += '</div>';

            contenido.innerHTML = html;
        }

        /** Renderizar lista de solicitudes */
        function renderListaSolicitudes(solicitudes, plantillas) {
            if (solicitudes.length === 0) {
                return '<p style="text-align:center;color:var(--text-secondary);padding:40px;">📭 No hay solicitudes registradas</p>';
            }

            return solicitudes.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function(s) {
                var pl = plantillas.find(function(p) { return p.id === s.plantillaId; }) || {};
                var estados = {
                    'nueva': '<span class="badge badge-nueva">🆕 Nueva</span>',
                    'contactada': '<span class="badge badge-suspendido">📞 Contactada</span>',
                    'en_negociacion': '<span class="badge" style="background:#ede9fe;color:#5b21b6;">🤝 Negociación</span>',
                    'cliente': '<span class="badge badge-cliente">✅ Cliente</span>',
                    'cerrada': '<span class="badge" style="background:#e2e8f0;color:#475569;">🔒 Cerrada</span>'
                };

                var fecha = new Date(s.fecha);
                var fechaStr = fecha.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                var diasDesde = Math.round((new Date() - fecha) / (1000 * 60 * 60 * 24));

                if (s.tipoContacto === 'solicitud_plan') {
                    tipoBadge = ' <span class="badge badge-solicitud-plan">💲 Solicitud de plan</span>';
                }

                return '<div class="solicitud-item">' +
                    '<div class="solicitud-info">' +
                    '<strong>' + s.nombre + tipoBadge + '</strong>' +
                    '<div style="font-size:11px;color:var(--text-secondary);">' +
                    '<span>📞 ' + s.telefono + '</span>' +
                    (s.email ? ' <span>✉️ ' + s.email + '</span>' : '') +
                    ' <span>📅 ' + fechaStr + ' (' + diasDesde + ' días)</span>' +
                    (s.plantillaId ? ' <span>📦 ' + (pl.emoji || '') + ' ' + (pl.nombre || 'Plantilla') + '</span>' : '') +
                    (s.mesesContratados ? ' <span>📆 ' + s.mesesContratados + ' mes(es)</span>' : '') +
                    (s.metodoPago ? ' <span>💳 ' + s.metodoPago + '</span>' : '') +
                    '</div>' +
                    (s.mensaje ? '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">📝 ' + s.mensaje + '</div>' : '') +
                    '</div>' +
                    '<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">' +
                    (estados[s.estado] || '') +
                    (telefonoLimpio ? '<a href="https://wa.me/' + telefonoLimpio + '" target="_blank" class="btn btn-success btn-xs">💬</a>' : '') +
                    '<button class="btn btn-success btn-xs" onclick="cambiarEstadoSolicitud(' + s.id + ',\'contactada\')" title="Contactada">📞</button>' +
                    '<button class="btn btn-warning btn-xs" onclick="cambiarEstadoSolicitud(' + s.id + ',\'en_negociacion\')" title="Negociación">🤝</button>' +

        var filtroSolicitudEstado = 'todas';

        function filtrarSolicitudes(estado, el) {
            filtroSolicitudEstado = estado;
            document.querySelectorAll('.filtros-chips .chip').forEach(function(c) { c.classList.remove('activo'); });
            if (el) el.classList.add('activo');
            aplicarFiltrosSolicitudes();
        }

        function filtrarSolicitudesTexto() { aplicarFiltrosSolicitudes(); }

        function aplicarFiltrosSolicitudes() {
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
            var filtroTexto = (document.getElementById('buscar-solicitud')?.value || '').toLowerCase();
            var f = solicitudes;

            if (filtroSolicitudEstado !== 'todas') {
                f = f.filter(function(s) { return s.estado === filtroSolicitudEstado; });
            }
            if (filtroTexto) {
                f = f.filter(function(s) {
                    return s.nombre.toLowerCase().includes(filtroTexto) ||
                           s.telefono.includes(filtroTexto) ||
                           (s.email || '').toLowerCase().includes(filtroTexto);
                });
            }

            f.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            var container = document.getElementById('lista-solicitudes');
            if (container) container.innerHTML = renderListaSolicitudes(f, plantillas);
        }

        function cambiarEstadoSolicitud(id, nuevoEstado) {
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var idx = solicitudes.findIndex(function(s) { return s.id === id; });
            if (idx === -1) return;

            var estados = { 'contactada': '📞 Contactada', 'en_negociacion': '🤝 En negociación', 'cliente': '✅ Cliente', 'cerrada': '🔒 Cerrada' };
            solicitudes[idx].estado = nuevoEstado;
            if (nuevoEstado === 'cliente') solicitudes[idx].fechaConversion = new Date().toISOString();
            localStorage.setItem(K.SOLICITUDES, JSON.stringify(solicitudes));
            registrarLog('Estado de solicitud actualizado', 'ID: ' + id + ' → ' + nuevoEstado);
            toast('✅ Solicitud marcada como ' + (estados[nuevoEstado] || nuevoEstado), 'exito');
            aplicarFiltrosSolicitudes();
            actualizarBadges();
        }

        function convertirSolicitudEnCliente(id) {
            var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
            var idx = solicitudes.findIndex(function(s) { return s.id === id; });
            if (idx === -1) return;

            var s = solicitudes[idx];
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];

            var usuarioBase = s.nombre.toLowerCase().replace(/\s+/g, '');
            var usuario = usuarioBase;
            var contador = 1;
            while (clientes.find(function(c) { return c.usuario === usuario; })) {
                usuario = usuarioBase + contador;
                contador++;
            }

            var nuevoCliente = {
                id: Date.now(),
                nombre: s.nombre,
                dueno: s.nombre,
                usuario: usuario,
                contrasena: '123456',
                tipoCliente: 'prueba',
                estado: 'activo',
                diasPrueba: 7,
                fechaPruebaInicio: new Date().toISOString().split('T')[0],
                fechaPruebaFin: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                telefono: s.telefono || '',
                email: s.email || '',
                whatsapp: s.telefono || '',
                direccion: '',
                horario: '',
                instagram: '',
                facebook: '',
                destacado: false,
                nuevo: true,
                logo: '🏪',
                eslogan: '',
                portada: '',
                urlTienda: '',
                urlAdmin: '',
                accesoPanel: false,
                categoriaId: null,
                plan: 'Básico',
                precio: 10,
                notificaciones: [],
                metodoPago: '',
                pagosEstructurados: 1,
                fechasPago: [],
                montosPago: [],
                pagosRealizados: [],
                enPeriodoGracia: false
            };

            clientes.push(nuevoCliente);
            localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));

            solicitudes[idx].estado = 'cliente';
            solicitudes[idx].clienteId = nuevoCliente.id;
            solicitudes[idx].fechaConversion = new Date().toISOString();
            localStorage.setItem(K.SOLICITUDES, JSON.stringify(solicitudes));

            actualizarUsuariosLogin();
            notificarCliente(nuevoCliente.id, '🎉 ¡Bienvenido a Isla Market! Tu cuenta ha sido activada. Usuario: ' + usuario + ' | Contraseña: 123456');
            registrarLog('Solicitud convertida en cliente', s.nombre + ' → ' + usuario);
            toast('✅ ¡' + s.nombre + ' ahora es cliente! Usuario: ' + usuario + ' | Contraseña: 123456', 'exito');
            aplicarFiltrosSolicitudes();
            actualizarBadges();
        }

        function eliminarSolicitud(id) {
            confirmarAccion('¿Eliminar solicitud?', 'Esta acción no se puede deshacer.', function() {
                var solicitudes = JSON.parse(localStorage.getItem(K.SOLICITUDES)) || [];
                solicitudes = solicitudes.filter(function(s) { return s.id !== id; });

        function guardarPlantilla() {
            var nombre = document.getElementById('pl-nombre').value.trim();
            if (!nombre) { toast('⚠️ El nombre es obligatorio', 'error'); return; }

            var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
            var imagenPreview = document.getElementById('pl-imagen-preview');
            var imagenData = imagenPreview.querySelector('img') ? imagenPreview.querySelector('img').src : '';

            plantillas.push({
                id: Date.now(),
                nombre: nombre,
                emoji: document.getElementById('pl-emoji').value.trim() || '🏪',
                categoriaId: parseInt(document.getElementById('pl-categoria').value),
                urlTienda: document.getElementById('pl-url-tienda').value.trim(),
                urlAdmin: document.getElementById('pl-url-admin').value.trim(),
                urlDemo: document.getElementById('pl-url-demo').value.trim(),
                color: document.getElementById('pl-color').value,
                descripcion: document.getElementById('pl-desc').value.trim(),
                tags: document.getElementById('pl-tags').value.trim(),
                disponible: document.getElementById('pl-disponible').checked,
                destacada: document.getElementById('pl-destacada').checked,
                orden: parseInt(document.getElementById('pl-orden').value) || 1,
                imagen: imagenData
            });

            localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));
            toast('✅ Plantilla guardada correctamente', 'exito');
            registrarLog('Plantilla creada', nombre);
            renderPlantillas(document.getElementById('contenido-principal'));

        function editarPlantilla(id) {
            var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
            var p = plantillas.find(function(pl) { return pl.id === id; });
            if (!p) return;

            document.getElementById('pl-nombre').value = p.nombre;
            document.getElementById('pl-emoji').value = p.emoji;
            document.getElementById('pl-categoria').value = p.categoriaId;
            document.getElementById('pl-url-tienda').value = p.urlTienda;
            document.getElementById('pl-url-admin').value = p.urlAdmin;
            document.getElementById('pl-url-demo').value = p.urlDemo || '';
            document.getElementById('pl-color').value = p.color;
            document.getElementById('pl-desc').value = p.descripcion || '';
            document.getElementById('pl-tags').value = p.tags || '';
            document.getElementById('pl-disponible').checked = p.disponible;
            document.getElementById('pl-destacada').checked = p.destacada || false;
            document.getElementById('pl-orden').value = p.orden || 1;

            if (p.imagen) {
                document.getElementById('pl-imagen-preview').innerHTML = '<img src="' + p.imagen + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
            } else {
                document.getElementById('pl-imagen-preview').innerHTML = '📷';
            }

            // Quitar de la lista para evitar duplicados al guardar
            plantillas = plantillas.filter(function(pl) { return pl.id !== id; });
            localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));

            toggleFormulario('form-plantilla');
            toast('✏️ Editando: ' + p.nombre + '. Modifica los campos y haz clic en Guardar.', 'exito');
        }

        function duplicarPlantilla(id) {
            var plantillas = JSON.parse(localStorage.getItem(K.PLANTILLAS)) || [];
            var original = plantillas.find(function(p) { return p.id === id; });
            if (!original) return;

            var copia = JSON.parse(JSON.stringify(original));
            copia.id = Date.now();
            copia.nombre = original.nombre + ' (Copia)';
            copia.disponible = true;
            plantillas.push(copia);
            localStorage.setItem(K.PLANTILLAS, JSON.stringify(plantillas));
            toast('📋 Plantilla duplicada correctamente', 'exito');
            renderPlantillas(document.getElementById('contenido-principal'));
        }

        function togglePagosEstructurados() {
            var num = parseInt(document.getElementById('cl-pagos-estructurados').value) || 1;
            var container = document.getElementById('fechas-pago-container');
            if (!container) return;

            var fechaInicio = document.getElementById('cl-fecha-inicio-alquiler').value || new Date().toISOString().split('T')[0];
            var html = '';
            for (var i = 0; i < num; i++) {
                var f = new Date(fechaInicio);
                f.setDate(f.getDate() + (i * Math.floor(30 / num)));
                html += '<div class="form-grupo"><label>Pago ' + (i + 1) + ' - Fecha</label><input type="date" id="cl-fecha-pago-' + i + '" value="' + f.toISOString().split('T')[0] + '"></div>';
                html += '<div class="form-grupo"><label>Pago ' + (i + 1) + ' - Monto ($)</label><input type="number" id="cl-monto-pago-' + i + '" value="' + Math.round((parseFloat(document.getElementById('cl-precio-mensual') ? document.getElementById('cl-precio-mensual').value : 10) || 10) / num) + '" step="0.01"></div>';

        function renderFilasClientes(datos) {
            var hoy = new Date();
            if (datos.length === 0) return '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-secondary);">No se encontraron clientes.</td></tr>';

            return datos.map(function(cl) {
                var tipoMostrar = '';
                var estadoBadge = '';
                var claseFila = '';

                if (cl.tipoCliente === 'prueba' || !cl.tipoCliente) {
                    tipoMostrar = '🧪 Prueba';
                    if (cl.fechaPruebaFin) {
                        var diasRestantes = Math.ceil((new Date(cl.fechaPruebaFin) - hoy) / (1000 * 60 * 60 * 24));
                        if (diasRestantes <= 0) {
                            estadoBadge = '<span class="badge badge-vencido">⏰ Vencida</span>';
                            claseFila = 'style="background:#fef2f2;"';
                        } else if (diasRestantes <= 3) {
                            estadoBadge = '<span class="badge badge-suspendido">🧪 ' + diasRestantes + 'd</span>';
                            claseFila = 'style="background:#fffbeb;"';
                        } else {
                            estadoBadge = '<span class="badge badge-prueba">🧪 ' + diasRestantes + 'd</span>';
                        }
                    }
                } else if (cl.tipoCliente === 'alquiler') {
                    tipoMostrar = '💰 Alquiler';
                    if (cl.estado === 'suspendido') {
                        estadoBadge = '<span class="badge badge-suspendido">⏸️ Suspendido</span>';
                        claseFila = 'style="background:#fffbeb;"';
                    } else if (cl.enPeriodoGracia) {
                        estadoBadge = '<span class="badge badge-gracia">🕐 Gracia</span>';
                    } else if (cl.fechaVencimiento && new Date(cl.fechaVencimiento) < hoy) {
                        estadoBadge = '<span class="badge badge-vencido">❌ Vencido</span>';
                        claseFila = 'style="background:#fef2f2;"';
                    } else {
                        estadoBadge = '<span class="badge badge-activo">✅ Activo</span>';
                    }
                }

                var logoHTML = cl.logo && cl.logo.startsWith('data:') ? '<img src="' + cl.logo + '" style="width:30px;height:30px;border-radius:6px;object-fit:cover;">' : (cl.logo || '🏪');

                return '<tr ' + claseFila + '>' +
                    '<td>' + logoHTML + '</td>' +
                    '<td><strong>' + cl.nombre + '</strong>' + (cl.eslogan ? '<br><small>' + cl.eslogan + '</small>' : '') + '</td>' +
                    '<td>' + tipoMostrar + '</td>' +
                    '<td><code>' + cl.usuario + '</code></td>' +
                    '<td>' + (cl.fechaVencimiento || cl.fechaPruebaFin || '—') + '</td>' +
                    '<td>' + estadoBadge + '</td>' +
                    '<td style="white-space:nowrap;">' +
                    '<button class="btn btn-outline btn-xs" onclick="verDetalleCliente(' + cl.id + ')">👁️</button> ' +
                    '<button class="btn btn-outline btn-xs" onclick="editarCliente(' + cl.id + ')">✏️</button> ' +
                    (cl.tipoCliente === 'prueba' || !cl.tipoCliente ?
                        '<button class="btn btn-success btn-xs" onclick="convertirAAlquiler(' + cl.id + ')">💰 Convertir</button> ' :
                        '<button class="btn btn-success btn-xs" onclick="renovarCliente(' + cl.id + ')">📅</button> ') +
                    '<button class="btn btn-danger btn-xs" onclick="eliminarCliente(' + cl.id + ')">🗑️</button>' +
                    '</td></tr>';
            }).join('');
        }

        function filtrarClientesEstado(estado, el) {
            filtroEstadoActual = estado;
            document.querySelectorAll('.filtros-chips .chip').forEach(function(chip) { chip.classList.remove('activo'); });
            if (el) el.classList.add('activo');
            aplicarFiltrosClientes();
        }

        function filtrarClientesTexto() { aplicarFiltrosClientes(); }

        function aplicarFiltrosClientes() {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var filtroTexto = (document.getElementById('buscar-cliente')?.value || '').toLowerCase();
            var hoy = new Date();
            var f = clientes;

            if (filtroEstadoActual === 'activo') {
                f = f.filter(function(c) { return c.estado === 'activo' && (!c.fechaVencimiento || new Date(c.fechaVencimiento) >= hoy); });
            } else if (filtroEstadoActual === 'vencido') {
                f = f.filter(function(c) { return c.estado === 'activo' && c.fechaVencimiento && new Date(c.fechaVencimiento) < hoy; });
            } else if (filtroEstadoActual === 'suspendido') {
                f = f.filter(function(c) { return c.estado === 'suspendido'; });
            }

            if (filtroTexto) {
                f = f.filter(function(c) {
                    return c.nombre.toLowerCase().includes(filtroTexto) ||
                           c.usuario.toLowerCase().includes(filtroTexto) ||
                           (c.dueno || '').toLowerCase().includes(filtroTexto);
                });
            }

            document.getElementById('tabla-clientes').innerHTML = renderFilasClientes(f);
        }

        function verDetalleCliente(id) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var cl = clientes.find(function(c) { return c.id === id; });
            if (!cl) return;

            var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
            var cat = categorias.find(function(c) { return c.id === cl.categoriaId; }) || {};
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var pagosCliente = pagos.filter(function(p) { return p.clienteId === id; }).sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            var html = '<div style="text-align:left;font-size:13px;line-height:1.8;">';
            html += '<h3 style="font-size:18px;font-weight:800;">' + cl.nombre + '</h3>';
            html += '<p><strong>👤 Dueño:</strong> ' + (cl.dueno || '—') + '</p>';
            html += '<p><strong>📞 Tel:</strong> ' + (cl.telefono || '—') + ' | <strong>✉️:</strong> ' + (cl.email || '—') + '</p>';
            html += '<p><strong>👤 Usuario:</strong> <code>' + cl.usuario + '</code> | <strong>🔑:</strong> <code>' + cl.contrasena + '</code></p>';
            html += '<p><strong>🏷️ Tipo:</strong> ' + (cl.tipoCliente === 'alquiler' ? '💰 Alquiler' : '🧪 Prueba') + '</p>';
            html += '<p><strong>💳 Método de pago:</strong> ' + (cl.metodoPago || '—') + '</p>';
            html += '<p><strong>📅 Inicio:</strong> ' + (cl.fechaInicio || cl.fechaPruebaInicio || '—') + ' | <strong>Vence:</strong> ' + (cl.fechaVencimiento || cl.fechaPruebaFin || '—') + '</p>';
            html += '<p><strong>🕐 Período de gracia:</strong> ' + (cl.enPeriodoGracia ? 'Sí' : 'No') + '</p>';
            html += '<p><strong>🔧 Panel Tienda:</strong> ' + (cl.accesoPanel ? '✅ Sí' : '❌ No') + '</p>';
            if (cl.urlTienda) html += '<p><strong>🌐 Tienda:</strong> <a href="' + cl.urlTienda + '" target="_blank">' + cl.urlTienda + '</a></p>';
            if (cl.urlAdmin) html += '<p><strong>🔧 Panel:</strong> <a href="' + cl.urlAdmin + '" target="_blank">' + cl.urlAdmin + '</a></p>';
            html += '<hr style="margin:10px 0;">';
            html += '<p><strong>💰 Historial de Pagos (' + pagosCliente.length + '):</strong></p>';
            if (pagosCliente.length === 0) {
                html += '<p style="color:var(--text-secondary);">Sin pagos registrados.</p>';
            } else {
                html += pagosCliente.slice(0, 15).map(function(p) {
                    return '<p style="font-size:11px;">' + p.fecha + ' - $' + p.monto.toFixed(2) + ' (' + (p.estado || '—') + ') ' + (p.notas || '') + '</p>';
                }).join('');
            }
            html += '</div>';

            mostrarDetalleModal('👁️ Detalle del Cliente', html);
        }

        function guardarCliente() {
            var nombre = document.getElementById('cl-nombre').value.trim();
            var usuario = document.getElementById('cl-usuario').value.trim().toLowerCase();
            var editandoId = document.getElementById('btn-guardar-cliente').getAttribute('data-editando');

            if (!nombre || !usuario) { toast('⚠️ Nombre y usuario son obligatorios', 'error'); return; }

            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];

            var previewLogo = document.getElementById('cl-logo-preview');
            var logoData = previewLogo.querySelector('img') ? previewLogo.querySelector('img').src : (previewLogo.textContent.trim() || '🏪');

            var previewPortada = document.getElementById('cl-portada-preview');
            var portadaData = previewPortada.querySelector('img') ? previewPortada.querySelector('img').src : '';

            var tipoCliente = document.getElementById('cl-tipo-cliente').value;
            var accesoPanel = document.getElementById('cl-acceso-panel').checked;
            var diasPrueba = parseInt(document.getElementById('cl-dias-prueba').value) || 7;
            var fechaPruebaInicio = document.getElementById('cl-fecha-prueba-inicio').value || new Date().toISOString().split('T')[0];
            var fechaPruebaFin = new Date(fechaPruebaInicio);
            fechaPruebaFin.setDate(fechaPruebaFin.getDate() + diasPrueba);

            var metodoPago = document.getElementById('cl-metodo-pago') ? document.getElementById('cl-metodo-pago').value : 'efectivo_cup';
            var pagosEstructurados = parseInt(document.getElementById('cl-pagos-estructurados') ? document.getElementById('cl-pagos-estructurados').value : 1) || 1;
            var fechasPago = [], montosPago = [];

            if (tipoCliente === 'alquiler') {
                for (var i = 0; i < pagosEstructurados; i++) {
                    fechasPago.push((document.getElementById('cl-fecha-pago-' + i) || {}).value || '');
                    montosPago.push(parseFloat((document.getElementById('cl-monto-pago-' + i) || {}).value) || 0);

            var enPeriodoGracia = document.getElementById('cl-periodo-gracia') ? document.getElementById('cl-periodo-gracia').checked : false;

                var idx = clientes.findIndex(function(c) { return c.id === parseInt(editandoId); });

                    clientes[idx].nombre = nombre;
                    clientes[idx].dueno = document.getElementById('cl-dueno').value.trim();

                    clientes[idx].diasPrueba = diasPrueba;
