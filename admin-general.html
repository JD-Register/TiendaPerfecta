<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel de Administración | Isla Market</title>
    <script>
        var cdns=['https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js'];
        var intento=0;
        function cargarChart(){if(intento>=cdns.length)return;var s=document.createElement('script');s.src=cdns[intento];s.onload=function(){window._chartCargado=true;};s.onerror=function(){intento++;setTimeout(cargarChart,500);};document.head.appendChild(s);}
        cargarChart();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root{
            --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
            --bg:#f8fafc; --surface:#ffffff; --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0;
            --success:#059669; --success-bg:#ecfdf5; --success-text:#065f46;
            --warning:#d97706; --warning-bg:#fffbeb; --warning-text:#92400e;
            --danger:#dc2626; --danger-bg:#fef2f2; --danger-text:#991b1b;
            --info:#2563eb; --info-bg:#eff6ff; --info-text:#1e40af;
            --wa-green:#25d366; --phone-blue:#2563eb;
            --sidebar-bg:#0f172a; --sidebar-hover:#1e293b; --sidebar-text:#94a3b8;
            --radius:12px; --radius-sm:8px; --radius-xs:6px;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(79,70,229,0.1);
            --transition:0.2s ease;
        }
        .dark-mode{
            --bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;
            --primary-light:#1e1b4b;
            --success-bg:#064e3b;--success-text:#a7f3d0;
            --warning-bg:#78350f;--warning-text:#fde68a;
            --danger-bg:#7f1d1d;--danger-text:#fecaca;
            --info-bg:#1e3a5f;--info-text:#bfdbfe;
            --shadow-md:0 4px 12px rgba(0,0,0,0.3);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px;line-height:1.5;transition:background 0.3s,color 0.3s;}
        img{max-width:100%;height:auto;}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:99;}
        .sidebar-overlay.activo{display:block;}
        .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;height:100dvh;background:var(--sidebar-bg);z-index:100;display:flex;flex-direction:column;transition:transform 0.25s;flex-shrink:0;}
        .sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:8px;}
        .sidebar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
        .sidebar-title{font-size:15px;font-weight:700;color:#fff;line-height:1.2;}
        .sidebar-title span{display:block;font-size:10px;font-weight:500;color:#818cf8;}
        .sidebar-nav{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 8px;overflow-y:auto;}
        .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--sidebar-text);text-decoration:none;font-weight:500;font-size:13px;transition:var(--transition);cursor:pointer;position:relative;white-space:nowrap;border-left:3px solid transparent;}
        .sidebar-nav a:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .sidebar-nav a.activo{background:var(--primary);color:#fff;border-left-color:#7c3aed;}
        .sidebar-nav a svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        .badge-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--danger);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
        .sidebar-footer{border-top:1px solid rgba(255,255,255,0.1);padding:10px 8px;display:flex;flex-direction:column;gap:2px;}
        .btn-sidebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:none;border:none;color:var(--sidebar-text);cursor:pointer;font-weight:500;font-size:12px;transition:var(--transition);width:100%;text-align:left;font-family:inherit;border-left:3px solid transparent;}
        .btn-sidebar:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .btn-sidebar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
        .btn-sidebar-logout{color:#fca5a5!important;border-top:1px solid rgba(255,255,255,0.1);margin-top:4px;padding-top:10px;}
        .btn-menu-movil{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
        .btn-menu-movil svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;}
        .contenido{margin-left:240px;flex:1;padding:24px;width:calc(100% - 240px);min-width:0;min-height:100vh;}
        .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
        .topbar h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
        .topbar .fecha{color:var(--text-muted);font-size:13px;font-weight:500;}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
        .stat-card{background:var(--surface);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--border);border-left:3px solid var(--primary);box-shadow:var(--shadow-sm);transition:var(--transition);}
        .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
        .stat-card:nth-child(2){border-left-color:var(--danger);}
        .stat-card:nth-child(3){border-left-color:var(--success);}
        .stat-card:nth-child(4){border-left-color:var(--warning);}
        .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:6px;}
        .stat-value{font-size:24px;font-weight:700;color:var(--text);}
        .seccion{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border);border-top:2px solid var(--primary);box-shadow:var(--shadow-sm);}
        .seccion-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
        .seccion-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
        .seccion-title svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;}
        .badge-success{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success);}
        .badge-warning{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning);}
        .badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger);}
        .badge-info{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info);}
        .badge-neutral{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
        .badge-primary{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);}
        .badge-vip{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;}
        .badge-urgente{background:var(--danger);color:#fff;animation:pulse 1s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.7;}}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent;transition:var(--transition);font-family:inherit;white-space:nowrap;text-decoration:none;}
        .btn svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;}
        .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
        .btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);}
        .btn-outline{background:transparent;border-color:var(--primary);color:var(--primary);}
        .btn-outline:hover{background:var(--primary-light);}
        .btn-success{background:var(--success);color:#fff;border-color:var(--success);}
        .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
        .btn-danger:hover{background:var(--danger);color:#fff;}
        .btn-wa{background:var(--wa-green);color:#fff;}
        .btn-wa svg{fill:currentColor;stroke:none;}
        .btn-tel{background:var(--phone-blue);color:#fff;}
        .btn-tel svg{fill:currentColor;stroke:none;}
        .btn-sm{padding:5px 10px;font-size:11px;}
        .btn-xs{padding:3px 8px;font-size:10px;border-radius:4px;}
        .btn-block{width:100%;justify-content:center;}
        .tabla-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);width:100%;}
        table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px;}
        thead{background:var(--primary-light);}
        th{text-align:left;padding:9px 12px;color:var(--primary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid var(--primary);white-space:nowrap;}
        td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tbody tr{transition:var(--transition);}
        tbody tr:hover{background:var(--primary-light);}
        .tabla-acciones{display:flex;gap:4px;flex-wrap:wrap;}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end;}
        .form-grupo{display:flex;flex-direction:column;min-width:0;}
        .form-grupo-full{grid-column:1/-1;}
        .form-grupo label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:4px;}
        .form-grupo input,.form-grupo select,.form-grupo textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--surface);transition:var(--transition);font-family:inherit;width:100%;color:var(--text);}
        .form-grupo input:focus,.form-grupo select:focus,.form-grupo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,0.1);}
        .form-grupo textarea{resize:vertical;min-height:50px;}
        .form-grupo-check{display:flex;align-items:center;gap:8px;padding-top:8px;}
        .form-grupo-check label{font-size:11px;font-weight:500;text-transform:none;cursor:pointer;}
        .form-grupo-check input[type="checkbox"]{width:15px;height:15px;cursor:pointer;accent-color:var(--primary);}
        .form-grupo-file input[type="file"]{padding:7px;border:1px dashed var(--primary);border-radius:var(--radius-xs);background:var(--primary-light);cursor:pointer;font-size:11px;}
        .logo-preview{width:60px;height:60px;border-radius:var(--radius-sm);border:2px solid var(--primary);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--primary-light);flex-shrink:0;}
        .logo-preview img{width:100%;height:100%;object-fit:contain;padding:4px;}
        .formulario-colapsable{display:none;margin-top:12px;padding-top:12px;border-top:2px solid var(--primary);}
        .formulario-colapsable.visible{display:block;}
        .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
        .chip{padding:6px 12px;border-radius:20px;font-weight:600;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:var(--transition);font-family:inherit;white-space:nowrap;}
        .chip:hover{border-color:var(--primary);color:var(--primary);}
        .chip.activo{background:var(--primary);color:#fff;border-color:var(--primary);}
        .search-box{position:relative;margin-bottom:12px;}
        .search-box input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);}
        .search-box input:focus{outline:none;border-color:var(--primary);}
        .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;}
        .alerta{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:12px;font-weight:500;flex-wrap:wrap;gap:8px;border:1px solid;border-left:4px solid;}
        .alerta-warning{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-text);border-left-color:var(--warning);}
        .alerta-danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text);border-left-color:var(--danger);}
        .alerta-info{background:var(--info-bg);border-color:var(--info);color:var(--info-text);border-left-color:var(--info);}
        .alerta-success{background:var(--success-bg);border-color:var(--success);color:var(--success-text);border-left-color:var(--success);}
        .dias-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
        .dia-chip{text-align:center;padding:5px 0;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:var(--transition);font-family:inherit;}
        .dia-chip:hover{border-color:var(--primary);color:var(--primary);}
        .dia-chip.seleccionado{background:var(--primary);color:#fff;border-color:var(--primary);}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:16px;}
        .modal-overlay.activo{display:flex;}
        .modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modalIn 0.25s ease;border:1px solid var(--primary);border-top:3px solid var(--primary);}
        @keyframes modalIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .modal h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--primary);}
        .modal-detalle{max-width:800px;}
        .detalle-seccion{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);border-left:3px solid var(--primary);}
        .detalle-seccion h4{font-size:11px;font-weight:700;margin-bottom:6px;color:var(--primary);text-transform:uppercase;}
        .detalle-seccion p{font-size:12px;margin-bottom:3px;}
        .detalle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
        .detalle-grid .item{background:var(--surface);border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border);}
        .detalle-grid .item .num{font-size:16px;font-weight:700;color:var(--primary);}
        .detalle-grid .item .lbl{font-size:9px;color:var(--text-muted);}
        .acciones-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
        .btn-accion{padding:7px 8px;border-radius:var(--radius-xs);font-weight:600;font-size:10px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:var(--transition);text-align:center;font-family:inherit;}
        .btn-accion:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
        .btn-accion.danger:hover{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
        .progress{width:100%;height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0;}
        .progress-fill{height:100%;border-radius:4px;transition:width 0.4s;}
        .contacto-botones{display:flex;gap:4px;flex-wrap:wrap;}
        .chart-container{max-width:100%;height:240px;margin-top:10px;position:relative;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;font-weight:600;font-size:13px;z-index:3000;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.2);max-width:90%;text-align:center;}
        .toast.mostrar{opacity:1;}
        .toast.exito{background:var(--success);color:#fff;}
        .toast.error{background:var(--danger);color:#fff;}
        .toast.info{background:var(--primary);color:#fff;}
        .etiqueta-select{display:flex;gap:4px;flex-wrap:wrap;}
        @media(max-width:1024px){.stats-grid{grid-template-columns:repeat(2,1fr);}.detalle-grid{grid-template-columns:repeat(2,1fr);}.acciones-grid{grid-template-columns:repeat(2,1fr);}}
        @media(max-width:900px){.sidebar{transform:translateX(-100%);}.sidebar.abierto{transform:translateX(0);}.btn-menu-movil{display:flex;}.contenido{margin-left:0;width:100%;padding:14px 10px;padding-top:56px;}}
        @media(max-width:600px){
            .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
            .stat-card{padding:12px;}
            .stat-value{font-size:17px;}
            .seccion{padding:14px 12px;}
            .form-grid{grid-template-columns:1fr;}
            .dias-grid{grid-template-columns:repeat(5,1fr);}
            .detalle-grid{grid-template-columns:1fr 1fr;}
            .acciones-grid{grid-template-columns:1fr 1fr;}
            .modal{padding:14px 10px;max-width:100%;}
            .tabla-wrap{border:none;overflow:visible;}
            table{min-width:auto;display:block;}
            thead{display:none;}
            tbody{display:block;}
            tr{display:block;margin-bottom:8px;border:1px solid var(--primary);border-radius:var(--radius-sm);padding:8px;border-left:3px solid var(--primary);}
            td{display:flex;justify-content:space-between;padding:5px 0;border:none;font-size:11px;}
            td::before{content:attr(data-label);font-weight:600;color:var(--primary);font-size:9px;text-transform:uppercase;margin-right:8px;flex-shrink:0;}
        }
        @media(max-width:400px){.stats-grid{grid-template-columns:1fr;}.acciones-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <button class="btn-menu-movil" onclick="toggleSidebar()"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">IM</div>
            <div class="sidebar-title">Isla Market<span>Panel Admin</span></div>
        </div>
        <nav class="sidebar-nav">
            <a class="activo" onclick="navegar('dashboard',this)"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>Dashboard</a>
            <a onclick="navegar('solicitudes',this)"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Solicitudes<span class="badge-count" id="badge-solicitudes" style="display:none;">0</span></a>
            <a onclick="navegar('soporte',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Soporte<span class="badge-count" id="badge-soporte" style="display:none;">0</span></a>
            <a onclick="navegar('plantillas',this)"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Plantillas</a>
            <a onclick="navegar('clientes',this)"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes<span class="badge-count" id="badge-vencidos" style="display:none;">0</span></a>
            <a onclick="navegar('pagos',this)"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Suscripciones</a>
            <a onclick="navegar('vitrina',this)"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>Vitrina<span class="badge-count" id="badge-no-publicados" style="display:none;">0</span></a>
            <a onclick="navegar('categorias',this)"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Categorías</a>
            <a onclick="navegar('reportes',this)"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Reportes</a>
            <a onclick="navegar('logs',this)"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>Actividad</a>

    <script>
        

        var K={PLANTILLAS:'central_plantillas',CLIENTES:'central_clientes',CATEGORIAS:'central_categorias',PAGOS:'central_pagos',CONFIG:'central_config',LOGS:'central_logs',SOLICITUDES:'central_solicitudes'};
        
        if(!localStorage.getItem(K.PLANTILLAS)){localStorage.setItem(K.PLANTILLAS,JSON.stringify([{id:1,nombre:'Pizzería',emoji:'🍕',descripcion:'Tienda de pizzas',tags:'Menú,Pedidos',urlTienda:'pizzalibre.html',urlAdmin:'admin-pizzalibre.html',urlDemo:'pizzalibre.html',color:'#ef4444',categoriaId:1,disponible:true,orden:1,imagen:''},{id:2,nombre:'Agencia de Viajes',emoji:'🚌',descripcion:'Reserva de pasajes',tags:'Reservas,Rutas',urlTienda:'agencia.html',urlAdmin:'admin-agencia.html',urlDemo:'agencia.html',color:'#e63946',categoriaId:2,disponible:true,orden:2,imagen:''}]));}
        if(!localStorage.getItem(K.CATEGORIAS)){localStorage.setItem(K.CATEGORIAS,JSON.stringify([{id:1,nombre:'Restaurantes',emoji:'🍕',orden:1},{id:2,nombre:'Viajes',emoji:'🚌',orden:2},{id:3,nombre:'Tiendas',emoji:'🛍️',orden:3},{id:4,nombre:'Servicios',emoji:'🔧',orden:4}]));}
        if(!localStorage.getItem(K.CLIENTES))localStorage.setItem(K.CLIENTES,'[]');
        if(!localStorage.getItem(K.PAGOS))localStorage.setItem(K.PAGOS,'[]');

        if(!localStorage.getItem(K.SOLICITUDES))localStorage.setItem(K.SOLICITUDES,'[]');
        if(!localStorage.getItem(K.CONFIG)){
            localStorage.setItem(K.CONFIG,JSON.stringify({
                nombrePlataforma:'IslaMarket',emoji:'🏝️',logo:'',email:'',telefono:'',whatsapp:'',
                planPrecio:16000,planDescuentoEfectivo:15,planTasa:365,
                diasPrueba:7,diasGracia:5,recordatorioDias:3,
                tasaCUP_USD:365,tasaActualizada:new Date().toISOString().split('T')[0],
                historialTasas:[{fecha:new Date().toISOString().split('T')[0],tasa:365}],
                mensajeBienvenida:'¡Bienvenido a Isla Market!',
                modoMantenimiento:false,adminUsuario:'admin',adminContrasena:'admin123'
            }));
        }
        (function(){var cfg=JSON.parse(localStorage.getItem(K.CONFIG))||{};var c=false;
            if(!cfg.tasaCUP_USD){cfg.tasaCUP_USD=cfg.planTasa||365;c=true;}
            if(!cfg.diasGracia){cfg.diasGracia=5;c=true;}
            if(!cfg.recordatorioDias){cfg.recordatorioDias=3;c=true;}
            if(!cfg.adminUsuario){cfg.adminUsuario='admin';c=true;}
            if(!cfg.adminContrasena){cfg.adminContrasena='admin123';c=true;}
            if(c)localStorage.setItem(K.CONFIG,JSON.stringify(cfg));
        })();
        
        var chartIngresos=null,callbackConfirmar=null,filtroEstadoActual='todos',filtroPagosEstado='todos',filtroSolicitudEstado='todas',filtroVitrinaEstado='todos',filtroSoporteEstado='todas',filtroSoportePrioridad='todas',filtroEtiqueta='todas';

        function obtenerTasaActual(){var cfg=JSON.parse(localStorage.getItem(K.CONFIG))||{};return cfg.tasaCUP_USD||365;}
        function obtenerConfig(){return JSON.parse(localStorage.getItem(K.CONFIG))||{};}
        function generarCuotas(precioBase,metodoPago,descuentoEfectivo,mesesContratados,pagosPorMes,diasPago,fechaInicio){
            var cuotas=[],montoPorPago=precioBase/pagosPorMes,fi=new Date(fechaInicio+'T00:00:00'),total=mesesContratados*pagosPorMes;
            for(var i=0;i<total;i++){
                var np=i%pagosPorMes,nm=Math.floor(i/pagosPorMes),dp=diasPago[np]||1;
                var fv=new Date(fi);fv.setMonth(fv.getMonth()+nm);
                fv.setDate(Math.min(dp,new Date(fv.getFullYear(),fv.getMonth()+1,0).getDate()));
                var ma=montoPorPago;
                if(np===pagosPorMes-1){var sa=0;for(var j=i-np;j<i;j++){if(cuotas[j])sa+=cuotas[j].montoEstimado;}ma=precioBase-sa;}
                cuotas.push({numero:i+1,fechaVencimiento:fv.toISOString().split('T')[0],montoEstimado:Math.round(ma*100)/100,montoReal:null,monedaReal:null,tasaUsada:null,pagado:false,fechaPago:null,comprobanteId:null,saldoPendiente:0,notas:'',recordatorioEnviado:false});
            }
            return cuotas;
        }
        function calcularMontoReal(montoEstimado,metodoPago,descuentoEfectivo,tasaDelDia){
            switch(metodoPago){
                case 'tarjeta_cup':return {monto:montoEstimado,moneda:'CUP',tasaUsada:null};
                case 'efectivo_cup':return {monto:Math.round(montoEstimado*(1-descuentoEfectivo/100)),moneda:'CUP',tasaUsada:null};
                case 'efectivo_usd':var usd=montoEstimado/tasaDelDia;return {monto:Math.round(usd*(1-descuentoEfectivo/100)*100)/100,moneda:'USD',tasaUsada:tasaDelDia};
                default:return {monto:montoEstimado,moneda:'CUP',tasaUsada:null};
            }
        }
        function toggleDarkMode(){document.body.classList.toggle('dark-mode');localStorage.setItem('adminDarkMode',document.body.classList.contains('dark-mode'));}
        if(localStorage.getItem('adminDarkMode')==='true')document.body.classList.add('dark-mode');
        function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast mostrar '+(t||'info');setTimeout(function(){el.className='toast';},3000);}
        function registrarLog(a,d){var logs=JSON.parse(localStorage.getItem(K.LOGS))||[];logs.unshift({fecha:new Date().toISOString(),accion:a,detalles:d});if(logs.length>500)logs=logs.slice(0,500);localStorage.setItem(K.LOGS,JSON.stringify(logs));}
        function toggleSidebar(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');s.classList.toggle('abierto');o.classList.toggle('activo',s.classList.contains('abierto'));}
        function confirmarAccion(tit,tex,cb){document.getElementById('modal-titulo').textContent=tit;document.getElementById('modal-texto').innerHTML='<p style="color:var(--text-muted);font-size:13px;">'+tex+'</p>';document.getElementById('modal-btn-si').style.display='inline-flex';callbackConfirmar=cb;document.getElementById('modal-confirmar').classList.add('activo');}
        function mostrarDetalleModal(tit,html){document.getElementById('modal-titulo').textContent=tit;document.getElementById('modal-texto').innerHTML=html;document.getElementById('modal-btn-si').style.display='none';document.getElementById('modal-confirmar').classList.add('activo');}
        function cerrarModalConfirmar(){document.getElementById('modal-confirmar').classList.remove('activo');callbackConfirmar=null;}
        document.getElementById('modal-btn-si').addEventListener('click',function(){if(callbackConfirmar)callbackConfirmar();cerrarModalConfirmar();});
        document.getElementById('modal-confirmar').addEventListener('click',function(e){if(e.target===this)cerrarModalConfirmar();});
        function notificarCliente(cid,txt){var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],idx=clientes.findIndex(function(c){return c.id===cid;});if(idx===-1)return;if(!clientes[idx].notificaciones)clientes[idx].notificaciones=[];clientes[idx].notificaciones.unshift({id:Date.now(),texto:txt,leida:false,fecha:new Date().toISOString()});if(clientes[idx].notificaciones.length>30)clientes[idx].notificaciones=clientes[idx].notificaciones.slice(0,30);localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));}
        function toggleFormulario(id){var el=document.getElementById(id);if(el)el.classList.toggle('visible');}
        function actualizarUsuariosLogin(){var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],ul={};clientes.forEach(function(c){if(c.usuario&&c.contrasena)ul[c.usuario]={contrasena:c.contrasena,pagina:c.urlAdmin};});localStorage.setItem('usuariosIslaMarket',JSON.stringify(ul));}

        function navegar(sec,el){
            document.querySelectorAll('.sidebar-nav a').forEach(function(a){a.classList.remove('activo');});
            if(el)el.classList.add('activo');
            document.getElementById('sidebar').classList.remove('abierto');
            document.getElementById('sidebar-overlay').classList.remove('activo');
            var c=document.getElementById('contenido-principal');
            c.innerHTML='';
            switch(sec){
                case'dashboard':renderDashboard(c);break;
                case'solicitudes':renderSolicitudes(c);break;
                case'soporte':renderSoporte(c);break;
                case'plantillas':renderPlantillas(c);break;
                case'clientes':renderClientes(c);break;
                case'pagos':renderPagos(c);break;
                case'vitrina':renderVitrina(c);break;
                case'categorias':renderCategorias(c);break;
                case'reportes':renderReportes(c);break;
                case'logs':renderLogs(c);break;
                case'config':renderConfig(c);break;
            }
            actualizarBadges();
            if(sec==='dashboard')verificarVencimientos();
        }

        function actualizarBadges(){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],solicitudes=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[],hoy=new Date();
            var v=0;
            clientes.forEach(function(c){if(c.estado==='activo'&&c.cuotas){c.cuotas.forEach(function(q){if(!q.pagado&&new Date(q.fechaVencimiento)<hoy)v++;});}});
            var bv=document.getElementById('badge-vencidos');bv.textContent=v;bv.style.display=v>0?'flex':'none';
            var sol=solicitudes.filter(function(s){return s.estado==='nueva'&&s.tipoContacto!=='soporte';}).length;
            var bs=document.getElementById('badge-solicitudes');bs.textContent=sol;bs.style.display=sol>0?'flex':'none';
            var sop=solicitudes.filter(function(s){return (s.estado==='nueva'||s.estado==='en_proceso')&&s.tipoContacto==='soporte';}).length;
            var bsp=document.getElementById('badge-soporte');bsp.textContent=sop;bsp.style.display=sop>0?'flex':'none';
            var np=clientes.filter(function(c){return c.tiendaCompleta&&!c.publicadoEnVitrina;}).length;
            var bnp=document.getElementById('badge-no-publicados');bnp.textContent=np;bnp.style.display=np>0?'flex':'none';
        }

        function verificarVencimientos(){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],hoy=new Date(),cambios=false,cfg=obtenerConfig();
            var diasGracia=cfg.diasGracia||5,recordatorioDias=cfg.recordatorioDias||3;
            clientes.forEach(function(cl){
                if(cl.tipoCliente!=='alquiler')return;
                var tieneCuotaVencida=false;
                if(cl.cuotas){cl.cuotas.forEach(function(q){if(!q.pagado&&new Date(q.fechaVencimiento+'T00:00:00')<hoy)tieneCuotaVencida=true;});}
                if(tieneCuotaVencida&&cl.estado==='activo'){
                    if(cl.graciaAutomatica&&!cl.enPeriodoGracia&&!cl.fechaInicioGracia){
                        cl.enPeriodoGracia=true;cl.fechaInicioGracia=hoy.toISOString();cambios=true;
                        notificarCliente(cl.id,'Tienes pagos vencidos. Período de gracia de '+diasGracia+' días activado.');
                        registrarLog('Gracia automática activada',cl.nombre);
                    }else if(!cl.graciaAutomatica&&!cl.enPeriodoGracia){
                        cl.estado='suspendido';cambios=true;
                        notificarCliente(cl.id,'Cuota vencida. Tienda suspendida.');
                        registrarLog('Cliente suspendido',cl.nombre);
                    }
                }
                if(cl.enPeriodoGracia&&cl.fechaInicioGracia){
                    var fg=new Date(cl.fechaInicioGracia);fg.setDate(fg.getDate()+diasGracia);
                    if(hoy>fg&&cl.estado==='activo'){cl.estado='suspendido';cl.enPeriodoGracia=false;cambios=true;notificarCliente(cl.id,'Período de gracia terminado. Tienda suspendida.');}
                }
                if(cl.cuotas&&cl.enPeriodoGracia){
                    var todasPagas=cl.cuotas.every(function(q){return q.pagado;});
                    if(todasPagas){cl.enPeriodoGracia=false;cl.fechaInicioGracia=null;cambios=true;}
                }
                if(cl.cuotas&&cl.estado==='activo'){
                    cl.cuotas.forEach(function(q){
                        if(!q.pagado&&!q.recordatorioEnviado){
                            var dias=Math.ceil((new Date(q.fechaVencimiento+'T00:00:00')-hoy)/(1000*60*60*24));
                            if(dias>=0&&dias<=recordatorioDias){
                                notificarCliente(cl.id,'Cuota #'+q.numero+' vence en '+dias+' día(s). Monto: $'+q.montoEstimado.toLocaleString());
                                q.recordatorioEnviado=true;cambios=true;
                            }
                        }
                    });
                }
            });
            if(cambios){localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));actualizarBadges();}
        }

        function marcarCuotaPagada(clienteId,cuotaIndex,monto,moneda,tasaUsada){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],idx=clientes.findIndex(function(c){return c.id===clienteId;});
            if(idx===-1||!clientes[idx].cuotas||!clientes[idx].cuotas[cuotaIndex])return;
            var q=clientes[idx].cuotas[cuotaIndex];
            if(q.pagado)return;
            q.pagado=true;q.montoReal=monto;q.monedaReal=moneda;q.tasaUsada=tasaUsada;q.fechaPago=new Date().toISOString().split('T')[0];q.recordatorioEnviado=true;
            var todasPagas=clientes[idx].cuotas.every(function(cu){return cu.pagado;});
            if(todasPagas){clientes[idx].enPeriodoGracia=false;clientes[idx].fechaInicioGracia=null;clientes[idx].estado='activo';}
            localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
            notificarCliente(clienteId,'Cuota #'+q.numero+' confirmada. Monto: $'+monto.toLocaleString()+' '+moneda);
            registrarLog('Pago confirmado','Cuota #'+q.numero+' de '+clientes[idx].nombre+' - $'+monto);
        }

        function btnWhatsApp(tel){return tel?'<a href="https://wa.me/'+tel.replace(/\+/g,'').replace(/\s/g,'')+'" target="_blank" class="btn btn-wa btn-xs"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg> WhatsApp</a>':'';}

        // ===== DASHBOARD =====
        function renderDashboard(c){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[],solicitudes=JSON.parse(localStorage.getItem(K.SOLICITUDES))||[],hoy=new Date();
            var activos=clientes.filter(function(cl){return cl.estado==='activo';});
            var suspendidos=clientes.filter(function(cl){return cl.estado==='suspendido';});
            var enGracia=clientes.filter(function(cl){return cl.enPeriodoGracia;});
            var vencidos=[],proximos=[],noPublicados=[];
            activos.forEach(function(cl){
                if(cl.cuotas){cl.cuotas.forEach(function(q){if(!q.pagado){var dias=Math.ceil((new Date(q.fechaVencimiento+'T00:00:00')-hoy)/(1000*60*60*24));if(dias<0)vencidos.push({cliente:cl,cuota:q});else if(dias<=7)proximos.push({cliente:cl,cuota:q,dias:dias});}});}
                if(cl.tiendaCompleta&&!cl.publicadoEnVitrina)noPublicados.push(cl);
            });
            var pendientesRevisar=pagos.filter(function(p){return p.estado==='Pendiente';});
            var ingresosMes=pagos.filter(function(p){var fp=new Date(p.fecha);return fp.getMonth()===hoy.getMonth()&&fp.getFullYear()===hoy.getFullYear()&&p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
            var proyeccion=clientes.filter(function(c){return c.tipoCliente==='alquiler'&&c.cuotas;}).reduce(function(s,c){return s+c.cuotas.filter(function(q){return!q.pagado;}).reduce(function(ss,q){return ss+q.montoEstimado;},0);},0);
            var tasaMorosidad=activos.length>0?Math.round((vencidos.length/activos.length)*100):0;
            
            var html='<div class="topbar"><h1>Dashboard</h1><span class="fecha">'+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div>';
            html+='<div class="stats-grid">';
            html+='<div class="stat-card"><div class="stat-label">Clientes Activos</div><div class="stat-value">'+activos.length+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Cuotas Vencidas</div><div class="stat-value" style="color:var(--danger);">'+vencidos.length+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Ingresos del Mes</div><div class="stat-value">$'+ingresosMes.toLocaleString()+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Proyección Pendiente</div><div class="stat-value">$'+proyeccion.toLocaleString()+'</div></div>';
            html+='</div>';

        function restaurarBackup(){

            input.onchange=function(e){
                var file=e.target.files[0];if(!file)return;
                var reader=new FileReader();

                    try{
                        var data=JSON.parse(ev.target.result);
                        if(data.plantillas)localStorage.setItem(K.PLANTILLAS,JSON.stringify(data.plantillas));
                        if(data.clientes)localStorage.setItem(K.CLIENTES,JSON.stringify(data.clientes));
                        if(data.categorias)localStorage.setItem(K.CATEGORIAS,JSON.stringify(data.categorias));
                        if(data.pagos)localStorage.setItem(K.PAGOS,JSON.stringify(data.pagos));

                        if(data.solicitudes)localStorage.setItem(K.SOLICITUDES,JSON.stringify(data.solicitudes));

        function actualizarInputDiasPago(){var sel=document.querySelectorAll('#dias-pago-grid .dia-chip.seleccionado');var dias=[];sel.forEach(function(b){dias.push(parseInt(b.dataset.dia));});dias.sort(function(a,b){return a-b;});document.getElementById('cl-dias-pago').value=dias.join(',');}
        function actualizarFechasPreview(){
            var container=document.getElementById('fechas-preview-container');if(!container)return;
            var ppm=parseInt(document.getElementById('cl-pagos-por-mes')?.value)||1;
            var meses=parseInt(document.getElementById('cl-meses-contratados')?.value)||1;
            var diasStr=document.getElementById('cl-dias-pago')?.value||'1';
            var diasPago=diasStr.split(',').map(function(d){return parseInt(d);});
            var fechaInicio=document.getElementById('cl-fecha-inicio-alquiler')?.value||new Date().toISOString().split('T')[0];
            var precioBase=parseFloat(document.getElementById('cl-precio-base')?.value)||obtenerConfig().planPrecio||16000;
            var totalCuotas=meses*ppm,montoPorPago=precioBase/ppm;
            var html='<div style="background:var(--success-bg);border:1px solid var(--success);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--success-text);"><strong>Calendario ('+totalCuotas+' pagos):</strong>';
            var fi=new Date(fechaInicio+'T00:00:00');
            for(var i=0;i<totalCuotas;i++){
                var np=i%ppm,nm=Math.floor(i/ppm),dp=diasPago[np]||1;
                var fv=new Date(fi);fv.setMonth(fv.getMonth()+nm);
                fv.setDate(Math.min(dp,new Date(fv.getFullYear(),fv.getMonth()+1,0).getDate()));
                var me=montoPorPago;
                if(np===ppm-1){var sa=0;for(var j=i-np;j<i;j++){sa+=montoPorPago;}me=precioBase-sa;}
                html+='<br>Pago '+(i+1)+': '+fv.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' - $'+Math.round(me).toLocaleString();
            }
            html+='</div>';
            container.innerHTML=html;
        }

        function aplicarFiltrosClientes(){

            if(filtroEstadoActual==='activo')r=r.filter(function(c){return c.estado==='activo';});
            else if(filtroEstadoActual==='vencido')r=r.filter(function(c){if(c.cuotas)return c.cuotas.some(function(q){return!q.pagado&&new Date(q.fechaVencimiento)<hoy;});return false;});
            else if(filtroEstadoActual==='suspendido')r=r.filter(function(c){return c.estado==='suspendido';});
            else if(filtroEstadoActual==='publicado')r=r.filter(function(c){return c.publicadoEnVitrina;});

        function verDetalleCliente(id){
            var cl=(JSON.parse(localStorage.getItem(K.CLIENTES))||[]).find(function(c){return c.id===id;});
            if(!cl)return;
            var cuotas=cl.cuotas||[];
            if(cuotas.length===0&&cl.tipoCliente==='alquiler'&&cl.fechaVencimiento){
                cuotas=[{numero:1,fechaVencimiento:cl.fechaVencimiento,montoEstimado:cl.precio||16000,montoReal:null,monedaReal:null,tasaUsada:null,pagado:false,fechaPago:null,comprobanteId:null}];
            }
            var totalCuotas=cuotas.length,pagadas=cuotas.filter(function(q){return q.pagado;}).length;
            var porcentaje=totalCuotas>0?Math.round((pagadas/totalCuotas)*100):0;
            var totalPagado=cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0);
            var totalPendiente=cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0);
            var html='<div style="font-size:13px;">';

            html+='<button class="chip" onclick="filtrarVitrina(\'publicado\',this)">Publicados</button>';
            html+='<button class="chip" onclick="filtrarVitrina(\'no_publicado\',this)">No publicados</button></div>';
            html+='<div class="tabla-wrap"><table><thead><tr><th>Negocio</th><th>Tienda</th><th>Vitrina</th><th>Acciones</th></tr></thead><tbody id="tabla-vitrina"></tbody></table></div></div>';
            c.innerHTML=html;renderFilasVitrina(clientes);
        }
        function renderFilasVitrina(datos){
            var tb=document.getElementById('tabla-vitrina');if(!tb)return;
            if(datos.length===0){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:20px;">No hay clientes.</td></tr>';return;}
            tb.innerHTML=datos.map(function(cl){
                var tienda=cl.tiendaCompleta?'<span class="badge badge-success">Completa</span>':'<span class="badge badge-warning">Pendiente</span>';
                var vitrina=cl.publicadoEnVitrina?'<span class="badge badge-success">Publicado</span>':'<span class="badge badge-neutral">Oculto</span>';
                return'<tr><td data-label="Negocio"><strong>'+cl.nombre+'</strong></td><td data-label="Tienda">'+tienda+'</td><td data-label="Vitrina">'+vitrina+'</td><td data-label="Acciones"><button class="btn btn-'+(cl.publicadoEnVitrina?'outline':'success')+' btn-xs" onclick="togglePublicarVitrina('+cl.id+')">'+(cl.publicadoEnVitrina?'Ocultar':'Publicar')+'</button></td></tr>';
            }).join('');
        }
        function togglePublicarVitrina(id){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],idx=clientes.findIndex(function(c){return c.id===id;});
            if(idx===-1)return;
            clientes[idx].publicadoEnVitrina=!clientes[idx].publicadoEnVitrina;
            localStorage.setItem(K.CLIENTES,JSON.stringify(clientes));
            if(clientes[idx].publicadoEnVitrina){notificarCliente(id,'Tu tienda ya es visible en la vitrina pública.');}
            toast(clientes[idx].publicadoEnVitrina?'Publicado':'Ocultado','exito');
            renderVitrina(document.getElementById('contenido-principal'));
            actualizarBadges();
        }
        function filtrarVitrina(e,el){filtroVitrinaEstado=e;document.querySelectorAll('.filtros .chip').forEach(function(c){c.classList.remove('activo');});if(el)el.classList.add('activo');var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],r=clientes;if(filtroVitrinaEstado==='publicado')r=r.filter(function(c){return c.publicadoEnVitrina;});else if(filtroVitrinaEstado==='no_publicado')r=r.filter(function(c){return !c.publicadoEnVitrina;});renderFilasVitrina(r);}

        // ===== CATEGORÍAS =====
        function renderCategorias(c){
            var cats=JSON.parse(localStorage.getItem(K.CATEGORIAS))||[];
            var html='<div class="topbar"><h1>Categorías</h1><button class="btn btn-primary btn-sm" onclick="toggleFormulario(\'form-cat\')">Nueva</button></div>';
            html+='<div class="formulario-colapsable" id="form-cat"><div class="seccion"><div class="form-grid">';
            html+='<div class="form-grupo"><label>Nombre</label><input id="cat-nombre"></div>';
            html+='<div class="form-grupo"><label>Emoji</label><input id="cat-emoji" value="📂"></div>';
            html+='<div class="form-grupo"><label>Orden</label><input type="number" id="cat-orden" value="1"></div>';
            html+='<button class="btn btn-primary" onclick="guardarCategoria()">Guardar</button></div></div></div>';
            html+='<div class="seccion">'+cats.sort(function(a,b){return a.orden-b.orden;}).map(function(cat){
                return'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);"><span>'+cat.emoji+' <strong>'+cat.nombre+'</strong></span><button class="btn btn-danger btn-xs" onclick="eliminarCategoria('+cat.id+')">Eliminar</button></div>';
            }).join('')+'</div>';
            c.innerHTML=html;
        }
        function guardarCategoria(){var n=document.getElementById('cat-nombre').value.trim();if(!n){toast('Nombre obligatorio','error');return;}var cats=JSON.parse(localStorage.getItem(K.CATEGORIAS))||[];cats.push({id:Date.now(),nombre:n,emoji:document.getElementById('cat-emoji').value.trim()||'📂',orden:parseInt(document.getElementById('cat-orden').value)||1});localStorage.setItem(K.CATEGORIAS,JSON.stringify(cats));toast('Guardada','exito');renderCategorias(document.getElementById('contenido-principal'));}
        function eliminarCategoria(id){confirmarAccion('Eliminar','',function(){var cats=JSON.parse(localStorage.getItem(K.CATEGORIAS))||[];cats=cats.filter(function(c){return c.id!==id;});localStorage.setItem(K.CATEGORIAS,JSON.stringify(cats));toast('Eliminada','exito');renderCategorias(document.getElementById('contenido-principal'));});}

        // ===== REPORTES =====
        function renderReportes(c){
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[],hoy=new Date();
            var total=pagos.filter(function(p){return p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
            var publicados=clientes.filter(function(c){return c.publicadoEnVitrina;}).length;
            var html='<div class="topbar"><h1>Reportes</h1><button class="btn btn-outline btn-sm" onclick="exportarPDFReporte()">Exportar PDF</button></div>';
            html+='<div class="stats-grid">';
            html+='<div class="stat-card"><div class="stat-label">Total Clientes</div><div class="stat-value">'+clientes.length+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Ingresos Totales</div><div class="stat-value">$'+total.toLocaleString()+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Publicados</div><div class="stat-value">'+publicados+'</div></div>';
            html+='</div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Ingresos Mensuales</span></div><div class="chart-container"><canvas id="chart-reportes"></canvas></div></div>';
            c.innerHTML=html;
            setTimeout(function(){
                if(typeof Chart==='undefined')return;
                var canvas=document.getElementById('chart-reportes');if(!canvas)return;
                var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],labels=[],data=[];
                for(var i=5;i>=0;i--){var m=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);labels.push(meses[m.getMonth()]);data.push(pagos.filter(function(p){var fp=new Date(p.fecha);return fp.getMonth()===m.getMonth()&&fp.getFullYear()===m.getFullYear()&&p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0));}
                new Chart(canvas.getContext('2d'),{type:'bar',data:{labels:labels,datasets:[{label:'$',data:data,backgroundColor:'#4f46e5',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
            },500);
        }
        function exportarPDFReporte(){
            if(typeof jspdf==='undefined'){toast('Error','error');return;}
            var clientes=JSON.parse(localStorage.getItem(K.CLIENTES))||[],pagos=JSON.parse(localStorage.getItem(K.PAGOS))||[];
            var total=pagos.filter(function(p){return p.estado==='Confirmado';}).reduce(function(s,p){return s+p.monto;},0);
            var doc=new jspdf.jsPDF('p','mm','a4');var y=15;
            doc.setFontSize(16);doc.setTextColor(79,70,229);doc.text('Isla Market - Reporte Ejecutivo',15,y);y+=8;
            doc.setFontSize(9);doc.setTextColor(100,116,139);doc.text('Generado: '+new Date().toLocaleString('es-ES'),15,y);y+=8;
            doc.setFontSize(11);doc.setTextColor(15,23,42);doc.text('RESUMEN',15,y);y+=6;doc.setFontSize(9);
            doc.text('Total Clientes: '+clientes.length,15,y);y+=5;
            doc.text('Ingresos Totales: $'+total.toLocaleString(),15,y);y+=5;
            doc.text('Publicados: '+clientes.filter(function(c){return c.publicadoEnVitrina;}).length,15,y);y+=8;
            doc.setFontSize(11);doc.text('CLIENTES',15,y);y+=6;doc.setFontSize(8);
            clientes.forEach(function(cl){doc.text(cl.nombre+' - '+(cl.tipoCliente==='alquiler'?'Alquiler':'Prueba')+' - '+cl.estado,15,y);y+=4;if(y>270){doc.addPage();y=20;}});
            doc.save('reporte_'+new Date().toISOString().split('T')[0]+'.pdf');
            toast('PDF descargado','exito');
        }

        // ===== LOGS =====
        function renderLogs(c){
            var logs=JSON.parse(localStorage.getItem(K.LOGS))||[];
            var html='<div class="topbar"><h1>Actividad</h1><button class="btn btn-outline btn-sm" onclick="limpiarLogs()">Limpiar</button></div><div class="seccion">';
            if(logs.length===0)html+='<p style="text-align:center;color:var(--text-muted);padding:20px;">Sin registros.</p>';
            else{html+='<div style="max-height:400px;overflow-y:auto;">';logs.slice(0,100).forEach(function(log){html+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;"><span><strong>'+log.accion+'</strong> - '+(log.detalles||'')+'</span><span style="color:var(--text-muted);">'+new Date(log.fecha).toLocaleString('es-ES')+'</span></div>';});html+='</div>';}
            html+='</div>';c.innerHTML=html;
        }
        function limpiarLogs(){confirmarAccion('Limpiar','',function(){localStorage.setItem(K.LOGS,'[]');toast('Limpio','exito');renderLogs(document.getElementById('contenido-principal'));});}

        // ===== CONFIGURACIÓN =====
        function renderConfig(c){
            var cfg=obtenerConfig();
            var html='<div class="topbar"><h1>Configuración</h1></div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Datos Generales</span></div><div class="form-grid">';
            html+='<div class="form-grupo"><label>Nombre</label><input id="cfg-nombre" value="'+(cfg.nombrePlataforma||'')+'"></div>';
            html+='<div class="form-grupo"><label>Email</label><input id="cfg-email" value="'+(cfg.email||'')+'"></div>';
            html+='<div class="form-grupo"><label>Teléfono</label><input id="cfg-telefono" value="'+(cfg.telefono||'')+'"></div>';
            html+='<div class="form-grupo"><label>WhatsApp</label><input id="cfg-whatsapp" value="'+(cfg.whatsapp||'')+'"></div>';
            html+='<div class="form-grupo form-grupo-full"><label>Mensaje de Bienvenida</label><input id="cfg-mensaje-bienvenida" value="'+(cfg.mensajeBienvenida||'')+'"></div></div></div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Credenciales Admin</span></div><div class="form-grid">';
            html+='<div class="form-grupo"><label>Usuario</label><input id="cfg-admin-usuario" value="'+(cfg.adminUsuario||'admin')+'"></div>';
            html+='<div class="form-grupo"><label>Contraseña</label><input type="password" id="cfg-admin-contrasena" value="'+(cfg.adminContrasena||'admin123')+'"></div></div></div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Tasa de Cambio</span></div><div class="form-grid">';
            html+='<div class="form-grupo"><label>Tasa CUP/USD</label><input type="number" id="cfg-tasa-cup-usd" value="'+(cfg.tasaCUP_USD||365)+'"></div>';
            html+='<div class="form-grupo"><label>Fecha</label><input type="date" id="cfg-tasa-fecha" value="'+(cfg.tasaActualizada||new Date().toISOString().split('T')[0])+'"></div></div></div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Plan y Precios</span></div><div class="form-grid">';
            html+='<div class="form-grupo"><label>Precio Mensual</label><input type="number" id="cfg-plan-precio" value="'+(cfg.planPrecio||16000)+'"></div>';
            html+='<div class="form-grupo"><label>Descuento Efectivo %</label><input type="number" id="cfg-plan-descuento" value="'+(cfg.planDescuentoEfectivo||15)+'"></div>';
            html+='<div class="form-grupo"><label>Días Prueba</label><input type="number" id="cfg-dias-prueba" value="'+(cfg.diasPrueba||7)+'"></div>';
            html+='<div class="form-grupo"><label>Días Gracia</label><input type="number" id="cfg-dias-gracia" value="'+(cfg.diasGracia||5)+'"></div>';
            html+='<div class="form-grupo"><label>Recordatorio días</label><input type="number" id="cfg-recordatorio-dias" value="'+(cfg.recordatorioDias||3)+'"></div>';
            html+='<div class="form-grupo-check"><input type="checkbox" id="cfg-modo-mantenimiento" '+(cfg.modoMantenimiento?'checked':'')+'><label>Modo Mantenimiento</label></div></div></div>';
            html+='<button class="btn btn-primary" onclick="guardarConfigManual()">Guardar</button>';
            c.innerHTML=html;
        }
        function guardarConfigManual(){
            var cfg=obtenerConfig();
            cfg.nombrePlataforma=document.getElementById('cfg-nombre').value.trim()||'IslaMarket';
            cfg.email=document.getElementById('cfg-email').value.trim();
            cfg.telefono=document.getElementById('cfg-telefono').value.trim();
            cfg.whatsapp=document.getElementById('cfg-whatsapp').value.trim();
            cfg.adminUsuario=document.getElementById('cfg-admin-usuario').value.trim()||'admin';
            cfg.adminContrasena=document.getElementById('cfg-admin-contrasena').value;
            cfg.planPrecio=parseFloat(document.getElementById('cfg-plan-precio').value)||16000;
            cfg.planDescuentoEfectivo=parseFloat(document.getElementById('cfg-plan-descuento').value)||15;
            cfg.diasPrueba=parseInt(document.getElementById('cfg-dias-prueba').value)||7;
            cfg.diasGracia=parseInt(document.getElementById('cfg-dias-gracia').value)||5;
            cfg.recordatorioDias=parseInt(document.getElementById('cfg-recordatorio-dias').value)||3;
            cfg.mensajeBienvenida=document.getElementById('cfg-mensaje-bienvenida').value.trim();
            cfg.modoMantenimiento=document.getElementById('cfg-modo-mantenimiento').checked;
            cfg.tasaCUP_USD=parseFloat(document.getElementById('cfg-tasa-cup-usd').value)||365;
            cfg.tasaActualizada=document.getElementById('cfg-tasa-fecha').value||new Date().toISOString().split('T')[0];
            localStorage.setItem(K.CONFIG,JSON.stringify(cfg));
            registrarLog('Configuración actualizada','');
            toast('Configuración guardada','exito');
        }

        document.addEventListener('keydown',function(e){
            if(e.key==='Escape'){
                cerrarModalConfirmar();
                document.getElementById('sidebar').classList.remove('abierto');
                document.getElementById('sidebar-overlay').classList.remove('activo');
            }
        });

        navegar('dashboard',document.querySelector('.sidebar-nav a'));
        actualizarBadges();
        verificarVencimientos();
    </script>
</body>
</html>
