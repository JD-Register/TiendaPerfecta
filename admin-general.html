            document.getElementById('cl-portada-preview').innerHTML = '🏢';
            document.getElementById('cl-acceso-panel').checked = false;
            document.getElementById('campos-acceso-panel').style.display = 'none';
            document.getElementById('cl-tipo-cliente').value = 'prueba';
            toggleTipoCliente();
            toggleFormulario('form-cliente');

            renderClientes(document.getElementById('contenido-principal'));
            actualizarBadges();
        }

        function convertirAAlquiler(id) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var idx = clientes.findIndex(function(c) { return c.id === id; });
            if (idx === -1) return;

            var meses = parseInt(prompt('¿Cuántos meses?', '1')) || 1;
            var precio = parseFloat(prompt('Precio mensual ($):', clientes[idx].precio || '10')) || 10;

            var fechaVenc = new Date();
            fechaVenc.setMonth(fechaVenc.getMonth() + meses);

            clientes[idx].tipoCliente = 'alquiler';
            clientes[idx].plan = 'Alquiler';
            clientes[idx].precio = precio;
            clientes[idx].fechaVencimiento = fechaVenc.toISOString().split('T')[0];
            clientes[idx].estado = 'activo';
            clientes[idx].accesoPanel = true;
            clientes[idx].fechaPruebaFin = null;
            clientes[idx].metodoPago = 'efectivo_cup';
            clientes[idx].pagosEstructurados = 1;
            clientes[idx].fechasPago = [fechaVenc.toISOString().split('T')[0]];
            clientes[idx].montosPago = [precio];
            clientes[idx].pagosRealizados = [false];

            if (!clientes[idx].usuarioTienda) {
                clientes[idx].usuarioTienda = clientes[idx].usuario;
                clientes[idx].contrasenaTienda = clientes[idx].contrasena;
            }

            localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
            actualizarUsuariosLogin();
            notificarCliente(id, '🎉 ¡Tu plan de alquiler ha sido activado! Ahora tienes acceso completo a tu tienda.');
            toast('✅ Cliente convertido a alquiler por ' + meses + ' meses', 'exito');
            registrarLog('Cliente convertido a alquiler', clientes[idx].nombre + ' - ' + meses + ' meses');
            aplicarFiltrosClientes();
            actualizarBadges();
        }

        function eliminarCliente(id) {
            confirmarAccion('¿Eliminar cliente?', 'Se eliminará permanentemente.', function() {
                var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
                var nombre = '';
                var idx = clientes.findIndex(function(c) { return c.id === id; });
                if (idx !== -1) { nombre = clientes[idx].nombre; clientes.splice(idx, 1); }
                localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
                actualizarUsuariosLogin();
                toast('🗑️ Cliente eliminado', 'exito');
                registrarLog('Cliente eliminado', nombre);
                renderClientes(document.getElementById('contenido-principal'));
                actualizarBadges();
            });
        }

        function exportarClientesCSV() {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            if (clientes.length === 0) { toast('⚠️ No hay clientes para exportar', 'error'); return; }

            var csv = 'Nombre,Usuario,Tipo,Estado,Vence\n';
            csv += clientes.map(function(c) {
                return '"' + c.nombre + '","' + c.usuario + '","' + (c.tipoCliente === 'alquiler' ? 'Alquiler' : 'Prueba') + '","' + c.estado + '","' + (c.fechaVencimiento || c.fechaPruebaFin || '') + '"';
            }).join('\n');

            var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'clientes_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            toast('📥 CSV exportado correctamente', 'exito');
        }

        function actualizarUsuariosLogin() {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var usuariosLogin = {};
            clientes.forEach(function(c) {
                if (c.usuario && c.contrasena) {
                    usuariosLogin[c.usuario] = { contrasena: c.contrasena, pagina: c.urlAdmin };
                }
            });
            localStorage.setItem('usuariosIslaMarket', JSON.stringify(usuariosLogin));
        }

        // ==========================================
        // PAGOS
        // ==========================================

        function renderPagos(contenido) {
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var hoy = new Date();

            var totalCobradoMes = pagos.filter(function(p) {
                var fp = new Date(p.fecha);
                return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear();
            }).reduce(function(s, p) { return s + p.monto; }, 0);

            var pendientes = pagos.filter(function(p) { return p.estado === 'Pendiente' || p.estado === 'En_revision'; });
            var morosos = clientes.filter(function(c) { return c.estado === 'activo' && c.fechaVencimiento && new Date(c.fechaVencimiento) < hoy; });

            var html = '';
            html += '<div class="topbar"><h1>💰 Suscripciones y Pagos</h1></div>';

            // Resumen
            html += '<div class="resumen" style="margin-bottom:20px;">';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">💰</div><div class="numero">$' + totalCobradoMes.toFixed(2) + '</div><div class="etiqueta">Cobrado este mes</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">⏳</div><div class="numero">' + pendientes.length + '</div><div class="etiqueta">Pendientes</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">✅</div><div class="numero">' + pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear(); }).length + '</div><div class="etiqueta">Realizados</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📊</div><div class="numero">$' + morosos.reduce(function(s, c) { return s + (c.precio || 0); }, 0).toFixed(2) + '</div><div class="etiqueta">Deuda Total</div></div>';
            html += '</div>';

            // Alertas de morosos
            if (morosos.length > 0) {
                html += '<div class="seccion"><h2>🚨 Pagos Pendientes (Morosos)</h2>';
                morosos.forEach(function(cl) {
                    var diasAtraso = Math.floor((new Date() - new Date(cl.fechaVencimiento)) / (1000 * 60 * 60 * 24));
                    html += '<div class="alerta alerta-danger"><span><strong>' + cl.nombre + '</strong> - Debe $' + (cl.precio || 0) + ' - ' + diasAtraso + ' días</span><div style="display:flex;gap:6px;"><button class="btn btn-success btn-sm" onclick="abrirFormularioPago(' + cl.id + ')">💰 Cobrar</button><button class="btn btn-outline btn-sm" onclick="enviarRecordatorioPago(' + cl.id + ')">📨 Recordatorio</button></div></div>';
                });
                html += '</div>';
            }

            // Formulario de pago colapsable
            html += '<div class="seccion"><div class="seccion-header"><h2>➕ Registrar Nuevo Pago</h2><button class="btn btn-primario btn-sm" onclick="toggleFormulario(\'form-pago\')">➕ Nuevo Pago</button></div>';
            html += '<div class="formulario-colapsable" id="form-pago">';
            html += '<div class="form-grid">';
            html += '<div class="form-grupo"><label>Cliente</label><select id="pg-cliente">' + clientes.map(function(c) { return '<option value="' + c.id + '">' + c.nombre + '</option>'; }).join('') + '</select></div>';
            html += '<div class="form-grupo"><label>Monto ($)</label><input type="number" id="pg-monto" value="10" step="0.01"></div>';
            html += '<div class="form-grupo"><label>Fecha de Pago</label><input type="date" id="pg-fecha"></div>';
            html += '<div class="form-grupo"><label>Método de Pago</label><select id="pg-metodo"><option>Efectivo (CUP)</option><option>Transferencia (CUP)</option><option>USD Efectivo</option></select></div>';
            html += '<div class="form-grupo"><label>Estado</label><select id="pg-estado"><option value="Confirmado">✅ Confirmado</option><option value="Pendiente">⏳ Pendiente</option></select></div>';
            html += '<div class="form-grupo"><label>Notas</label><input id="pg-notas" placeholder="Opcional"></div>';
            html += '<button class="btn btn-primario" onclick="registrarPago()">💾 Registrar Pago</button>';
            html += '</div></div></div>';

            // Historial de pagos
            html += '<div class="seccion"><h2>📋 Historial de Pagos</h2>';
            html += '<div class="filtros-chips">';
            html += '<button class="chip activo" onclick="filtrarPagos(\'todos\', this)">📊 Todos</button>';
            html += '<button class="chip" onclick="filtrarPagos(\'Confirmado\', this)">✅ Confirmados</button>';
            html += '<button class="chip" onclick="filtrarPagos(\'Pendiente\', this)">⏳ Pendientes</button>';
            html += '</div>';
            html += '<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Método</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tabla-pagos">' + renderFilasPagos(pagos, clientes) + '</tbody></table></div></div>';

            contenido.innerHTML = html;
        }

        function abrirFormularioPago(clienteId) {
            document.getElementById('pg-cliente').value = clienteId;
            document.getElementById('pg-monto').value = 10;
            document.getElementById('pg-fecha').value = new Date().toISOString().split('T')[0];
            document.getElementById('pg-notas').value = '';
            toggleFormulario('form-pago');
            toast('💰 Completa el formulario de pago.', 'info');
            document.getElementById('form-pago').scrollIntoView({ behavior: 'smooth' });
        }

        function enviarRecordatorioPago(clienteId) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var cl = clientes.find(function(c) { return c.id === clienteId; });
            if (!cl) return;

            var mensaje = "📢 *Recordatorio de Pago*\n\nHola " + cl.dueno + ",\n\nTu suscripción de *" + cl.nombre + "* ha vencido.\n\n💰 Monto: $" + (cl.precio || 10) + "\n📅 Vencimiento: " + cl.fechaVencimiento + "\n\nPor favor, realiza tu pago para mantener tu tienda activa.\n\n¡Gracias! 🙌";
            var tel = cl.whatsapp || cl.telefono;
            if (tel) {
                window.open("https://wa.me/" + tel.replace(/\+/g, '').replace(/\s/g, '') + "?text=" + encodeURIComponent(mensaje), '_blank');
                toast('✅ Recordatorio enviado por WhatsApp', 'exito');
            } else {
                toast('⚠️ No tiene teléfono registrado', 'error');
            }
        }

        function renderFilasPagos(datos, clientes) {
            if (datos.length === 0) return '<tr><td colspan="6" style="text-align:center;padding:30px;">No hay pagos registrados.</td></tr>';
            var estados = { 'Confirmado': '<span class="badge badge-activo">✅ Confirmado</span>', 'Pendiente': '<span class="badge badge-suspendido">⏳ Pendiente</span>', 'En_revision': '<span class="badge badge-prueba">🔍 En revisión</span>', 'Rechazado': '<span class="badge badge-vencido">❌ Rechazado</span>' };
            return datos.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function(p) {
                var cl = clientes.find(function(c) { return c.id === p.clienteId; }) || {};
                return '<tr><td>' + p.fecha + '</td><td><strong>' + (cl.nombre || '—') + '</strong></td><td>$' + p.monto.toFixed(2) + '</td><td>' + (p.metodoPago || '—') + '</td><td>' + (estados[p.estado] || p.estado) + '</td><td><button class="btn btn-outline btn-xs" onclick="editarPago(' + p.id + ')">✏️</button> <button class="btn btn-danger btn-xs" onclick="eliminarPago(' + p.id + ')">🗑️</button></td></tr>';
            }).join('');
        }

        function filtrarPagos(estado, el) {
            filtroPagosEstado = estado;
            document.querySelectorAll('.filtros-chips .chip').forEach(function(chip) { chip.classList.remove('activo'); });
            if (el) el.classList.add('activo');
            aplicarFiltrosPagos();
        }

        function aplicarFiltrosPagos() {
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var f = pagos;
            if (filtroPagosEstado !== 'todos') f = f.filter(function(p) { return p.estado === filtroPagosEstado; });
            document.getElementById('tabla-pagos').innerHTML = renderFilasPagos(f, clientes);
        }

        function registrarPago() {
            var monto = parseFloat(document.getElementById('pg-monto').value);
            if (!monto || monto <= 0) { toast('⚠️ Ingresa un monto válido', 'error'); return; }

            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var clienteId = parseInt(document.getElementById('pg-cliente').value);

            var pago = {
                id: Date.now(),
                clienteId: clienteId,
                monto: monto,
                fecha: document.getElementById('pg-fecha').value || new Date().toISOString().split('T')[0],
                metodoPago: document.getElementById('pg-metodo').value,
                estado: document.getElementById('pg-estado').value,
                notas: document.getElementById('pg-notas').value.trim(),
                fechaCreacion: new Date().toISOString()
            };

            pagos.push(pago);
            localStorage.setItem(K.PAGOS, JSON.stringify(pagos));

            if (pago.estado === 'Confirmado') {
                var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
                var idx = clientes.findIndex(function(c) { return c.id === clienteId; });
                if (idx !== -1) {
                    var ultimaFecha = clientes[idx].fechaVencimiento ? new Date(clientes[idx].fechaVencimiento) : new Date();
                    if (ultimaFecha < new Date()) ultimaFecha = new Date();
                    ultimaFecha.setMonth(ultimaFecha.getMonth() + 1);
                    clientes[idx].fechaVencimiento = ultimaFecha.toISOString().split('T')[0];
                    clientes[idx].estado = 'activo';
                    clientes[idx].enPeriodoGracia = false;
                    localStorage.setItem(K.CLIENTES, JSON.stringify(clientes));
                    notificarCliente(clienteId, '✅ Tu pago de $' + monto + ' ha sido confirmado. Tu plan está activo hasta ' + ultimaFecha.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) + '.');
                }
            }

            toast('✅ Pago registrado correctamente', 'exito');
            registrarLog('Pago registrado', 'Cliente ID: ' + clienteId + ' - $' + monto);
            renderPagos(document.getElementById('contenido-principal'));
            actualizarBadges();
        }

        function editarPago(id) {
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var p = pagos.find(function(pg) { return pg.id === id; });
            if (!p) return;

            document.getElementById('pg-cliente').value = p.clienteId;
            document.getElementById('pg-monto').value = p.monto;
            document.getElementById('pg-fecha').value = p.fecha;
            document.getElementById('pg-metodo').value = p.metodoPago || 'Efectivo (CUP)';
            document.getElementById('pg-estado').value = p.estado || 'Confirmado';
            document.getElementById('pg-notas').value = p.notas || '';

            pagos = pagos.filter(function(pg) { return pg.id !== id; });
            localStorage.setItem(K.PAGOS, JSON.stringify(pagos));

            toggleFormulario('form-pago');
            toast('✏️ Editando pago. Modifica los campos y haz clic en Guardar.', 'exito');
        }

        function eliminarPago(id) {
            confirmarAccion('¿Eliminar pago?', 'Esta acción no se puede deshacer.', function() {
                var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
                pagos = pagos.filter(function(p) { return p.id !== id; });
                localStorage.setItem(K.PAGOS, JSON.stringify(pagos));
                toast('🗑️ Pago eliminado', 'exito');
                registrarLog('Pago eliminado', 'ID: ' + id);
                renderPagos(document.getElementById('contenido-principal'));
                actualizarBadges();
            });
        }

        // VITRINA
        // ==========================================

        function renderVitrina(contenido) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var html = '';
            html += '<div class="topbar"><h1>⭐ Control de Vitrina</h1></div>';
            html += '<div class="seccion"><h2>Configurar qué se muestra al público</h2>';
            html += '<div class="tabla-wrap"><table><thead><tr><th>Logo</th><th>Cliente</th><th>Destacado</th><th>Nuevo</th><th>Acciones</th></tr></thead><tbody>';
            html += clientes.map(function(cl) {

                return '<tr><td>' + logoHTML + '</td><td><strong>' + cl.nombre + '</strong></td><td>' + (cl.destacado ? '⭐ Sí' : 'No') + '</td><td>' + (cl.nuevo ? '🆕 Sí' : 'No') + '</td><td><button class="btn btn-warning btn-xs" onclick="toggleDestacado(' + cl.id + ')">' + (cl.destacado ? 'Quitar ⭐' : 'Destacar ⭐') + '</button> <button class="btn btn-info btn-xs" onclick="toggleNuevo(' + cl.id + ')" style="background:#3b82f6;color:#fff;">' + (cl.nuevo ? 'Quitar 🆕' : 'Marcar 🆕') + '</button></td></tr>';

            renderVitrina(document.getElementById('contenido-principal'));
        }

        function toggleNuevo(id) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var idx = clientes.findIndex(function(c) { return c.id === id; });
            if (idx !== -1) { clientes[idx].nuevo = !clientes[idx].nuevo; localStorage.setItem(K.CLIENTES, JSON.stringify(clientes)); }
            renderVitrina(document.getElementById('contenido-principal'));
        }

        // CATEGORÍAS
        // ==========================================

        function renderCategorias(contenido) {
            var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
            var html = '';
            html += '<div class="topbar"><h1>📂 Categorías</h1><button class="btn btn-primario btn-sm" onclick="toggleFormulario(\'form-cat\')">➕ Agregar</button></div>';
            html += '<div class="formulario-colapsable" id="form-cat"><div class="seccion"><div class="form-grid"><div class="form-grupo"><label>Nombre</label><input id="cat-nombre"></div><div class="form-grupo"><label>Emoji</label><input id="cat-emoji" value="📂"></div><div class="form-grupo"><label>Orden</label><input type="number" id="cat-orden" value="1"></div><button class="btn btn-primario" onclick="guardarCategoria()">💾 Guardar</button></div></div></div>';
            html += '<div class="seccion"><h2>📋 Lista de Categorías</h2>';

                return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;"><span style="font-size:22px;">' + cat.emoji + '</span><strong>' + cat.nombre + '</strong><small>Orden: ' + cat.orden + '</small><div><button class="btn btn-outline btn-xs" onclick="editarCategoria(' + cat.id + ')">✏️</button> <button class="btn btn-danger btn-xs" onclick="eliminarCategoria(' + cat.id + ')">🗑️</button></div></div>';
            }).join('');
            html += '</div>';
            contenido.innerHTML = html;

        function guardarCategoria() {
            var nombre = document.getElementById('cat-nombre').value.trim();
            if (!nombre) { toast('⚠️ Nombre obligatorio', 'error'); return; }
            var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
            categorias.push({ id: Date.now(), nombre: nombre, emoji: document.getElementById('cat-emoji').value.trim() || '📂', orden: parseInt(document.getElementById('cat-orden').value) || 1 });
            localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
            toast('✅ Categoría guardada', 'exito');
            renderCategorias(document.getElementById('contenido-principal'));
        }

        function editarCategoria(id) {
            var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
            var cat = categorias.find(function(c) { return c.id === id; });
            if (!cat) return;
            document.getElementById('cat-nombre').value = cat.nombre;
            document.getElementById('cat-emoji').value = cat.emoji;
            document.getElementById('cat-orden').value = cat.orden;
            categorias = categorias.filter(function(c) { return c.id !== id; });
            localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
            toggleFormulario('form-cat');
            toast('✏️ Editando. Modifica y guarda.', 'exito');
        }

        function eliminarCategoria(id) {
            confirmarAccion('¿Eliminar categoría?', '', function() {
                var categorias = JSON.parse(localStorage.getItem(K.CATEGORIAS)) || [];
                categorias = categorias.filter(function(c) { return c.id !== id; });
                localStorage.setItem(K.CATEGORIAS, JSON.stringify(categorias));
                toast('🗑️ Eliminada', 'exito');
                renderCategorias(document.getElementById('contenido-principal'));
            });
        }

        // ==========================================
        // REPORTES
        // ==========================================

        function renderReportes(contenido) {
            var clientes = JSON.parse(localStorage.getItem(K.CLIENTES)) || [];
            var pagos = JSON.parse(localStorage.getItem(K.PAGOS)) || [];
            var hoy = new Date();
            var totalIngresos = pagos.reduce(function(s, p) { return s + p.monto; }, 0);
            var ingresosMes = pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === hoy.getMonth() && fp.getFullYear() === hoy.getFullYear(); }).reduce(function(s, p) { return s + p.monto; }, 0);

            var html = '';
            html += '<div class="topbar"><h1>📈 Reportes y Análisis</h1></div>';
            html += '<div class="resumen" style="margin-bottom:24px;">';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#dbeafe;color:#3b82f6;">👥</div><div class="numero">' + clientes.length + '</div><div class="etiqueta">Total Clientes</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#d1fae5;color:#10b981;">💰</div><div class="numero">$' + totalIngresos.toLocaleString() + '</div><div class="etiqueta">Ingresos Totales</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#fef3c7;color:#f59e0b;">📅</div><div class="numero">$' + ingresosMes.toLocaleString() + '</div><div class="etiqueta">Este Mes</div></div>';
            html += '<div class="resumen-tarjeta"><div class="resumen-icono" style="background:#ede9fe;color:#7c3aed;">📩</div><div class="numero">' + (JSON.parse(localStorage.getItem(K.SOLICITUDES)) || []).filter(function(s) { return s.estado === 'nueva'; }).length + '</div><div class="etiqueta">Solicitudes Nuevas</div></div>';
            html += '</div>';
            html += '<div class="seccion"><h2>📊 Ingresos Mensuales</h2><div class="chart-container"><canvas id="chart-reportes"></canvas></div></div>';

            contenido.innerHTML = html;

            setTimeout(function() {
                if (typeof Chart === 'undefined') return;
                var canvas = document.getElementById('chart-reportes');
                if (!canvas) return;
                var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                var labels = [], data = [];
                for (var i = 5; i >= 0; i--) {
                    var m = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
                    labels.push(meses[m.getMonth()]);
                    data.push(pagos.filter(function(p) { var fp = new Date(p.fecha); return fp.getMonth() === m.getMonth() && fp.getFullYear() === m.getFullYear(); }).reduce(function(s, p) { return s + p.monto; }, 0));
                }
                new Chart(canvas.getContext('2d'), { type: 'bar', data: { labels: labels, datasets: [{ label: 'Ingresos ($)', data: data, backgroundColor: '#6366f1', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
            }, 500);
        }

        // ==========================================
        // CONFIGURACIÓN
        // ==========================================

        function renderConfig(contenido) {
            var cfg = JSON.parse(localStorage.getItem(K.CONFIG)) || {};

            var html = '';
            html += '<div class="topbar"><h1>⚙️ Configuración</h1></div>';

            // Datos generales
            html += '<div class="seccion"><h2>🖥️ Datos Generales</h2>';
            html += '<div class="form-grid">';
            html += '<div class="form-grupo"><label>Nombre de la Plataforma</label><input id="cfg-nombre" value="' + (cfg.nombrePlataforma || '') + '"></div>';
            html += '<div class="form-grupo"><label>Emoji</label><input id="cfg-emoji" value="' + (cfg.emoji || '🏝️') + '"></div>';
            html += '<div class="form-grupo"><label>Email</label><input id="cfg-email" value="' + (cfg.email || '') + '"></div>';
            html += '<div class="form-grupo"><label>Teléfono</label><input id="cfg-telefono" value="' + (cfg.telefono || '') + '"></div>';
            html += '<div class="form-grupo"><label>WhatsApp</label><input id="cfg-whatsapp" value="' + (cfg.whatsapp || '') + '"></div>';
            html += '<div class="form-grupo-file"><label>🖼️ Logo de la Plataforma (imagen)</label><input type="file" id="cfg-logo-input" accept="image/*" onchange="previewConfigLogo(event)"><div class="logo-preview" id="cfg-logo-preview" style="width:80px;height:80px;">' + (cfg.logo ? '<img src="' + cfg.logo + '" style="width:100%;height:100%;object-fit:cover;">' : '🏝️') + '</div></div>';
            html += '</div></div>';

            // Plan y precios
            html += '<div class="seccion"><h2>💲 Plan y Precios</h2>';
            html += '<div class="form-grid">';
            html += '<div class="form-grupo"><label>Precio Mensual (CUP)</label><input type="number" id="cfg-plan-precio" value="' + (cfg.planPrecio || 15000) + '"></div>';
            html += '<div class="form-grupo"><label>Descuento Efectivo (%)</label><input type="number" id="cfg-plan-descuento" value="' + (cfg.planDescuentoEfectivo || 15) + '"></div>';
            html += '<div class="form-grupo"><label>Tasa de Cambio (CUP/USD)</label><input type="number" id="cfg-plan-tasa" value="' + (cfg.planTasa || 365) + '"></div>';
            html += '<div class="form-grupo"><label>Máx. Pruebas Gratuitas</label><input type="number" id="cfg-max-pruebas" value="' + (cfg.maxPruebasGratuitas || 5) + '"></div>';
            html += '<div class="form-grupo"><label>Días de Prueba</label><input type="number" id="cfg-dias-prueba" value="' + (cfg.diasPrueba || 7) + '"></div>';
            html += '<div class="form-grupo form-grupo-full"><label>Mensaje cuando no hay pruebas disponibles</label><input id="cfg-mensaje-sin-pruebas" value="' + (cfg.mensajeSinPruebas || '') + '" placeholder="Todos nuestros espacios de prueba están ocupados..."></div>';
            html += '<div class="form-grupo-check"><input type="checkbox" id="cfg-modo-mantenimiento" ' + (cfg.modoMantenimiento ? 'checked' : '') + '><label>🔧 Modo mantenimiento (vitrina desactivada temporalmente)</label></div>';
            html += '</div></div>';

            // Backup
            html += '<div class="seccion"><h2>📦 Backup y Restauración</h2>';
            html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
            html += '<button class="btn btn-outline" onclick="backupDatos()">📥 Descargar Backup</button>';
            html += '<button class="btn btn-outline" onclick="restaurarBackup()" style="border-color:var(--warning);color:var(--warning);">📤 Restaurar Backup</button>';
            html += '</div></div>';

            html += '<button class="btn btn-primario" onclick="guardarConfigManual()" style="margin-top:8px;">💾 Guardar Configuración</button>';

            contenido.innerHTML = html;
        }

        function previewConfigLogo(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('cfg-logo-preview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;height:100%;object-fit:cover;">';
            };
            reader.readAsDataURL(file);
        }

        function guardarConfigManual() {
            var logoPreview = document.getElementById('cfg-logo-preview');
            var logoData = logoPreview.querySelector('img') ? logoPreview.querySelector('img').src : '';

            var cfg = {
                nombrePlataforma: document.getElementById('cfg-nombre').value.trim() || 'IslaMarket',
                emoji: document.getElementById('cfg-emoji').value.trim() || '🏝️',
                logo: logoData,
                email: document.getElementById('cfg-email').value.trim(),
                telefono: document.getElementById('cfg-telefono').value.trim(),
                whatsapp: document.getElementById('cfg-whatsapp').value.trim(),
                planPrecio: parseFloat(document.getElementById('cfg-plan-precio').value) || 15000,
                planDescuentoEfectivo: parseFloat(document.getElementById('cfg-plan-descuento').value) || 15,
                planTasa: parseFloat(document.getElementById('cfg-plan-tasa').value) || 365,
                maxPruebasGratuitas: parseInt(document.getElementById('cfg-max-pruebas').value) || 5,
                diasPrueba: parseInt(document.getElementById('cfg-dias-prueba').value) || 7,
                mensajeSinPruebas: document.getElementById('cfg-mensaje-sin-pruebas').value.trim(),
                modoMantenimiento: document.getElementById('cfg-modo-mantenimiento').checked
            };

            localStorage.setItem(K.CONFIG, JSON.stringify(cfg));
            toast('✅ Configuración guardada correctamente', 'exito');
        }

        function backupDatos() {
            var data = {
                plantillas: JSON.parse(localStorage.getItem(K.PLANTILLAS)),
                clientes: JSON.parse(localStorage.getItem(K.CLIENTES)),
                categorias: JSON.parse(localStorage.getItem(K.CATEGORIAS)),
                pagos: JSON.parse(localStorage.getItem(K.PAGOS)),
                config: JSON.parse(localStorage.getItem(K.CONFIG)),
                logs: JSON.parse(localStorage.getItem(K.LOGS)),
                solicitudes: JSON.parse(localStorage.getItem(K.SOLICITUDES))
            };
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'backup_islamarket_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            toast('📥 Backup descargado correctamente', 'exito');
        }

        function restaurarBackup() {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var data = JSON.parse(ev.target.result);
                        if (data.plantillas) localStorage.setItem(K.PLANTILLAS, JSON.stringify(data.plantillas));
                        if (data.clientes) localStorage.setItem(K.CLIENTES, JSON.stringify(data.clientes));
                        if (data.categorias) localStorage.setItem(K.CATEGORIAS, JSON.stringify(data.categorias));
                        if (data.pagos) localStorage.setItem(K.PAGOS, JSON.stringify(data.pagos));
                        if (data.config) localStorage.setItem(K.CONFIG, JSON.stringify(data.config));
                        if (data.logs) localStorage.setItem(K.LOGS, JSON.stringify(data.logs));
                        if (data.solicitudes) localStorage.setItem(K.SOLICITUDES, JSON.stringify(data.solicitudes));
                        toast('✅ Backup restaurado correctamente', 'exito');
                        navegar('dashboard', document.querySelector('.sidebar-nav a'));
                    } catch (err) {
                        toast('⚠️ Archivo inválido', 'error');
                    }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        // ==========================================
        // CERRAR SESIÓN
        // ==========================================
        function cerrarSesion() {
            sessionStorage.removeItem('adminSesion');
            window.location.href = 'index.html';
        }

        // ==========================================
        // EVENTOS DE TECLADO
        // ==========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModalConfirmar();
                document.getElementById('sidebar').classList.remove('abierto');
                document.getElementById('sidebar-overlay').classList.remove('activo');
            }
        });

        // ==========================================
        // INICIAR
        // ==========================================
        navegar('dashboard', document.querySelector('.sidebar-nav a'));
        actualizarBadges();
    </script>
</body>
</html>
