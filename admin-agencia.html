<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Panel Admin | Agencia de Viajes</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
            onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --primary: #e63946;
            --primary-dark: #c1121f;
            --primary-light: #fef2f2;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-sidebar: #cbd5e1;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        .dark-mode {
            --bg: #1a1a2e;
            --surface: #16213e;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --primary-light: #2d1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }

        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
        .sidebar-overlay.active { display: block; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
            background: var(--sidebar-bg); padding: 20px 14px; z-index: 100;
            display: flex; flex-direction: column; transition: transform 0.3s; overflow-y: auto;
        }

        .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 6px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px; }
        .sidebar-logo .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), #c1121f); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .sidebar-logo h2 { font-size: 17px; font-weight: 700; color: #fff; }
        .sidebar-logo span { color: #fca5a5; }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--text-sidebar); text-decoration: none; font-weight: 600; font-size: 13px; transition: var(--transition); cursor: pointer; position: relative; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--sidebar-hover); color: #fff; }
        .sidebar-nav a svg { width: 20px; height: 20px; flex-shrink: 0; }

        .sidebar-badge { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #ef4444; color: #fff; min-width: 18px; height: 18px; border-radius: 50%; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

        .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
        .btn-sidebar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: none; border: none; color: var(--text-sidebar); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition); width: 100%; text-align: left; font-family: inherit; }
        .btn-sidebar:hover { background: var(--sidebar-hover); color: #fff; }
        .btn-sidebar.danger:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

        .btn-hamburger { display: none; position: fixed; top: 14px; left: 14px; z-index: 110; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn-hamburger svg { width: 22px; height: 22px; }

        .main { margin-left: 260px; flex: 1; padding: 24px; transition: margin 0.3s; width: calc(100% - 260px); min-width: 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .topbar h1 { font-size: 22px; font-weight: 800; }
        .topbar .fecha { font-size: 13px; color: var(--text-secondary); }
        .topbar-actions { display: flex; align-items: center; gap: 8px; }
        #contenido-principal { width: 100%; }

        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); transition: var(--transition); }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .card .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
        .card .number { font-size: 28px; font-weight: 900; }
        .card .label { font-size: 10px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        .section { background: var(--surface); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); width: 100%; }
        .section h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section .desc { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; margin-bottom: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea { padding: 9px 11px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; background: #f8fafc; transition: var(--transition); font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230,57,70,0.06); background: #fff; }
        .form-group input[type="checkbox"] { width: auto; padding: 0; margin-right: 6px; }
        .form-group input[type="file"] { padding: 8px; border: 2px dashed var(--border); cursor: pointer; background: #f8fafc; }
        .form-group-check { display: flex; align-items: center; gap: 8px; padding-top: 20px; }
        .form-group-check label { font-size: 11px; font-weight: 600; cursor: pointer; text-transform: none; color: var(--text); }

        .btn { padding: 9px 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 11px; cursor: pointer; border: none; transition: var(--transition); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-warning:hover { background: #d97706; }
        .btn-sm { padding: 4px 8px; font-size: 9px; border-radius: 20px; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-outline-success { background: transparent; border: 2px solid var(--success); color: var(--success); }
        .btn-outline-success:hover { background: #d1fae5; }
        .btn-outline-danger { background: transparent; border: 2px solid var(--danger); color: var(--danger); }
        .btn-outline-danger:hover { background: #fee2e2; }
        .btn-export { background: #7c3aed; color: #fff; font-size: 10px; padding: 5px 10px; }
        .btn-duplicar { background: #8b5cf6; color: #fff; }
        .btn-copiar { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
        .btn-copiar:hover { background: #e2e8f0; }
        .btn-gestionar { background: #6366f1; color: #fff; font-size: 10px; padding: 5px 10px; }
        .btn-toggle-activo { background: var(--success) !important; color: #fff !important; border-color: var(--success) !important; }
        .btn-logout-top { background: none; border: 2px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 20px; font-size: 10px; cursor: pointer; }
        .btn-notificar { background: #25d366; color: #fff; }

        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: auto; }
        th { text-align: left; padding: 9px 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); background: #f8fafc; border-bottom: 2px solid var(--border); white-space: nowrap; cursor: pointer; }
        th:hover { color: var(--primary); }
        td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
        tr.cancelada { background: #fef2f2; opacity: 0.7; }

        .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-tipo-parada { background: #ede9fe; color: #5b21b6; font-size: 8px; padding: 2px 6px; border-radius: 10px; }

        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input { width: 100%; padding: 9px 12px 9px 36px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 40px; font-weight: 700; font-size: 12px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }

        .modal-admin { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 800; align-items: center; justify-content: center; padding: 16px; }
        .modal-admin.activo { display: flex; }
        .modal-admin .modal-content { background: #fff; border-radius: var(--radius); padding: 22px; max-width: 550px; width: 100%; max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .countdown-container { background: linear-gradient(135deg, #1a1a2e, #2d1a1a); border-radius: var(--radius); padding: 24px; text-align: center; color: #fff; margin-bottom: 20px; }
        .countdown-timer { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .countdown-item .countdown-value { font-size: 36px; font-weight: 900; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; min-width: 70px; }

        .bus-simulador { background: #f8fafc; border-radius: var(--radius-sm); padding: 20px; border: 2px solid #cbd5e1; max-width: 350px; margin: 0 auto; }
        .bus-grid-sim { display: grid; grid-template-columns: 1fr 30px 1fr; gap: 4px; }
        .bus-col-sim { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .asiento-sim { aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; border: 2px solid var(--border); background: #fff; }
        .asiento-sim.libre { background: #d1fae5; border-color: #10b981; color: #065f46; }
        .asiento-sim.ocupado { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .asiento-sim.pendiente { background: #fef3c7; border-color: #f59e0b; color: #92400e; }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .btn-hamburger { display: flex; }
            .main { margin-left: 0; width: 100%; padding: 16px 10px; padding-top: 60px; }
            .cards { grid-template-columns: repeat(2, 1fr); }
            table { font-size: 10px; }
            th, td { padding: 6px 4px; font-size: 8px; }
        }
        @media (max-width: 500px) {
            .cards { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            th, td { padding: 4px 3px; font-size: 7px; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    <button class="btn-hamburger" id="btn-hamburger" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><div class="logo-icon">🚌</div><h2>Agencia<span>Admin</span></h2></div>
        <nav class="sidebar-nav">
            <a class="active" onclick="navegar('dashboard', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Panel</a>
            <a onclick="navegar('rutas', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6"/><path d="M21 19v-6a2 2 0 00-2-2h-2a2 2 0 00-2 2v6"/><rect x="9" y="5" width="6" height="14" rx="1"/></svg> Rutas</a>
            <a onclick="navegar('viajes', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Viajes</a>
            <a onclick="navegar('vehiculos', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="22" height="12" rx="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg> Vehículos</a>
            <a onclick="navegar('reservas', this)" id="nav-reservas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Reservas<span class="sidebar-badge" id="sidebar-badge-reservas" style="display:none;">0</span></a>
            <a onclick="navegar('confirmaciones', this)" id="nav-confirmaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Confirmaciones<span class="sidebar-badge" id="sidebar-badge-confirmaciones" style="display:none;">0</span></a>
            <a onclick="navegar('gestion-viaje', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Gestión Viaje</a>
            <a onclick="navegar('viajes-futuros', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Viajes Futuros</a>
            <a onclick="navegar('config', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> Configuración</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-sidebar" id="btn-toggle-dark" onclick="toggleDarkMode()">🌓 Modo Oscuro</button>
            <button class="btn-sidebar" onclick="backupDatos()">📥 Backup</button>
            <button class="btn-sidebar" onclick="window.open('agencia.html','_blank')">🌐 Ver Tienda</button>
            <button class="btn-sidebar danger" onclick="cerrarSesion()">🚪 Salir</button>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1 id="titulo-seccion">📊 Panel</h1>
            <div class="topbar-actions">
                <span class="fecha" id="fecha-actual"></span>
                <button class="btn-logout-top" onclick="cerrarSesion()">🚪 Salir</button>
            </div>
        </div>
        <div id="contenido-principal"></div>
    </div>

    <!-- MODAL CONFIRMAR (verde para confirmar, rojo para borrar) -->
    <div class="modal-admin" id="modal-confirmar">
        <div class="modal-content" style="max-width:450px;text-align:center;">
            <div style="font-size:40px;margin-bottom:8px;" id="modal-icono">⚠️</div>
            <h3 id="modal-confirmar-titulo">¿Estás seguro?</h3>
            <p id="modal-confirmar-texto" style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;"></p>
            <div class="modal-actions" style="justify-content:center;">
                <button class="btn btn-danger" id="modal-confirmar-btn-si">Confirmar</button>
                <button class="btn btn-outline btn-sm" onclick="cerrarModalConfirmar()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal-admin" id="modal-editar-viaje"><div class="modal-content" id="modal-editar-viaje-contenido"></div></div>
    <div class="modal-admin" id="modal-editar-vehiculo"><div class="modal-content" id="modal-editar-vehiculo-contenido"></div></div>
    <div class="modal-admin" id="modal-detalle-reserva"><div class="modal-content" id="modal-detalle-reserva-contenido"></div></div>
    <div class="toast" id="toast"></div>

    <script>
        // 

        var K = { VEHICULOS:'vp_v', RUTAS:'vp_r', VIAJES:'vp_vj', RESERVAS:'vp_rs', CONFIG:'vp_cf', LOGS:'vp_logs', CONFIRMACIONES:'vp_conf' };
        if(!localStorage.getItem(K.VEHICULOS)) localStorage.setItem(K.VEHICULOS, '[]');
        if(!localStorage.getItem(K.RUTAS)) localStorage.setItem(K.RUTAS, '[]');
        if(!localStorage.getItem(K.VIAJES)) localStorage.setItem(K.VIAJES, '[]');
        if(!localStorage.getItem(K.RESERVAS)) localStorage.setItem(K.RESERVAS, '[]');
        if(!localStorage.getItem(K.LOGS)) localStorage.setItem(K.LOGS, '[]');
        if(!localStorage.getItem(K.CONFIRMACIONES)) localStorage.setItem(K.CONFIRMACIONES, '[]');
        if(!localStorage.getItem(K.CONFIG)) { localStorage.setItem(K.CONFIG, JSON.stringify({ nombre:'Agencia de Viajes', telefono:'', whatsapp:'', email:'', direccion:'', horario:'Lun-Dom 8AM-8PM', color:'#e63946', emoji:'🚌', usarPrecioPorParada:false, portada:'', carrusel:[], logo:'' })); }
        document.getElementById('fecha-actual').textContent = new Date().toLocaleDateString('es-ES', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

        var chart=null, tmpParadas=[], editandoRutaIdx=-1, callbackConfirmar=null, editandoViajeIdx=-1, editandoVehiculoIdx=-1, countdownInterval=null;

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('adminDarkMode', document.body.classList.contains('dark-mode')); document.getElementById('btn-toggle-dark').textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌓 Modo Oscuro'; }
        if(localStorage.getItem('adminDarkMode') === 'true') document.body.classList.add('dark-mode');
        (function(){ document.getElementById('btn-toggle-dark').textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌓 Modo Oscuro'; })();
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }
        function toast(m,t){ var el=document.getElementById('toast'); el.textContent=m; el.className='toast '+t+' show'; setTimeout(()=>el.classList.remove('show'),2500); }
        function cerrarSesion(){ sessionStorage.removeItem('clienteSesion'); window.location.href='login-cliente.html'; }

        // ==========================================
        // NAVEGACIÓN
        // ==========================================
        function navegar(seccion, el) {
            closeSidebar(); document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('mostrar'));
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            var botones = document.querySelectorAll('.sidebar-nav a'); botones.forEach(function(a) { a.classList.remove('active'); }); if (el) el.classList.add('active');
            var c = document.getElementById('contenido-principal'); c.innerHTML = '';
            var titulos = { dashboard: '📊 Panel', rutas: '🗺️ Rutas', viajes: '📅 Viajes', vehiculos: '🚌 Vehículos', reservas: '🎫 Reservas', confirmaciones: '✅ Confirmaciones', 'gestion-viaje': '📊 Gestión de Viaje', 'viajes-futuros': '🔮 Viajes Futuros', config: '⚙️ Configuración' };
            document.getElementById('titulo-seccion').textContent = titulos[seccion] || 'Panel';

        function renderDashboard(c){ /* ... SIN CAMBIOS ... */ var v=JSON.parse(localStorage.getItem(K.VEHICULOS))||[], r=JSON.parse(localStorage.getItem(K.RUTAS))||[], vj=JSON.parse(localStorage.getItem(K.VIAJES))||[], rs=JSON.parse(localStorage.getItem(K.RESERVAS))||[]; var hoy=new Date().toISOString().split('T')[0]; var ingresosHoy=rs.filter(x=>x.fechaReserva===hoy&&x.estado==='confirmada').reduce((s,x)=>s+(x.precioTotal||0),0); var pendientes=rs.filter(x=>x.estado==='pendiente'||x.estado==='pendiente_pago').length; var viajesHoy=vj.filter(x=>x.fecha===hoy&&x.estado==='activo'); var html=`<div class="cards"><div class="card"><div class="icon" style="background:#dbeafe;color:#2563eb;">🚌</div><div class="number">${v.length}</div><div class="label">Vehículos</div></div><div class="card"><div class="icon" style="background:#d1fae5;color:#10b981;">🗺️</div><div class="number">${r.length}</div><div class="label">Rutas</div></div><div class="card"><div class="icon" style="background:#fef3c7;color:#f59e0b;">📅</div><div class="number">${vj.filter(x=>x.estado==='activo').length}</div><div class="label">Viajes Activos</div></div><div class="card"><div class="icon" style="background:#ede9fe;color:#7c3aed;">💰</div><div class="number">$${ingresosHoy.toLocaleString()}</div><div class="label">Ingresos Hoy</div></div></div>`; if(viajesHoy.length){ html+='<div class="section"><h2>🟢 Viajes de Hoy</h2>'; viajesHoy.forEach(v=>{ let rt=(JSON.parse(localStorage.getItem(K.RUTAS))||[])[v.rutaIndex]||{}, ve=(JSON.parse(localStorage.getItem(K.VEHICULOS))||[])[v.vehiculoIndex]||{}; let cap=ve.capacidad||40, ocup=cap-v.asientosDisponibles, pct=Math.round((ocup/cap)*100); html+=`<div class="viaje-dashboard-card"><div><strong>${rt.nombre||'?'}</strong><br><small>${v.hora} · ${ve.tipo||''} ${ve.matricula||''}</small></div><div style="text-align:center;"><small>${ocup}/${cap} (${pct}%)</small><div class="ocupacion-bar"><div class="ocupacion-fill" style="width:${pct}%;background:${pct>80?'#10b981':pct>40?'#f59e0b':'#ef4444'};"></div></div></div><div><strong>$${v.precio}</strong></div><button class="btn btn-gestionar btn-sm" onclick="abrirGestionViaje(${vj.indexOf(v)})">📊 Gestionar</button></div>`; }); html+='</div>'; } if(pendientes) html+=`<div class="section"><h2>📋 Pendientes</h2><p style="font-size:24px;font-weight:900;color:var(--warning);">${pendientes} reservas</p></div>`; html+='<div class="section"><h2>📈 Ingresos 7 días</h2><div class="chart-container"><canvas id="chart-ingresos"></canvas></div></div>'; c.innerHTML=html; drawChart(); }
        function drawChart(){ /* ... SIN CAMBIOS ... */ var rs=JSON.parse(localStorage.getItem(K.RESERVAS))||[], dias=[], ingresos=[]; for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); var f=d.toISOString().split('T')[0]; dias.push(d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})); ingresos.push(rs.filter(r=>r.fechaReserva===f&&r.estado==='confirmada').reduce((s,r)=>s+(r.precioTotal||0),0)); } var canvas=document.getElementById('chart-ingresos'); if(!canvas) return; if(chart) chart.destroy(); chart=new Chart(canvas.getContext('2d'),{type:'bar',data:{labels:dias,datasets:[{label:'$',data:ingresos,backgroundColor:'#e63946',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}); }

        function loadReservas(){ var reservas=JSON.parse(localStorage.getItem(K.RESERVAS))||[], viajes=JSON.parse(localStorage.getItem(K.VIAJES))||[], rutas=JSON.parse(localStorage.getItem(K.RUTAS))||[]; var fv=document.getElementById('filtro-viaje')?.value||'', fe=document.getElementById('filtro-estado')?.value||'', ff=document.getElementById('filtro-fecha-reserva')?.value||'', ft=(document.getElementById('buscar-reserva')?.value||'').toLowerCase(); var f=fv?reservas.filter(r=>r.viajeIndex==fv):reservas; if(fe) f=f.filter(r=>r.estado===fe); if(ff) f=f.filter(r=>r.fechaReserva===ff||r.viajeFecha===ff); if(ft) f=f.filter(r=>r.codigo.toLowerCase().includes(ft)||(r.pasajeros||[]).some(p=>p.nombre.toLowerCase().includes(ft)||(p.ci||'').toLowerCase().includes(ft))); f.sort((a,b)=>b.id-a.id); var tbody=document.getElementById('tabla-reservas'); if(!tbody) return; tbody.innerHTML=f.map(r=>{ var v=viajes[r.viajeIndex]||{}, rt=rutas[v.rutaIndex]||{}, p=(r.pasajeros||[])[0]||{}; var estadoBadge=r.estado==='confirmada'?'<span class="badge badge-success">✅ Confirmada</span>':r.estado==='cancelada'?'<span class="badge badge-danger">❌ Cancelada</span>':r.estado==='pendiente_pago'?'<span class="badge badge-warning">💰 Pend. Pago</span>':'<span class="badge badge-warning">⏳ Pendiente</span>'; var tipoParadaStr=''; if(r.tipoParada==='antes_de') tipoParadaStr=' ⬆️ Antes'; else if(r.tipoParada==='despues_de') tipoParadaStr=' ⬇️ Después'; var lugarStr=r.lugarEspecifico?' - '+r.lugarEspecifico:''; var recogidaStr=r.lugarRecogida||'Lugar oficial'; return `<tr class="${r.estado==='cancelada'?'cancelada':''}"><td><strong>${r.codigo}</strong></td><td>${rt.nombre||'?'} ${v.fecha||''}</td><td>${p.nombre||'—'}</td><td>${p.ci||'—'}</td><td>#${p.asiento||'—'}</td><td>${r.paradaDescenso||rt.destino||'?'}${tipoParadaStr}${lugarStr}</td><td>${recogidaStr}</td><td>${estadoBadge}</td><td><button class="btn btn-outline btn-sm" onclick="verDetalleReserva(${r.id})">👁️</button> ${(r.estado==='pendiente'||r.estado==='pendiente_pago')?`<button class="btn btn-success btn-sm" onclick="confirmarCambiarEstado('${r.codigo}','confirmada')">✅</button>`:''} ${r.estado!=='cancelada'?`<button class="btn btn-danger btn-sm" onclick="confirmarCambiarEstado('${r.codigo}','cancelada')">❌</button>`:''} <button class="btn btn-danger btn-sm" onclick="confirmarEliminarReserva('${r.codigo}')" style="background:#94a3b8;">🗑️</button></td></tr>`; }).join(''); }

        function confirmarCambiarEstado(codigo,nuevoEstado){
            var titulo = nuevoEstado === 'confirmada' ? '✅ Confirmar reserva' : '❌ Cancelar reserva';
            var texto = nuevoEstado === 'confirmada' ? `Se confirmarán todas las reservas con código ${codigo}.` : `Se cancelarán todas las reservas con código ${codigo}.`;
            var tipoModal = nuevoEstado === 'confirmada' ? 'confirmar' : 'borrar';
            abrirModalConfirmar(titulo, texto, ()=>{ cambiarEstadoReserva(codigo, nuevoEstado); }, tipoModal);
        }

        function cambiarEstadoReserva(codigo, nuevoEstado){
            var reservas = JSON.parse(localStorage.getItem(K.RESERVAS));
            var telefonoCliente = '', nombreCliente = '', rutaNombre = '', fechaViaje = '', horaViaje = '';
            reservas.forEach(r => {
                if(r.codigo === codigo){
                    if(nuevoEstado === 'cancelada' && r.estado === 'confirmada'){
                        var viajes = JSON.parse(localStorage.getItem(K.VIAJES));
                        if(viajes[r.viajeIndex]) viajes[r.viajeIndex].asientosDisponibles += (r.pasajeros || []).length || 1;
                        localStorage.setItem(K.VIAJES, JSON.stringify(viajes));
                    }
                    if(nuevoEstado === 'confirmada' && r.estado !== 'confirmada'){
                        var confirmaciones = JSON.parse(localStorage.getItem(K.CONFIRMACIONES)) || [];
                        var p = (r.pasajeros || [])[0] || {};
                        var confIdx = confirmaciones.findIndex(function(c) { return c.codigoReserva === codigo && c.estado === 'pendiente'; });
                        if(confIdx !== -1){
                            confirmaciones[confIdx].estado = 'completado';
                            confirmaciones[confIdx].fechaConfirmacion = new Date().toISOString();
                        } else {
                            confirmaciones.push({ id: Date.now() + Math.random(), viajeIndex: r.viajeIndex, codigoReserva: r.codigo, nombre: p.nombre || '—', telefono: r.telefono || p.telefono || '—', idTransferencia: 'CONF-' + Date.now().toString(36).toUpperCase(), captura: '', estado: 'completado', fecha: new Date().toISOString().split('T')[0], monto: r.precioTotal || 0 });
                        }
                        localStorage.setItem(K.CONFIRMACIONES, JSON.stringify(confirmaciones));
                        telefonoCliente = r.telefono || (p.telefono || '');
                        nombreCliente = p.nombre || 'Cliente';
                        var viajes = JSON.parse(localStorage.getItem(K.VIAJES)) || [], rutas = JSON.parse(localStorage.getItem(K.RUTAS)) || [];
                        var v = viajes[r.viajeIndex] || {}, rt = rutas[v.rutaIndex] || {};
                        rutaNombre = rt.nombre || 'su viaje'; fechaViaje = v.fecha || ''; horaViaje = v.hora || '';
                    }
                    if(nuevoEstado === 'cancelada'){
                        var confirmaciones = JSON.parse(localStorage.getItem(K.CONFIRMACIONES)) || [];
                        confirmaciones = confirmaciones.filter(function(c) { return !(c.codigoReserva === codigo && c.estado === 'pendiente'); });
                        localStorage.setItem(K.CONFIRMACIONES, JSON.stringify(confirmaciones));
                    }
                    r.estado = nuevoEstado;
                    if(nuevoEstado === 'cancelada') r.fechaCancelacion = new Date().toISOString();
                }
            });
            localStorage.setItem(K.RESERVAS, JSON.stringify(reservas));
            loadReservas(); actualizarBadges();
            toast('Estado actualizado: ' + nuevoEstado, 'success');
            if(nuevoEstado === 'confirmada' && telefonoCliente){
                mostrarNotificacionWhatsApp(codigo, nombreCliente, telefonoCliente, rutaNombre, fechaViaje, horaViaje);
            }
        }

        function mostrarNotificacionWhatsApp(codigo, nombre, telefono, ruta, fecha, hora){
            var toastEl = document.createElement('div');
            toastEl.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);z-index:3000;text-align:center;max-width:350px;width:90%;';
            toastEl.innerHTML = '<p style="font-weight:700;margin-bottom:8px;color:#065f46;">✅ Reserva confirmada: ' + codigo + '</p>';
            var btnW = document.createElement('button'); btnW.className = 'btn btn-notificar btn-sm'; btnW.textContent = '📢 Notificar por WhatsApp'; btnW.style.cssText = 'width:100%;margin-bottom:4px;';
            btnW.onclick = function(){
                var mensaje = encodeURIComponent('✅ *Reserva Confirmada*\n\nHola ' + nombre + ',\n\nTu reserva ha sido *CONFIRMADA*.\n\n📋 Código: ' + codigo + '\n🚌 Ruta: ' + ruta + '\n📅 Fecha: ' + fecha + ' ' + hora + '\n\n¡Gracias por viajar con nosotros! 🚌');
                window.open('https://wa.me/' + telefono.replace(/\+/g, '').replace(/\s/g, '') + '?text=' + mensaje, '_blank');
            };
            toastEl.appendChild(btnW);
            var btnCerrar = document.createElement('button'); btnCerrar.className = 'btn btn-outline btn-sm'; btnCerrar.textContent = 'Cerrar'; btnCerrar.style.cssText = 'width:100%;';
            btnCerrar.onclick = function(){ toastEl.remove(); };
            toastEl.appendChild(btnCerrar);
            document.body.appendChild(toastEl);
            setTimeout(function() { if(toastEl.parentNode) toastEl.remove(); }, 20000);
        }

        function confirmarEliminarReserva(codigo){
            abrirModalConfirmar('¿Eliminar reserva?', `Se eliminarán todas las reservas con código ${codigo}.`, ()=>{ eliminarReserva(codigo); }, 'borrar');
        }
        function eliminarReserva(codigo){
            var reservas = JSON.parse(localStorage.getItem(K.RESERVAS)) || [];
            reservas.filter(r => r.codigo === codigo && r.estado !== 'cancelada').forEach(r => { var viajes = JSON.parse(localStorage.getItem(K.VIAJES)) || []; if(viajes[r.viajeIndex]) viajes[r.viajeIndex].asientosDisponibles += (r.pasajeros || []).length || 1; localStorage.setItem(K.VIAJES, JSON.stringify(viajes)); });
            reservas = reservas.filter(r => r.codigo !== codigo);
            localStorage.setItem(K.RESERVAS, JSON.stringify(reservas));
            var confirmaciones = JSON.parse(localStorage.getItem(K.CONFIRMACIONES)) || [];
            confirmaciones = confirmaciones.filter(c => c.codigoReserva !== codigo);
            localStorage.setItem(K.CONFIRMACIONES, JSON.stringify(confirmaciones));
            loadReservas(); actualizarBadges(); toast('Reserva eliminada', 'success');
        }
        function limpiarHistorialReservas(){
            abrirModalConfirmar('Limpiar historial', 'Se eliminarán canceladas y viajes pasados (>7 días).', () => {
                var reservas = JSON.parse(localStorage.getItem(K.RESERVAS)) || [], viajes = JSON.parse(localStorage.getItem(K.VIAJES)) || [], limite = new Date(); limite.setDate(limite.getDate() - 7);
                var aEliminar = reservas.filter(r => r.estado === 'cancelada' || (viajes[r.viajeIndex] && new Date(viajes[r.viajeIndex].fecha + 'T23:59:59') < limite));
                var codigos = aEliminar.map(r => r.codigo);
                reservas = reservas.filter(r => codigos.indexOf(r.codigo) === -1);
                localStorage.setItem(K.RESERVAS, JSON.stringify(reservas));
                var confirmaciones = JSON.parse(localStorage.getItem(K.CONFIRMACIONES)) || [];
                confirmaciones = confirmaciones.filter(c => codigos.indexOf(c.codigoReserva) === -1);
                localStorage.setItem(K.CONFIRMACIONES, JSON.stringify(confirmaciones));
                loadReservas(); actualizarBadges(); toast('Historial limpiado', 'success');
            }, 'borrar');
        }
        function verDetalleReserva(id){ var reservas=JSON.parse(localStorage.getItem(K.RESERVAS))||[], r=reservas.find(r=>r.id===id); if(!r) return; var viajes=JSON.parse(localStorage.getItem(K.VIAJES))||[], rutas=JSON.parse(localStorage.getItem(K.RUTAS))||[], v=viajes[r.viajeIndex]||{}, rt=rutas[v.rutaIndex]||{}, pasajeros=r.pasajeros||[], modal=document.getElementById('modal-detalle-reserva'), contenido=document.getElementById('modal-detalle-reserva-contenido'); contenido.innerHTML=`<h3>👁️ Detalle</h3><div style="font-size:13px;"><p><strong>Código:</strong> ${r.codigo}</p><p><strong>Ruta:</strong> ${rt.nombre||'—'}</p><p><strong>Fecha:</strong> ${v.fecha||'—'} · ${v.hora||'—'}</p><p><strong>Recogida:</strong> ${r.lugarRecogida||'Lugar oficial'}</p><p><strong>Pasajeros:</strong></p>${pasajeros.map(p=>`<p>🧑 ${p.nombre} | #${p.asiento} | CI: ${p.ci||'—'}</p>`).join('')}<p><strong>Total:</strong> $${((r.precioTotal||0).toFixed(2))}</p></div><div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="cerrarModalDetalleReserva()">Cerrar</button></div>`; modal.classList.add('activo'); }
        function cerrarModalDetalleReserva(){ document.getElementById('modal-detalle-reserva').classList.remove('activo'); }
        document.getElementById('modal-detalle-reserva').addEventListener('click',function(e){ if(e.target===this) cerrarModalDetalleReserva(); });
        function exportCSV(){ var reservas=JSON.parse(localStorage.getItem(K.RESERVAS))||[]; if(!reservas.length) return toast('Sin datos','error'); var csv=['Código,Fecha,Pasajero,CI,Asiento,Estado'].concat(reservas.map(r=>{var p=(r.pasajeros||[])[0]||{};return[r.codigo,r.viajeFecha||'',p.nombre||'',p.ci||'',p.asiento||'',r.estado].join(',');})).join('\n'); var blob=new Blob([csv],{type:'text/csv'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='reservas.csv'; a.click(); toast('📥 Exportado','success'); }

        function cargarConfirmaciones(){
            var confirmaciones=JSON.parse(localStorage.getItem(K.CONFIRMACIONES))||[], viajes=JSON.parse(localStorage.getItem(K.VIAJES))||[], rutas=JSON.parse(localStorage.getItem(K.RUTAS))||[];
            var fv=document.getElementById('filtro-conf-viaje')?.value||'', fe=document.getElementById('filtro-conf-estado')?.value||'pendiente';
            var f=fv?confirmaciones.filter(c=>c.viajeIndex==fv):confirmaciones;
            if(fe) f=f.filter(c=>c.estado===fe);
            f.sort((a,b)=>b.id-a.id);
            var tbody=document.getElementById('tbody-confirmaciones'); if(!tbody) return;
            
            if(f.length === 0){
                var mensaje = fe === 'pendiente' ? '✅ No hay confirmaciones pendientes por revisar' : 'No se encontraron resultados';
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-secondary);">' + mensaje + '</td></tr>';
                return;
            }
            
            tbody.innerHTML=f.map(c=>{
                var v=viajes[c.viajeIndex]||{}, rt=rutas[v.rutaIndex]||{};
                var estadoBadge=c.estado==='pendiente'?'<span class="badge badge-warning">⏳ Pendiente</span>':'<span class="badge badge-success">✅ Completado</span>';
                return `<tr><td>${c.fecha||'—'}</td><td><strong>${c.nombre}</strong></td><td>${c.telefono}</td><td>${rt.nombre||'?'} ${v.fecha||''}</td><td><code>${c.idTransferencia||'—'}</code></td><td>$${(c.monto||0).toFixed(2)}</td><td>${estadoBadge}</td></tr>`;
            }).join('');

        async function saveConfig(){ var cfg=JSON.parse(localStorage.getItem(K.CONFIG)); cfg.nombre=document.getElementById('cfg-nombre').value.trim(); cfg.telefono=document.getElementById('cfg-tel').value.trim(); cfg.whatsapp=document.getElementById('cfg-wa').value.trim(); cfg.email=document.getElementById('cfg-email').value.trim(); cfg.direccion=document.getElementById('cfg-dir').value.trim(); cfg.horario=document.getElementById('cfg-horario').value.trim(); cfg.color=document.getElementById('cfg-color').value; cfg.emoji=document.getElementById('cfg-emoji').value.trim()||'🚌'; cfg.usarPrecioPorParada=document.getElementById('cfg-precio-parada').checked; var promesas=[]; var logoFile=document.getElementById('cfg-logo').files[0]; if(logoFile) promesas.push(new Promise(res=>{ var r=new FileReader(); r.onload=ev=>{ cfg.logo=ev.target.result; res(); }; r.readAsDataURL(logoFile); })); var portadaFile=document.getElementById('cfg-portada').files[0]; if(portadaFile) promesas.push(new Promise(res=>{ var r=new FileReader(); r.onload=ev=>{ cfg.portada=ev.target.result; res(); }; r.readAsDataURL(portadaFile); })); if(cfg.carrusel) cfg.carrusel.forEach((f,i)=>{ var nombreEl=document.getElementById('carrusel-nombre-'+i); if(nombreEl) f.nombre=nombreEl.value.trim(); var imgEl=document.getElementById('carrusel-img-'+i); if(imgEl&&imgEl.files[0]) promesas.push(new Promise(res=>{ var r=new FileReader(); r.onload=ev=>{ f.imagen=ev.target.result; res(); }; r.readAsDataURL(imgEl.files[0]); })); }); await Promise.all(promesas); localStorage.setItem(K.CONFIG,JSON.stringify(cfg)); toast('✅ Configuración guardada','success'); renderConfig(document.getElementById('contenido-principal')); }

        document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ cerrarModalConfirmar(); cerrarModalEditarViaje(); cerrarModalEditarVehiculo(); cerrarModalDetalleReserva(); } });
        navegar('dashboard',document.querySelector('.sidebar-nav a.active')); actualizarBadges();
    </script>
