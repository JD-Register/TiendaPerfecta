<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mi Panel | TiendaPerfecta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 12px;
            --shadow: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .navbar-brand .icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navbar-actions span {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn-logout {
            padding: 8px 18px;
            border-radius: 50px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .contenido {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
            flex: 1;
            width: 100%;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 900;
            margin: 4px 0;
        }

        .stat-card .sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .badge-estado {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .badge-activo { background: #d1fae5; color: #065f46; }
        .badge-prueba { background: #fef3c7; color: #92400e; }
        .badge-vencido { background: #fee2e2; color: #991b1b; }
        .badge-suspendido { background: #e2e8f0; color: #475569; }

        .seccion {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .seccion h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tienda-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 20px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .tienda-card .info { flex: 1; }
        .tienda-card .info h4 { font-size: 16px; font-weight: 700; }
        .tienda-card .info p { font-size: 12px; color: var(--text-secondary); }

        .btn-tienda {
            padding: 9px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: #fff;
            transition: 0.2s;
            font-family: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tienda:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .btn-tienda.outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-tienda.outline:hover {
            background: var(--primary);
            color: #fff;
        }

        .comprobante-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .comprobante-item:last-child { border-bottom: none; }
        .comprobante-item .info { font-size: 13px; }
        .comprobante-item .info strong { display: block; }

        .estado {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .estado-pendiente { background: #fef3c7; color: #92400e; }
        .estado-confirmado { background: #d1fae5; color: #065f46; }
        .estado-rechazado { background: #fee2e2; color: #991b1b; }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            transition: 0.2s;
            background: var(--bg);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.06);
            background: var(--surface);
        }

        .form-group input[type="file"] {
            padding: 8px;
            border: 2px dashed var(--border);
            cursor: pointer;
        }

        .btn-submit {
            padding: 11px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: #fff;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(99,102,241,0.3);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: #fef3c7;
            border-radius: var(--radius-sm);
            border: 1px solid #fde68a;
            margin: 8px 0;
        }

        .timer .days {
            font-size: 24px;
            font-weight: 900;
            color: #92400e;
        }

        .timer .label {
            font-size: 12px;
            color: #92400e;
        }

        .timer.urgente {
            background: #fee2e2;
            border-color: #fecaca;
        }

        .timer.urgente .days { color: #991b1b; }
        .timer.urgente .label { color: #991b1b; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 500;
        }

        .toast.mostrar {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.exito { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.info { border-color: var(--primary); color: var(--primary); }

        @media (max-width: 768px) {
            .navbar { padding: 0 16px; height: 58px; }
            .contenido { padding: 16px 12px; }
            .seccion { padding: 18px 16px; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .tienda-card { flex-direction: column; text-align: center; }
            .tienda-card .btn-tienda { width: 100%; justify-content: center; }
            .comprobante-item { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <div class="icon">🏢</div>
            <span id="brand-nombre">TiendaPerfecta</span>
        </div>
        <div class="navbar-actions">
            <span id="usuario-nombre"></span>
            <button class="btn-logout" onclick="cerrarSesion()">🚪 Salir</button>
        </div>
    </nav>

    <div class="contenido" id="contenido-principal"></div>

    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // VERIFICACIÓN DE SESIÓN
        // ==========================================
        (function() {
            var sesion = JSON.parse(sessionStorage.getItem('clienteSesion') || 'null');
            
            if (!sesion || !sesion.id || !sesion.token) {
                window.location.href = 'login-cliente.html';
                return;
            }
            
            var ahora = new Date().getTime();
            if (ahora >= sesion.expiracion) {
                sessionStorage.removeItem('clienteSesion');
                window.location.href = 'login-cliente.html?expirado=1';
                return;
            }
            
            // Renovar expiración
            sesion.expiracion = ahora + (480 * 60 * 1000);
            sessionStorage.setItem('clienteSesion', JSON.stringify(sesion));
        })();

        // ==========================================
        // STORAGE KEYS
        // ==========================================
        var K_CLIENTES = 'central_clientes';
        var K_PAGOS = 'central_pagos';
        var K_CONFIG = 'central_config';
        var K_PLANTILLAS = 'central_plantillas';
        var K_SOLICITUDES = 'central_solicitudes';

        // ==========================================
        // DATOS DE SESIÓN
        // ==========================================
        var sesionActual = JSON.parse(sessionStorage.getItem('clienteSesion'));
        var clienteActual = null;

        function cargarClienteActual() {
            var clientes = JSON.parse(localStorage.getItem(K_CLIENTES)) || [];
            clienteActual = clientes.find(function(c) { return c.id === sesionActual.id; });
            
            if (!clienteActual) {
                sessionStorage.removeItem('clienteSesion');
                window.location.href = 'login-cliente.html';
                return;
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('clienteSesion');
            window.location.href = 'index.html';
        }

        // ==========================================
        // TOAST
        // ==========================================
        function mostrarToast(mensaje, tipo) {
            var toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = 'toast mostrar ' + (tipo || 'info');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.className = 'toast';
            }, 4000);
        }

        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        function obtenerConfig() {
            var cfg = JSON.parse(localStorage.getItem(K_CONFIG)) || {};
            return {
                nombrePlataforma: cfg.nombrePlataforma || 'TiendaPerfecta',
                emoji: cfg.emoji || '🏢',
                diasPrueba: cfg.diasPrueba || 7,
                moneda: cfg.moneda || 'CUP',
                precioMensual: cfg.precioMensual || 10,
                telefono: cfg.telefono || '',
                whatsapp: cfg.whatsapp || '',
                email: cfg.email || ''
            };
        }

        // ==========================================
        // CARGAR PANEL COMPLETO
        // ==========================================
        function cargarPanel() {
            cargarClienteActual();
            if (!clienteActual) return;

            var container = document.getElementById('contenido-principal');
            var cfg = obtenerConfig();
            var plantillas = JSON.parse(localStorage.getItem(K_PLANTILLAS)) || [];
            var pagos = JSON.parse(localStorage.getItem(K_PAGOS)) || [];
            var solicitudes = JSON.parse(localStorage.getItem(K_SOLICITUDES)) || [];
            var hoy = new Date();

            document.getElementById('usuario-nombre').textContent = '👋 ' + clienteActual.nombre;
            document.getElementById('brand-nombre').textContent = cfg.nombrePlataforma;

            // Datos de la plantilla
            var pl = plantillas.find(function(p) { return p.id === clienteActual.plantillaId; }) || {};

            // Calcular días restantes
            var diasRestantes = 0;
            var esPrueba = false;
            var esVencido = false;

            if (clienteActual.fechaInicio && clienteActual.estado === 'activo') {
                var fechaInicio = new Date(clienteActual.fechaInicio);
                var fechaVencimiento = clienteActual.fechaVencimiento ? new Date(clienteActual.fechaVencimiento) : null;
                
                if (!fechaVencimiento) {
                    var diasPrueba = cfg.diasPrueba || 7;
                    fechaVencimiento = new Date(fechaInicio);
                    fechaVencimiento.setDate(fechaVencimiento.getDate() + diasPrueba);
                    esPrueba = true;
                }

                var diff = Math.ceil((fechaVencimiento - hoy) / (1000 * 60 * 60 * 24));
                diasRestantes = diff > 0 ? diff : 0;
                
                if (diasRestantes === 0 && esPrueba) {
                    esVencido = true;
                }
            }

            // Pagos del cliente
            var pagosCliente = pagos.filter(function(p) { return p.clienteId === clienteActual.id; });

            // Solicitud original del cliente
            var solicitudOriginal = solicitudes.find(function(s) { 
                return s.clienteId === clienteActual.id || 
                       (s.nombre === clienteActual.nombre && s.telefono === clienteActual.telefono);
            });

            // Estado del cliente
            var estadoBadge = '';
            if (clienteActual.estado === 'suspendido') {
                estadoBadge = '<span class="badge-estado badge-suspendido">⏸️ Suspendido</span>';
            } else if (esVencido && esPrueba) {
                estadoBadge = '<span class="badge-estado badge-vencido">⏰ Prueba vencida</span>';
            } else if (esPrueba && diasRestantes > 0) {
                estadoBadge = '<span class="badge-estado badge-prueba">🧪 Prueba (' + diasRestantes + ' días)</span>';
            } else if (clienteActual.estado === 'activo') {
                estadoBadge = '<span class="badge-estado badge-activo">✅ Activo</span>';
            } else {
                estadoBadge = '<span class="badge-estado badge-vencido">❌ Inactivo</span>';
            }

            // === HTML DEL PANEL ===
            var html = '';

            // Dashboard
            html += '<div class="dashboard-grid">' +
                '<div class="stat-card"><div class="label">🏪 Mi Tienda</div><div class="value" style="font-size:18px;">' + clienteActual.nombre + '</div><div class="sub">' + (pl.emoji || '🏪') + ' ' + (pl.nombre || 'Sin plantilla asignada') + '</div></div>' +
                '<div class="stat-card"><div class="label">📊 Estado</div><div style="margin:4px 0;">' + estadoBadge + '</div><div class="sub">Plan: ' + (clienteActual.plan || 'Básico') + ' · $' + (clienteActual.precio || 0) + '/mes</div></div>' +
                '<div class="stat-card"><div class="label">📅 Información</div><div class="sub" style="font-size:12px;">Inicio: ' + (clienteActual.fechaInicio ? new Date(clienteActual.fechaInicio + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) : '—') + '<br>Vence: ' + (clienteActual.fechaVencimiento ? new Date(clienteActual.fechaVencimiento + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Sin vencimiento') + '</div></div>' +
                '<div class="stat-card"><div class="label">💰 Pagos</div><div class="value" style="font-size:18px;">' + pagosCliente.length + '</div><div class="sub">Total: $' + pagosCliente.reduce(function(s, p) { return s + p.monto; }, 0).toFixed(2) + '</div></div>' +
                '</div>';

            // Timer de prueba
            if (esPrueba && diasRestantes > 0 && diasRestantes <= 7) {
                var timerClass = diasRestantes <= 3 ? 'timer urgente' : 'timer';
                html += '<div class="' + timerClass + '">' +
                    '<span class="days">' + diasRestantes + '</span>' +
                    '<span class="label">días de prueba gratuita restantes</span>' +
                    (diasRestantes <= 3 ? ' ⚠️ ¡Tu prueba termina pronto! Contacta al administrador para contratar un plan.' : '') +
                    '</div>';
            } else if (esVencido || (esPrueba && diasRestantes === 0)) {
                html += '<div class="timer urgente">' +
                    '<span>⏰</span>' +
                    '<span style="font-weight:700;color:#991b1b;">Tu prueba ha vencido.</span>' +
                    '<span style="font-size:12px;">Contrata un plan para continuar usando tu tienda.</span>' +
                    '</div>';
            }

            // Mi Tienda
            html += '<div class="seccion">' +
                '<h2>🏪 Mi Tienda</h2>' +
                '<div class="tienda-card">' +
                '<div class="info">' +
                '<h4>' + clienteActual.nombre + '</h4>' +
                '<p>' + (pl.emoji || '🏪') + ' ' + (pl.nombre || 'Sin plantilla') + ' · Plan ' + (clienteActual.plan || 'Básico') + '</p>' +
                (clienteActual.eslogan ? '<p style="font-style:italic;color:var(--text-secondary);font-size:12px;">"' + clienteActual.eslogan + '"</p>' : '') +
                (clienteActual.notas ? '<p style="font-size:11px;color:var(--text-secondary);margin-top:4px;">📝 ' + clienteActual.notas + '</p>' : '') +
                '</div>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap;">';

            if (clienteActual.urlTienda) {
                html += '<a href="' + clienteActual.urlTienda + '" target="_blank" class="btn-tienda">🌐 Visitar mi tienda</a>';
            }
            if (clienteActual.urlAdmin) {
                html += '<a href="' + clienteActual.urlAdmin + '" target="_blank" class="btn-tienda outline">🔧 Panel de administración</a>';
            }
            if (!clienteActual.urlTienda && !clienteActual.urlAdmin) {
                html += '<span style="font-size:12px;color:var(--text-secondary);">El administrador está configurando tu tienda. Pronto tendrás acceso.</span>';
            }

            html += '</div></div></div>';

            // Datos de la solicitud original
            if (solicitudOriginal) {
                html += '<div class="seccion">' +
                    '<h2>📋 Mi Solicitud Original</h2>' +
                    '<div style="font-size:13px;line-height:1.8;">' +
                    '<p><strong>📅 Fecha:</strong> ' + new Date(solicitudOriginal.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' }) + '</p>' +
                    '<p><strong>📞 Teléfono:</strong> ' + solicitudOriginal.telefono + '</p>' +
                    (solicitudOriginal.email ? '<p><strong>✉️ Email:</strong> ' + solicitudOriginal.email + '</p>' : '') +
                    (solicitudOriginal.mensaje ? '<p><strong>📝 Mensaje:</strong> ' + solicitudOriginal.mensaje + '</p>' : '') +
                    '<p><strong>📊 Estado:</strong> <span class="badge-estado badge-activo">✅ Convertida en cliente</span></p>' +
                    '</div></div>';
            }

            // Subir comprobante
            html += '<div class="seccion">' +
                '<h2>📤 Subir Comprobante de Pago</h2>' +
                '<p style="color:var(--text-secondary);font-size:12px;margin-bottom:12px;">Sube tu comprobante de pago para mantener tu tienda activa.</p>' +
                '<form id="form-comprobante" onsubmit="return subirComprobante(event)">' +
                '<div class="form-group">' +
                '<label>Monto ($)</label>' +
                '<input type="number" id="comp-monto" value="' + (clienteActual.precio || 10) + '" step="0.01" required>' +
                '</div>' +
                '<div class="form-group">' +
                '<label>Método de Pago</label>' +
                '<select id="comp-metodo">' +
                '<option value="Efectivo">💵 Efectivo</option>' +
                '<option value="Transferencia">🏦 Transferencia</option>' +
                '<option value="Tarjeta">💳 Tarjeta</option>' +
                '<option value="Enzona">📱 Enzona</option>' +
                '<option value="MLC">💳 MLC</option>' +
                '</select>' +
                '</div>' +
                '<div class="form-group">' +
                '<label>Comprobante (imagen o captura)</label>' +
                '<input type="file" id="comp-archivo" accept="image/*" required>' +
                '</div>' +
                '<div class="form-group">' +
                '<label>Notas (opcional)</label>' +
                '<input type="text" id="comp-notas" placeholder="Detalles adicionales...">' +
                '</div>' +
                '<button type="submit" class="btn-submit">📨 Enviar comprobante</button>' +
                '</form>' +
                '</div>';

            // Historial de pagos
            html += '<div class="seccion">' +
                '<h2>📋 Historial de Comprobantes</h2>';

            if (pagosCliente.length === 0) {
                html += '<p style="color:var(--text-secondary);font-size:13px;text-align:center;padding:20px;">No has enviado comprobantes todavía.</p>';
            } else {
                html += pagosCliente.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); }).map(function(p) {
                    var estadoClase = p.estado === 'Confirmado' ? 'estado-confirmado' : 
                                     p.estado === 'Rechazado' ? 'estado-rechazado' : 'estado-pendiente';
                    return '<div class="comprobante-item">' +
                        '<div class="info">' +
                        '<strong>📅 ' + p.fecha + '</strong>' +
                        '<span>💰 $' + p.monto.toFixed(2) + ' · ' + (p.metodoPago || '—') + '</span>' +
                        (p.notas ? ' <span style="color:var(--text-secondary);font-size:11px;">📝 ' + p.notas + '</span>' : '') +
                        (p.numeroComprobante ? ' <span style="color:var(--text-secondary);font-size:11px;">🔢 ' + p.numeroComprobante + '</span>' : '') +
                        '</div>' +
                        '<span class="estado ' + estadoClase + '">' + (p.estado || 'Pendiente') + '</span>' +
                        '</div>';
                }).join('');
            }

            html += '</div>';

            // Contacto
            html += '<div class="seccion" style="background:#f8fafc;border:2px dashed var(--border);">' +
                '<h2>📞 ¿Necesitas ayuda?</h2>' +
                '<p style="color:var(--text-secondary);font-size:13px;">Contáctanos si tienes dudas sobre tu suscripción o necesitas asistencia técnica.</p>' +
                '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">' +
                (cfg.whatsapp ? '<a href="https://wa.me/' + cfg.whatsapp.replace(/\+/g, '') + '" target="_blank" class="btn-tienda" style="background:#25d366;">💬 WhatsApp</a>' : '') +
                (cfg.telefono ? '<a href="tel:' + cfg.telefono + '" class="btn-tienda outline" style="border-color:#2563eb;color:#2563eb;">📞 Llamar</a>' : '') +
                (cfg.email ? '<a href="mailto:' + cfg.email + '" class="btn-tienda outline" style="border-color:#64748b;color:#64748b;">✉️ Email</a>' : '') +
                '</div>' +
                '</div>';

            container.innerHTML = html;
        }

        // ==========================================
        // SUBIR COMPROBANTE
        // ==========================================
        function subirComprobante(e) {
            e.preventDefault();

            var monto = parseFloat(document.getElementById('comp-monto').value);
            var metodo = document.getElementById('comp-metodo').value;
            var archivo = document.getElementById('comp-archivo').files[0];
            var notas = document.getElementById('comp-notas').value.trim();

            if (!monto || monto <= 0) {
                mostrarToast('⚠️ Ingresa un monto válido.', 'error');
                return false;
            }

            if (!archivo) {
                mostrarToast('⚠️ Selecciona una imagen del comprobante.', 'error');
                return false;
            }

            var reader = new FileReader();
            reader.onload = function(ev) {
                var pagos = JSON.parse(localStorage.getItem(K_PAGOS)) || [];

                var nuevoPago = {
                    id: Date.now(),
                    clienteId: clienteActual.id,
                    monto: monto,
                    fecha: new Date().toISOString().split('T')[0],
                    metodoPago: metodo,
                    estado: 'Pendiente',
                    comprobante: ev.target.result,
                    notas: notas,
                    fechaCreacion: new Date().toISOString(),
                    numeroComprobante: 'CLI-' + clienteActual.id + '-' + Date.now().toString().slice(-6)
                };

                pagos.push(nuevoPago);
                localStorage.setItem(K_PAGOS, JSON.stringify(pagos));

                mostrarToast('✅ Comprobante enviado correctamente. Espera la confirmación del administrador.', 'exito');
                document.getElementById('form-comprobante').reset();
                cargarPanel();
            };

            reader.readAsDataURL(archivo);
            return false;
        }

        // ==========================================
        // INICIAR
        // ==========================================
        cargarPanel();
    </script>
</body>
</html>
