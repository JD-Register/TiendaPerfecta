<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mi Panel | Isla Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        :root{
            --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
            --bg:#f8fafc; --surface:#ffffff; --text:#1e293b; --text-muted:#64748b; --border:#e2e8f0;
            --success:#059669; --success-bg:#ecfdf5; --success-text:#065f46;
            --warning:#d97706; --warning-bg:#fffbeb; --warning-text:#92400e;
            --danger:#dc2626; --danger-bg:#fef2f2; --danger-text:#991b1b;
            --info:#2563eb; --info-bg:#eff6ff; --info-text:#1e40af;
            --wa-green:#25d366; --phone-blue:#2563eb;
            --sidebar-bg:#0f172a; --sidebar-hover:#1e293b; --sidebar-text:#94a3b8;
            --radius:12px; --radius-sm:8px; --radius-xs:6px;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(79,70,229,0.1);
            --transition:0.25s ease;
            --sidebar-width:230px;
        }
        .dark-mode{
            --bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;
            --primary-light:#1e1b4b;
            --success-bg:#064e3b;--success-text:#a7f3d0;
            --warning-bg:#78350f;--warning-text:#fde68a;
            --danger-bg:#7f1d1d;--danger-text:#fecaca;
            --info-bg:#1e3a5f;--info-text:#bfdbfe;
            --shadow-md:0 4px 12px rgba(0,0,0,0.3);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{-webkit-text-size-adjust:100%;}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px;line-height:1.5;transition:background 0.3s,color 0.3s;}
        img{max-width:100%;height:auto;}

        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:99;}
        .sidebar-overlay.activo{display:block;}
        .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;height:100dvh;background:var(--sidebar-bg);z-index:100;display:flex;flex-direction:column;transition:transform 0.25s;flex-shrink:0;}
        .sidebar-header{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:8px;}
        .sidebar-logo{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;}
        .sidebar-logo img{width:100%;height:100%;object-fit:contain;}
        .sidebar-title{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
        .sidebar-title span{display:block;font-size:10px;font-weight:500;color:#818cf8;}
        .sidebar-nav{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 8px;overflow-y:auto;}
        .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;color:var(--sidebar-text);text-decoration:none;font-weight:500;font-size:13px;transition:var(--transition);cursor:pointer;position:relative;white-space:nowrap;border-left:3px solid transparent;}
        .sidebar-nav a:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .sidebar-nav a.activo{background:var(--primary);color:#fff;border-left-color:#7c3aed;}
        .sidebar-nav a svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
        .badge-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--danger);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
        .sidebar-footer{border-top:1px solid rgba(255,255,255,0.1);padding:10px 8px;}
        .btn-sidebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;background:none;border:none;color:var(--sidebar-text);cursor:pointer;font-weight:500;font-size:12px;transition:var(--transition);width:100%;text-align:left;font-family:inherit;border-left:3px solid transparent;}
        .btn-sidebar:hover{background:var(--sidebar-hover);color:#fff;border-left-color:var(--primary);}
        .btn-sidebar-logout{color:#fca5a5!important;border-top:1px solid rgba(255,255,255,0.1);margin-top:4px;padding-top:10px;}
        .btn-sidebar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}

        .btn-menu-movil{display:none;position:fixed;top:10px;left:10px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
        .btn-menu-movil svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;}

        .contenido{margin-left:var(--sidebar-width);flex:1;padding:20px 24px;width:calc(100% - var(--sidebar-width));min-width:0;min-height:100vh;display:flex;flex-direction:column;}

        .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--primary);}
        .page-header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
        .page-header .fecha{color:var(--text-muted);font-size:12px;font-weight:500;}
        .user-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--primary);font-weight:600;font-size:12px;color:var(--primary);}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
        .stat-card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border);border-left:3px solid var(--primary);box-shadow:var(--shadow-sm);transition:var(--transition);}
        .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
        .stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:4px;}
        .stat-value{font-size:18px;font-weight:700;color:var(--text);}

        .seccion{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid var(--border);border-top:2px solid var(--primary);box-shadow:var(--shadow-sm);}
        .seccion-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
        .seccion-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
        .seccion-title svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;}

        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;}
        .badge-success{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success);}
        .badge-warning{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning);}
        .badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger);}
        .badge-info{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info);}
        .badge-neutral{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
        .badge-primary{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary);}
        .badge-vip{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;}

        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;border:1px solid transparent;transition:var(--transition);font-family:inherit;white-space:nowrap;text-decoration:none;}
        .btn svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;}
        .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
        .btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);}
        .btn-outline{background:transparent;border-color:var(--primary);color:var(--primary);}
        .btn-outline:hover{background:var(--primary-light);}
        .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
        .btn-wa{background:var(--wa-green);color:#fff;}
        .btn-wa svg{fill:currentColor;stroke:none;}
        .btn-tel{background:var(--phone-blue);color:#fff;}
        .btn-tel svg{fill:currentColor;stroke:none;}
        .btn-block{width:100%;justify-content:center;}
        .btn-sm{padding:5px 10px;font-size:11px;}
        .btn-xs{padding:3px 8px;font-size:10px;border-radius:4px;}

        .tabla-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);width:100%;}
        table{width:100%;border-collapse:collapse;font-size:12px;min-width:550px;}
        thead{background:var(--primary-light);}
        th{text-align:left;padding:9px 12px;color:var(--primary);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;border-bottom:2px solid var(--primary);white-space:nowrap;}
        td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
        tbody tr{transition:var(--transition);}
        tbody tr:hover{background:var(--primary-light);}
        .fila-pagada{background:var(--success-bg);}
        .fila-vencida{background:var(--danger-bg);}

        .progress{width:100%;height:6px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0;}
        .progress-fill{height:100%;border-radius:4px;transition:width 0.4s;}

        .timer-box{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);margin:10px 0;border:1px solid;flex-wrap:wrap;}
        .timer-box.warning{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-text);}
        .timer-box.danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text);}
        .timer-num{font-size:24px;font-weight:900;}
        .timer-text{font-size:12px;}

        .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
        .form-grupo{display:flex;flex-direction:column;min-width:0;}
        .form-grupo-full{grid-column:1/-1;}
        .form-grupo label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);margin-bottom:4px;}
        .form-grupo input,.form-grupo select,.form-grupo textarea{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;background:var(--surface);transition:var(--transition);font-family:inherit;width:100%;color:var(--text);}
        .form-grupo input:focus,.form-grupo select:focus,.form-grupo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,0.1);}
        .form-grupo textarea{resize:vertical;min-height:60px;}

        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.75);backdrop-filter:blur(6px);z-index:2000;align-items:center;justify-content:center;padding:20px;}
        .modal-overlay.activo{display:flex;}
        .modal-box{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modalIn 0.25s ease;text-align:center;max-height:85vh;overflow-y:auto;border:1px solid var(--primary);border-top:3px solid var(--primary);}
        @keyframes modalIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .modal-box h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--primary);}
        .modal-box p{color:var(--text-muted);font-size:13px;}
        .modal-box img{max-width:100%;max-height:250px;border-radius:8px;margin:10px 0;}

        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 24px;border-radius:8px;font-weight:600;font-size:13px;z-index:500;opacity:0;transition:all 0.3s;pointer-events:none;box-shadow:var(--shadow-md);max-width:90%;text-align:center;}
        .toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0);}
        .toast.exito{background:var(--success);color:#fff;}
        .toast.error{background:var(--danger);color:#fff;}
        .toast.info{background:var(--primary);color:#fff;}

        .contacto-botones{display:flex;gap:6px;flex-wrap:wrap;}
        .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
        .chip{padding:6px 12px;border-radius:20px;font-weight:600;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:var(--transition);font-family:inherit;white-space:nowrap;}
        .chip:hover{border-color:var(--primary);color:var(--primary);}
        .chip.activo{background:var(--primary);color:#fff;border-color:var(--primary);}
        .ver-mas-btn{display:block;margin:10px auto;text-align:center;}

        @media(max-width:1024px){
            .stats-grid{grid-template-columns:repeat(2,1fr);}
            .form-grid{grid-template-columns:1fr;}
        }
        @media(max-width:900px){
            .sidebar{transform:translateX(-100%);}
            .sidebar.abierto{transform:translateX(0);}
            .btn-menu-movil{display:flex;}
            .contenido{margin-left:0;width:100%;padding:14px 12px;padding-top:56px;}
        }
        @media(max-width:600px){
            .stats-grid{grid-template-columns:1fr 1fr;gap:8px;}
            .stat-card{padding:12px;}
            .stat-value{font-size:16px;}
            .seccion{padding:14px 12px;}
            .page-header h1{font-size:17px;}
            .tabla-wrap{border:none;overflow:visible;}
            table{min-width:auto;display:block;}
            thead{display:none;}
            tbody{display:block;}
            tr{display:block;margin-bottom:8px;border:1px solid var(--primary);border-radius:var(--radius-sm);padding:8px;border-left:3px solid var(--primary);}
            td{display:flex;justify-content:space-between;padding:5px 0;border:none;font-size:12px;}
            td::before{content:attr(data-label);font-weight:600;color:var(--primary);font-size:9px;text-transform:uppercase;margin-right:8px;flex-shrink:0;}
            .filtros{overflow-x:auto;flex-wrap:nowrap;}
        }
        @media(max-width:400px){.stats-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <button class="btn-menu-movil" onclick="toggleSidebar()"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo" id="brand-icon">🏝️</div>
            <div class="sidebar-title" id="brand-nombre">Isla Market<span>Mi Panel</span></div>
        </div>
        <nav class="sidebar-nav">
            <a class="activo" onclick="navegarSeccion('inicio',this)"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>Inicio</a>
            <a onclick="navegarSeccion('pagos',this)"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Mis Pagos</a>
            <a onclick="navegarSeccion('tienda',this)"><svg viewBox="0 0 24 24"><path d="M3 9l1-5h16l1 5M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M9 20V12h6v8"/></svg>Mi Tienda</a>
            <a onclick="navegarSeccion('notificaciones',this)"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Notificaciones<span class="badge-count" id="badge-notif" style="display:none;">0</span></a>
            <a onclick="navegarSeccion('soporte',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Soporte</a>
            <a onclick="navegarSeccion('ajustes',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Ajustes</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-sidebar" onclick="toggleDarkMode()"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Modo Oscuro</button>
            <button class="btn-sidebar btn-sidebar-logout" onclick="cerrarSesion()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar Sesión</button>
        </div>
    </aside>

    <main class="contenido" id="contenido-principal"></main>

    <div class="modal-overlay" id="modal-box" onclick="if(event.target===this)cerrarModal()">
        <div class="modal-box">
            <h3 id="modal-titulo">Modal</h3>
            <div id="modal-texto"></div>
            <button class="btn btn-primary" onclick="cerrarModal()">Entendido</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function(){var sesion=JSON.parse(sessionStorage.getItem('clienteSesion')||'null');if(!sesion||!sesion.id||!sesion.token){window.location.href='login-cliente.html';return;}var ahora=new Date().getTime();if(ahora>=sesion.expiracion){sessionStorage.removeItem('clienteSesion');window.location.href='login-cliente.html?expirado=1';return;}sesion.expiracion=ahora+(480*60*1000);sessionStorage.setItem('clienteSesion',JSON.stringify(sesion));})();

        var K_CLIENTES='central_clientes',K_PAGOS='central_pagos',K_CONFIG='central_config',K_PLANTILLAS='central_plantillas',K_SOLICITUDES='central_solicitudes',K_LOGS='central_logs';
        var sesionActual=JSON.parse(sessionStorage.getItem('clienteSesion'));
        var clienteActual=null;
        var seccionActual='inicio';
        var totalDebe=0;
        var historialFiltro='todos';
        var historialLimite=10;

        function cargarClienteActual(){var clientes=JSON.parse(localStorage.getItem(K_CLIENTES))||[];clienteActual=clientes.find(function(c){return c.id===sesionActual.id;});if(!clienteActual){sessionStorage.removeItem('clienteSesion');window.location.href='login-cliente.html';}}
        function cerrarSesion(){sessionStorage.removeItem('clienteSesion');window.location.href='index.html';}
        function obtenerConfig(){var cfg=JSON.parse(localStorage.getItem(K_CONFIG))||{};return{nombrePlataforma:cfg.nombrePlataforma||'Isla Market',emoji:cfg.emoji||'🏝️',logo:cfg.logo||'',telefono:cfg.telefono||'',whatsapp:cfg.whatsapp||'',email:cfg.email||'',diasPrueba:cfg.diasPrueba||7,planPrecio:cfg.planPrecio||16000,diasGracia:cfg.diasGracia||5,tasaCUP_USD:cfg.tasaCUP_USD||365,tasaActualizada:cfg.tasaActualizada||''};}
        function mostrarToast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast mostrar '+(t||'info');clearTimeout(el._t);el._t=setTimeout(function(){el.className='toast';},3500);}
        function abrirModal(tit,contenido){document.getElementById('modal-titulo').textContent=tit;document.getElementById('modal-texto').innerHTML=contenido;document.getElementById('modal-box').classList.add('activo');}
        function cerrarModal(){document.getElementById('modal-box').classList.remove('activo');}
        function toggleSidebar(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');s.classList.toggle('abierto');o.classList.toggle('activo',s.classList.contains('abierto'));}
        function toggleDarkMode(){document.body.classList.toggle('dark-mode');localStorage.setItem('clienteDarkMode',document.body.classList.contains('dark-mode'));}
        if(localStorage.getItem('clienteDarkMode')==='true')document.body.classList.add('dark-mode');
        function obtenerTasaActual(){var cfg=JSON.parse(localStorage.getItem(K_CONFIG))||{};return cfg.tasaCUP_USD||365;}
        function actualizarBadgeNotif(){var notif=clienteActual.notificaciones||[];var noLeidas=notif.filter(function(n){return!n.leida;});var badge=document.getElementById('badge-notif');if(noLeidas.length>0){badge.textContent=noLeidas.length;badge.style.display='flex';}else{badge.style.display='none';}}

        function navegarSeccion(sec,el){
            seccionActual=sec;
            document.querySelectorAll('.sidebar-nav a').forEach(function(a){a.classList.remove('activo');});
            if(el)el.classList.add('activo');
            document.getElementById('sidebar').classList.remove('abierto');
            document.getElementById('sidebar-overlay').classList.remove('activo');
            cargarClienteActual();
            if(!clienteActual)return;
            actualizarBadgeNotif();
            var c=document.getElementById('contenido-principal');
            c.innerHTML='';
            switch(sec){
                case'inicio':renderInicio(c);break;
                case'pagos':renderPagos(c);break;
                case'tienda':renderTienda(c);break;
                case'notificaciones':renderNotificaciones(c);break;
                case'soporte':renderSoporte(c);break;
                case'ajustes':renderAjustes(c);break;
            }
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function actualizarBranding(){
            var cfg=obtenerConfig();
            document.getElementById('brand-nombre').innerHTML=cfg.nombrePlataforma+'<span>Mi Panel</span>';
            var icon=document.getElementById('brand-icon');
            if(cfg.logo){icon.innerHTML='<img src="'+cfg.logo+'" alt="Logo">';}
            else{icon.textContent=cfg.emoji;}
        }

        function headerHTML(titulo){
            return '<div class="page-header"><h1>'+titulo+'</h1><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><span class="user-chip">'+(clienteActual.dueno||clienteActual.nombre)+'</span><span class="fecha">'+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})+'</span></div></div>';
        }

        // ===== INICIO =====
        function renderInicio(c){
            var cfg=obtenerConfig();var hoy=new Date();
            var esPrueba=(clienteActual.tipoCliente==='prueba'||!clienteActual.tipoCliente);
            var enPeriodoGracia=clienteActual.enPeriodoGracia||false;
            var diasGraciaRestantes=0;
            if(enPeriodoGracia&&clienteActual.fechaInicioGracia){
                var fg=new Date(clienteActual.fechaInicioGracia);fg.setDate(fg.getDate()+(cfg.diasGracia||5));
                diasGraciaRestantes=Math.max(0,Math.ceil((fg-hoy)/(1000*60*60*24)));
            }
            var diasPruebaRestantes=0,diasPruebaTotal=cfg.diasPrueba||7;
            if(esPrueba&&clienteActual.fechaPruebaInicio){
                var fin=new Date(clienteActual.fechaPruebaInicio);fin.setDate(fin.getDate()+diasPruebaTotal);
                diasPruebaRestantes=Math.max(0,Math.ceil((fin-hoy)/(1000*60*60*24)));
            }
            var cuotas=clienteActual.cuotas||[];
            var totalCuotas=cuotas.length;
            var pagadas=cuotas.filter(function(q){return q.pagado;}).length;
            var porcentaje=totalCuotas>0?Math.round((pagadas/totalCuotas)*100):0;
            var totalPagado=cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0);
            var totalPendiente=cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0);
            totalDebe=totalPendiente;
            var proximaCuota=null;
            for(var i=0;i<cuotas.length;i++){if(!cuotas[i].pagado){proximaCuota=cuotas[i];break;}}

            var html=headerHTML('Inicio');
            html+='<div class="stats-grid">';
            html+='<div class="stat-card"><div class="stat-label">Mi Tienda</div><div class="stat-value" style="font-size:14px;">'+clienteActual.nombre+'</div></div>';
            if(esPrueba){
                html+='<div class="stat-card"><div class="stat-label">Estado</div><div class="stat-value"><span class="badge badge-warning">Prueba Gratuita</span></div></div>';
                html+='<div class="stat-card"><div class="stat-label">Días Restantes</div><div class="stat-value">'+diasPruebaRestantes+' / '+diasPruebaTotal+'</div></div>';
            }else{
                html+='<div class="stat-card"><div class="stat-label">Estado</div><div class="stat-value"><span class="badge '+(enPeriodoGracia?'badge-warning':'badge-success')+'">'+(enPeriodoGracia?'En Gracia':'Activo')+'</span></div></div>';
                html+='<div class="stat-card"><div class="stat-label">Pagado</div><div class="stat-value">$'+totalPagado.toLocaleString()+'</div></div>';
                html+='<div class="stat-card"><div class="stat-label">Próximo Pago</div><div class="stat-value" style="font-size:13px;">'+(proximaCuota?new Date(proximaCuota.fechaVencimiento+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}):'—')+'</div></div>';
            }
            html+='</div>';

            if(esPrueba&&diasPruebaRestantes>0){
                html+='<div class="timer-box '+(diasPruebaRestantes<=3?'danger':'warning')+'"><span class="timer-num">'+diasPruebaRestantes+'</span><span class="timer-text">días de prueba restantes</span></div>';
                html+='<div class="seccion" style="text-align:center;"><div class="seccion-title">¿Listo para crecer?</div><button class="btn btn-primary btn-block" onclick="abrirFormularioPago()">Contratar plan</button></div>';
            }else if(enPeriodoGracia){
                html+='<div class="timer-box danger"><span class="timer-num">'+diasGraciaRestantes+'</span><span class="timer-text">días de gracia</span></div>';
                html+='<div class="seccion" style="text-align:center;"><button class="btn btn-danger btn-block" onclick="abrirFormularioPago()">Pagar ahora</button></div>';
            }else if(!esPrueba&&proximaCuota){
                var diasP=Math.ceil((new Date(proximaCuota.fechaVencimiento+'T00:00:00')-hoy)/(1000*60*60*24));
                if(diasP<=7&&diasP>0){html+='<div class="timer-box '+(diasP<=3?'danger':'warning')+'"><span class="timer-num">'+diasP+'</span><span class="timer-text">días para el próximo pago</span></div>';}
                html+='<div class="progress"><div class="progress-fill" style="width:'+porcentaje+'%;background:var(--success);"></div></div>';
            }

            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Accesos Rápidos</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;">';
            html+='<button class="btn btn-primary" onclick="navegarSeccion(\'pagos\',document.querySelector(\'.sidebar-nav a[onclick*="pagos"]\'))">Ver pagos</button>';
            if(clienteActual.urlTienda)html+='<a href="'+clienteActual.urlTienda+'" target="_blank" class="btn btn-outline">Visitar tienda</a>';
            if(clienteActual.urlAdmin)html+='<a href="'+clienteActual.urlAdmin+'" target="_blank" class="btn btn-outline">Panel tienda</a>';
            html+='<button class="btn btn-outline" onclick="navegarSeccion(\'soporte\',document.querySelector(\'.sidebar-nav a[onclick*="soporte"]\'))">Soporte</button>';
            html+='</div></div>';
            html+='<div class="seccion" style="text-align:center;"><p style="font-size:12px;color:var(--text-muted);">Tasa actual: <strong>'+obtenerTasaActual()+' CUP/USD</strong></p></div>';
            c.innerHTML=html;
        }

        // ===== PAGOS =====
        function renderPagos(c){
            var cuotas=clienteActual.cuotas||[];
            if(cuotas.length===0&&clienteActual.tipoCliente==='alquiler'&&clienteActual.fechaVencimiento){
                cuotas=[{numero:1,fechaVencimiento:clienteActual.fechaVencimiento,montoEstimado:clienteActual.precio||16000,montoReal:null,monedaReal:null,tasaUsada:null,pagado:false,fechaPago:null,comprobanteId:null}];
            }
            var totalCuotas=cuotas.length;
            var pagadas=cuotas.filter(function(q){return q.pagado;}).length;
            var porcentaje=totalCuotas>0?Math.round((pagadas/totalCuotas)*100):0;
            var totalPagado=cuotas.filter(function(q){return q.pagado;}).reduce(function(s,q){return s+(q.montoReal||q.montoEstimado);},0);
            var totalPendiente=cuotas.filter(function(q){return !q.pagado;}).reduce(function(s,q){return s+q.montoEstimado;},0);
            totalDebe=totalPendiente;
            var pagosCliente=(JSON.parse(localStorage.getItem(K_PAGOS))||[]).filter(function(p){return p.clienteId===clienteActual.id;});
            var hoy=new Date();

            var html=headerHTML('Mis Pagos');
            html+='<div class="stats-grid">';
            html+='<div class="stat-card"><div class="stat-label">Pagado</div><div class="stat-value">$'+totalPagado.toLocaleString()+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Pendiente</div><div class="stat-value">$'+totalPendiente.toLocaleString()+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Progreso</div><div class="stat-value">'+porcentaje+'%</div></div>';
            html+='</div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendario de Cuotas</span></div>';
            html+='<div class="tabla-wrap"><table><thead><tr><th>#</th><th>Vence</th><th>Estimado</th><th>Real</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
            for(var i=0;i<cuotas.length;i++){
                var q=cuotas[i];var fv=new Date(q.fechaVencimiento+'T00:00:00');var vencido=!q.pagado&&fv<hoy;
                var claseFila=q.pagado?'fila-pagada':(vencido?'fila-vencida':'');
                var estadoTexto=q.pagado?'<span class="badge badge-success">Pagado</span>':(vencido?'<span class="badge badge-danger">Vencido</span>':'<span class="badge badge-warning">Pendiente</span>');
                var montoReal=q.montoReal?'$'+q.montoReal.toLocaleString()+' '+(q.monedaReal||''):'—';
                var accion='';
                if(!q.pagado&&!vencido){accion='<button class="btn btn-primary btn-xs" onclick="subirComprobanteCuota('+i+')">Subir</button>';}
                else if(!q.pagado&&vencido){accion='<button class="btn btn-danger btn-xs" onclick="subirComprobanteCuota('+i+')">Pagar</button>';}
                else if(q.comprobanteId){accion='<button class="btn btn-outline btn-xs" onclick="verComprobante('+q.comprobanteId+')">Ver</button>';}
                html+='<tr class="'+claseFila+'"><td data-label="#">'+q.numero+'</td><td data-label="Vence">'+fv.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})+'</td><td data-label="Estimado">$'+q.montoEstimado.toLocaleString()+'</td><td data-label="Real">'+montoReal+'</td><td data-label="Estado">'+estadoTexto+'</td><td data-label="Acción">'+accion+'</td></tr>';
            }
            html+='</tbody></table></div>';
            html+='<div class="progress" style="margin-top:10px;"><div class="progress-fill" style="width:'+porcentaje+'%;background:var(--success);"></div></div>';
            html+='<p style="font-size:11px;color:var(--text-muted);text-align:right;">'+pagadas+' de '+totalCuotas+' cuotas pagadas</p></div>';

            if(pagosCliente.length>0){
                html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>Historial de Comprobantes</span></div>';
                html+='<div class="filtros">';
                html+='<button class="chip '+(historialFiltro==='todos'?'activo':'')+'" onclick="filtrarHistorial(\'todos\',this)">Todos</button>';
                html+='<button class="chip '+(historialFiltro==='Confirmado'?'activo':'')+'" onclick="filtrarHistorial(\'Confirmado\',this)">Confirmados</button>';
                html+='<button class="chip '+(historialFiltro==='Pendiente'?'activo':'')+'" onclick="filtrarHistorial(\'Pendiente\',this)">Pendientes</button>';
                html+='<button class="chip '+(historialFiltro==='Rechazado'?'activo':'')+'" onclick="filtrarHistorial(\'Rechazado\',this)">Rechazados</button>';
                html+='</div><div id="historial-pagos"></div>';
                html+='<button class="btn btn-outline btn-sm ver-mas-btn" id="btn-ver-mas" style="display:none;" onclick="verMasHistorial()">Ver más</button>';
                html+='</div>';
            }
            c.innerHTML=html;
            renderHistorialPagos();
        }
        function filtrarHistorial(filtro,el){
            historialFiltro=filtro;
            document.querySelectorAll('.filtros .chip').forEach(function(c){c.classList.remove('activo');});
            if(el)el.classList.add('activo');
            historialLimite=10;
            renderHistorialPagos();
        }
        function renderHistorialPagos(){
            var cont=document.getElementById('historial-pagos');
            if(!cont)return;
            var pagosCliente=(JSON.parse(localStorage.getItem(K_PAGOS))||[]).filter(function(p){return p.clienteId===clienteActual.id;});
            if(historialFiltro!=='todos')pagosCliente=pagosCliente.filter(function(p){return p.estado===historialFiltro;});
            pagosCliente.sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);});
            var visibles=pagosCliente.slice(0,historialLimite);
            var html='';
            if(visibles.length===0){html='<p style="text-align:center;color:var(--text-muted);padding:15px;">No hay comprobantes.</p>';}
            else{
                visibles.forEach(function(p){
                    var estadoBadge=p.estado==='Confirmado'?'<span class="badge badge-success">Confirmado</span>':p.estado==='Rechazado'?'<span class="badge badge-danger">Rechazado</span>':'<span class="badge badge-warning">En revisión</span>';
                    html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px;"><span style="font-size:12px;"><strong>'+p.fecha+'</strong> - $'+p.monto.toFixed(2)+(p.cuotaIndex!==undefined?' (Cuota #'+(p.cuotaIndex+1)+')':'')+'</span>'+estadoBadge+(p.comprobante?' <button class="btn btn-outline btn-xs" onclick="verComprobanteImagen(\''+p.comprobante+'\')">Ver</button>':'')+'</div>';
                });
            }
            cont.innerHTML=html;
            var btnVerMas=document.getElementById('btn-ver-mas');
            if(btnVerMas){
                if(pagosCliente.length>historialLimite){btnVerMas.style.display='block';}
                else{btnVerMas.style.display='none';}
            }
        }
        function verMasHistorial(){historialLimite+=10;renderHistorialPagos();}

        // ===== TIENDA =====
        function renderTienda(c){
            var html=headerHTML('Mi Tienda');
            html+='<div class="stats-grid">';
            html+='<div class="stat-card"><div class="stat-label">Nombre</div><div class="stat-value" style="font-size:14px;">'+clienteActual.nombre+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Vitrina</div><div class="stat-value">'+(clienteActual.publicadoEnVitrina?'<span class="badge badge-success">Publicado</span>':'<span class="badge badge-neutral">Oculto</span>')+'</div></div>';
            html+='<div class="stat-card"><div class="stat-label">Teléfono</div><div class="stat-value" style="font-size:13px;">'+(clienteActual.telefono||'—')+'</div></div>';
            if(clienteActual.etiquetas&&clienteActual.etiquetas.length>0){
                html+='<div class="stat-card"><div class="stat-label">Etiquetas</div><div class="stat-value" style="font-size:12px;">'+clienteActual.etiquetas.map(function(e){return '<span class="badge badge-vip" style="margin:2px;">'+e+'</span>';}).join('')+'</div></div>';

            if(cfg.whatsapp)html+='<a href="https://wa.me/'+cfg.whatsapp.replace(/\+/g,'')+'" target="_blank" class="btn btn-wa btn-sm">WhatsApp</a>';
            if(cfg.telefono)html+='<a href="tel:'+cfg.telefono+'" class="btn btn-tel btn-sm">Llamar</a>';
            if(cfg.email)html+='<a href="mailto:'+cfg.email+'" class="btn btn-outline btn-sm">Email</a>';
            html+='</div></div>';
            if(misTickets.length>0){
                html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Mis Tickets</span></div>';
                misTickets.sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);}).forEach(function(t){
                    var estadoBadge=t.estado==='nueva'?'<span class="badge badge-info">Nueva</span>':t.estado==='en_proceso'?'<span class="badge badge-warning">En Proceso</span>':t.estado==='resuelta'?'<span class="badge badge-success">Resuelta</span>':'<span class="badge badge-neutral">Cerrada</span>';
                    var prioBadge=t.prioridad==='urgente'?'<span class="badge badge-danger">Urgente</span>':t.prioridad==='alta'?'<span class="badge badge-danger">Alta</span>':t.prioridad==='media'?'<span class="badge badge-warning">Media</span>':'<span class="badge badge-success">Baja</span>';
                    html+='<div style="padding:10px 0;border-bottom:1px solid var(--border);"><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;">'+estadoBadge+' '+prioBadge+'</div><span style="font-size:12px;">'+(t.mensaje||'')+'</span><br><small style="color:var(--text-muted);">'+new Date(t.fecha).toLocaleDateString('es-ES')+'</small>';
                    if(t.respuestas&&t.respuestas.length>0){
                        html+='<div style="margin-top:8px;padding-left:10px;border-left:2px solid var(--primary);">';
                        t.respuestas.forEach(function(r){
                            html+='<p style="font-size:11px;margin-bottom:4px;"><strong>'+(r.de==='admin'?'Admin':'Tú')+':</strong> '+r.texto+' <small style="color:var(--text-muted);">'+new Date(r.fecha).toLocaleString('es-ES')+'</small></p>';
                        });
                        html+='</div>';
                    }
                    html+='</div>';
                });
                html+='</div>';
            }
            c.innerHTML=html;
        }
        function enviarSoporte(e){
            e.preventDefault();
            var tipo=document.getElementById('soporte-tipo').value;
            var prioridad=document.getElementById('soporte-prioridad').value;
            var mensaje=document.getElementById('soporte-mensaje').value.trim();
            if(!mensaje){mostrarToast('Describe tu problema','error');return false;}
            var solicitudes=JSON.parse(localStorage.getItem(K_SOLICITUDES))||[];
            solicitudes.unshift({id:Date.now(),fecha:new Date().toISOString(),origen:'panel_cliente',tipoContacto:'soporte',nombre:clienteActual.dueno||clienteActual.nombre,telefono:clienteActual.telefono||'',email:clienteActual.email||'',mensaje:mensaje,contexto:{tipoProblema:tipo,clienteId:clienteActual.id,usuario:clienteActual.usuario},prioridad:prioridad,estado:'nueva',leida:false,respuestas:[],historial:[{fecha:new Date().toISOString(),accion:'Ticket creado'}]});
            localStorage.setItem(K_SOLICITUDES,JSON.stringify(solicitudes));
            mostrarToast('Solicitud enviada','exito');
            navegarSeccion('soporte',document.querySelector('.sidebar-nav a[onclick*="soporte"]'));
            return false;
        }

        // ===== AJUSTES =====
        function renderAjustes(c){
            var cfg=obtenerConfig();
            var html=headerHTML('Ajustes');
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Cambiar Contraseña</span></div>';
            html+='<form onsubmit="return cambiarPassword(event)">';
            html+='<div class="form-grid">';
            html+='<div class="form-grupo"><label>Actual</label><input type="password" id="pass-actual" required></div>';
            html+='<div class="form-grupo"><label>Nueva</label><input type="password" id="pass-nueva" required minlength="4"></div>';
            html+='<div class="form-grupo"><label>Confirmar</label><input type="password" id="pass-confirmar" required minlength="4"></div>';
            html+='</div>';
            html+='<button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Guardar</button></form></div>';
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Información</span></div>';
            html+='<p style="font-size:12px;">Tasa actual: <strong>'+obtenerTasaActual()+' CUP/USD</strong></p>';
            html+='<p style="font-size:12px;">Días de prueba: <strong>'+cfg.diasPrueba+'</strong></p>';
            html+='<p style="font-size:12px;">Precio del plan: <strong>$'+(cfg.planPrecio||16000).toLocaleString()+' CUP/mes</strong></p>';
            html+='</div>';
            c.innerHTML=html;
        }
        function cambiarPassword(e){
            e.preventDefault();
            var actual=document.getElementById('pass-actual').value;
            var nueva=document.getElementById('pass-nueva').value;
            var confirmar=document.getElementById('pass-confirmar').value;
            if(clienteActual.contrasena&&actual!==clienteActual.contrasena){mostrarToast('Contraseña actual incorrecta','error');return false;}
            if(nueva!==confirmar){mostrarToast('No coinciden','error');return false;}
            if(nueva.length<4){mostrarToast('Mínimo 4 caracteres','error');return false;}
            var clientes=JSON.parse(localStorage.getItem(K_CLIENTES))||[];
            var idx=clientes.findIndex(function(c){return c.id===clienteActual.id;});
            if(idx===-1)return false;
            clientes[idx].contrasena=nueva;
            localStorage.setItem(K_CLIENTES,JSON.stringify(clientes));
            var ul=JSON.parse(localStorage.getItem('usuariosIslaMarket')||'{}');
            if(ul[clientes[idx].usuario])ul[clientes[idx].usuario].contrasena=nueva;
            localStorage.setItem('usuariosIslaMarket',JSON.stringify(ul));
            clienteActual.contrasena=nueva;
            // Notificar al admin mediante logs
            var logs=JSON.parse(localStorage.getItem(K_LOGS)||'[]');
            logs.unshift({fecha:new Date().toISOString(),accion:'Cliente cambió contraseña',detalles:clienteActual.nombre+' ('+clienteActual.usuario+')'});
            localStorage.setItem(K_LOGS,JSON.stringify(logs));
            mostrarToast('Contraseña actualizada','exito');
            document.getElementById('pass-actual').value='';document.getElementById('pass-nueva').value='';document.getElementById('pass-confirmar').value='';
            return false;
        }

        function subirComprobanteCuota(cuotaIndex){
            var cuotas=clienteActual.cuotas||[];
            if(!cuotas[cuotaIndex])return;
            var q=cuotas[cuotaIndex];
            var html=headerHTML('Subir Comprobante');
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Cuota #'+q.numero+' - '+new Date(q.fechaVencimiento+'T00:00:00').toLocaleDateString('es-ES')+'</span></div>';
            html+='<p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Tasa actual: <strong>'+obtenerTasaActual()+' CUP/USD</strong></p>';
            html+='<form onsubmit="return enviarComprobanteCuota(event,'+cuotaIndex+')">';
            html+='<div class="form-grid">';
            html+='<div class="form-grupo"><label>Monto</label><input type="number" id="comp-monto" value="'+q.montoEstimado+'" step="0.01" required></div>';
            html+='<div class="form-grupo"><label>Método</label><select id="comp-metodo"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div>';
            html+='<div class="form-grupo form-grupo-full"><label>Comprobante</label><input type="file" id="comp-archivo" accept="image/*" required></div>';
            html+='</div>';
            html+='<button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Enviar</button></form>';
            html+='<button class="btn btn-outline btn-block" style="margin-top:6px;" onclick="navegarSeccion(\'pagos\',document.querySelector(\'.sidebar-nav a[onclick*="pagos"]\'))">Volver</button></div>';
            document.getElementById('contenido-principal').innerHTML=html;
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function enviarComprobanteCuota(e,cuotaIndex){
            e.preventDefault();
            var monto=parseFloat(document.getElementById('comp-monto').value);
            var metodo=document.getElementById('comp-metodo').value;
            var archivo=document.getElementById('comp-archivo').files[0];
            if(!monto||!archivo){mostrarToast('Completa los campos','error');return false;}
            var reader=new FileReader();
            reader.onload=function(ev){
                var pagos=JSON.parse(localStorage.getItem(K_PAGOS))||[];
                pagos.push({id:Date.now(),clienteId:clienteActual.id,cuotaIndex:cuotaIndex,monto:monto,fecha:new Date().toISOString().split('T')[0],metodoPago:metodo,estado:'Pendiente',comprobante:ev.target.result,notas:'',origen:'cliente',moneda:'CUP',tasaUsada:null});
                localStorage.setItem(K_PAGOS,JSON.stringify(pagos));
                mostrarToast('Comprobante enviado','exito');
                navegarSeccion('pagos',document.querySelector('.sidebar-nav a[onclick*="pagos"]'));
            };
            reader.readAsDataURL(archivo);
            return false;
        }
        function abrirFormularioPago(){
            var cfg=obtenerConfig();
            var html=headerHTML('Activar Plan');
            html+='<div class="seccion"><div class="seccion-header"><span class="seccion-title">Formulario de Activación</span></div>';
            html+='<p style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Tasa actual: <strong>'+obtenerTasaActual()+' CUP/USD</strong></p>';
            html+='<form onsubmit="return subirComprobanteRapido(event)">';
            html+='<div class="form-grid">';
            html+='<div class="form-grupo"><label>Monto</label><input type="number" id="pago-monto" value="'+(totalDebe||cfg.planPrecio)+'" required></div>';
            html+='<div class="form-grupo"><label>Método</label><select id="pago-metodo"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div>';
            html+='<div class="form-grupo form-grupo-full"><label>Comprobante</label><input type="file" id="pago-archivo" accept="image/*" required></div>';
            html+='</div>';
            html+='<button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Enviar</button></form></div>';
            document.getElementById('contenido-principal').innerHTML=html;
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function subirComprobanteRapido(e){
            e.preventDefault();
            var monto=parseFloat(document.getElementById('pago-monto').value);
            var metodo=document.getElementById('pago-metodo').value;
            var archivo=document.getElementById('pago-archivo').files[0];
            if(!monto||!archivo){mostrarToast('Completa los campos','error');return false;}
            var reader=new FileReader();
            reader.onload=function(ev){
                var pagos=JSON.parse(localStorage.getItem(K_PAGOS))||[];
                pagos.push({id:Date.now(),clienteId:clienteActual.id,cuotaIndex:null,monto:monto,fecha:new Date().toISOString().split('T')[0],metodoPago:metodo,estado:'Pendiente',comprobante:ev.target.result,notas:'Solicitud de activación',origen:'cliente',moneda:'CUP',tasaUsada:null});
                localStorage.setItem(K_PAGOS,JSON.stringify(pagos));
                mostrarToast('Solicitud enviada','exito');
                navegarSeccion('inicio',document.querySelector('.sidebar-nav a'));
            };
            reader.readAsDataURL(archivo);
            return false;
        }
        function verComprobante(pid){
            var pagos=JSON.parse(localStorage.getItem(K_PAGOS))||[];
            var p=pagos.find(function(x){return x.id===pid;});
            if(!p){mostrarToast('No encontrado','error');return;}
            abrirModal('Comprobante',p.comprobante?'<img src="'+p.comprobante+'"><p>Monto: $'+p.monto.toFixed(2)+'</p>':'<p>Monto: $'+p.monto.toFixed(2)+'</p>');
        }
        function verComprobanteImagen(src){abrirModal('Comprobante','<img src="'+src+'">');}
        function marcarNotificacionLeida(id){
            var clientes=JSON.parse(localStorage.getItem(K_CLIENTES))||[];
            var idx=clientes.findIndex(function(c){return c.id===clienteActual.id;});
            if(idx===-1)return;
            var notifs=clientes[idx].notificaciones||[];
            var n=notifs.find(function(not){return not.id===id;});
            if(n){n.leida=true;localStorage.setItem(K_CLIENTES,JSON.stringify(clientes));actualizarBadgeNotif();navegarSeccion('notificaciones',document.querySelector('.sidebar-nav a[onclick*="notificaciones"]'));}
        }

        document.addEventListener('keydown',function(e){if(e.key==='Escape')cerrarModal();});

        cargarClienteActual();
        if(clienteActual){
            actualizarBranding();
            actualizarBadgeNotif();
            navegarSeccion('inicio',document.querySelector('.sidebar-nav a'));
        }
    </script>
</body>
</html>
